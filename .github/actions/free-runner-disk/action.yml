---
name: Free runner disk
description: >-
  Remove toolchains the hosted Ubuntu image ships but this repository never
  uses, so role preflights that reserve free disk space (the observability
  queue boundary keeps 20 % of the filesystem plus a 2 GiB allowance free)
  see the same headroom on every runner image.
runs:
  using: composite
  steps:
    - name: Remove unused hosted toolchains
      shell: bash
      run: |
        set -euo pipefail
        df -h / | tail -1
        for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                    /usr/share/swift /usr/local/share/powershell /usr/local/julia* \
                    /opt/hostedtoolcache/CodeQL; do
          [ -e "$path" ] || continue
          sudo rm -rf -- "$path"
        done
        df -h / | tail -1
