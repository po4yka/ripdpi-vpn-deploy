---
name: Setup cached Python tooling
description: Install hash-pinned Python tooling and optional pinned Galaxy collections
inputs:
  galaxy:
    description: Install the repository's Galaxy collections
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      id: python
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt

    # A download-cache hit never bypasses pip's version and hash checks.
    - name: Install pinned Python tooling
      shell: bash
      run: python -m pip install --require-hashes --no-deps -r requirements.txt

    - name: Cache Galaxy collections
      if: inputs.galaxy == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ github.workspace }}/.ansible/collections
        # requirements.txt pins ansible-core; exact matches avoid stale collections.
        key: >-
          galaxy-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
          hashFiles('requirements.txt', 'requirements.yml') }}

    - name: Ensure pinned Galaxy collections are installed
      if: inputs.galaxy == 'true'
      shell: bash
      env:
        ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
      run: |
        for attempt in 1 2 3; do
          ansible-galaxy collection install -r requirements.yml --collections-path "$ANSIBLE_COLLECTIONS_PATH" && break
          if [ "${attempt}" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 10))
        done
