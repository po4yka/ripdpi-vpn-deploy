---
name: vpnd release SBOM
description: Generate dist/sbom.json from the locked vpnd Cargo dependency graph
runs:
  using: composite
  steps:
    - name: Install Rust metadata tooling
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
      with:
        toolchain: stable

    - name: Install checksum-verified cargo-cyclonedx
      shell: bash
      env:
        CYCLONEDX_VERSION: "0.5.9"
        CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/cargo-cyclonedx.tar.xz"
        bin_dir="$RUNNER_TEMP/cargo-cyclonedx-bin"
        asset="cargo-cyclonedx-x86_64-unknown-linux-gnu"
        base_url="https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download"
        curl -fsSL \
          "${base_url}/cargo-cyclonedx-${CYCLONEDX_VERSION}/${asset}.tar.xz" \
          -o "$archive"
        echo "${CYCLONEDX_SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "$bin_dir"
        tar -xJf "$archive" -C "$bin_dir" --strip-components=1 \
          "${asset}/cargo-cyclonedx"

    - name: Generate vpnd SBOM
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$RUNNER_TEMP/cargo-cyclonedx-bin:$PATH"
        lock_before="$(git hash-object vpnd/Cargo.lock)"
        rm -f vpnd/sbom.json
        cargo metadata --manifest-path vpnd/Cargo.toml --locked --format-version 1 > /dev/null
        CARGO_NET_OFFLINE=true cargo cyclonedx --manifest-path vpnd/Cargo.toml \
          --target all --format json --spec-version 1.5 --override-filename sbom
        test "$(git hash-object vpnd/Cargo.lock)" = "$lock_before"
        python3 - <<'PY'
        import json
        import pathlib
        import tomllib
        package = tomllib.loads(pathlib.Path("vpnd/Cargo.toml").read_text())["package"]
        sbom = json.loads(pathlib.Path("vpnd/sbom.json").read_text())
        assert sbom["bomFormat"] == "CycloneDX" and sbom["specVersion"] == "1.5"
        assert sbom["metadata"]["component"]["name"] == "vpnd"
        assert sbom["metadata"]["component"]["version"] == package["version"]
        assert any(c.get("purl", "").startswith("pkg:cargo/") for c in sbom["components"])
        assert sbom["dependencies"]
        PY
        mkdir -p dist
        mv vpnd/sbom.json dist/sbom.json
