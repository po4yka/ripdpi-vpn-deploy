---
name: vpnd release SBOM
description: Generate dist/sbom.json from the hash-locked vpnd Python runtime inventory
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ci-python
    - name: Install isolated hash-pinned SBOM tooling
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/vpnd-sbom-tools"
        "$RUNNER_TEMP/vpnd-sbom-tools/bin/python" -m pip install \
          --require-hashes --no-deps --only-binary=:all: -r vpnd/sbom-requirements.txt
        echo "$RUNNER_TEMP/vpnd-sbom-tools/bin" >> "$GITHUB_PATH"
    - name: Generate vpnd SBOM
      shell: bash
      run: python3 scripts/vpnd-sbom.py --out dist/sbom.json
