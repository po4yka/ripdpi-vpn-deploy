---
# Weekly grouped updates. CI and human merge remain required.
# Galaxy collections use the separate drift workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      routine:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: terraform
    directory: /terraform/providers/upcloud
