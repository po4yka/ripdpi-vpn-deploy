---
name: _rust (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (e.g. x86_64-unknown-linux-gnu)"
        type: string
        required: true
      cargo-command:
        description: "Cargo subcommand + args to run; must include --locked (e.g. 'test --release --locked')"
        type: string
        default: "test --release --locked"
      cache-key-suffix:
        description: "Optional suffix appended to the rust-cache key"
        type: string
        default: ""
      cross:
        description: "Use cross instead of cargo for the build step"
        type: boolean
        default: false
      upload-binary:
        description: "Upload the built binary as a workflow artifact (build --release only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust:
    timeout-minutes: 45
    name: rust (${{ inputs.target }})
    runs-on: ${{ contains(inputs.target, 'apple') && 'macos-latest' || 'ubuntu-24.04' }}
    env:
      CARGO_COMMAND: ${{ inputs.cargo-command }}
      RUST_TARGET: ${{ inputs.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          targets: ${{ inputs.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: vpnd
          key: ${{ inputs.target }}${{ inputs.cache-key-suffix != '' && format('-{0}', inputs.cache-key-suffix) || '' }}

      - name: Install cross (cross-compilation only)
        if: ${{ inputs.cross }}
        working-directory: vpnd
        run: cargo install cross --locked

      - name: Require the committed dependency graph
        shell: bash
        run: |
          if [[ ! "$RUST_TARGET" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
            echo "invalid Rust target: ${RUST_TARGET}" >&2
            exit 1
          fi
          case " $CARGO_COMMAND " in
            *" --locked "*) ;;
            *)
              echo "cargo-command must include --locked" >&2
              exit 1
              ;;
          esac

      - name: Run cargo ${{ inputs.cargo-command }} (native)
        if: ${{ !inputs.cross }}
        working-directory: vpnd
        shell: bash
        run: |
          read -r -a cargo_args <<< "$CARGO_COMMAND"
          cargo "${cargo_args[@]}" --target "$RUST_TARGET"

      - name: Run cross ${{ inputs.cargo-command }} (cross)
        if: ${{ inputs.cross }}
        working-directory: vpnd
        shell: bash
        run: |
          read -r -a cargo_args <<< "$CARGO_COMMAND"
          cross "${cargo_args[@]}" --target "$RUST_TARGET"

      - name: Rename binary with target suffix
        if: ${{ inputs.upload-binary }}
        shell: bash
        run: |
          src="vpnd/target/${RUST_TARGET}/release/vpnd"
          dst="vpnd-${RUST_TARGET}"
          cp "${src}" "${dst}"

      - name: Upload binary artifact
        if: ${{ inputs.upload-binary }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: vpnd-${{ inputs.target }}
          path: vpnd-${{ inputs.target }}
          retention-days: 1
