---
name: ci-cancel-closed

# Closing or merging a PR does not cancel its ci run. Joining the same
# repository-wide concurrency group as ci.yml cancels that run and its
# queued jobs, so they stop holding runner slots. Key by PR number: a merged
# PR's closed event reports the base branch as github.ref.
on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    name: cancel closed PR CI
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Release the PR concurrency group
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "Cancelled any ci run for PR ${PR_NUMBER}"
