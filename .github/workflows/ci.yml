---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks with repo rules
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ./.gitleaks.toml
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint workflows
        run: |
          actionlint_path="$(go env GOPATH)/bin/actionlint"
          "$actionlint_path"

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [upcloud, hetzner, vultr, scaleway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: "1.15.2"

      - name: terraform fmt -check
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform fmt -check -recursive

      - name: terraform init -backend=false
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform validate

  terraform-exception:
    name: terraform inert exception root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: "1.15.2"
      - name: terraform fmt -check
        working-directory: terraform/exception/cascade-ingress
        run: terraform fmt -check
      - name: terraform init without backend
        working-directory: terraform/exception/cascade-ingress
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform/exception/cascade-ingress
        run: terraform validate

  cloud-init:
    name: cloud-init schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cloud-init
        run: |
          sudo apt-get update
          sudo apt-get install -y cloud-init

      - name: Render cloud-init template
        run: python3 scripts/render-cloud-init-ci.py > /tmp/cloud-init.rendered.yaml

      - name: Validate with cloud-init schema
        run: cloud-init schema --config-file /tmp/cloud-init.rendered.yaml

  ansible:
    name: ansible-lint + syntax-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: |
          pip install --require-hashes --no-deps -r requirements.txt
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: ansible-lint
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ./ansible.cfg
        run: ansible-lint --offline

      - name: ansible-playbook --syntax-check
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ./ansible.cfg
          # site.yml asserts VPN_SECRETS_FILE is set; provide a stub for syntax-check.
          VPN_SECRETS_FILE: ${{ github.workspace }}/secrets/prod.secrets.example.yaml
        run: ansible-playbook playbooks/site.yml --syntax-check -i 'localhost,'

  molecule:
    name: molecule (${{ matrix.role }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role:
          - baseline
          - firewall
          - xray
          - hysteria
          - nginx-xhttp
          - watchdog
          - monitoring
          - backup
          - subscription-host
          - amneziawg
          - geodata
          - cascade-egress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: |
          pip install --require-hashes --no-deps -r requirements.txt
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: molecule test
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run shellcheck on every shell script
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -s bash -S warning scripts/*.sh terraform/exception/cascade-ingress/*.sh

  secrets-coverage:
    name: secrets-coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --require-hashes --no-deps -r requirements.txt
      - name: check-secrets-coverage
        run: python3 scripts/check-secrets-coverage.py

  templates-render:
    name: templates-render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --require-hashes --no-deps -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y nginx-light
      - name: Install pinned Xray semantic validator
        run: |
          XRAY_VERSION="$(python3 -c 'import yaml; print(yaml.safe_load(open("secrets/prod.secrets.example.yaml"))["xray"]["version"])')"
          XRAY_DIR="${RUNNER_TEMP}/xray"
          mkdir -p "${XRAY_DIR}"
          curl -fsSL -o "${XRAY_DIR}/xray.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q "${XRAY_DIR}/xray.zip" -d "${XRAY_DIR}"
          "${XRAY_DIR}/xray" version
          echo "${XRAY_DIR}" >> "${GITHUB_PATH}"
      - name: check-templates-render
        run: python3 scripts/check-templates-render.py
      - name: check-xray-breaking-changes
        run: python3 scripts/check-xray-breaking-changes.py

  yaml:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install --require-hashes --no-deps -r requirements.txt
      - name: yamllint
        run: yamllint -c .yamllint.yml .

  unit-tests:
    name: pytest unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install SOPS and age
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          curl -fsSL "https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64" -o /tmp/sops
          echo "0d65660fbe785647ff4f1764d7f69edf598f79d6d79ebbef4a501909b6ff6b82  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: pip install --require-hashes --no-deps -r requirements.txt
      - name: pytest tests/unit/
        run: python3 -m pytest tests/unit/ -v

  bats-test:
    name: bats shell tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats ssss
      - name: bats tests/bats/
        run: bats tests/bats/

  snapshot:
    name: jinja snapshot diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: pip install --require-hashes --no-deps -r requirements.txt
      - name: render-snapshots check
        run: python3 scripts/render-snapshots.py

  validate-schema:
    name: secrets schema (lenient on example)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: pip install --require-hashes --no-deps -r requirements.txt
      - name: validate-secrets (lenient on example schema)
        run: python3 scripts/validate-secrets.py
      - name: validate-bundle (ripdpi contract vs client)
        run: python3 scripts/validate-bundle.py

  tf-test:
    name: terraform test (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [upcloud, hetzner, vultr, scaleway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: "1.15.2"
      - name: terraform init -backend=false
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform init -backend=false
      - name: terraform test
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform test

  vpnd-test:
    name: vpnd cargo test
    uses: ./.github/workflows/_rust.yml
    with:
      target: x86_64-unknown-linux-gnu
      cargo-command: test --release --locked

  vpnd-clippy:
    name: vpnd cargo clippy
    uses: ./.github/workflows/_rust.yml
    with:
      target: x86_64-unknown-linux-gnu
      cargo-command: clippy --release --all-targets --locked -- -D warnings

  vpnd-msrv:
    name: vpnd MSRV check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: "1.88.0"
      - run: cargo +1.88.0 check --locked
        working-directory: vpnd

  vpnd-deny:
    name: vpnd dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: vpnd/Cargo.toml
          arguments: "--all-features --config vpnd/deny.toml"
          rust-version: "1.88.0"

  molecule-failure-scenarios:
    # Non-default Molecule scenarios that exercise red-path / failure
    # injection plus the paired cascade classifier scenarios. Both populated
    # and forced-empty are required; happy-path alone is not promotion evidence.
    name: molecule failure (${{ matrix.role }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: watchdog
            scenario: failure
          - role: cascade-ingress
            scenario: populated
          - role: cascade-ingress
            scenario: forced-empty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          pip install --require-hashes --no-deps -r requirements.txt
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: molecule test -s ${{ matrix.scenario }}
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  required:
    name: required checks
    if: always()
    needs:
      - gitleaks
      - actionlint
      - terraform
      - terraform-exception
      - cloud-init
      - ansible
      - molecule
      - shellcheck
      - secrets-coverage
      - templates-render
      - yaml
      - unit-tests
      - bats-test
      - snapshot
      - validate-schema
      - tf-test
      - vpnd-test
      - vpnd-clippy
      - vpnd-msrv
      - vpnd-deny
      - molecule-failure-scenarios
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success")' <<< "$RESULTS"
