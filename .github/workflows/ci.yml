---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: CI dependency selection
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select complete changed-file consumer groups
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/select-ci-checks.py

  gitleaks:
    timeout-minutes: 5
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks with repo rules
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ./.gitleaks.toml
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  actionlint:
    timeout-minutes: 5
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bin_dir="$RUNNER_TEMP/actionlint-bin"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ZIZMOR_VERSION: "1.29.0"
      ZIZMOR_SHA256: dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified zizmor
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          bin_dir="$RUNNER_TEMP/zizmor-bin"
          curl -fsSL \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$archive"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Audit owned GitHub automation
        run: make zizmor-check ZIZMOR_FORMAT=github

      - name: Verify fail-closed scope and findings
        run: make zizmor-test

  task-contract:
    name: task-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/tasking/package-lock.json

      - name: Install pinned tasking tools
        run: npm ci --prefix tools/tasking --ignore-scripts

      - name: Validate local task contracts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          args=()
          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -n "$base_sha" ]]; then
            git cat-file -e "${base_sha}^{commit}" || {
              echo "::error::Task-contract base commit is unavailable: $base_sha"
              exit 1
            }
            if git cat-file -e "${base_sha}:tools/tasking/project.json"; then
              args+=(--base "$base_sha")
            else
              echo "::notice::Pre-contract bootstrap base; strict history starts with the next change"
            fi
          fi
          ./taskctl validate "${args[@]}"

  terraform:
    timeout-minutes: 10
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['terraform'] }}
    name: terraform fmt + validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [upcloud, hetzner, vultr, scaleway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: "1.15.9"

      - name: terraform fmt -check
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform fmt -check -recursive

      - name: terraform init -backend=false
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform validate

  terraform-exception:
    timeout-minutes: 10
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['terraform-exception'] }}
    name: terraform inert exception root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: "1.15.9"
      - name: terraform fmt -check
        working-directory: terraform/exception/cascade-ingress
        run: terraform fmt -check
      - name: terraform init without backend
        working-directory: terraform/exception/cascade-ingress
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform/exception/cascade-ingress
        run: terraform validate

  cloud-init:
    timeout-minutes: 10
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['cloud-init'] }}
    name: cloud-init schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install cloud-init
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o APT::Update::Error-Mode=any
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y cloud-init

      - name: Render cloud-init template
        run: python3 scripts/render-cloud-init-ci.py > /tmp/cloud-init.rendered.yaml

      - name: Validate with cloud-init schema
        run: cloud-init schema --config-file /tmp/cloud-init.rendered.yaml

  ansible:
    timeout-minutes: 15
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['ansible'] }}
    name: ansible-lint + syntax-check
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-python
        with:
          galaxy: "true"

      - name: ansible-lint
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ./ansible.cfg
        run: ansible-lint --offline

      - name: ansible-playbook --syntax-check
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ./ansible.cfg
          # site.yml asserts VPN_SECRETS_FILE is set; provide a stub for syntax-check.
          VPN_SECRETS_FILE: ${{ github.workspace }}/secrets/prod.secrets.example.yaml
        run: ansible-playbook playbooks/site.yml --syntax-check -i 'localhost,'

  molecule:
    timeout-minutes: ${{ matrix.role == 'naive' && 30 || 20 }}
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['molecule'] }}
    name: molecule (${{ matrix.role }})
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    strategy:
      fail-fast: false
      matrix:
        role:
          - baseline
          - package_updates
          - network-exposure-gate
          - firewall
          - intrusion_prevention
          - xray
          - transport-egress
          - hysteria
          - naive
          - nginx-xhttp
          - watchdog
          - monitoring
          - observability_agent
          - observability_control_plane
          - observability_deadman
          - observability_kuma
          - backup
          - subscription-host
          - amneziawg
          - geodata
          - cascade-egress
          - cdn-front
          - warp-outbound
          - hysteria-realm
          - honeypot
          - dns-morph-bridge
          - split-hop-egress
          - tailnet-management
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-python
        with:
          galaxy: "true"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: matrix.role == 'naive'
        with:
          go-version: "1.27.3"
          cache: false

      - name: Build exact composite for Naive role acceptance
        if: matrix.role == 'naive'
        run: make native-naive-build

      - name: molecule test
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          NAIVE_NATIVE_BINARY: ${{ github.workspace }}/.cache/p2-native-caddy/caddy

      - name: Verify pinned Kuma push timing persistence and encrypted restore
        if: matrix.role == 'observability_kuma'
        run: |
          test "$(uname -m)" = x86_64
          age_dir="$(mktemp -d "$RUNNER_TEMP/kuma-age.XXXXXX")"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$age_dir/archive.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 \
            "$age_dir/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$age_dir/archive.tar.gz" -C "$age_dir" age/age age/age-keygen
          export PATH="$age_dir/age:$PATH"
          test "$(age --version)" = v1.3.2
          python3 ansible/roles/observability_kuma/molecule/runtime/run.py

  shellcheck:
    timeout-minutes: 5
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck on every shell script
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -s bash -S warning scripts/*.sh terraform/exception/cascade-ingress/*.sh

  python-validators:
    name: python validators
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
      - name: Install nginx validator
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-light
      - name: Install pinned Xray semantic validator
        uses: ./.github/actions/install-xray
      - name: yamllint
        if: ${{ !cancelled() }}
        run: yamllint -c .yamllint.yml .
      - name: check-secrets-coverage
        if: ${{ !cancelled() }}
        run: python3 scripts/check-secrets-coverage.py
      - name: check-templates-render
        if: ${{ !cancelled() }}
        run: python3 scripts/check-templates-render.py
      - name: check-xray-breaking-changes
        if: ${{ !cancelled() }}
        run: python3 scripts/check-xray-breaking-changes.py
      - name: render-snapshots check
        if: ${{ !cancelled() }}
        run: python3 scripts/render-snapshots.py
      - name: validate-secrets (lenient on example schema)
        if: ${{ !cancelled() }}
        run: python3 scripts/validate-secrets.py
      - name: validate-bundle (ripdpi contract vs client)
        if: ${{ !cancelled() }}
        run: python3 scripts/validate-bundle.py

  unit-tests:
    name: pytest group ${{ matrix.group }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [1, 2, 3, 4]
    env:
      SING_BOX_CLIENT_VERSION: "1.14.3"
      SING_BOX_CLIENT_LINUX_AMD64_SHA256: "e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee"
      PROMTOOL_VERSION: "3.14.0"
      PROMETHEUS_LINUX_AMD64_SHA256: "f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Workspace/taskctl integration verifies immutable archive source commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Install test system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y restic openssh-server wireguard-tools uuid-runtime
          sudo install -d -m 0755 /run/sshd
      - uses: ./.github/actions/install-sops-age
      - name: Install checksum-verified gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          sudo install -m 0755 "$bin_dir/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - uses: ./.github/actions/setup-ci-python
      - name: Install checksum-verified Prometheus tools
        run: |
          set -euo pipefail
          asset="prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          archive="$RUNNER_TEMP/prometheus.tar.gz"
          bin_dir="$RUNNER_TEMP/prometheus-bin"
          curl -fsSL --connect-timeout 10 --max-time 120 \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/${asset}" \
            -o "$archive"
          echo "${PROMETHEUS_LINUX_AMD64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" --strip-components=1 \
            "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool" \
            "prometheus-${PROMTOOL_VERSION}.linux-amd64/prometheus"
          sudo install -m 0755 "$bin_dir/promtool" "$bin_dir/prometheus" /usr/local/bin/
          promtool --version
          prometheus --version
      - name: Install pinned sing-box client parser
        run: |
          set -euo pipefail
          version="${SING_BOX_CLIENT_VERSION}"
          archive="sing-box-${version}-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "${SING_BOX_CLIENT_LINUX_AMD64_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          python3 scripts/check-singbox-client-compatibility.py \
            --expected-version "$version" --binary "/tmp/sing-box-${version}-linux-amd64/sing-box"
          stage="$(sudo mktemp -d /usr/local/bin/.sing-box.XXXXXXXX)"
          trap 'sudo rm -rf -- "$stage"' EXIT
          sudo install -m 0755 "/tmp/sing-box-${version}-linux-amd64/sing-box" "$stage/sing-box"
          sudo mv -T "$stage/sing-box" /usr/local/bin/sing-box
      - name: Install checksum-verified Conftest for policy regression tests
        env:
          CONFTEST_VERSION: "0.57.0"
          CONFTEST_SHA256: db1018a7e301cada4d4bd8a70880a13314daae27b3f4d409c7ffba1847718392
        run: |
          archive="$RUNNER_TEMP/conftest.tar.gz"
          bin_dir="$RUNNER_TEMP/conftest-bin"
          curl -fsSL --connect-timeout 5 --max-time 60 \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o "$archive"
          echo "${CONFTEST_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" conftest
          sudo install -m 0755 "$bin_dir/conftest" /usr/local/bin/conftest
          conftest --version
      - name: Run real pinned sing-box check
        run: python3 scripts/check-singbox-client-compatibility.py --expected-version "${SING_BOX_CLIENT_VERSION}"
      - name: Install checksum-verified Xray sentinel parser
        uses: ./.github/actions/install-xray
      - name: Check canonical sentinel profiles with real pinned runtimes
        run: make liveness-profile-check
      - name: pytest tests/unit/
        env:
          PYTEST_GROUP: ${{ matrix.group }}
        run: make test-unit-shard
      - name: Upload pytest group report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pytest-group-${{ matrix.group }}
          path: .pytest-shards/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  pytest-required:
    timeout-minutes: 5
    name: pytest unit tests
    if: always()
    needs: [unit-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all four groups to succeed
        env:
          SHARD_RESULT: ${{ needs.unit-tests.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pytest-group-*
          path: .pytest-shards/reports
      - name: Require complete disjoint pytest coverage
        run: python3 scripts/check-pytest-shards.py .pytest-shards/reports --write-durations .pytest-shards/pytest-durations.json
      - name: Upload verified durations for the next profile refresh
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pytest-durations
          path: .pytest-shards/pytest-durations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-runtime:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['native-runtime'] }}
    name: native runtime integration
    runs-on: ubuntu-24.04
    # Setup, early AWG gates, the complete native suite and cleanup share this budget.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-disposable-ci
      - name: Verify the real mtg release and FakeTLS configuration
        run: sudo env "PATH=$PATH" make test-mtg-native-compatibility
      - name: Install checksum-verified Alertmanager and amtool
        env:
          ALERTMANAGER_SHA256: 5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alertmanager.tar.gz"
          curl -fsSL --connect-timeout 10 --max-time 120 \
            https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz \
            -o "$archive"
          echo "${ALERTMANAGER_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" \
            alertmanager-0.28.1.linux-amd64/alertmanager alertmanager-0.28.1.linux-amd64/amtool
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build exact native Naive composite
        run: make native-naive-build
      - name: Build exact transport semantic parser fixtures
        run: make native-transport-semantics-build
      - name: Install native parser and protocol fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nftables=1.0.9-1ubuntu0.1 libnftables1=1.0.9-1ubuntu0.1 openssh-server e2fsprogs util-linux mount nginx iproute2 openssl wireguard-tools unbound lynis prometheus-node-exporter tcpdump tshark
      - name: Stage trusted native runtime sources and artifacts
        run: |
          set -Eeuo pipefail
          stage="$(sudo mktemp -d /opt/ripdpi-native-runtime.XXXXXXXX)"
          trap 'sudo rm -rf -- "$stage"' ERR
          sudo cp -a "$GITHUB_WORKSPACE/." "$stage/"
          sudo cp -a "$RUNNER_TEMP/alertmanager-0.28.1.linux-amd64" "$stage/.cache/native-alertmanager"
          sudo chown -hR 0:0 "$stage"
          sudo chmod 0755 "$stage"
          printf 'NATIVE_RUNTIME_ROOT=%s\n' "$stage" >> "$GITHUB_ENV"
          trap - ERR
      - name: Check native AWG warm publication before the complete runtime suite
        working-directory: ${{ env.NATIVE_RUNTIME_ROOT }}
        run: |
          sudo env \
            "TRANSPORT_NATIVE_ISOLATED=1" \
            "AWG_NATIVE_GO_SOURCE=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/amneziawg-go-2e3f7d122ca8ef61e403fddc48a9db8fccd95dbf" \
            "AWG_NATIVE_TOOLS_SOURCE=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/amneziawg-tools-c0b400c6dfc046f5cae8f3051b14cb61686fcf55" \
            "PATH=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/bin:$PATH" \
            python3 -m pytest tests/unit/test_topology_awg_warm_native.py --fail-on-skip -v --tb=short
      - name: Check native AWG rollback before the complete runtime suite
        working-directory: ${{ env.NATIVE_RUNTIME_ROOT }}
        run: |
          sudo env \
            "TRANSPORT_NATIVE_ISOLATED=1" \
            "AWG_NATIVE_GO_SOURCE=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/amneziawg-go-2e3f7d122ca8ef61e403fddc48a9db8fccd95dbf" \
            "AWG_NATIVE_TOOLS_SOURCE=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/amneziawg-tools-c0b400c6dfc046f5cae8f3051b14cb61686fcf55" \
            "PATH=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/bin:$PATH" \
            "PYTEST_ADDOPTS=--tb=short" \
            make test-awg-dualstack-runtime
      - name: Exercise ECH recipients, privacy and resource profiles
        working-directory: ${{ env.NATIVE_RUNTIME_ROOT }}
        run: |
          sudo env "PATH=$PATH" TRANSPORT_NATIVE_ISOLATED=1 PYTEST_ADDOPTS=--tb=short \
            make test-hysteria-ech-runtime
      - name: Execute native tests with UID and GID capabilities
        working-directory: ${{ env.NATIVE_RUNTIME_ROOT }}
        run: |
          sudo env \
            "TRANSPORT_NATIVE_ISOLATED=1" \
            "PYTEST_ADDOPTS=--tb=short" \
            "ALERTMANAGER_BIN=$NATIVE_RUNTIME_ROOT/.cache/native-alertmanager/alertmanager" \
            "NAIVE_NATIVE_BINARY=$NATIVE_RUNTIME_ROOT/.cache/p2-native-caddy/caddy" \
            "SNELL_NATIVE_BINARY=/usr/local/bin/sing-box" \
            "AWG_NATIVE_GO_SOURCE=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/amneziawg-go-2e3f7d122ca8ef61e403fddc48a9db8fccd95dbf" \
            "AWG_NATIVE_TOOLS_SOURCE=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/amneziawg-tools-c0b400c6dfc046f5cae8f3051b14cb61686fcf55" \
            "PATH=$NATIVE_RUNTIME_ROOT/.cache/native-transport-semantics/bin:$PATH" \
            make test-native-runtime test-xhttp-delivery-matrix test-topology-authenticated-probes
      - name: Remove owned native runtime staging
        if: ${{ always() && env.NATIVE_RUNTIME_ROOT != '' }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUNTIME_ROOT" =~ ^/opt/ripdpi-native-runtime\.[A-Za-z0-9]{8}$ ]]
          test ! -L "$NATIVE_RUNTIME_ROOT"
          sudo rm -rf -- "$NATIVE_RUNTIME_ROOT"

  transport-runtime-acceptance:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['transport-runtime-acceptance'] }}
    name: native transport runtime acceptance (${{ matrix.group }}/2)
    runs-on: ubuntu-24.04
    # Cold artifact setup and all native recovery cases share the job budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          galaxy: "true"
      - name: Create the isolated native transport systemd environment
        env:
          RTA_IMAGE: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-ubuntu2404@sha256:e9dfdf3cc37d8d098ef7e036e716abba78980333522ccbf7504a79189755a267
          RTA_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          RTA_PYTHON_PREFIX="$(python -c 'import sys; print(sys.prefix)')"
          echo "RTA_PYTHON_PREFIX=$RTA_PYTHON_PREFIX" >> "$GITHUB_ENV"
          docker pull "$RTA_IMAGE"
          docker create --name transport-runtime-acceptance \
            --label "ripdpi.rta.owner=$RTA_OWNER" \
            --privileged --cgroupns=host --tmpfs /run --tmpfs /run/lock \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --volume "$RTA_PYTHON_PREFIX:$RTA_PYTHON_PREFIX:ro" \
            "$RTA_IMAGE" /lib/systemd/systemd
          docker cp "$GITHUB_WORKSPACE/." transport-runtime-acceptance:/opt/rta
          docker start transport-runtime-acceptance
          docker exec transport-runtime-acceptance /bin/bash -eu -c '
            apt-get update
            apt-get install -y --no-install-recommends \
              nftables=1.0.9-1ubuntu0.1 libnftables1=1.0.9-1ubuntu0.1 \
              iproute2 openssl curl ca-certificates openssh-server \
              python3-yaml make unzip \
              nginx=1.24.0-2ubuntu7.18 nginx-common=1.24.0-2ubuntu7.18
            chmod 0755 /var/log
          '
      - name: Execute complete transport acceptance in fresh partitioned runners
        env:
          PYTEST_NATIVE_GROUP: ${{ matrix.group }}
        run: |
          docker exec --workdir /opt/rta \
            --env TRANSPORT_NATIVE_ISOLATED=1 \
            --env "PYTEST_ADDOPTS=--tb=short --splits 2 --group $PYTEST_NATIVE_GROUP --splitting-algorithm least_duration" \
            --env ANSIBLE_COLLECTIONS_PATH=/opt/rta/.ansible/collections \
            --env "PATH=$RTA_PYTHON_PREFIX/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            transport-runtime-acceptance \
            make test-transport-runtime-acceptance
      - name: Retire the exact owned native environment
        if: always()
        env:
          RTA_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          owned="$(docker ps -aq --filter name='^/transport-runtime-acceptance$' \
            --filter "label=ripdpi.rta.owner=$RTA_OWNER")"
          if [[ -n "$owned" ]]; then
            docker rm --force "$owned"
          fi

  transport-native-acceptance:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['transport-native-acceptance'] }}
    name: native four-transport acceptance (${{ matrix.plan }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        plan: [core, recovery-1, recovery-2, recovery-3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-disposable-ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build exact native source pairs and verified protocol artifacts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmnl-dev
          make native-transport-semantics-build
          TRANSPORT_NATIVE_ISOLATED=1 python3 tests/native/transport_acceptance/prepare_awg.py
      - name: Create owned systemd and TUN acceptance environment
        env:
          NATIVE_IMAGE: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-ubuntu2404@sha256:e9dfdf3cc37d8d098ef7e036e716abba78980333522ccbf7504a79189755a267
          NATIVE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          NATIVE_PYTHON="$(python -c 'import sys; print(sys.prefix)')"
          NATIVE_GO="$(go env GOROOT)"
          echo "NATIVE_PYTHON=$NATIVE_PYTHON" >> "$GITHUB_ENV"
          docker pull "$NATIVE_IMAGE"
          docker create --name four-transport-native \
            --label "ripdpi.native.owner=$NATIVE_OWNER" \
            --privileged --cgroupns=host --tmpfs /run --tmpfs /run/lock \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --volume "$NATIVE_PYTHON:$NATIVE_PYTHON:ro" \
            --volume "$NATIVE_GO:/usr/local/go:ro" \
            "$NATIVE_IMAGE" /lib/systemd/systemd
          docker cp "$GITHUB_WORKSPACE/." four-transport-native:/opt/rta
          docker cp /usr/local/bin/xray four-transport-native:/usr/local/bin/xray
          docker cp /usr/local/bin/geoip.dat four-transport-native:/usr/local/bin/geoip.dat
          docker cp /usr/local/bin/geosite.dat four-transport-native:/usr/local/bin/geosite.dat
          docker cp /usr/local/bin/sops four-transport-native:/usr/local/bin/sops
          docker cp "$GITHUB_WORKSPACE/.cache/native-transport-semantics/bin/hysteria" four-transport-native:/usr/local/sbin/hysteria
          docker start four-transport-native
          docker exec four-transport-native /bin/bash -eu -c '
            apt-get update
            apt-get install -y --no-install-recommends \
              nftables=1.0.9-1ubuntu0.1 libnftables1=1.0.9-1ubuntu0.1 \
              iproute2 iptables openssl curl ca-certificates openssh-server \
              python3-yaml make unzip nginx logrotate tcpdump age git
            chmod 0755 /var/log
            install -d -m 0755 /usr/local/libexec
            mount --make-rshared /run
            chown -R --no-dereference 0:0 /opt/rta
          '
      - name: Execute every native case without selection or skip overrides
        env:
          NATIVE_PLAN: ${{ matrix.plan }}
        run: |
          docker exec --workdir /opt/rta \
            --env TRANSPORT_NATIVE_ISOLATED=1 \
            --env "TRANSPORT_NATIVE_PLAN=$NATIVE_PLAN" \
            --env TRANSPORT_NATIVE_EVIDENCE=/var/tmp/transport-native-evidence.json \
            --env AWG_NATIVE_GO_SOURCE=/opt/rta/.cache/four-transport-sources/baseline/go \
            --env AWG_NATIVE_TOOLS_SOURCE=/opt/rta/.cache/four-transport-sources/baseline/tools \
            --env ANSIBLE_COLLECTIONS_PATH=/opt/rta/.ansible/collections \
            --env "PATH=$NATIVE_PYTHON/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            four-transport-native make test-four-transport-native
      - name: Retain only redacted case and cleanup evidence
        if: always()
        run: |
          mkdir -p native-evidence
          docker cp four-transport-native:/var/tmp/transport-native-evidence.json native-evidence/result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        if: always()
        with:
          name: native-four-transport-evidence-${{ matrix.plan }}
          path: native-evidence/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove and confirm exact owned environment
        if: always()
        env:
          NATIVE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          owned="$(docker ps -aq --filter name='^/four-transport-native$' \
            --filter "label=ripdpi.native.owner=$NATIVE_OWNER")"
          if [[ -n "$owned" ]]; then
            docker rm --force "$owned"
          fi
          test -z "$(docker ps -aq --filter name='^/four-transport-native$')"

  go-helper:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['go-helper'] }}
    name: MTProxy Go helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: tools/probe-matrix-mtproto/go.sum
      - run: make test-probe-matrix-mtproto

  bats-test:
    timeout-minutes: 10
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['bats-test'] }}
    name: bats shell tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
      - name: Install bats and encrypted transaction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ssss age
          curl -fsSL "https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64" -o /tmp/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
      - name: bats tests/bats/
        run: bats tests/bats/

  tf-test:
    timeout-minutes: 10
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['tf-test'] }}
    name: terraform test (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: [upcloud, hetzner, vultr, scaleway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: "1.15.9"
      - name: terraform init -backend=false
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform init -backend=false
      - name: terraform test
        working-directory: terraform/providers/${{ matrix.provider }}
        run: terraform test

  vpnd-test:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['vpnd-test'] }}
    name: vpnd-test
    uses: ./.github/workflows/_python-vpnd.yml
    with:
      command: test
      cross-platform: true

  vpnd-lint:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['vpnd-lint'] }}
    name: vpnd-lint
    uses: ./.github/workflows/_python-vpnd.yml
    with:
      command: lint
      cross-platform: false

  vpnd-package:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['vpnd-package'] }}
    name: vpnd-package
    uses: ./.github/workflows/_python-vpnd.yml
    with:
      command: package
      cross-platform: true

  vpnd-dependency:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['vpnd-dependency'] }}
    name: vpnd-dependency
    uses: ./.github/workflows/_python-vpnd.yml
    with:
      command: dependency
      cross-platform: false

  molecule-failure-scenarios:
    timeout-minutes: 20
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['molecule-failure-scenarios'] }}
    # Non-default Molecule scenarios that exercise red-path / failure
    # injection, shared TLS permissions, and paired cascade classifiers. Both populated
    # and forced-empty are required; happy-path alone is not promotion evidence.
    name: molecule failure (${{ matrix.role }})
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: watchdog
            scenario: failure
          - role: observability_agent
            scenario: enabled
          - role: observability_control_plane
            scenario: enabled
          - role: observability_deadman
            scenario: enabled
          - role: cascade-ingress
            scenario: populated
          - role: cascade-ingress
            scenario: forced-empty
          - role: hysteria-realm
            scenario: shared-tls
          - role: cdn-front
            scenario: cdn-on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          galaxy: "true"
      - name: molecule test -s ${{ matrix.scenario }}
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  molecule-full-stack:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['molecule-full-stack'] }}
    name: molecule full-stack (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [full-stack, full-stack-published]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-python
        with:
          galaxy: "true"

      # The only CI surface exercising role ORDERING across site.yml — the
      # per-role matrix cannot catch cross-role interactions.
      - name: molecule full-stack test
        working-directory: ansible
        run: |
          DEPLOY_SOURCE_REVISION="$(git rev-parse HEAD)"
          export DEPLOY_SOURCE_REVISION
          DEPLOYABLE_SOURCE_DIGEST="$(../scripts/deploy-source-identity.sh --digest)"
          export DEPLOYABLE_SOURCE_DIGEST
          molecule -c "molecule/${SCENARIO}/molecule.yml" test -s "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  vpnd-sbom:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['vpnd-sbom'] }}
    name: vpnd release SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/vpnd-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: vpnd-release-sbom
          path: dist/sbom.json
          if-no-files-found: error
          retention-days: 14

  # Protective workflows share the dependency plan and required aggregate.
  # A selected failure or an unplanned skip always rejects the merge.
  tf-policy:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['tf-policy'] }}
    uses: ./.github/workflows/tf-policy.yml

  image-scan:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['image-scan'] }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/image-scan.yml

  contract-sync:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['contract-sync'] }}
    uses: ./.github/workflows/contract-sync.yml

  reproducible-build:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.checks)['reproducible-build'] }}
    uses: ./.github/workflows/reproducible-build.yml

  required:
    timeout-minutes: 3
    name: required checks
    if: always()
    needs:
      - selection
      - gitleaks
      - actionlint
      - zizmor
      - task-contract
      - terraform
      - terraform-exception
      - cloud-init
      - ansible
      - molecule
      - molecule-full-stack
      - shellcheck
      - python-validators
      - unit-tests
      - pytest-required
      - native-runtime
      - transport-runtime-acceptance
      - transport-native-acceptance
      - go-helper
      - bats-test
      - tf-test
      - vpnd-test
      - vpnd-lint
      - vpnd-package
      - vpnd-dependency
      - vpnd-sbom
      - molecule-failure-scenarios
      - tf-policy
      - image-scan
      - contract-sync
      - reproducible-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Require every planned check and reject unexpected skips
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py
