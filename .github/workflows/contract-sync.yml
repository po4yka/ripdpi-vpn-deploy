---
# Cross-repo contract drift detection.
#
# The `contract/` directory is the single source of truth for the RIPDPI bundle
# contract; the Android client (po4yka/RIPDPI) vendors a byte-identical copy
# under core/data/src/test/resources/contract/. That copy is maintained by hand,
# so nothing automatically notices when this repo's schema changes and the
# client copy goes stale — both repos stay green against their own copies. This
# job closes that gap: it byte-compares the client's vendored copy against this
# repo's SoT and fails on any drift, catching it at the source (the PR that
# changes the schema here).
#
# Both repos are public, so the client's vendored copy is fetched with an
# anonymous shallow sparse clone — no token or secret to configure, so this
# check always enforces. If po4yka/RIPDPI is ever made private, switch the clone
# URL to use a read-only token (see git history of this file).
name: contract-sync

on:
  pull_request:
    paths:
      - "contract/**"
      - ".github/workflows/contract-sync.yml"
  push:
    branches: [main]
    paths:
      - "contract/**"
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC — catch drift even with no contract PR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: client vendored copy matches SoT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Compare client vendored contract against this repo's SoT
        env:
          CLIENT_REPO: po4yka/RIPDPI
          CLIENT_CONTRACT_DIR: core/data/src/test/resources/contract
        run: |
          set -euo pipefail

          # Anonymous shallow sparse clone of just the vendored contract dir.
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${CLIENT_REPO}.git" client
          git -C client sparse-checkout set "${CLIENT_CONTRACT_DIR}"

          client_dir="client/${CLIENT_CONTRACT_DIR}"
          if [ ! -d "${client_dir}" ]; then
            echo "::error title=missing client dir::${CLIENT_CONTRACT_DIR} not found in ${CLIENT_REPO} (renamed or removed?)."
            exit 1
          fi
          fail=0

          # Every SoT file (except docs) must be byte-identical in the client.
          while IFS= read -r f; do
            rel="${f#contract/}"
            case "$rel" in README.md|*/README.md) continue ;; esac
            cf="${client_dir}/${rel}"
            if [ ! -f "$cf" ]; then
              echo "::error title=missing vendored file::client lacks ${rel}; vendor it from contract/${rel}."
              fail=1
            elif ! cmp -s "$f" "$cf"; then
              echo "::error title=contract drift::contract/${rel} differs from the client vendored copy; re-vendor byte-for-byte."
              fail=1
            fi
          done < <(find contract -type f | sort)

          # Flag client-vendored files that no longer exist in the SoT.
          while IFS= read -r cf; do
            rel="${cf#"${client_dir}/"}"
            case "$rel" in README.md|*/README.md) continue ;; esac
            if [ ! -f "contract/${rel}" ]; then
              echo "::error title=orphan vendored file::client vendors ${rel} but it no longer exists in contract/; remove it."
              fail=1
            fi
          done < <(find "${client_dir}" -type f | sort)

          if [ "$fail" -eq 0 ]; then
            echo "contract-sync: OK — client vendored copy is byte-identical to the SoT."
          fi
          exit "$fail"
