---
name: daily-security

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-security
  cancel-in-progress: false

jobs:
  dependencies:
    name: locked dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.31.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .git,.cache,.ansible,.terraform,.venv,tools/tasking/node_modules
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
      - name: Retain the dependency scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: daily-security-${{ github.run_attempt }}-dependencies
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency code scanning results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: daily-locked-dependencies

  images:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/image-scan.yml
    with:
      retain-reports: true

  notify:
    name: notify on changed security results
    needs: [dependencies, images]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download scan evidence
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: daily-security-${{ github.run_attempt }}-*
          path: security-reports
      - name: Update the owner notification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          SECURITY_JOB_RESULTS: ${{ toJSON(needs) }}
          SECURITY_DOWNLOAD_RESULT: ${{ steps.reports.outcome }}
          SECURITY_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const notify = require('./scripts/notify-security-scan.cjs');
            await notify({github, context, core});
