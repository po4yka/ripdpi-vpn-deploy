---
name: image-scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enumerate-images:
    timeout-minutes: 5
    name: enumerate container images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-python
      - name: Collect test and production images
        id: images
        run: echo "matrix=$(python3 scripts/list-container-images.py)" >> "$GITHUB_OUTPUT"

  scan:
    timeout-minutes: 15
    name: trivy (${{ matrix.image }})
    needs: enumerate-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.enumerate-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Each architecture retains a stable category when its digest changes.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.31.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore
          # Without this, trivy-action `unset`s the severity filter for SARIF
          # output ("Building SARIF report with all severities"), so exit-code
          # fires on MEDIUM/LOW findings too — defeating the HIGH,CRITICAL gate.
          # Keep the SARIF (and the exit-code) limited to the severities above.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.category }}
