---
name: image-scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enumerate-images:
    name: enumerate base images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Collect base images from molecule scenarios
        id: images
        run: |
          mapfile -t files < <(find ansible/roles ansible/molecule -path '*/molecule.yml' -type f)

          if [ "${#files[@]}" -eq 0 ]; then
            images='["__none__"]'
          else
            images=$(awk '/image:/ {print $2}' "${files[@]}" \
              | grep -v '^true$' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            if [ "${images}" = "[]" ]; then
              images='["__none__"]'
            fi
          fi
          echo "matrix=${images}" >> "$GITHUB_OUTPUT"

  scan:
    name: trivy (${{ matrix.image }})
    needs: enumerate-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.enumerate-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: No Molecule base images configured
        if: matrix.image == '__none__'
        run: echo "No Molecule base images are configured."

      - name: Run Trivy vulnerability scanner
        if: matrix.image != '__none__'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.31.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore
          # Without this, trivy-action `unset`s the severity filter for SARIF
          # output ("Building SARIF report with all severities"), so exit-code
          # fires on MEDIUM/LOW findings too — defeating the HIGH,CRITICAL gate.
          # Keep the SARIF (and the exit-code) limited to the severities above.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF results
        if: always() && matrix.image != '__none__'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}
