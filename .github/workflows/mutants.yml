---
name: cargo-mutants weekly

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutants:
    name: mutation testing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: vpnd

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.0.0 --locked

      - name: Run mutation tests
        id: mutants
        working-directory: vpnd
        # Full pass over vpnd/.cargo/mutants.toml. Surviving mutants are
        # reported below; baseline, timeout, usage and logging failures are red.
        shell: bash
        run: |
          set +e
          ../scripts/test-vpnd-mutants.sh 2>&1 | tee "$RUNNER_TEMP/mutants-output.txt"
          status=("${PIPESTATUS[@]}")
          set -e
          echo "exit_code=${status[0]}" >> "$GITHUB_OUTPUT"
          if (( status[1] != 0 )); then
            exit "${status[1]}"
          fi
          case "${status[0]}" in
            0|2) ;;
            *) exit "${status[0]}" ;;
          esac

      - name: Retain mutation results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: vpnd-mutation-results
          path: |
            ${{ runner.temp }}/mutants-output.txt
            vpnd/mutants.out/
          retention-days: 14

      - name: Report surviving mutants to tracking issue
        if: steps.mutants.outputs.exit_code == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync(process.env.RUNNER_TEMP + '/mutants-output.txt', 'utf8');
            const label = 'automation:mutation-testing';
            const weekOf = new Date().toISOString().slice(0, 10);
            const title = `Surviving mutants — week of ${weekOf}`;

            // Ensure the label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'e4e669',
                  description: 'Tracks cargo-mutants surviving mutant reports',
                });
              }
            }

            // Find an open tracking issue for this label
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });

            const body = [
              `## ${title}`,
              '',
              'Workflow run: ' + context.serverUrl + '/' +
                context.repo.owner + '/' + context.repo.repo +
                '/actions/runs/' + context.runId,
              '',
              '```',
              output.slice(0, 60000),
              '```',
              '',
              'Each surviving mutant either needs a new test in the next PR',
              'or a `// MUTANT-OK: <reason>` comment in the source.',
            ].join('\n');

            if (issues.data.length > 0) {
              // Append a comment to the existing tracking issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body,
              });
              core.info(`Commented on issue #${issues.data[0].number}`);
            } else {
              // Open a fresh tracking issue
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: [label],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
