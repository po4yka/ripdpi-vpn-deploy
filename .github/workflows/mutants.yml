---
name: Python mutation checks weekly

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutants:
    name: mutation testing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-python

      - name: Run mutation tests
        id: mutants
        working-directory: vpnd
        # Full pass over the mutation scope in vpnd/pyproject.toml. Survivors are
        # reported below; baseline, timeout, usage and logging failures are red.
        shell: bash
        run: |
          set +e
          ../scripts/test-vpnd-mutants.sh 2>&1 | tee "$RUNNER_TEMP/mutants-output.txt"
          status=("${PIPESTATUS[@]}")
          set -e
          echo "exit_code=${status[0]}" >> "$GITHUB_OUTPUT"
          if (( status[1] != 0 )); then
            exit "${status[1]}"
          fi
          case "${status[0]}" in
            0|2) ;;
            *) exit "${status[0]}" ;;
          esac

      - name: Retain mutation results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: vpnd-mutation-results
          path: |
            ${{ runner.temp }}/mutants-output.txt
            vpnd/mutants/
          retention-days: 14

      - name: Report surviving mutants to tracking issue
        if: steps.mutants.outputs.exit_code == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // The console log is mostly progress frames; report the structured results.
            const runs = fs.readdirSync('vpnd/mutants').filter(name => name.startsWith('run.'));
            if (runs.length !== 1) {
              throw new Error(`Expected one mutation report, found ${runs.length}`);
            }
            const report = `vpnd/mutants/${runs[0]}`;
            const stats = JSON.parse(fs.readFileSync(`${report}/mutmut-cicd-stats.json`, 'utf8'));
            const survivors = fs.readFileSync(`${report}/mutmut-results.txt`, 'utf8')
              .split('\n').map(line => line.trim())
              .filter(line => line.endsWith(': survived'))
              .map(line => line.slice(0, -': survived'.length));
            if (survivors.length !== stats.survived) {
              throw new Error(`Listed ${survivors.length} survivors, stats report ${stats.survived}`);
            }
            let list = survivors.join('\n');
            if (list.length > 60000) {
              list = list.slice(0, list.lastIndexOf('\n', 60000)) +
                '\n... (truncated; see the vpnd-mutation-results artifact)';
            }
            const label = 'automation:mutation-testing';
            const weekOf = new Date().toISOString().slice(0, 10);
            const title = `Surviving mutants — week of ${weekOf}`;

            // Ensure the label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'e4e669',
                  description: 'Tracks Python surviving mutant reports',
                });
              }
            }

            // Find an open tracking issue for this label
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });

            const body = [
              `## ${title}`,
              '',
              'Workflow run: ' + context.serverUrl + '/' +
                context.repo.owner + '/' + context.repo.repo +
                '/actions/runs/' + context.runId,
              '',
              `Killed ${stats.killed}, timeout ${stats.timeout}, ` +
                `survived ${stats.survived} of ${stats.total} mutants.`,
              '',
              '```',
              list,
              '```',
              '',
              'Each surviving mutant either needs a new test in the next PR',
              'or an independently reviewed equivalent-mutant explanation.',
            ].join('\n');

            if (issues.data.length > 0) {
              // Append a comment to the existing tracking issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body,
              });
              core.info(`Commented on issue #${issues.data[0].number}`);
            } else {
              // Open a fresh tracking issue
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: [label],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
