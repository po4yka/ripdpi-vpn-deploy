name: publish-observability-kuma

on:
  push:
    paths:
      - 'images/observability-kuma/**'
      - '.github/workflows/publish-observability-kuma.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/po4yka/ripdpi-vpn-deploy/observability-kuma
      IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/observability-kuma
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/po4yka/ripdpi-vpn-deploy
      - name: Require native SQLite binding
        run: docker run --rm --network none --entrypoint node "${IMAGE}:${IMAGE_TAG}" -e "require('/app/node_modules/@louislam/sqlite3')"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.31.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: observability-kuma-${{ matrix.architecture }}
      - name: Bind the scanned image configuration
        id: scanned
        run: echo "config=$(docker inspect --format '{{.Id}}' "${IMAGE}:${IMAGE_TAG}")" >> "$GITHUB_OUTPUT"
      - name: Publish the cached build with provenance
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/observability-kuma
          push: true
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/po4yka/ripdpi-vpn-deploy
      - name: Verify the published digest contains the scanned image
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          SCANNED_CONFIG: ${{ steps.scanned.outputs.config }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          index=$(docker buildx imagetools inspect "${IMAGE}@${PUBLISHED_DIGEST}" --raw)
          child=$(jq -er --arg arch "$ARCHITECTURE" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
            | if length == 1 then .[0].digest else error("one runnable manifest required") end' <<< "$index")
          jq -e --arg child "$child" '
            any(.manifests[]; .annotations["vnd.docker.reference.type"] == "attestation-manifest"
              and .annotations["vnd.docker.reference.digest"] == $child)' <<< "$index" >/dev/null
          reference="${IMAGE}@${child}"
          docker pull "$reference"
          test "$(docker inspect --format '{{.Id}}' "$reference")" = "$SCANNED_CONFIG"
          echo "runtime_ref=$reference" >> "$GITHUB_STEP_SUMMARY"
          echo "provenance_ref=${IMAGE}@${PUBLISHED_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
