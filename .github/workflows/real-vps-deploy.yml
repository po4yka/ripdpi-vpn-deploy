---
name: real-vps-deploy
# One fresh guest per selected distro; all credentialed steps live behind the
# protected environment in ci-disposable-deploy.yml.
on:
  workflow_dispatch:
    inputs:
      zone:
        description: UpCloud zone
        required: false
        default: fi-hel1
  pull_request:
    types: [labeled]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci-real-deploy'))
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(vars.CI_REAL_DEPLOY_UBUNTU24 == 'true' && '["debian13","ubuntu2404"]' || '["debian13"]') }}
    uses: ./.github/workflows/ci-disposable-deploy.yml
    with:
      distro: ${{ matrix.distro }}
      profile: p0p1p2
      mode: deploy
      zone: ${{ github.event.inputs.zone || 'fi-hel1' }}
