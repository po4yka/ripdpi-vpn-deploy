---
name: release-vpnd
on:
  push:
    tags:
      - 'vpnd-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: vpnd release tag (vpnd-vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      release-tag: ${{ steps.validate.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: validate
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/validate-vpnd-release-tag.sh "$TAG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  build:
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
      - name: Verify Python release
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.release-tag }}
        run: python3 scripts/check-vpnd-package.py --release-tag "$RELEASE_TAG"
      - name: Build locked release bundle
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/build-vpnd-package.py --output dist --bundle-target "$TARGET"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/vpnd-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: vpnd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  release:
    name: attach release assets
    needs: [build, validate-tag]
    runs-on: ubuntu-24.04
    concurrency:
      group: vpnd-release-${{ needs.validate-tag.outputs.release-tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: vpnd-*
          path: dist
          merge-multiple: true
      - name: Emit SBOM
        uses: ./.github/actions/vpnd-sbom
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum vpnd-* sbom.json | tee SHA256SUMS
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-${{ needs.validate-tag.outputs.release-tag }}
          path: dist/sbom.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/vpnd-x86_64-unknown-linux-gnu.tar.gz
            dist/vpnd-aarch64-unknown-linux-gnu.tar.gz
            dist/vpnd-x86_64-apple-darwin.tar.gz
            dist/vpnd-aarch64-apple-darwin.tar.gz
            dist/SHA256SUMS
            dist/sbom.json
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          packages=(dist/vpnd-*-py3-none-any.whl dist/vpnd-[0-9]*.tar.gz)
          for asset in "${packages[@]}"; do
            test -s "$asset"
          done
          assets+=("${packages[@]}")
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [[ "$release_is_draft" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes ""
          fi
