---
name: release-vpnd

on:
  push:
    tags:
      - 'vpnd-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "vpnd release tag (vpnd-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      release-tag: ${{ steps.validate.outputs.release-tag }}
    steps:
      - name: Checkout release revision and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: validate
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/validate-vpnd-release-tag.sh "$TAG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build-x86_64-linux:
    name: build (x86_64-unknown-linux-gnu)
    needs: validate-tag
    uses: ./.github/workflows/_rust.yml
    with:
      target: x86_64-unknown-linux-gnu
      cargo-command: build --release --locked
      cross: false
      upload-binary: true

  build-aarch64-linux:
    name: build (aarch64-unknown-linux-gnu)
    needs: validate-tag
    uses: ./.github/workflows/_rust.yml
    with:
      target: aarch64-unknown-linux-gnu
      cargo-command: build --release --locked
      cross: true
      upload-binary: true

  build-x86_64-macos:
    name: build (x86_64-apple-darwin)
    needs: validate-tag
    uses: ./.github/workflows/_rust.yml
    with:
      target: x86_64-apple-darwin
      cargo-command: build --release --locked
      cross: false
      upload-binary: true

  build-aarch64-macos:
    name: build (aarch64-apple-darwin)
    needs: validate-tag
    uses: ./.github/workflows/_rust.yml
    with:
      target: aarch64-apple-darwin
      cargo-command: build --release --locked
      cross: false
      upload-binary: true

  attest:
    name: attest (${{ matrix.target }})
    needs:
      - build-x86_64-linux
      - build-aarch64-linux
      - build-x86_64-macos
      - build-aarch64-macos
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vpnd-${{ matrix.target }}
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/vpnd-${{ matrix.target }}

      - name: Re-upload attested artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: attested-vpnd-${{ matrix.target }}
          path: dist/vpnd-${{ matrix.target }}
          retention-days: 1

  release:
    name: attach release assets
    needs:
      - attest
      - validate-tag
    runs-on: ubuntu-24.04
    # contents: write is required for gh release upload. It is scoped to this
    # job only; the top-level token remains read-only.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.release-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download all attested binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: attested-vpnd-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum vpnd-* | tee SHA256SUMS

      - name: Emit SBOM
        # Generates sbom/<tag>.json from the pinned example secrets schema.
        # A real release should set VPN_SECRETS_FILE to a decrypted secrets file
        # and SBOM_LABEL to a meaningful label (e.g. the tag name). Using the
        # example schema here ensures the artifact is always present; operators
        # can re-run with real secrets locally via `scripts/emit-sbom.py`.
        env:
          SBOM_LABEL: ${{ needs.validate-tag.outputs.release-tag }}
        run: |
          python3 -m pip install --quiet --require-hashes --no-deps -r requirements.txt
          python3 scripts/emit-sbom.py
          cp "sbom/${SBOM_LABEL}.json" dist/sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-${{ needs.validate-tag.outputs.release-tag }}
          path: dist/sbom.json
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/vpnd-x86_64-unknown-linux-gnu \
            dist/vpnd-aarch64-unknown-linux-gnu \
            dist/vpnd-x86_64-apple-darwin \
            dist/vpnd-aarch64-apple-darwin \
            dist/SHA256SUMS \
            dist/sbom.json \
            --clobber
