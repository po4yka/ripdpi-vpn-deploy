---
name: reproducible-build

# Verifies that the prebuilt-binary sha256s pinned in the secrets schema
# correspond to deterministic from-source rebuilds of the same tag. If a
# release tag is silently re-cut with different bytes, this job fails the
# CI before the operator deploys it.
#
# Scope: xray-core, hysteria, rclone, RealiTLScanner. AmneziaWG sha256s are not
# pinned in v1 schema and are out of scope here.

on:
  workflow_call:
    inputs:
      artifact_producer_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      artifact_producer_only:
        description: Build and verify artifacts before their first publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-runtimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Rebuild exact stable sources with the patched compiler
        run: make security-runtime-build
      - name: Require exact published artifact bytes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          built = json.loads(Path(".cache/security-runtime-artifacts/build.json").read_text())
          expected = json.loads(Path("scripts/security-runtime-artifacts.json").read_text())
          if built["artifacts"] != expected["artifacts"]:
              raise SystemExit("patched runtime artifact bytes differ from the approved pins")
          PY
      - name: Prove actual dpkg replacement and native compiler version
        run: |
          set -euo pipefail
          { go version; dpkg-deb --version; dpkg-query -W dpkg liblzma5; } > .cache/security-runtime-artifacts/packaging-toolchain.txt
          package_root="$(mktemp -d)"
          trap 'sudo rm -rf -- "$package_root"' EXIT
          mkdir -p "$package_root/var/lib/dpkg"
          touch "$package_root/var/lib/dpkg/status"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 10 --retry-max-time 480 --connect-timeout 10 --max-time 120 \
            https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.deb \
            --output "$package_root/previous.deb"
          echo "efbfe852181f7191eb3c9043ed1ab49c9b2d0ba045c61c926a5da111c939ec5c  $package_root/previous.deb" | sha256sum -c -
          sudo dpkg --root="$package_root" --log="$package_root/dpkg.log" --unpack "$package_root/previous.deb"
          test "$(dpkg-query --admindir="$package_root/var/lib/dpkg" -W '-f=${Version}' rclone)" = 1.75.2
          sudo dpkg --root="$package_root" --log="$package_root/dpkg.log" \
            --unpack .cache/security-runtime-artifacts/rclone-1.75.2+go1.27.3-1-linux-amd64.deb
          test "$(dpkg-query --admindir="$package_root/var/lib/dpkg" -W '-f=${Version}' rclone)" = 1.75.2+go1.27.3-1
          "$package_root/usr/bin/rclone" version | tee "$package_root/native-version"
          grep -Fx 'rclone v1.75.2' "$package_root/native-version"
          grep -Fx -- '- go/version: go1.27.3' "$package_root/native-version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: security-runtime-build
          retention-days: 7
          if-no-files-found: error
          path: |
            .cache/security-runtime-artifacts/build.json
            .cache/security-runtime-artifacts/SHA256SUMS
            .cache/security-runtime-artifacts/packaging-toolchain.txt
            .cache/security-runtime-artifacts/hysteria-linux-*
            .cache/security-runtime-artifacts/rclone-linux-*
            .cache/security-runtime-artifacts/rclone-*.deb
            .cache/security-runtime-artifacts/*-LICENSE
  xray-core:
    if: ${{ !inputs.artifact_producer_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned xray version + sha256 from schema
        id: pin
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import yaml
          d = yaml.safe_load(open("secrets/prod.secrets.example.yaml")) or {}
          x = d.get("xray") or {}
          v   = x.get("version", "")
          amd = x.get("linux_amd64_sha256", "")
          version_pattern = r"(?:v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.+-]+)?|REPLACE_WITH_[A-Z0-9_]+)"
          sha_pattern = r"(?:[0-9a-fA-F]{64}|REPLACE_WITH_RELEASE_SHA256|)"
          if re.fullmatch(version_pattern, v) is None:
              raise SystemExit("invalid xray version pin")
          if re.fullmatch(sha_pattern, amd) is None:
              raise SystemExit("invalid xray sha256 pin")
          print(f"version={v}")
          print(f"sha={amd}")
          PY

      - name: Skip when pin is a placeholder
        if: ${{ steps.pin.outputs.sha == 'REPLACE_WITH_RELEASE_SHA256' || steps.pin.outputs.sha == '' }}
        run: echo "no real sha256 pinned yet; skipping rebuild verification" && exit 0

      - name: Set up Go (matching XTLS upstream)
        if: ${{ steps.pin.outputs.sha != 'REPLACE_WITH_RELEASE_SHA256' && steps.pin.outputs.sha != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.23.x"
          check-latest: true

      - name: Clone Xray-core at pinned tag
        if: ${{ steps.pin.outputs.sha != 'REPLACE_WITH_RELEASE_SHA256' && steps.pin.outputs.sha != '' }}
        env:
          PIN_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          git clone --depth 1 --branch "$PIN_VERSION" \
            https://github.com/XTLS/Xray-core src

      - name: Build deterministically
        if: ${{ steps.pin.outputs.sha != 'REPLACE_WITH_RELEASE_SHA256' && steps.pin.outputs.sha != '' }}
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -trimpath
        run: |
          set -euo pipefail
          go build -ldflags="-s -w" -o ../xray-built ./main

      - name: Compare local build sha256 against schema pin
        if: ${{ steps.pin.outputs.sha != 'REPLACE_WITH_RELEASE_SHA256' && steps.pin.outputs.sha != '' }}
        env:
          PIN_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          local_sha="$(sha256sum xray-built | awk '{print $1}')"
          schema_sha="$PIN_SHA"
          echo "schema:  ${schema_sha}"
          echo "rebuild: ${local_sha}"
          # xray mismatch is advisory only: Go releases are not reproducible
          # by default (build IDs, timestamps, toolchain version all affect
          # the binary). A mismatch here does NOT indicate tampering — it
          # means upstream's toolchain differs from ours. The role downloads
          # the upstream release asset and verifies its sha256; that check is
          # the actual integrity gate. Hysteria uses a downloaded release
          # asset verified against a pinned sha256, making it the blocking
          # reproducibility gate for this workflow.
          if [[ "${local_sha}" != "${schema_sha}" ]]; then
            echo "::warning::Rebuild sha256 does not match schema pin."
            echo "::warning::This usually means upstream ships a different toolchain build."
            echo "::warning::Verify the release-asset sha256 instead (downloaded by the role)."
          else
            echo "match — rebuild is bit-identical to the pinned binary"
          fi

  hysteria:
    if: ${{ !inputs.artifact_producer_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned hysteria version
        id: pin
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import yaml
          d = yaml.safe_load(open("secrets/prod.secrets.example.yaml")) or {}
          h = d.get("hysteria") or {}
          v = h.get("version", "")
          amd = h.get("linux_amd64_sha256", "")
          version_pattern = r"(?:v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.+-]+)?|REPLACE_WITH_[A-Z0-9_]+)"
          sha_pattern = r"(?:[0-9a-fA-F]{64}|REPLACE_WITH_RELEASE_SHA256|)"
          if re.fullmatch(version_pattern, v) is None:
              raise SystemExit("invalid hysteria version pin")
          if re.fullmatch(sha_pattern, amd) is None:
              raise SystemExit("invalid hysteria sha256 pin")
          print(f"version={v}")
          print(f"sha={amd}")
          PY

      - name: Skip when pin is a placeholder
        if: ${{ steps.pin.outputs.sha == 'REPLACE_WITH_RELEASE_SHA256' || steps.pin.outputs.sha == '' }}
        run: echo "no real sha256 pinned yet; skipping" && exit 0

      - name: Verify release-asset sha256 matches schema
        if: ${{ steps.pin.outputs.sha != 'REPLACE_WITH_RELEASE_SHA256' && steps.pin.outputs.sha != '' }}
        env:
          PIN_SHA: ${{ steps.pin.outputs.sha }}
          PIN_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          ver="$PIN_VERSION"
          url="https://github.com/po4yka/ripdpi-vpn-deploy/releases/download/runtime-go1.27.3-20261102/hysteria-linux-amd64"
          curl -fsSL --retry 4 --retry-delay 10 --retry-max-time 480 --connect-timeout 10 --max-time 120 -o hysteria-bin "$url"
          asset_sha="$(sha256sum hysteria-bin | awk '{print $1}')"
          echo "release asset sha256: ${asset_sha}"
          echo "schema pin:           $PIN_SHA"
          [[ "$asset_sha" == "$PIN_SHA" ]] \
            || { echo "::error::release-asset sha256 differs from schema pin"; exit 1; }
          chmod 0755 hysteria-bin
          ./hysteria-bin version > hysteria-version.txt
          grep -Fx "Version:$(printf '\t')${ver}" hysteria-version.txt
          grep -Fx "Toolchain:$(printf '\t')go1.27.3" hysteria-version.txt

  realitlscanner:
    if: ${{ !inputs.artifact_producer_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned RealiTLScanner version + sha256
        id: pin
        run: |
          set -euo pipefail
          ver="$(grep -E '^REALI_VERSION=' scripts/scan-reality-targets.sh \
                 | cut -d'"' -f2)"
          sha="$(grep -E '^REALI_LINUX_SHA256=' scripts/scan-reality-targets.sh \
                 | cut -d'"' -f2)"
          [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]] \
            || { echo "::error::invalid RealiTLScanner version pin"; exit 1; }
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] \
            || { echo "::error::invalid RealiTLScanner sha256 pin"; exit 1; }
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}"     >> "$GITHUB_OUTPUT"

      - name: Verify release-asset sha256 matches script pin
        env:
          PIN_SHA: ${{ steps.pin.outputs.sha }}
          PIN_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/XTLS/RealiTLScanner/releases/download/${PIN_VERSION}/RealiTLScanner-linux-64"
          curl -fsSL --retry 4 --retry-delay 10 --retry-max-time 480 --connect-timeout 10 --max-time 120 -o reali "$url"
          asset_sha="$(sha256sum reali | awk '{print $1}')"
          echo "release asset sha256: ${asset_sha}"
          echo "script pin:           $PIN_SHA"
          [[ "$asset_sha" == "$PIN_SHA" ]] \
            || { echo "::error::release-asset sha256 differs from script pin"; exit 1; }
