---
name: rkn-block-checker-baseline

# Operator-triggered regression baseline. Runs the four-layer
# diagnostic from the GitHub runner itself and uploads the JSON report
# + diff as a workflow artifact. Not run on push or PR — the upstream
# tool issues real network probes that are out of place in CI lanes.
#
# The lane takes no exit IP or proxy input: dispatch inputs, logs and
# artifacts of this public repository are world-readable, and a node
# address published there is burned. Probe through a node only with the
# local wrapper (docs/how-to/regression-baseline.md).

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  baseline:
    name: rkn-block-checker baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-pinned Python tooling + jq
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --no-deps -r requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends jq

      - name: Run baseline
        id: baseline
        run: |
          set -euo pipefail
          args=(local)
          # State dir inside the runner workspace so the upload step picks it up.
          args+=(--state-dir "${GITHUB_WORKSPACE}/.rkn-baseline")
          # Wrapper exits non-zero when verdicts shift; capture but do not fail
          # the job — the diff itself is the deliverable.
          ./scripts/run-rkn-block-checker.sh "${args[@]}" || true

      - name: Upload baseline report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: rkn-block-checker-baseline-local
          path: .rkn-baseline/
          if-no-files-found: error
          retention-days: 90
