---
name: transport-reachability-matrix
# Independent fresh guest per profile. Runner baseline reports remain distinct
# from the canonical authenticated protocol promotion probes.
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Comma-separated profiles, each provisioned on a fresh guest
        required: false
        default: p0,p0p1,p0p1p2
      zone:
        description: UpCloud zone
        required: false
        default: fi-hel1
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  selection:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci-real-deploy'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - name: Validate selected profiles
        id: profiles
        env:
          PROFILES_INPUT: ${{ github.event.inputs.profiles || 'p0,p0p1,p0p1p2' }}
        run: |
          python3 - <<'PY'
          import json, os
          profiles = os.environ['PROFILES_INPUT'].split(',')
          allowed = {'p0', 'p0p1', 'p0p1p2', 'p0p4', 'p0p5'}
          if not profiles or len(set(profiles)) != len(profiles) or set(profiles) - allowed:
              raise SystemExit('invalid profile selection')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('profiles=' + json.dumps(profiles) + '\n')
          PY
  matrix:
    needs: selection
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(needs.selection.outputs.profiles) }}
    uses: ./.github/workflows/ci-disposable-deploy.yml
    with:
      distro: debian13
      profile: ${{ matrix.profile }}
      mode: matrix
      zone: ${{ github.event.inputs.zone || 'fi-hel1' }}
