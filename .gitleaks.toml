title = "vpn-deploy custom rules"

[extend]
useDefault = true

[[rules]]
id = "vless-uri"
description = "VLESS subscription URI"
regex = '''vless://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+'''
tags = ["vpn", "secret"]

[[rules]]
id = "trojan-uri"
description = "Trojan URI"
regex = '''trojan://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+'''
tags = ["vpn", "secret"]

[[rules]]
id = "hysteria2-uri"
description = "Hysteria2 URI"
regex = '''hysteria2://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+'''
tags = ["vpn", "secret"]

[[rules]]
id = "xray-reality-private-key"
description = "Xray REALITY private key"
regex = '''(?i)(privateKey|reality_private_key)["'\s:=]+[A-Za-z0-9_-]{30,}'''
tags = ["vpn", "secret"]

[[rules]]
id = "wireguard-private-key"
description = "WireGuard / AmneziaWG private key"
regex = '''(?i)(privatekey|private_key)["'\s:=]+[A-Za-z0-9+/]{40,}={0,2}'''
tags = ["vpn", "secret"]

[[rules]]
id = "subscription-token"
description = "Subscription token / path"
regex = '''(?i)(sub|subscription).{0,30}(token|uuid|key)["'\s:=]+[A-Za-z0-9._~/-]{16,}'''
tags = ["vpn", "secret"]

[[rules]]
id = "age-secret-key"
description = "age secret key"
regex = '''AGE-SECRET-KEY-[A-Z0-9]{58}'''
tags = ["age", "secret"]

[[rules]]
id = "snell-credential"
description = "Snell PSK or per-user key"
regex = '''(?i)(?:snell[_ .-]{0,30}(?:psk|userkey)|\b(?:psk|userkey)\b)["'\s:=]+[A-Za-z0-9+/_.-]{16,}={0,2}'''
tags = ["vpn", "secret"]

[allowlist]
description = "Narrowly scoped fixtures/placeholders that intentionally look secret-like"
commits = [
    "0c241e6fa9c944445100d26d451c5e991d725ee8",
    "0311b9d4f5d97e8b14c3135a5f429820711e5dbe",
]
paths = [
    '''secrets/prod\.secrets\.example\.yaml''',
    '''.*\.example\..*''',
    '''ansible/roles/.*/molecule/.*''',
    '''ansible/molecule/.*''',
    '''tests/bats/age_recovery_roundtrip\.bats''',
    '''tests/unit/test_age_recovery_roundtrip\.py''',
    '''tests/unit/test_gitleaks_rules\.py''',
    '''tests/fixtures/age-test\.key''',
    '''tests/fixtures/secrets-sample\.yml''',
    '''tests/fixtures/age-recovery-shares/.*''',
    '''tests/snapshot/golden/.*''',
]
regexes = [
    '''REPLACE_WITH_[A-Z_]+''',
    '''<[A-Z_]+>''',
    '''AAAA_REPLACE_WITH_PUBLIC_KEY''',
    '''age-keygen''',
    '''STUB_[A-Z_]+''',
    '''MOLECULE_[A-Z_]+''',
]
