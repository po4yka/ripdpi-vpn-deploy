title = "vpn-deploy custom rules"

[extend]
useDefault = true

[[rules]]
id = "jfrog-identity-token"
[[rules.allowlists]]
description = "Exact public Xray Linux amd64 release archive SHA-256 values"
condition = "AND"
paths = ['''^\.github/actions/install-xray/action\.yml$''']
regexTarget = "line"
regexes = ['''^\s*XRAY_SHA256: (23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae|e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214)\s*$''']

[[rules]]
id = "vless-uri"
description = "VLESS subscription URI"
regex = '''vless://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+'''
tags = ["vpn", "secret"]

[[rules]]
id = "trojan-uri"
description = "Trojan URI"
regex = '''trojan://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+'''
tags = ["vpn", "secret"]

[[rules]]
id = "hysteria2-uri"
description = "Hysteria2 URI"
regex = '''hysteria2://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+'''
tags = ["vpn", "secret"]

[[rules]]
id = "xray-reality-private-key"
description = "Xray REALITY private key"
regex = '''(?i)(privateKey|reality_private_key)["'\s:=]+[A-Za-z0-9_-]{30,}'''
tags = ["vpn", "secret"]

[[rules]]
id = "wireguard-private-key"
description = "WireGuard / AmneziaWG private key"
regex = '''(?i)(privatekey|private_key)["'\s:=]+[A-Za-z0-9+/]{40,}={0,2}'''
tags = ["vpn", "secret"]

[[rules]]
id = "wireguard-preshared-key"
description = "WireGuard / AmneziaWG per-device preshared key"
regex = '''(?i)preshared_?key["'\s:=]+[A-Za-z0-9+/]{43}='''
tags = ["vpn", "secret"]

[[rules.allowlists]]
description = "Synthetic preshared keys in contract goldens and unit fixtures"
paths = [
    '''^contract/ripdpi-bundle\.golden-full\.json$''',
    '''^tests/unit/test_emit_bundle_host_selection\.py$''',
    '''^tests/unit/test_retire_unbound_staging_client\.py$''',
    '''^tests/unit/test_secrets_schema\.py$''',
]

[[rules]]
id = "subscription-token"
description = "Subscription token / path"
regex = '''(?i)(sub|subscription).{0,30}(token|uuid|key)["'\s:=]+[A-Za-z0-9._~/-]{16,}'''
tags = ["vpn", "secret"]

[[rules]]
id = "age-secret-key"
description = "age secret key"
regex = '''AGE-SECRET-KEY-[A-Z0-9]{58}'''
tags = ["age", "secret"]

[[rules]]
id = "snell-credential"
description = "Snell PSK or per-user key"
regex = '''(?i)(?:snell[_ .-]{0,30}(?:psk|userkey)|\b(?:psk|userkey)\b)["'\s:=]+[A-Za-z0-9+/_.-]{16,}={0,2}'''
tags = ["vpn", "secret"]

[[rules.allowlists]]
description = "Snell per-device credential generation expression"
condition = "AND"
paths = ['''^scripts/device_lifecycle_credentials\.py$''']
regexTarget = "line"
regexes = ['''^\s*variant\['users'\]\.append\(\{'name': name, 'userkey': secrets\.token_urlsafe\(32\)\}\)\s*$''']

[allowlist]
description = "Narrowly scoped fixtures/placeholders that intentionally look secret-like"
commits = [
    "0c241e6fa9c944445100d26d451c5e991d725ee8",
]
paths = [
    '''secrets/prod\.secrets\.example\.yaml''',
    '''.*\.example\..*''',
    '''ansible/roles/.*/molecule/.*''',
    '''ansible/molecule/.*''',
    '''tests/bats/age_recovery_roundtrip\.bats''',
    '''tests/unit/test_age_recovery_roundtrip\.py''',
    '''tests/unit/test_gitleaks_rules\.py''',
    '''tests/unit/test_reality_self_steal\.py''',
    '''tests/unit/test_emit_singbox_roundtrip\.py''',
    '''tests/unit/test_client_payload_incy_links\.py''',
    '''tests/fixtures/age-test\.key''',
    '''tests/fixtures/secrets-sample\.yml''',
    '''tests/fixtures/age-recovery-shares/.*''',
    '''tests/snapshot/golden/.*''',
]
regexes = [
    '''REPLACE_WITH_[A-Z_]+''',
    '''<[A-Z_]+>''',
    '''age-keygen''',
    '''STUB_[A-Z_]+''',
    '''MOLECULE_[A-Z_]+''',
]
