---
# Tunables shared across every host. Secrets do NOT live here — they are
# loaded at runtime from VPN_SECRETS_FILE in playbook vars_files.

probe_matrix_runtime_users:
  xray_uid: 971
  mtg_uid: 972

vpn:
  # Toggle transport and service surfaces. Keep host-hardening posture in
  # `security_controls` below so deploy profiles can change security policy
  # without overloading the VPN transport namespace.
  enable_transport_egress: true  # required recipient destination boundary
  enable_xray_reality: true
  enable_reality_self_steal: false # P0 loopback TLS target for owned REALITY camouflage
  enable_nginx_xhttp: true        # P1 — direct, no CDN baseline
  enable_naive: false             # P1 alternative; do not share a public port with nginx-xhttp
  enable_hysteria: true           # P2 — UDP/443
  enable_amneziawg: true          # P2 — device-VPN
  enable_geodata: true            # geosite/geoip pinned + daily refresh
  enable_monitoring: true
  enable_watchdog: true           # local probe + ntfy/Pushover alerts
  enable_backup: true
  enable_subscription_host: false # opt-in; not in v1 default deploy
  enable_tailnet_management: false # opt-in ordinary OpenSSH over a restricted Tailnet

  # Build xray-core from source on the VPS instead of downloading a
  # release asset. Closes the threat "GitHub release tag silently
  # re-cut with different bytes" — the binary comes from a pinned tag
  # of the upstream source tree, built with a pinned Go toolchain.
  # Trade-offs:
  #   * slower first deploy (adds ~2-5 min of `go build`)
  #   * requires Go on the VPS (apt-installable on Debian 13)
  #   * xray.source_linux_{amd64,arm64}_sha256 pin the native source-built
  #     outputs; xray.linux_*_sha256 continue to pin prebuilt archives
  build_xray_from_source: false
  enable_policy_ratelimit: false   # opt-in; daemon tails xray access.log,
                                  # adds offending IPs to an nftables
                                  # set `policy_offenders` with TTL.
                                  # See roles/policy-ratelimit/.
  enable_cdn_front: false         # opt-in; tactical CF-fronted XHTTP
                                  # vhost with real-IP restoration +
                                  # optional origin-firewall lockdown.
                                  # Read docs/decisions/0001-cdn-not-filtered-path-baseline.md before
                                  # turning this on — CDN is NOT the
                                  # filtered-path baseline in this project.
  enable_honeypot: false          # opt-in; active-probing canary listener
                                  # on honeypot.port (default 4443). Logs
                                  # every TCP connect + SNI, exports
                                  # Prometheus textfile metrics. See
                                  # roles/honeypot/defaults/main.yml.
  enable_warp_outbound: false     # opt-in; vendor tunnel_only mode in
                                  # an isolated namespace with a guarded TUN.
                                  # See vpn.warp_outbound_routes below
                                  # for the xray routing hook.
  enable_dns_morph_bridge: false  # opt-in; UDP/53 bootstrap-channel
                                  # listener (P4 fallback tier). Co-installs
                                  # unbound on 127.0.0.1:5353 for the
                                  # active-probing-defense forward path.
                                  # See roles/dns-morph-bridge/CLAUDE.md
                                  # and docs/reference/provider-notes.md.
  enable_hysteria_realm: false    # opt-in; sing-box realm-service
                                  # rendezvous for UDP hole-punching
                                  # (P5 fallback tier). Sing-box ≥
                                  # alpha.22 required on every peer
                                  # — see roles/hysteria-realm/CLAUDE.md
                                  # for the alpha-tier risk profile.
  enable_split_hop_egress: false  # opt-in; runs on Node B in the
                                  # two-VPS split-hop topology. Node B
                                  # initiates a persistent WireGuard
                                  # tunnel to Node A and NAT-forwards
                                  # decapsulated client traffic to
                                  # upstream. Mitigates the FOCI 2026
                                  # per-IP dual-role flow classifier.
                                  # See docs/decisions/0003-split-hop-relay-topology.md
                                  # and docs/how-to/split-hop-pilot.md.
  enable_split_hop_ingress: false # opt-in RESEARCH Node A responder;
                                  # requires allow_research_roles.
  enable_probe_matrix_target: false # opt-in RESEARCH five-protocol target;
                                    # never part of a family deploy.
  enable_snell: false          # RESEARCH; staging-only Snell v4/v6 evaluation
  # EXCEPTION only; role-tiers.yml retains implementation-only governance.
  # Declaring these defaults does not grant per-host exception authorization.
  enable_cascade_ingress: false
  enable_cascade_egress: false

  # When enable_warp_outbound is true AND this list is non-empty, the
  # Xray routes the listed destinations through the private SOCKS
  # normalizer and native namespace gateway, tagged "warp-out".
  # The vendor supplies the TUN, not a SOCKS listener. Each entry is a
  # routing-rule fragment; the role wraps each in {type:"field", …,
  # outboundTag:"warp-out"}. Use geosite:/geoip: for sets, or "domain"
  # arrays for explicit allowlists.
  #
  # Example for a Netflix-via-WARP cohort:
  #   warp_outbound_routes:
  #     - { domain: ["geosite:netflix"] }
  #     - { ip:     ["geoip:cloudflare"] }
  warp_outbound_routes: []

  # To disable the P0 listener entirely, set enable_xray_reality: false
  # and rely on enable_nginx_xhttp for transport.

  # AmneziaWG cohort profile selector. Slug must match a file under
  # `ansible/roles/amneziawg/vars/cohorts/<slug>.yml` (e.g.
  # `narrow-junk-sequential`). When set, the role loads that file
  # and uses its jc/jmin/jmax/s1/s2/h1..h4 as defaults;
  # `amneziawg_secrets` still takes precedence if the operator
  # supplies explicit values there. Empty string keeps the broad-rule
  # baseline baked into the role defaults. See docs/reference/awg-cohorts.md
  # for the shipped profiles. Ignored when `amneziawg_secrets.instances`
  # is non-empty — multi-instance layouts carry their own per-instance
  # obfuscation parameters.
  awg_cohort: ""

# Host-hardening posture flags. `vpn.*` controls which transport/service
# surfaces exist, while `security_controls.*` controls host hardening policy.
security_controls:
  ssh_strict: true
  ssh_allow_tcp_forwarding: false
  ssh_prune_moduli: true
  ssh_required_rsa_size: 0  # 0 omits RequiredRSASize for older OpenSSH compatibility
  ssh_max_sessions: 2
  ssh_max_startups: "10:30:20"
  unattended_upgrades: true
  fail2ban: false

# Security updates are continuous; full distribution upgrades and any required
# reboot run only through the serial os-maintenance playbook.
package_updates:
  enabled: true
  security_only: true
  automatic_reboot: false
  mail: root
  mail_only_on_error: true
  remove_unused_dependencies: true
  install_apticron: false

# nftables policy. `permissive` preserves the historical output-chain behavior
# (`policy accept`). `logged` keeps accept but adds low-noise counters only.
# `strict` is opt-in and default-drop for host-originated egress; transport
# egress is allowed when the corresponding VPN profile needs it.
firewall_egress_policy: permissive  # valid: permissive, logged, strict
allowed_ssh_cidrs: []  # populated from terraform tfvars; see render-inventory.sh
# Exact controller addresses approved by the saved Tailnet ACL. The role stays
# inert unless a reviewed fleet profile enables vpn.enable_tailnet_management.
tailnet_management:
  approved_sources:
    - 100.116.80.32
    - fd7a:115c:a1e0::4701:50a4
public_site_canonical_url: "https://vpn.example.com:8443"
# Operator-owned static site served by nginx-xhttp instead of the bundled
# decoy. A controller-local directory holding at least 404.html; every regular
# file below it is published at the same relative path. The bundled pages are
# committed in a public repository, so every deployment that keeps them serves
# one byte-identical identity; production hosts (inventory env: prod) refuse
# convergence while this is empty. Supply it in the same private extra-vars
# file as public_site_canonical_url.
nginx_xhttp_public_site_dir: ""
# Explicit public listener collision exceptions. Keep empty for normal hosts.
# Each item is either "tcp/8443" or a mapping like {protocol: udp, range: "20000-40000", reason: "..."}.
listener_collision_allowlist: []

# P0's two accepted REALITY client shapes are declared once here. This lives
# outside `vpn` because cohort profiles deliberately replace their complete
# `vpn` mapping. Xray consumes the flow member and watchdog consumes both
# members when it builds the authenticated client probe.
p0_reality_shapes:
  vision:
    client_flow: "xtls-rprx-vision"
    client_mux: false
    finalmask: false
  mux:
    client_flow: ""
    client_mux: true
    finalmask: false

# P0 flow default is deliberately outside the replaceable `vpn` mapping.
# A profile may override it with vpn.xray_flow_mode; a cohort may override it
# with flow_mode. Both inherit this canonical default when omitted.
p0_reality_flow_mode: vision

# Optional complete RIPDPI payload verification policy. Select two owned HTTPS
# controls with known content before enabling; ordinary sing-box stays RTT-only.
# See docs/RIPDPI-BUNDLE.md. Keep outside the replaceable vpn toggle map.
client_payload_failover: null

# Ports
# These are the runtime defaults used by pre-task listener rendering and all
# transport consumers. Terraform's resolved public_listener_contract is
# intentionally independent: it is the provider-edge policy and site.yml
# compares it with the rendered runtime manifest before a role can converge.
xray_port: 443
# Alternate REALITY is opt-in after path-specific measurement. A different port
# on the same address does not survive an address-wide block. Prefer a separate
# reachable TCP/443 endpoint for resilience; non-443 camouflage is not guaranteed.
# A nonzero value requires a matching provider listener and no port collision.
# Multi-cohort layouts declare their own ports and ignore this setting.
xray_fallback_port: 0
nginx_xhttp_public_port: 8443 # public nginx listener; direct-only cohorts may override to 443
nginx_xhttp_port: 10085       # localhost-only Xray XHTTP inbound behind nginx
xray_api_listen: "127.0.0.1:10086"  # localhost-only Xray StatsService
# Public port for the optional SECOND, direct (non-CDN) HTTPS XHTTP frontend.
# Opt-in via nginx_xhttp.fallback_enabled (off by default); when on, nginx
# renders an extra server block that shares the same Xray localhost upstream
# so XHTTP delivery survives a Cloudflare/cdn-front outage. Default 2083
# as an explicit alternate listener; its reachability must be measured.
# Avoid collisions (443 = REALITY tcp / Hysteria udp;
# 8443 = nginx_xhttp_public_port AND cdn_front.port; 8444 = subscription-host
# / hysteria-realm). A pre-flight assert in the nginx-xhttp role rejects a
# collision with any of those. Rotate if the alt-port itself gets targeted.
nginx_xhttp_fallback_port: 2083
hysteria_port: 443
# Optional Hysteria2 port-hopping. When set to a "low-high" string
# (e.g. "20000-40000") the role opens that UDP range in nftables, the
# firewall redirects it to the fixed server port, and emit-singbox.sh writes server_ports +
# hop_interval into client configs. Empty = no port-hopping.
hysteria_port_range: ""
hysteria_hop_interval: "30s"

# Runtime listener defaults for optional roles. Role-owned nested settings may
# override these, but pre-task rendering must not rely on role defaults.
cdn_front_port: 8443
naive_bind_port: 443
amneziawg_listen_port: 51820
subscription_port: 8444
honeypot_port: 4443
dns_morph_bridge_listen_port: 53
hysteria_realm_listen_port: 8444
split_hop_ingress_listen_port: 51821

# Paths
xray_install_root: /opt/xray
xray_config_dir: /etc/xray
xray_log_dir: /var/lib/vpn-xray-logs

hysteria_install_root: /opt/hysteria
hysteria_config_dir: /etc/hysteria
hysteria_log_dir: /var/log/hysteria

amneziawg_config_dir: /etc/amnezia/amneziawg

# Backup
restic_repo_dir: /var/backups/vpn-restic   # local-first; remote sync is opt-in

# Reviewed operator-owned policy; no feed is loaded or applied by default.
network_exposure_gate:
  mode: disabled
  artifact: ""
  trusted_key: ""
  trusted_key_sha256: ""
  source_id: ""
  promotion_approved: false
  promotion_digest: ""
  authorized_hosts: []

# Versioned observability configuration accepts systemd credentials only.
# Admit the reviewed rebuild workspaces. Runtime role enablement, exact-host
# capacity, private-path and backup admission remain separate.
observability_contract:
  enabled_environments: [staging, p0-upcloud, p1-scaleway, p2-vultr, observer-upcloud]
  schema_version: 1
  credential_mode: systemd

# Validated alert policy shared verbatim by agents and the control plane. A
# missing unit is not inferred as failed; expected-target evidence owns
# absence, while node_systemd_unit_state supplies only observed failures.
observability_alert_policy:
  warning_severity: warning
  critical_severity: critical
  resource_hold: 5m
  critical_hold: 3m
  detector_hold: 3m
  cpu_warning_ratio: 0.90
  memory_warning_ratio: 0.90
  swap_warning_ratio: 0.50
  disk_warning_ratio: 0.10
  disk_critical_ratio: 0.05
  inode_warning_ratio: 0.10
  inode_critical_ratio: 0.05
  clock_skew_seconds: 60
  certificate_warning_seconds: 1209600
  certificate_critical_seconds: 259200
  network_error_rate: 0
  restart_attempts: 3
  detector_stale_seconds: 180
  burn_stale_seconds: 3900
  honeypot_events_60min: 100
  policy_events_5min: 10
  filesystem_mountpoint: /
  network_device_exclude_regex: ^lo$
  required_systemd_units:
    - caddy-naive.service
    - hysteria-server.service
    - nginx.service
    - observability-agent.service
    - observability-alertmanager.service
    - observability-disk-guard.service
    - observability-ingress.service
    - observability-prometheus.service
    - xray.service
