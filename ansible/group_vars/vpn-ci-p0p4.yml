---
# Disposable test profile; deployment still requires canonical SSH ownership.
# DNS-Morph checks process/configuration only; no bootstrap data plane is proved.
dns_morph_bridge_allow_echo_only: true
vpn:
  enable_xray_reality: true
  enable_nginx_xhttp: false
  enable_naive: false
  enable_hysteria: false
  enable_amneziawg: false
  enable_geodata: false
  enable_monitoring: false
  enable_watchdog: false
  enable_backup: false
  enable_subscription_host: false
  enable_policy_ratelimit: false
  enable_cdn_front: false
  enable_honeypot: false
  enable_warp_outbound: false
  enable_dns_morph_bridge: true
  enable_hysteria_realm: false
  enable_split_hop_egress: false
  enable_snell: false
  enable_tailnet_management: true
allow_research_roles:
  - dns-morph-bridge
