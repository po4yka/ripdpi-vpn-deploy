---
# Profile: lab/pilot host.
# Starts from a family-safe device-full surface, but this file is deliberately
# not listed in role-tiers.yml family_profiles. Research roles may be enabled
# here only by also adding their role names to allow_research_roles in the same
# file or host_vars entry.

allow_research_roles: []

vpn:
  enable_xray_reality: true
  enable_nginx_xhttp: true
  enable_naive: false
  enable_hysteria: true
  enable_amneziawg: true
  enable_geodata: true
  enable_monitoring: true
  enable_watchdog: true
  enable_backup: true
  enable_subscription_host: false
  enable_policy_ratelimit: false
  enable_cdn_front: false
  enable_honeypot: false
  enable_warp_outbound: false
  enable_dns_morph_bridge: false
  enable_hysteria_realm: false
  enable_split_hop_egress: false
