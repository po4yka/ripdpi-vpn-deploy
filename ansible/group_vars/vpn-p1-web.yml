---
# Profile: public web, direct XHTTP, and subscription delivery node.
# Public listeners: HTTP redirect, nginx HTTPS/XHTTP, and the
# subscription delivery HTTPS listener (tcp/8444; the matching
# public_listeners entry lives in the scaleway environment tfvars).
# Co-located subscription delivery follows the v1 default in
# docs/SUBSCRIPTION-HOST-SEPARATION.md.

vpn:
  enable_xray_reality: false
  enable_nginx_xhttp: true
  enable_naive: false
  enable_hysteria: false
  enable_amneziawg: false
  enable_geodata: false
  enable_monitoring: true
  enable_watchdog: true
  enable_backup: true
  enable_tailnet_management: true
  enable_subscription_host: true
  enable_policy_ratelimit: false
  enable_cdn_front: false
  enable_honeypot: false
  enable_warp_outbound: false
  enable_dns_morph_bridge: false
  enable_hysteria_realm: false
  enable_split_hop_egress: false
  enable_snell: false

nginx_xhttp_public_port: 443
# Neutral placeholder. The real decoy origin is operator-supplied per deploy
# via ANSIBLE_EXTRA_VARS_FILE (see docs/DEPLOY-PROFILES.md); nginx-xhttp's
# converge assert pins it to https://<nginx_xhttp.server_name> from secrets.
public_site_canonical_url: "https://vpn.example.com"
