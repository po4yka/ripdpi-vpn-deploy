---
# Legacy split-profile cohort: P1+P2 nodes with no REALITY direct path. Used
# by hosts in the [vpn-p1p2] inventory group. Keep for existing inventories;
# new family hosts should usually choose vpn-family-standard or
# vpn-device-full instead.

vpn:
  enable_xray_reality: false
  enable_nginx_xhttp: true
  enable_naive: false
  enable_hysteria: true
  enable_amneziawg: true
  enable_geodata: false   # no xray here; nothing to feed geodata to
  enable_monitoring: true
  enable_watchdog: true
  enable_backup: true
  enable_subscription_host: false
  enable_policy_ratelimit: false
  enable_cdn_front: false
  enable_honeypot: false
  enable_warp_outbound: false
  enable_dns_morph_bridge: false
  enable_hysteria_realm: false
  enable_split_hop_egress: false
  enable_snell: false
