---
# Long-lived split-hop Node A for a live research pair: the device-full-tailnet family transports,
# monitoring, watchdog and backup, plus the shop0 responder. Never a family profile.
# Complete map because the deployment controller replaces canonical vpn maps.
# Only probe-matrix runtime users are policy-routed; the family-egress profile extends the scope.
allow_research_roles: [split-hop-ingress]

# Served XHTTP origin; the live pair's bootstrap-secrets run sets hysteria.masquerade_url to the same origin.
public_site_canonical_url: >-
  https://{{ nginx_xhttp.server_name }}{{ ':' ~ nginx_xhttp_public_port if nginx_xhttp_public_port | int != 443 else '' }}
vpn:
  enable_transport_egress: true
  enable_destination_filter: false
  enable_xray_reality: true
  enable_reality_self_steal: false
  enable_nginx_xhttp: true
  enable_naive: false
  enable_hysteria: true
  enable_amneziawg: true
  enable_geodata: true
  enable_monitoring: true
  enable_watchdog: true
  enable_backup: true
  enable_subscription_host: false
  enable_tailnet_management: true
  build_xray_from_source: false
  enable_policy_ratelimit: false
  enable_cdn_front: false
  enable_honeypot: false
  enable_warp_outbound: false
  enable_dns_morph_bridge: false
  enable_hysteria_realm: false
  enable_split_hop_egress: false
  enable_split_hop_ingress: true
  split_hop_family_egress: false
  enable_probe_matrix_target: false
  enable_liveness_sentinel: false
  enable_snell: false
  enable_cascade_ingress: false
  enable_cascade_egress: false
  warp_outbound_routes: []
  awg_cohort: ''
