---
# Sibling of `full-stack` that publishes the production listeners to host
# ports so an external client (e.g. the RIPDPI Android app running on a
# Mac-host emulator) can reach the in-container stack.
#
# Same role set as `full-stack`, with the explicit inventory below and
# host exposure through `published_ports`. The converge playbook is
# imported from the same `playbooks/site.yml` via `converge.yml`.
#
# CI keeps using `full-stack` — that scenario stays portless to match
# the original "single shared docker bridge, no host exposure" semantics.
#
# Host port map:
#   12222/tcp  -> container 22/tcp    (sshd; debugging only)
#   31443/tcp  -> container 443/tcp   (xray VLESS+REALITY+Vision, P0)
#   31443/udp  -> container 443/udp   (hysteria2, P2)
#   31844/tcp  -> container 8443/tcp  (nginx XHTTP front, P1)
#
# Designed to run via:
#   cd ansible && molecule -c molecule/full-stack-published/molecule.yml converge
# or via the RIPDPI-side wrapper at test-lab/vpn-deploy/ in the sibling repo.

dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-fullstack-debian13-published
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:fd0443883979e0879e912231914df2093769d45fcb82af251704b30e2fc5c42e
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    capabilities:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    published_ports:
      - "12222:22/tcp"
      - "31443:443/tcp"
      - "31443:443/udp"
      - "31844:8443/tcp"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
    # This Docker-connection fixture cannot prove the out-of-container SSH
    # transaction.  It exercises the controller-owned convergence phase only.
    ANSIBLE_SKIP_TAGS: ssh-transaction
    # Reuse the sibling scenario's test-secrets file so the two scenarios
    # share a single source of truth for synthetic keys/certs/shas.
    VPN_SECRETS_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/../full-stack/test-secrets.yaml
  inventory:
    # See the sibling full-stack/molecule.yml header comment for the
    # rationale (host must be in the `vpn` group, group_vars/all.yml must
    # be mirrored because molecule's temp inventory dir won't load it).
    group_vars:
      all:
        xray_port: 443
        nginx_xhttp_public_port: 8443
        nginx_xhttp_port: 10085
        hysteria_port: 443
        hysteria_port_range: ""
        hysteria_hop_interval: "30s"
        xray_install_root: /opt/xray
        xray_config_dir: /etc/xray
        xray_log_dir: /var/log/xray
        hysteria_install_root: /opt/hysteria
        hysteria_config_dir: /etc/hysteria
        hysteria_log_dir: /var/log/hysteria
        amneziawg_config_dir: /etc/amnezia/amneziawg
        restic_repo_dir: /var/backups/vpn-restic
        # Explicit provider snapshot for this scenario's preflight inputs.
        # xray_fallback_port is explicitly disabled above, so five listeners
        # are enabled and match this contract.
        terraform_public_listeners_b64_chunks:
          - "W3sibmFtZSI6InhyYXkiLCJwcm90b2NvbCI6InRjcCIsInBvcnQiOjQ0MywicG9ydF9yYW5nZSI6bnVsbH0seyJuYW1lIjoicHVibGljLXNpdGUtaHR0cCIsInByb3RvY29sIjoidGNw"
          - "IiwicG9ydCI6ODAsInBvcnRfcmFuZ2UiOm51bGx9LHsibmFtZSI6Im5naW54LXhodHRwIiwicHJvdG9jb2wiOiJ0Y3AiLCJwb3J0Ijo4NDQzLCJwb3J0X3JhbmdlIjpudWxsfSx7Im5h"
          - "bWUiOiJoeXN0ZXJpYSIsInByb3RvY29sIjoidWRwIiwicG9ydCI6NDQzLCJwb3J0X3JhbmdlIjpudWxsfSx7Im5hbWUiOiJob25leXBvdCIsInByb3RvY29sIjoidGNwIiwicG9ydCI6"
          - "NDQ0MywicG9ydF9yYW5nZSI6bnVsbH1d"
        terraform_public_listeners_b64: >-
          {{ terraform_public_listeners_b64_chunks | join('') }}
      vpn:
        ansible_user: root
        # Synthetic provider-assigned public IPv4 used by enabled role preflights.
        vpn_service_address: 203.0.113.10
        allowed_ssh_cidrs: ["0.0.0.0/0"]
        vpn:
          enable_xray_reality: true
          enable_nginx_xhttp: true
          enable_naive: false
          enable_hysteria: true
          enable_amneziawg: false
          enable_geodata: false
          enable_monitoring: false
          enable_watchdog: true
          enable_backup: false
          enable_subscription_host: false
          enable_warp_outbound: false
          enable_honeypot: true
          enable_policy_ratelimit: true
          xray_flow_mode: vision
          xray_finalmask: false
    hosts:
      vpn:
        hosts:
          vpn-fullstack-debian13-published:
            # Host vars outrank the repository-wide all-group default that
            # Ansible discovers from this checkout during the real Molecule run.
            xray_fallback_port: 0
  config_options:
    defaults:
      callback_result_format: yaml

verifier:
  name: ansible

# Explicit tests repeat the same converge and require Molecule's changed=0
# idempotence assertion. Direct `converge` still leaves the container up for
# the external client harness until an explicit destroy.
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
