---
# Full-stack site.yml run inside a single privileged Docker container.
# Closes the gap between per-role molecule scenarios and a real deploy:
# this hits the role ORDERING and the interactions between baseline,
# firewall, xray, hysteria, nginx-xhttp, and the optional defensive
# roles. Cheaper than spinning up a UpCloud sub-account per PR.
#
# Skipped on purpose:
#   amneziawg     kernel module + iptables NAT not portable to Docker
#   warp-outbound Cloudflare WARP installer expects systemd-networkd /
#                 real DNS; doesn't survive container teardown
#   backup        restic-against-localhost adds noise; restore path is
#                 in its own per-role scenario
#
# Designed to run via:
#   make molecule-full-stack
# or directly:
#   cd ansible && molecule -c molecule/full-stack/molecule.yml test -s full-stack
#
# Collections come from the repo-root requirements.yml, installed by the
# operator or CI before molecule runs; a galaxy dependency block here would
# resolve its relative path against the invoking CWD and break.

driver:
  name: docker

platforms:
  - name: vpn-fullstack-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:fd0443883979e0879e912231914df2093769d45fcb82af251704b30e2fc5c42e
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    capabilities:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
    # The transaction phase proves real public and management SSH transports;
    # a Docker-connection scenario can only exercise controller-owned stack
    # convergence.  Controller transaction tests and staging cover that phase.
    ANSIBLE_SKIP_TAGS: ssh-transaction
    VPN_SECRETS_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/test-secrets.yaml
  inventory:
    # playbooks/site.yml targets `hosts: vpn`, so the test container must
    # be a member of that group. Also mirror the top-level (non-`vpn:`)
    # keys from ansible/group_vars/all.yml: molecule's temp inventory dir
    # does not auto-load that file.
    group_vars:
      all:
        xray_port: 443
        nginx_xhttp_public_port: 8443
        nginx_xhttp_port: 10085
        hysteria_port: 443
        hysteria_port_range: ""
        hysteria_hop_interval: "30s"
        xray_install_root: /opt/xray
        xray_config_dir: /etc/xray
        xray_log_dir: /var/log/xray
        hysteria_install_root: /opt/hysteria
        hysteria_config_dir: /etc/hysteria
        hysteria_log_dir: /var/log/hysteria
        amneziawg_config_dir: /etc/amnezia/amneziawg
        restic_repo_dir: /var/backups/vpn-restic
        # Provider edge contract as render-inventory.sh would inject it
        # (base64 of the compact JSON public_listeners output), matching this
        # scenario's enabled toggle set exactly.
        terraform_public_listeners_b64_chunks:
          - "W3sibmFtZSI6InhyYXkiLCJwcm90b2NvbCI6InRjcCIsInBvcnQiOjQ0MywicG9ydF9yYW5nZSI6bnVsbH0seyJuYW1lIjoieHJheS1mYWxsYmFjayIsInByb3RvY29sIjoidGNwIiwi"
          - "cG9ydCI6MjA1MywicG9ydF9yYW5nZSI6bnVsbH0seyJuYW1lIjoicHVibGljLXNpdGUtaHR0cCIsInByb3RvY29sIjoidGNwIiwicG9ydCI6ODAsInBvcnRfcmFuZ2UiOm51bGx9LHsi"
          - "bmFtZSI6Im5naW54LXhodHRwIiwicHJvdG9jb2wiOiJ0Y3AiLCJwb3J0Ijo4NDQzLCJwb3J0X3JhbmdlIjpudWxsfSx7Im5hbWUiOiJoeXN0ZXJpYSIsInByb3RvY29sIjoidWRwIiwi"
          - "cG9ydCI6NDQzLCJwb3J0X3JhbmdlIjpudWxsfSx7Im5hbWUiOiJob25leXBvdCIsInByb3RvY29sIjoidGNwIiwicG9ydCI6NDQ0MywicG9ydF9yYW5nZSI6bnVsbH1d"
        terraform_public_listeners_b64: >-
          {{ terraform_public_listeners_b64_chunks | join('') }}
      vpn:
        ansible_user: root
        # Provider-assigned public IPv4; render-inventory.sh injects the real one.
        vpn_service_address: 203.0.113.10
        allowed_ssh_cidrs: ["0.0.0.0/0"]
        vpn:
          enable_xray_reality: true
          enable_nginx_xhttp: true
          enable_naive: false
          enable_hysteria: true
          enable_amneziawg: false
          enable_geodata: false
          enable_monitoring: false
          enable_watchdog: true
          enable_backup: false
          enable_subscription_host: false
          enable_warp_outbound: false
          enable_honeypot: true
          enable_policy_ratelimit: true
          xray_flow_mode: vision
          xray_finalmask: false
    hosts:
      vpn:
        hosts:
          vpn-fullstack-debian13:
  config_options:
    defaults:
      callback_result_format: yaml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
