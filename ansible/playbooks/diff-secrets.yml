---
- name: Inspect configuration drift without changing the host
  hosts: vpn
  become: true
  gather_facts: false
  vars:
    vpn_secrets_file: >-
      {{ lookup('env', 'VPN_SECRETS_FILE') |
         default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true) }}
  vars_files:
    - "{{ vpn_secrets_file }}"
  tasks:
    - name: Require explicit runtime secrets for inspection
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: Run make decrypt and provide VPN_SECRETS_FILE before inspection.

    - name: Compare canonical Xray configuration and version
      ansible.builtin.include_role:
        name: xray
        tasks_from: drift
      when: >-
        not (vpn_subscription_only | default(false) | bool) and
        ((vpn.enable_xray_reality | default(true) | bool) or
         (vpn.enable_nginx_xhttp | default(true) | bool))

    - name: Read service state
      ansible.builtin.service_facts:

    - name: Compare transport service state with profile toggles
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services.get(item.unit, {}).get('state', '') == 'running') ==
            (item.enabled | bool)
        fail_msg: "Service state differs from the selected profile: {{ item.unit }}"
        quiet: true
      loop:
        - unit: xray.service
          enabled: >-
            {{ not (vpn_subscription_only | default(false) | bool) and
               ((vpn.enable_xray_reality | default(true) | bool) or
                (vpn.enable_nginx_xhttp | default(true) | bool)) }}
        - unit: nginx.service
          enabled: >-
            {{ (vpn.enable_nginx_xhttp | default(true) | bool) or
               (vpn.enable_cdn_front | default(false) | bool) or
               (vpn.enable_reality_self_steal | default(false) | bool) or
               (vpn.enable_subscription_host | default(false) | bool) or
               (vpn_subscription_only | default(false) | bool) }}
        - unit: hysteria-server.service
          enabled: "{{ (vpn.enable_hysteria | default(true) | bool) and not (vpn_subscription_only | default(false) | bool) }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: Check every configured AmneziaWG instance
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "awg-quick@{{ item }}"
      changed_when: false
      loop: >-
        {{ (amneziawg_secrets.instances | default([]) | map(attribute='name') | list)
           if (amneziawg_secrets.instances | default([]) | length > 0)
           else [(amneziawg | default({})).interface | default('awg0')] }}
      when: (vpn.enable_amneziawg | default(true) | bool) and not (vpn_subscription_only | default(false) | bool)

    - name: Reject active AmneziaWG instances in a disabled profile
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts.services | dict2items |
            selectattr('key', 'match', '^awg-quick@.+\.service$') |
            selectattr('value.state', 'equalto', 'running') | list | length == 0
        quiet: true
      when: not (vpn.enable_amneziawg | default(true) | bool) or (vpn_subscription_only | default(false) | bool)

    - name: Read Hysteria binary version
      ansible.builtin.command: /usr/local/bin/hysteria version
      register: _hysteria_drift_version
      changed_when: false
      when: (vpn.enable_hysteria | default(true) | bool) and not (vpn_subscription_only | default(false) | bool)

    - name: Compare Hysteria binary version with its pin
      ansible.builtin.assert:
        that:
          - >-
            hysteria.version in
            (_hysteria_drift_version.stdout | regex_findall('Version:\s+(v[^\s]+)'))
        quiet: true
      when: (vpn.enable_hysteria | default(true) | bool) and not (vpn_subscription_only | default(false) | bool)

    - name: Report successful inspected comparisons
      ansible.builtin.debug:
        msg: Xray configuration, enabled transport services and inspected binary pins match.
