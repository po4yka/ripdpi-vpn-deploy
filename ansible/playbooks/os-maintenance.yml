---
- name: Apply rolling operating-system maintenance
  hosts: vpn
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Require a supported Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "os-maintenance supports Debian and Ubuntu hosts only."

    - name: Ensure recurring security updates are configured
      ansible.builtin.include_role:
        name: package_updates

    - name: Refresh package indexes before maintenance
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        lock_timeout: 300

    - name: Apply all pending OS package upgrades
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
        lock_timeout: 300
        dpkg_options: "force-confdef,force-confold"

    - name: Detect whether upgraded packages require a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: os_maintenance_reboot_marker

    - name: Reboot after kernel or core-library updates
      ansible.builtin.reboot:
        connect_timeout: 15
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 10
      when: os_maintenance_reboot_marker.stat.exists

    - name: Verify enabled transport services after maintenance
      ansible.builtin.command:
        cmd: "systemctl is-active {{ item }}"
      changed_when: false
      loop: >-
        {{
          ['tailscaled', 'nftables', 'prometheus-node-exporter']
          + (['xray'] if ((vpn.enable_xray_reality | default(false)) or
                          (vpn.enable_nginx_xhttp | default(false))) else [])
          + (['nginx'] if (vpn.enable_nginx_xhttp | default(false)) else [])
          + (['hysteria-server'] if (vpn.enable_hysteria | default(false)) else [])
        }}
      loop_control:
        label: "{{ item }}"
      when: not ansible_check_mode

    - name: Verify AmneziaWG after maintenance
      ansible.builtin.command:
        cmd: awg show awg0
      changed_when: false
      when:
        - not ansible_check_mode
        - vpn.enable_amneziawg | default(false)

    - name: Simulate another full upgrade
      ansible.builtin.command:
        cmd: apt-get -s -o Debug::NoLocking=true dist-upgrade
      register: os_maintenance_residual_upgrade
      changed_when: false
      when: not ansible_check_mode

    - name: Reject a residual package backlog
      ansible.builtin.assert:
        that:
          - "'0 upgraded, 0 newly installed, 0 to remove' in os_maintenance_residual_upgrade.stdout"
        fail_msg: "OS package backlog remains after rolling maintenance."
      when: not ansible_check_mode

    - name: Check for a residual reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: os_maintenance_residual_reboot
      when: not ansible_check_mode

    - name: Reject a residual reboot requirement
      ansible.builtin.assert:
        that:
          - not os_maintenance_residual_reboot.stat.exists
        fail_msg: "Host still requires a reboot after rolling maintenance."
      when: not ansible_check_mode
