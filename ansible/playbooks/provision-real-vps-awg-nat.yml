---
- name: Provision independent dual-protocol evidence echo
  hosts: awg_evidence_echo
  become: true
  gather_facts: true
  serial: 1
  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}
  vars_files:
    - "{{ vpn_secrets_file }}"
  pre_tasks:
    - name: Ensure VPN_SECRETS_FILE was provided for evidence echo
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: >-
          VPN_SECRETS_FILE is not set. Decrypt the SOPS file with `make decrypt`
          and export the resulting root-readable path before provisioning.

    - name: Decode provider listener contract for evidence echo
      ansible.builtin.set_fact:
        public_listener_contract: "{{ terraform_public_listeners_b64 | b64decode | from_json }}"
  roles:
    - role: real-vps-awg-nat
      real_vps_awg_nat_mode: "echo"

