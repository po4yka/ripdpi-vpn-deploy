---
- name: Rollback accepted Xray config through complete native acceptance
  hosts: vpn
  become: true
  gather_facts: false

  tasks:
    - name: Admit and verify the complete rollback candidate with exact compensation
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/python3', '-Es',
              '/usr/local/libexec/ripdpi-transport-egress/transport_runtime_rollback.py', 'config']
              + (['--check'] if ansible_check_mode else []) }}
      register: transport_rollback
      changed_when: transport_rollback.rc == 0 and (transport_rollback.stdout | from_json).changed
      check_mode: false
      no_log: true
      diff: false
