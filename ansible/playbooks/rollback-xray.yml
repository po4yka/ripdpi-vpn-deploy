---
- name: Rollback Xray binary to a pinned previous release
  hosts: vpn
  become: true
  gather_facts: false

  vars:
    rollback_xray_version: "{{ lookup('env', 'ROLLBACK_XRAY_VERSION') }}"

  tasks:
    - name: ROLLBACK_XRAY_VERSION names a pinned release
      ansible.builtin.assert:
        that:
          - rollback_xray_version is match('^v?[0-9]+[.][0-9]+[.][0-9]+$')
        fail_msg: "ROLLBACK_XRAY_VERSION must name a pinned release (e.g. v26.3.27)."

    - name: Target rollback release exists on disk
      ansible.builtin.stat:
        path: "/opt/xray/releases/{{ rollback_xray_version }}/xray"
        follow: false
      register: rb_release
      failed_when: >-
        not rb_release.stat.exists or
        not (rb_release.stat.isreg | default(false)) or
        not (rb_release.stat.executable | default(false))

    - name: Inspect the current Xray release link
      ansible.builtin.stat:
        path: /opt/xray/current
        follow: false
      register: rb_current

    - name: Refuse an absent runtime link or a no-op rollback
      ansible.builtin.assert:
        that:
          - rb_current.stat.islnk | default(false)
          - (rb_current.stat.lnk_source | default('')) != '/opt/xray/releases/' ~ rollback_xray_version
        fail_msg: "Rollback requires an existing runtime link and a different pinned release."

    - name: Validate current config with rollback binary
      ansible.builtin.command:
        argv:
          - "/opt/xray/releases/{{ rollback_xray_version }}/xray"
          - run
          - -test
          - -config
          - /etc/xray/config.json
      check_mode: false
      changed_when: false
      no_log: true

    - name: Point /opt/xray/current at the rollback release
      ansible.builtin.file:
        src: "/opt/xray/releases/{{ rollback_xray_version }}"
        dest: "/opt/xray/current"
        state: link
        force: true

    - name: Restart Xray
      ansible.builtin.systemd_service:
        name: xray
        state: restarted

    - name: Verify Xray active after rollback
      ansible.builtin.command:
        cmd: systemctl is-active xray
      register: active
      changed_when: false
      failed_when: active.stdout != "active"
