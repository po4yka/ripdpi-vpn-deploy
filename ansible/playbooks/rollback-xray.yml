---
- name: Rollback accepted Xray runtime through complete native acceptance
  hosts: vpn
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  vars:
    rollback_xray_version: "{{ lookup('env', 'ROLLBACK_XRAY_VERSION') }}"

  pre_tasks:
    - name: Bind rollback to one exact inventory alias
      ansible.builtin.import_tasks: tasks/exact-node.yml
      tags: [always]

  tasks:
    - name: Admit and verify the complete rollback candidate with exact compensation
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/python3', '-Es',
              '/usr/local/libexec/ripdpi-transport-egress/transport_runtime_rollback.py', 'runtime']
              + ['--version', rollback_xray_version] + (['--check'] if ansible_check_mode else []) }}
      register: transport_rollback
      changed_when: transport_rollback.rc == 0 and (transport_rollback.stdout | from_json).changed
      check_mode: false
      no_log: true
      diff: false
