---
# Rotate per-device credentials. The actual UUID/shortId/peer-key generation
# happens locally via scripts/new-client.sh + sops re-encrypt; this playbook
# only re-renders server-side configs and reloads services.
#
# See docs/RUNBOOK-rotate.md for the full procedure.

- name: Re-render and reload after credential rotation
  hosts: vpn
  become: true
  gather_facts: true

  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}

  vars_files:
    - "{{ vpn_secrets_file }}"

  tasks:
    - name: Ensure VPN_SECRETS_FILE was provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path
          to your decrypted secrets file before running this playbook.

    - name: Compute effective AmneziaWG instances
      ansible.builtin.include_role:
        name: amneziawg
        tasks_from: instances.yml
      when: vpn.enable_amneziawg | default(false)

    - name: Re-render Xray config
      ansible.builtin.template:
        src: ../roles/xray/templates/config.json.j2
        dest: /etc/xray/config.json
        owner: root
        group: xray
        mode: "0640"
        validate: "/usr/local/bin/xray run -test -config %s"
      no_log: true
      diff: false
      when: vpn.enable_xray_reality | default(true)
      notify: Restart xray

    - name: Re-render Hysteria config
      ansible.builtin.template:
        src: ../roles/hysteria/templates/config.yaml.j2
        dest: /etc/hysteria/config.yaml
        owner: root
        group: hysteria
        mode: "0640"
      no_log: true
      diff: false
      when: vpn.enable_hysteria | default(false)
      notify: Restart hysteria

    - name: Re-render AmneziaWG peers
      ansible.builtin.template:
        src: ../roles/amneziawg/templates/awg0.conf.j2
        dest: "{{ amneziawg_config_dir }}/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false
      when: vpn.enable_amneziawg | default(false)
      loop: "{{ _awg_instances }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        _inst: "{{ item }}"
      notify: Reload amneziawg

    - name: Re-render Snell users
      ansible.builtin.template:
        src: ../roles/snell/templates/config.json.j2
        dest: /etc/snell/config.json
        owner: root
        group: snell
        mode: "0640"
        validate: "/usr/local/bin/sing-box-snell check -c %s"
      no_log: true
      diff: false
      when: vpn.enable_snell | default(false)
      notify: Restart snell

  handlers:
    - name: Restart xray
      ansible.builtin.systemd_service:
        name: xray
        state: restarted

    - name: Restart hysteria
      ansible.builtin.systemd_service:
        name: hysteria-server
        state: restarted

    - name: Reload amneziawg
      ansible.builtin.systemd_service:
        name: "awg-quick@{{ item.name }}"
        state: reloaded
      loop: "{{ _awg_instances | default([{'name': amneziawg.interface}]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Restart snell
      ansible.builtin.systemd_service:
        name: snell.service
        state: restarted
