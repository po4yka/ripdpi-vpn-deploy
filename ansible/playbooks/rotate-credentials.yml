---
# Rotate per-device credentials. The actual UUID/shortId/peer-key generation
# happens locally via scripts/new-client.sh + sops re-encrypt; this playbook
# reconciles approved server authority and activates its guarded generation.
#
# See docs/how-to/rotate.md for the full procedure.

- name: Reconcile approved transport authority after credential rotation
  hosts: vpn
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}
    xray_log_path: /var/lib/vpn-xray-logs
    p0_reality_shape_template: >-
      {{ playbook_dir }}/../templates/p0-reality-shape.json.j2

  vars_files:
    - "{{ vpn_secrets_file }}"

  pre_tasks:
    - name: Bind rotation to one exact inventory alias
      ansible.builtin.import_tasks: tasks/exact-node.yml
      tags: [always]

    - name: Require the target inventory environment to match the selected ENV
      ansible.builtin.assert:
        that:
          - lookup('env', 'ENV') | length > 0
          - hostvars[inventory_hostname]['env'] | default('') == lookup('env', 'ENV')
        fail_msg: The target inventory environment must equal ENV; rotate with the ENV and secrets of that node
      tags: [always]

  tasks:
    - name: Preflight enabled transport input semantics
      ansible.builtin.import_tasks: tasks/transport-input-preflight.yml
      tags: [always]

    - name: Admit public listeners before AWG rotation can republish the firewall
      ansible.builtin.import_tasks: tasks/public-listener-preflight.yml
      when: not (vpn_subscription_only | default(false) | bool)
      tags: [always]

    - name: Ensure VPN_SECRETS_FILE was provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path
          to your decrypted secrets file before running this playbook.

    - name: Reconcile protected credential rotation through authoritative roles
      when: not (vpn_subscription_only | default(false) | bool)
      vars:
        transport_egress_site_staging: true
      block:
        - name: Prepare the complete protected rotation topology
          ansible.builtin.include_role:
            name: transport-egress
            tasks_from: prepare-site

        - name: Stage rotated Xray credentials through the authoritative role
          ansible.builtin.include_role:
            name: xray
          vars:
            xray_role_enabled: >-
              {{ (vpn.enable_xray_reality | default(true) | bool) or
                 (vpn.enable_nginx_xhttp | default(true) | bool) }}

        - name: Stage rotated Hysteria credentials through the authoritative role
          ansible.builtin.include_role:
            name: hysteria
          vars:
            hysteria_role_enabled: '{{ vpn.enable_hysteria | default(true) | bool }}'

        - name: Admit the complete protected rotation generation
          ansible.builtin.import_tasks: tasks/transport-egress-activate.yml

    - name: Activate rotated AmneziaWG peers and firewall claims together
      ansible.builtin.import_tasks: tasks/awg-rotate.yml
      vars:
        amneziawg_role_enabled: '{{ vpn.enable_amneziawg | default(true) | bool }}'
      when: not (vpn_subscription_only | default(false) | bool)

    - name: Reconcile active and retired Snell variants through the authoritative role
      ansible.builtin.include_role:
        name: snell
      vars:
        snell_role_enabled: '{{ vpn.enable_snell | default(false) | bool }}'
      when: not (vpn_subscription_only | default(false) | bool)

    - name: Reconcile independent Naive credentials through the authoritative role
      ansible.builtin.include_role:
        name: naive
      vars:
        naive_role_enabled: '{{ vpn.enable_naive | default(false) | bool }}'
      when: not (vpn_subscription_only | default(false) | bool)

    - name: Reconcile published grant revocation through the authoritative role
      ansible.builtin.include_role:
        name: subscription-host
      when: (vpn.enable_subscription_host | default(false) | bool) or (vpn_subscription_only | default(false) | bool)

    - name: Revoke grants on an explicitly retained disabled publisher
      ansible.builtin.include_role:
        name: subscription-host
        tasks_from: revoke-grants
      when:
        - vpn_device_retained_publisher | default(false) | bool
        - vpn_device_revocation | default(none) is not none
