---
# Rotate per-device credentials. The actual UUID/shortId/peer-key generation
# happens locally via scripts/new-client.sh + sops re-encrypt; this playbook
# reconciles approved server authority and activates its guarded generation.
#
# See docs/RUNBOOK-rotate.md for the full procedure.

- name: Reconcile approved transport authority after credential rotation
  hosts: vpn
  become: true
  gather_facts: true

  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}
    xray_log_path: /var/log/xray
    p0_reality_shape_template: >-
      {{ playbook_dir }}/../templates/p0-reality-shape.json.j2

  vars_files:
    - "{{ vpn_secrets_file }}"

  tasks:
    - name: Preflight enabled transport input semantics
      ansible.builtin.import_tasks: tasks/transport-input-preflight.yml
      tags: [always]

    - name: Ensure VPN_SECRETS_FILE was provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path
          to your decrypted secrets file before running this playbook.

    - name: Compute effective AmneziaWG instances
      ansible.builtin.include_role:
        name: amneziawg
        tasks_from: instances.yml
      when: vpn.enable_amneziawg | default(true)

    - name: Reconcile protected credential rotation through authoritative roles
      when: >-
        not (vpn_subscription_only | default(false) | bool) and
        ((vpn.enable_xray_reality | default(true) | bool) or
         (vpn.enable_nginx_xhttp | default(true) | bool) or
         (vpn.enable_hysteria | default(true) | bool))
      vars:
        transport_egress_site_staging: true
      block:
        - name: Prepare the complete protected rotation topology
          ansible.builtin.include_role:
            name: transport-egress
            tasks_from: prepare-site

        - name: Stage rotated Xray credentials through the authoritative role
          ansible.builtin.include_role:
            name: xray
          when: >-
            (vpn.enable_xray_reality | default(true) | bool) or
            (vpn.enable_nginx_xhttp | default(true) | bool)

        - name: Stage rotated Hysteria credentials through the authoritative role
          ansible.builtin.include_role:
            name: hysteria
          when: vpn.enable_hysteria | default(true) | bool

        - name: Admit the complete protected rotation generation
          ansible.builtin.import_tasks: tasks/transport-egress-activate.yml

    - name: Re-render AmneziaWG peers
      ansible.builtin.template:
        src: ../roles/amneziawg/templates/awg0.conf.j2
        dest: "{{ amneziawg_config_dir }}/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false
      when: vpn.enable_amneziawg | default(true)
      loop: "{{ _awg_instances }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        _inst: "{{ item }}"
      notify: Restart amneziawg

    - name: Re-render Snell users
      ansible.builtin.template:
        src: ../roles/snell/templates/config.json.j2
        dest: /etc/snell/config.json
        owner: root
        group: snell
        mode: "0640"
        validate: "/usr/local/bin/sing-box-snell check -c %s"
      no_log: true
      diff: false
      when: vpn.enable_snell | default(false)
      notify: Restart snell

    - name: Reconcile independent Naive credentials through the authoritative role
      ansible.builtin.include_role:
        name: naive
      when: vpn.enable_naive | default(false) | bool

  handlers:
    - name: Restart amneziawg
      ansible.builtin.systemd_service:
        name: "awg-quick@{{ item.name }}"
        state: restarted
      loop: "{{ _awg_instances | default([{'name': amneziawg.interface}]) }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Restart snell
      ansible.builtin.systemd_service:
        name: snell.service
        state: restarted
