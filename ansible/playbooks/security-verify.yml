---
- name: Verify VPN VPS host security hardening
  hosts: vpn
  become: true
  gather_facts: false

  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}

  vars_files:
    - "{{ vpn_secrets_file }}"

  tasks:
    - name: Ensure VPN_SECRETS_FILE was provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path to your decrypted secrets file before running this playbook.

    - name: Collect effective sshd configuration
      ansible.builtin.command:
        cmd: sshd -T
      register: security_sshd_t
      changed_when: false

    - name: SSH effective hardening is applied
      vars:
        _security_controls: "{{ security_controls | default({}) }}"
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in (security_sshd_t.stdout | lower)"
          - "'kbdinteractiveauthentication no' in (security_sshd_t.stdout | lower)"
          - "'permitrootlogin no' in (security_sshd_t.stdout | lower)"
          - "'x11forwarding no' in (security_sshd_t.stdout | lower)"
          - "(_security_controls.ssh_allow_tcp_forwarding | default(false) | bool) or 'allowtcpforwarding no' in (security_sshd_t.stdout | lower)"
          - "not (_security_controls.ssh_strict | default(true) | bool) or 'allowagentforwarding no' in (security_sshd_t.stdout | lower)"
          - "not (_security_controls.ssh_strict | default(true) | bool) or 'permittunnel no' in (security_sshd_t.stdout | lower)"
          - "not (_security_controls.ssh_strict | default(true) | bool) or 'permitemptypasswords no' in (security_sshd_t.stdout | lower)"

    - name: Sysctl hardening values are applied
      ansible.builtin.command:
        cmd: "sysctl -n {{ item.key }}"
      loop:
        - key: "kernel.randomize_va_space"
          value: "2"
        - key: "kernel.kptr_restrict"
          value: "2"
        - key: "kernel.yama.ptrace_scope"
          value: "2"
        - key: "fs.protected_hardlinks"
          value: "1"
        - key: "fs.protected_symlinks"
          value: "1"
        - key: "net.ipv4.conf.all.accept_redirects"
          value: "0"
      register: security_sysctl_value
      changed_when: false
      failed_when: security_sysctl_value.stdout != item.value

    - name: nftables config syntax valid
      ansible.builtin.command:
        cmd: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Node capability manifest exists
      ansible.builtin.stat:
        path: /var/lib/ripdpi-vpn-deploy/manifest.json
      register: security_node_manifest_verify
      failed_when: not security_node_manifest_verify.stat.exists

    - name: Node capability manifest is valid JSON
      ansible.builtin.command:
        cmd: python3 -m json.tool /var/lib/ripdpi-vpn-deploy/manifest.json
      changed_when: false

    - name: Collect nftables input chain
      ansible.builtin.command:
        cmd: nft list chain inet filter input
      register: security_nft_input_chain
      changed_when: false

    - name: Firewall input policy defaults to drop
      ansible.builtin.assert:
        that:
          - "'policy drop' in (security_nft_input_chain.stdout | lower)"

    - name: Collect nftables output chain
      ansible.builtin.command:
        cmd: nft list chain inet filter output
      register: security_nft_output_chain
      changed_when: false

    - name: Firewall output policy matches configured egress mode
      vars:
        _egress_policy: "{{ firewall_egress_policy | default('permissive') }}"
        _expected_output_policy: "{{ 'drop' if _egress_policy == 'strict' else 'accept' }}"
      ansible.builtin.assert:
        that:
          - "'policy ' ~ _expected_output_policy in (security_nft_output_chain.stdout | lower)"

    - name: Decode provider listener contract from rendered inventory
      ansible.builtin.set_fact:
        public_listener_contract: "{{ terraform_public_listeners_b64 | b64decode | from_json }}"

    - name: Public listeners match enabled profile manifest
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          expected_tcp=" 22 {% for listener in public_listener_contract if listener.protocol == 'tcp' and listener.port is not none %}{{ listener.port }} {% endfor %} "
          expected_udp=" {% for listener in public_listener_contract if listener.protocol == 'udp' and listener.port is not none %}{{ listener.port }} {% endfor %} "
          expected_udp_ranges=" {% for listener in public_listener_contract if listener.protocol == 'udp' and listener.port_range is not none %}{{ listener.port_range }} {% endfor %} "

          in_list() {
            case "$1" in
              *" $2 "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          in_ranges() {
            local port="$1"
            local range start end
            for range in $expected_udp_ranges; do
              case "$range" in
                *-*)
                  start="${range%-*}"
                  end="${range#*-}"
                  if [[ "$start" =~ ^[0-9]+$ && "$end" =~ ^[0-9]+$ && "$port" -ge "$start" && "$port" -le "$end" ]]; then
                    return 0
                  fi
                  ;;
              esac
            done
            return 1
          }

          ss -H -lntu | awk '{ print $1 " " $5 }' | while read -r proto addr; do
            case "$addr" in
              127.*|localhost:*|"[::1]:"*|"::1:"*) continue ;;
            esac
            port="${addr##*:}"
            port="${port%]}"
            [[ "$port" =~ ^[0-9]+$ ]] || continue
            case "$proto" in
              tcp*) in_list "$expected_tcp" "$port" || echo "$proto $addr" ;;
              udp*) in_list "$expected_udp" "$port" || in_ranges "$port" || echo "$proto $addr" ;;
            esac
          done

          listeners="$(ss -H -lntu | awk '{ print $1 " " $5 }')"
          for port in $expected_tcp; do
            [[ "$port" == 22 ]] && continue
            grep -Eq "^tcp.*(:|\])${port}$" <<< "$listeners" || echo "missing tcp ${port}"
          done
          for port in $expected_udp; do
            grep -Eq "^udp.*(:|\])${port}$" <<< "$listeners" || echo "missing udp ${port}"
          done
        executable: /bin/bash
      register: security_unexpected_public_listeners
      changed_when: false
      failed_when: security_unexpected_public_listeners.stdout | length > 0

    - name: unattended-upgrades timers are enabled
      ansible.builtin.command:
        cmd: "systemctl is-enabled {{ item }}"
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      register: security_unattended_timers
      changed_when: false
      failed_when: security_unattended_timers.stdout not in ["enabled", "static", "indirect"]
      when: (security_controls | default({})).unattended_upgrades | default(false)

    - name: unattended-upgrades service is enabled or static
      ansible.builtin.command:
        cmd: systemctl is-enabled unattended-upgrades.service
      register: security_unattended_service
      changed_when: false
      failed_when: security_unattended_service.stdout not in ["enabled", "static", "indirect"]
      when: (security_controls | default({})).unattended_upgrades | default(false)

    - name: fail2ban service is active
      ansible.builtin.command:
        cmd: systemctl is-active fail2ban
      register: security_fail2ban_status
      changed_when: false
      failed_when: security_fail2ban_status.stdout != "active"
      when: (security_controls | default({})).fail2ban | default(false)

    - name: fail2ban daemon responds
      ansible.builtin.command:
        cmd: fail2ban-client status
      changed_when: false
      when: (security_controls | default({})).fail2ban | default(false)

    - name: fail2ban sshd jail responds
      ansible.builtin.command:
        cmd: fail2ban-client status sshd
      changed_when: false
      when: (security_controls | default({})).fail2ban | default(false)
