---
- name: Provision VPN VPS — full stack
  hosts: vpn
  become: true
  gather_facts: true

  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}

  vars_files:
    - "{{ vpn_secrets_file }}"

  pre_tasks:
    - name: Ensure VPN_SECRETS_FILE was provided
      tags: [always]
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path
          to your decrypted secrets file before running this playbook.

    # The firewall renders zero SSH accept rules under policy drop when the
    # allowlist is empty; a non-populated inventory would converge green and
    # lock the operator out. Fail fast instead (REQ-SSH-ALLOWLIST-FAILFAST).
    - name: Ensure the SSH management-path allowlist is populated
      tags: [always]
      ansible.builtin.assert:
        that:
          - allowed_ssh_cidrs is defined
          - allowed_ssh_cidrs | length > 0
        fail_msg: |
          allowed_ssh_cidrs is empty. The firewall role would render a
          policy-drop ruleset with no SSH accept rule and lock you out of
          this node. Populate allowed_ssh_cidrs in tfvars and re-render the
          inventory (scripts/render-inventory.sh) before deploying.

    # Role-tier guard: a role tagged `research` in ansible/role-tiers.yml must
    # never converge on a family node. A lab/pilot host opts in explicitly by
    # listing the role in `allow_research_roles` in its inventory (git-visible).
    # The static half of this guard is scripts/check-deploy-profile.py (CI).
    - name: Load role tier manifest
      tags: [always]
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../role-tiers.yml"

    - name: Guard — block RESEARCH-tier roles in a family deploy
      tags: [always]
      vars:
        _enabled_research_roles: >-
          {{ toggle_role_map | dict2items
             | selectattr('key', 'in',
                 (vpn | default({}) | dict2items
                  | selectattr('value', 'equalto', true)
                  | map(attribute='key') | list))
             | map(attribute='value') | list
             | select('in',
                 (tiers | dict2items
                  | selectattr('value', 'equalto', 'research')
                  | map(attribute='key') | list))
             | list }}
        _forbidden: "{{ _enabled_research_roles | difference(allow_research_roles | default([])) }}"
      ansible.builtin.assert:
        that:
          - _forbidden | length == 0
        fail_msg: >-
          Refusing to deploy: RESEARCH-tier role(s) {{ _forbidden }} are enabled
          on this host but not approved in `allow_research_roles`. Research /
          experimental roles are not part of the family (P0/P1/P2) baseline. To
          run one on a lab or pilot node, add it to `allow_research_roles` in
          that host's inventory (e.g. allow_research_roles: [split-hop-egress]).
          See docs/ROLE-TIERING.md.
        success_msg: "Tier guard OK — no unapproved research-tier roles enabled."

    - name: Guard — block unapproved EXCEPTION-tier roles
      tags: [always]
      vars:
        _enabled_exception_roles: >-
          {{ toggle_role_map | dict2items
             | selectattr('key', 'in',
                 (vpn | default({}) | dict2items
                  | selectattr('value', 'equalto', true)
                  | map(attribute='key') | list))
             | map(attribute='value') | list
             | select('in',
                 (tiers | dict2items
                  | selectattr('value', 'equalto', 'exception')
                  | map(attribute='key') | list))
             | list }}
        _forbidden_exception: "{{ _enabled_exception_roles | difference(allow_exception_roles | default([])) }}"
      ansible.builtin.assert:
        that:
          - _forbidden_exception | length == 0
        fail_msg: >-
          Refusing to deploy: EXCEPTION-tier role(s) {{ _forbidden_exception }}
          require an exact per-host allow_exception_roles entry.

    - name: Guard — cascade and split-hop role families are mutually exclusive
      vars:
        _cascade_enabled: >-
          {{ (vpn.enable_cascade_ingress | default(false) | bool) or
             (vpn.enable_cascade_egress | default(false) | bool) }}
        _split_hop_enabled: >-
          {{ (vpn.enable_split_hop_ingress | default(false) | bool) or
             (vpn.enable_split_hop_egress | default(false) | bool) }}
        _cascade_conflicts: >-
          {{ (['cascade-ingress'] if vpn.enable_cascade_ingress | default(false) | bool else []) +
             (['cascade-egress'] if vpn.enable_cascade_egress | default(false) | bool else []) }}
        _split_hop_conflicts: >-
          {{ (['split-hop-ingress'] if vpn.enable_split_hop_ingress | default(false) | bool else []) +
             (['split-hop-egress'] if vpn.enable_split_hop_egress | default(false) | bool else []) }}
      ansible.builtin.assert:
        that:
          - not (_cascade_enabled and _split_hop_enabled)
        fail_msg: >-
          Host {{ inventory_hostname }} may not combine cascade roles
          {{ _cascade_conflicts }} with split-hop roles {{ _split_hop_conflicts }}.
      tags: [always]

    - name: Guard — cascade classifier owns every egress decision
      ansible.builtin.assert:
        that:
          - not ((vpn.enable_cascade_ingress | default(false) | bool) and (vpn.enable_warp_outbound | default(false) | bool))
        fail_msg: >-
          Host {{ inventory_hostname }} may not enable cascade-ingress with
          warp-outbound because WARP rules would bypass uniform classification.
      tags: [always]

    - name: Guard — verify cascade ASN attestation before converge
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../../scripts/check-cascade-attestation.py
          --attestation {{ cascade_attestation_file | default(playbook_dir ~ '/../../attestations/cascade-asn-attestation.json') | quote }}
      delegate_to: localhost
      become: false
      changed_when: false
      when: >-
        (vpn.enable_cascade_ingress | default(false) | bool) or
        (vpn.enable_cascade_egress | default(false) | bool)
      tags: [always]

    - name: Guard — verify fresh cascade per-leg protocol completion
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../../scripts/check-cascade-leg-health.py
          --health-record {{ cascade_leg_health_file | default(playbook_dir ~ '/../../attestations/cascade-leg-health.json') | quote }}
      delegate_to: localhost
      become: false
      changed_when: false
      when: >-
        (vpn.enable_cascade_ingress | default(false) | bool) or
        (vpn.enable_cascade_egress | default(false) | bool)
      tags: [always]

    - name: Guard — block cascade live activation under implementation-only governance
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', playbook_dir ~ '/../role-tiers.yml') |
             from_yaml).cascade_governance_status == 'live-authorized'
        fail_msg: >-
          Cascade implementation is present for review, but live activation is
          not authorized. A future governance commit must change the repository-
          owned cascade_governance_status before converge can proceed.
      when: >-
        (vpn.enable_cascade_ingress | default(false) | bool) or
        (vpn.enable_cascade_egress | default(false) | bool)
      tags: [always]

    - name: Build effective public listener manifest
      ansible.builtin.set_fact:
        public_listener_manifest: "{{ lookup('template', playbook_dir ~ '/../templates/listener-manifest.json.j2') | from_json }}"
      tags: [always]

    - name: Decode provider listener contract from rendered inventory
      ansible.builtin.set_fact:
        public_listener_contract: "{{ terraform_public_listeners_b64 | b64decode | from_json }}"
      tags: [always]

    - name: Guard — provider edge and runtime listener contracts agree
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/../../scripts/check-listener-contract.py"
        stdin: "{{ {'expected': public_listener_contract, 'actual': public_listener_manifest} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      tags: [always]

    - name: Guard — block public listener collisions before convergence
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/../../scripts/check-listener-collisions.py"
        stdin: "{{ {'listeners': public_listener_manifest, 'allowlist': listener_collision_allowlist | default([])} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      tags: [always]

  # Hosts in the `vpn-subscription-only` inventory group skip every
  # transport-class role and run only baseline + firewall + the
  # subscription-host role + supporting services (monitoring /
  # watchdog / backup). See docs/SUBSCRIPTION-HOST-SEPARATION.md.

  roles:
    - role: baseline
      tags: [baseline, always]

    - role: package_updates
      when: (security_controls | default({})).unattended_upgrades | default(false)
      tags: [baseline, security, updates]

    - role: firewall
      tags: [firewall, always]

    - role: intrusion_prevention
      when: (security_controls | default({})).fail2ban | default(false)
      tags: [security, intrusion-prevention]

    - role: geodata
      when: >-
        (vpn.enable_geodata | default(true)) and
        ((vpn.enable_xray_reality | default(true)) or
         (vpn.enable_cascade_ingress | default(false))) and
        not (vpn_subscription_only | default(false))
      tags: [geodata, xray]

    # Verify the optional egress before any Xray render or handler flush can
    # activate routes that depend on it. The xray tag must retain this gate.
    - role: warp-outbound
      when: (vpn.enable_warp_outbound | default(false)) and not (vpn_subscription_only | default(false))
      tags: [warp, outbound, xray, p0, p1, transport]

    - role: xray
      when: >-
        ((vpn.enable_xray_reality | default(true)) or
         (vpn.enable_nginx_xhttp | default(true))) and
        not (vpn_subscription_only | default(false))
      tags: [xray, p0, p1, transport]

    - role: reality-self-steal
      when: not (vpn_subscription_only | default(false))
      tags: [reality-self-steal, p0, transport]

    - role: nginx-xhttp
      when: (vpn.enable_nginx_xhttp | default(true)) and not (vpn_subscription_only | default(false))
      tags: [nginx, xhttp, p1, transport]

    - role: cdn-front
      when: (vpn.enable_cdn_front | default(false)) and not (vpn_subscription_only | default(false))
      tags: [cdn-front, p1, transport]

    - role: naive
      when: (vpn.enable_naive | default(false)) and not (vpn_subscription_only | default(false))
      tags: [naive, p1, transport]

    - role: hysteria
      when: (vpn.enable_hysteria | default(false)) and not (vpn_subscription_only | default(false))
      tags: [hysteria, p2, transport]

    - role: amneziawg
      when: (vpn.enable_amneziawg | default(false)) and not (vpn_subscription_only | default(false))
      tags: [amneziawg, awg, p2, transport]

    - role: subscription-host
      when: (vpn.enable_subscription_host | default(false)) or (vpn_subscription_only | default(false))
      tags: [subscription]

    - role: honeypot
      when: (vpn.enable_honeypot | default(false)) and not (vpn_subscription_only | default(false))
      tags: [honeypot, defensive]

    - role: policy-ratelimit
      when: (vpn.enable_policy_ratelimit | default(false)) and not (vpn_subscription_only | default(false))
      tags: [policy-ratelimit, defensive]

    - role: dns-morph-bridge
      when: (vpn.enable_dns_morph_bridge | default(false)) and not (vpn_subscription_only | default(false))
      tags: [dns-morph-bridge, p4, transport, bootstrap]

    - role: hysteria-realm
      when: (vpn.enable_hysteria_realm | default(false)) and not (vpn_subscription_only | default(false))
      tags: [hysteria-realm, p5, transport, rendezvous]

    - role: snell
      when: (vpn.enable_snell | default(false)) and not (vpn_subscription_only | default(false))
      tags: [snell, p3, transport, research]

    - role: split-hop-egress
      when: (vpn.enable_split_hop_egress | default(false)) and not (vpn_subscription_only | default(false))
      tags: [split-hop-egress, topology]

    - role: split-hop-ingress
      when: (vpn.enable_split_hop_ingress | default(false)) and not (vpn_subscription_only | default(false))
      tags: [split-hop-ingress, topology, research]

    - role: cascade-ingress
      when: (vpn.enable_cascade_ingress | default(false)) and not (vpn_subscription_only | default(false))
      tags: [cascade-ingress, topology, exception]

    - role: cascade-egress
      when: (vpn.enable_cascade_egress | default(false)) and not (vpn_subscription_only | default(false))
      tags: [cascade-egress, topology, exception]

    - role: probe-matrix-target
      when: (vpn.enable_probe_matrix_target | default(false)) and not (vpn_subscription_only | default(false))
      tags: [probe-matrix-target, measurement, research]

    - role: monitoring
      when: vpn.enable_monitoring | default(true)
      tags: [monitoring]

    - role: backup
      when: vpn.enable_backup | default(true)
      tags: [backup]

    - role: watchdog
      when: vpn.enable_watchdog | default(true)
      tags: [watchdog, monitoring]

    - role: node_manifest
      tags: [manifest]
