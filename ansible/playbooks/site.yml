---
- name: Provision VPN VPS — full stack
  hosts: vpn
  serial: 1
  any_errors_fatal: true
  become: true
  gather_facts: true

  vars:
    transport_egress_site_staging: true
    baseline_defer_awg_forwarding: true
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}

  vars_files:
    - "{{ vpn_secrets_file }}"

  pre_tasks:
    - name: Preflight enabled transport input semantics
      ansible.builtin.import_tasks: tasks/transport-input-preflight.yml
      tags: [always]

    - name: Require exact-node controller ownership before convergence
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ssh_transaction_controller_managed | default(false) | bool
        fail_msg: site.yml must run through the exact-node deployment controller

    # The firewall replaces its ruleset with `destroy table`, which needs the
    # nftables shipped since Debian 13 and Ubuntu 24.04.
    - name: Refuse host operating systems older than Debian 13 or Ubuntu 24.04
      tags: [always]
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 13)
            or (ansible_facts['distribution'] == 'Ubuntu'
                and ansible_facts['distribution_version'] is version('24.04', '>='))
        fail_msg: unsupported-host-os; recreate the node from a Debian 13 or Ubuntu 24.04 image

    - name: Preflight enabled DNS-Morph inputs before host changes
      ansible.builtin.import_role:
        name: dns-morph-bridge
        tasks_from: preflight
      when:
        - vpn.enable_dns_morph_bridge | default(false) | bool
        - not (vpn_subscription_only | default(false) | bool)
      tags: [always]

    - name: Validate reviewed network exposure policy before host changes
      ansible.builtin.import_role:
        name: network-exposure-gate
      tags: [always]

    - name: Ensure VPN_SECRETS_FILE was provided
      tags: [always]
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path
          to your decrypted secrets file before running this playbook.

    # The firewall renders zero SSH accept rules under policy drop when the
    # allowlist is empty; a non-populated inventory would converge green and
    # lock the operator out. Fail fast instead (REQ-SSH-ALLOWLIST-FAILFAST).
    - name: Ensure the SSH management-path allowlist is populated
      tags: [always]
      ansible.builtin.assert:
        that:
          - allowed_ssh_cidrs is defined
          - allowed_ssh_cidrs | length > 0
        fail_msg: |
          allowed_ssh_cidrs is empty. The firewall role would render a
          policy-drop ruleset with no SSH accept rule and lock you out of
          this node. Populate allowed_ssh_cidrs in tfvars and re-render the
          inventory (scripts/render-inventory.sh) before deploying.

    # Role-tier guard: a role tagged `research` in ansible/role-tiers.yml must
    # never converge on a family node. A lab/pilot host opts in explicitly by
    # listing the role in `allow_research_roles` in its inventory (git-visible).
    # The static half of this guard is scripts/check-deploy-profile.py (CI).
    - name: Load role tier manifest
      tags: [always]
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../role-tiers.yml"

    - name: Guard — block RESEARCH-tier roles in a family deploy
      tags: [always]
      vars:
        _enabled_research_roles: >-
          {{ toggle_role_map | dict2items
             | selectattr('key', 'in',
                 (vpn | default({}) | dict2items
                  | selectattr('value', 'equalto', true)
                  | map(attribute='key') | list))
             | map(attribute='value') | list
             | select('in',
                 (tiers | dict2items
                  | selectattr('value', 'equalto', 'research')
                  | map(attribute='key') | list))
             | list }}
        _forbidden: "{{ _enabled_research_roles | difference(allow_research_roles | default([])) }}"
      ansible.builtin.assert:
        that:
          - _forbidden | length == 0
        fail_msg: >-
          Refusing to deploy: RESEARCH-tier role(s) {{ _forbidden }} are enabled
          on this host but not approved in `allow_research_roles`. Research /
          experimental roles are not part of the family (P0/P1/P2) baseline. To
          run one on a lab or pilot node, add it to `allow_research_roles` in
          that host's inventory (e.g. allow_research_roles: [split-hop-egress]).
          See docs/decisions/0002-role-and-doc-tiering.md.
        success_msg: "Tier guard OK — no unapproved research-tier roles enabled."

    - name: Guard — block unapproved EXCEPTION-tier roles
      tags: [always]
      vars:
        _enabled_exception_roles: >-
          {{ toggle_role_map | dict2items
             | selectattr('key', 'in',
                 (vpn | default({}) | dict2items
                  | selectattr('value', 'equalto', true)
                  | map(attribute='key') | list))
             | map(attribute='value') | list
             | select('in',
                 (tiers | dict2items
                  | selectattr('value', 'equalto', 'exception')
                  | map(attribute='key') | list))
             | list }}
        _forbidden_exception: "{{ _enabled_exception_roles | difference(allow_exception_roles | default([])) }}"
      ansible.builtin.assert:
        that:
          - _forbidden_exception | length == 0
        fail_msg: >-
          Refusing to deploy: EXCEPTION-tier role(s) {{ _forbidden_exception }}
          require an exact per-host allow_exception_roles entry.

    - name: Guard — cascade and split-hop role families are mutually exclusive
      vars:
        _cascade_enabled: >-
          {{ (vpn.enable_cascade_ingress | default(false) | bool) or
             (vpn.enable_cascade_egress | default(false) | bool) }}
        _split_hop_enabled: >-
          {{ (vpn.enable_split_hop_ingress | default(false) | bool) or
             (vpn.enable_split_hop_egress | default(false) | bool) }}
        _cascade_conflicts: >-
          {{ (['cascade-ingress'] if vpn.enable_cascade_ingress | default(false) | bool else []) +
             (['cascade-egress'] if vpn.enable_cascade_egress | default(false) | bool else []) }}
        _split_hop_conflicts: >-
          {{ (['split-hop-ingress'] if vpn.enable_split_hop_ingress | default(false) | bool else []) +
             (['split-hop-egress'] if vpn.enable_split_hop_egress | default(false) | bool else []) }}
      ansible.builtin.assert:
        that:
          - not (_cascade_enabled and _split_hop_enabled)
        fail_msg: >-
          Host {{ inventory_hostname }} may not combine cascade roles
          {{ _cascade_conflicts }} with split-hop roles {{ _split_hop_conflicts }}.
      tags: [always]

    - name: Guard — cascade classifier owns every egress decision
      ansible.builtin.assert:
        that:
          - not ((vpn.enable_cascade_ingress | default(false) | bool) and (vpn.enable_warp_outbound | default(false) | bool))
        fail_msg: >-
          Host {{ inventory_hostname }} may not enable cascade-ingress with
          warp-outbound because WARP rules would bypass uniform classification.
      tags: [always]

    - name: Guard — verify cascade ASN attestation before converge
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../../scripts/check-cascade-attestation.py
          --attestation {{ cascade_attestation_file | default(playbook_dir ~ '/../../attestations/cascade-asn-attestation.json') | quote }}
      delegate_to: localhost
      become: false
      changed_when: false
      when: >-
        (vpn.enable_cascade_ingress | default(false) | bool) or
        (vpn.enable_cascade_egress | default(false) | bool)
      tags: [always]

    - name: Guard — verify fresh cascade per-leg protocol completion
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../../scripts/check-cascade-leg-health.py
          --health-record {{ cascade_leg_health_file | default(playbook_dir ~ '/../../attestations/cascade-leg-health.json') | quote }}
      delegate_to: localhost
      become: false
      changed_when: false
      when: >-
        (vpn.enable_cascade_ingress | default(false) | bool) or
        (vpn.enable_cascade_egress | default(false) | bool)
      tags: [always]

    - name: Guard — block cascade live activation under implementation-only governance
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', playbook_dir ~ '/../role-tiers.yml') |
             from_yaml).cascade_governance_status == 'live-authorized'
        fail_msg: >-
          Cascade implementation is present for review, but live activation is
          not authorized. A future governance commit must change the repository-
          owned cascade_governance_status before converge can proceed.
      when: >-
        (vpn.enable_cascade_ingress | default(false) | bool) or
        (vpn.enable_cascade_egress | default(false) | bool)
      tags: [always]

    - name: Admit the provider and runtime public listener contract
      ansible.builtin.import_tasks: tasks/public-listener-preflight.yml
      tags: [always]

    - name: Guard — validate exact Tailnet management source addresses
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../../scripts/tailnet-validate-sources.py
        stdin: "{{ tailnet_management.approved_sources | default([]) | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      when: vpn.enable_tailnet_management | default(false)
      tags: [always, tailnet-management]

    - name: Guard — require confirmed Tailnet identity before host convergence
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/lib/vpn-tailnet/tailnet-check.py
        stdin: >-
          {{ {'inventory_alias': inventory_hostname,
              'public_address': vpn_service_address,
              'ssh_port': ansible_port | int,
              'approved_sources': tailnet_management.approved_sources,
              'transport_address': ansible_host} | to_json }}
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
      check_mode: false
      changed_when: false
      no_log: true
      when: vpn.enable_tailnet_management | default(false)
      tags: [always, tailnet-management]

    - name: Guard — block public listener collisions before convergence
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/../../scripts/check-listener-collisions.py"
        stdin: "{{ {'listeners': public_listener_manifest, 'allowlist': listener_collision_allowlist | default([])} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      tags: [always]

  # Hosts in the `vpn-subscription-only` inventory group skip every
  # transport-class role and run only baseline + firewall + the
  # subscription-host role + supporting services (monitoring /
  # watchdog / backup). See docs/how-to/subscription-host-separation.md.

  roles:
    - role: baseline
      vars:
        baseline_defer_resolver_restore: true
        baseline_dns_morph_active: >-
          {{ (vpn.enable_dns_morph_bridge | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [baseline, always]

    - role: package_updates
      tags: [baseline, security, updates]

  tasks:
    - name: Install inert managed public TLS prerequisites before ingress capture
      ansible.builtin.import_role:
        name: nginx-xhttp
        tasks_from: tls-prepare
        public: true
      when:
        - vpn.enable_nginx_xhttp | default(true) | bool
        - not (vpn_subscription_only | default(false) | bool)
        - nginx_xhttp.acme is defined
      tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]

    # One ingress decision owns initial firewall compensation. AWG commits later.
    - name: Converge protected consumers with retained initial firewall authority
      block:
        - name: Capture the protected ingress composition before staging
          ansible.builtin.import_tasks: tasks/transport-ingress-begin.yml
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Reconcile firewall prerequisites
          ansible.builtin.import_role:
            name: firewall
            public: true
          tags: [firewall, always]
          vars:
            firewall_site_transaction: true
        - name: Reconcile intrusion_prevention prerequisites
          ansible.builtin.import_role:
            name: intrusion_prevention
            public: true
          tags: [security, intrusion-prevention]
        - name: Establish trusted managed public TLS after HTTP firewall admission
          ansible.builtin.import_role:
            name: nginx-xhttp
            tasks_from: tls-bootstrap
            public: true
          when:
            - vpn.enable_nginx_xhttp | default(true) | bool
            - not (vpn_subscription_only | default(false) | bool)
            - nginx_xhttp.acme is defined
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Reconcile geodata prerequisites
          ansible.builtin.import_role:
            name: geodata
            public: true
          vars:
            geodata_role_enabled: >-
              {{ (vpn.enable_geodata | default(true)) and ((vpn.enable_xray_reality | default(true)) or
              (vpn.enable_cascade_ingress | default(false))) and not (vpn_subscription_only | default(false)) }}
          tags: [geodata, xray]
        - name: Reconcile tailnet-management prerequisites
          ansible.builtin.import_role:
            name: tailnet-management
            public: true
          when: vpn.enable_tailnet_management | default(false)
          tags: [tailnet-management, security]
        - name: Reconcile transport-egress runtime
          ansible.builtin.import_role:
            name: transport-egress
            public: true
            tasks_from: prepare-site
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Reconcile xray runtime
          ansible.builtin.import_role:
            name: xray
            public: true
          vars:
            xray_role_enabled: >-
              {{ ((vpn.enable_xray_reality | default(true)) or (vpn.enable_nginx_xhttp | default(true))) and not
              (vpn_subscription_only | default(false)) }}
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Reconcile reality-self-steal runtime
          ansible.builtin.import_role:
            name: reality-self-steal
            public: true
          vars:
            reality_self_steal_role_enabled: >-
              {{ (not (vpn_subscription_only | default(false))) and (vpn.enable_reality_self_steal | default(false) | bool)
              }}
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Reconcile nginx-xhttp runtime
          ansible.builtin.import_role:
            name: nginx-xhttp
            public: true
          vars:
            nginx_xhttp_role_enabled: '{{ (vpn.enable_nginx_xhttp | default(true)) and not (vpn_subscription_only | default(false))
              }}'
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Reconcile hysteria runtime
          ansible.builtin.import_role:
            name: hysteria
            public: true
          vars:
            hysteria_role_enabled: '{{ (vpn.enable_hysteria | default(true)) and not (vpn_subscription_only | default(false))
              }}'
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Admit protected transports after complete frontend staging
          ansible.builtin.import_tasks: tasks/transport-egress-activate.yml
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Commit the ready protected ingress and egress composition
          ansible.builtin.import_tasks: tasks/transport-ingress-commit.yml
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Enable autonomous public TLS renewal after the protected commit
          ansible.builtin.import_role:
            name: nginx-xhttp
            tasks_from: tls-finish
            public: true
          when:
            - vpn.enable_nginx_xhttp | default(true) | bool
            - not (vpn_subscription_only | default(false) | bool)
            - nginx_xhttp.acme is defined
          tags: [xray, hysteria, nginx, xhttp, reality-self-steal, p0, p1, p2, transport]
        - name: Finish an initial firewall without a selected protected consumer
          ansible.builtin.command:
            argv:
              - python3
              - -Es
              - /usr/local/libexec/ripdpi-consumer/firewall_consumer.py
              - finish
              - --owner
              - site
          changed_when: false
          no_log: true
          when: _firewall_site_transaction_active | default(false) | bool
          tags: [always]
      rescue:
        - name: Resolve a durable commit decision before any compensation
          ansible.builtin.include_tasks: tasks/transport-ingress-recover-commit.yml
          when: transport_site_transaction_active | default(false) | bool
          tags: [always]
        - name: Quiesce candidate transport processes before ingress compensation
          ansible.builtin.include_role:
            name: transport-egress
            tasks_from: quiesce
          when:
            - transport_site_transaction_active | default(false) | bool
            - _transport_egress_transaction_started | default(false) | bool
          tags: [always]
        - name: Restore accepted ingress before any protected frontend recovery
          ansible.builtin.include_tasks: tasks/transport-ingress-restore.yml
          tags: [always]
        - name: Admit retained consumer helpers before recovery
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/../roles/runtime-release/files/consumer_authority.py'')
                }}'
          changed_when: false
          check_mode: false
          tags: [always]
        - name: Inspect retained firewall helper after interrupted convergence
          ansible.builtin.stat:
            path: /usr/local/libexec/ripdpi-consumer/firewall_consumer.py
            follow: false
          register: _firewall_rescue_helper
          tags: [always]
        - name: Read retained firewall consumer ownership before compensation
          ansible.builtin.command:
            argv:
              - python3
              - -Es
              - /usr/local/libexec/ripdpi-consumer/firewall_consumer.py
              - status
          changed_when: false
          check_mode: false
          register: _firewall_rescue_owner
          when: _firewall_rescue_helper.stat.exists
          tags: [always]
        - name: Restore initial firewall after protected convergence refusal
          ansible.builtin.command:
            argv:
              - python3
              - -Es
              - /usr/local/libexec/ripdpi-consumer/firewall_consumer.py
              - restore
            stdin: '{{ {''owner'': ''site'', ''check'': ansible_check_mode} | to_json }}'
          changed_when: true
          check_mode: false
          no_log: true
          when:
            - _firewall_rescue_helper.stat.exists
            - (_firewall_rescue_owner.stdout | from_json).owner == 'site'
          tags: [always]
        - name: Restore accepted protected generation after site staging failure
          ansible.builtin.include_role:
            name: transport-egress
            tasks_from: rollback
          when:
            - transport_site_transaction_active | default(false) | bool
            - _transport_egress_transaction_started | default(false) | bool
          tags: [always]
        - name: Report protected site staging refusal after bounded recovery
          ansible.builtin.fail:
            msg: >-
              Protected transport staging failed; {{ 'accepted-generation recovery was attempted when available.'
              if (transport_site_transaction_active | default(false) | bool)
              else 'no accepted-generation recovery was attempted.' }}
          tags: [always]
    - name: Reconcile cdn-front runtime
      ansible.builtin.import_role:
        name: cdn-front
        public: true
      vars:
        cdn_front_role_enabled: >-
          {{ (vpn.enable_cdn_front | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [cdn-front, p1, transport]
    - name: Reconcile naive runtime
      ansible.builtin.import_role:
        name: naive
        public: true
      vars:
        naive_role_enabled: >-
          {{ (vpn.enable_naive | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [naive, p1, transport]
    - name: Reconcile amneziawg runtime
      ansible.builtin.import_role:
        name: amneziawg
        public: true
      vars:
        amneziawg_role_enabled: >-
          {{ (vpn.enable_amneziawg | default(true)) and not (vpn_subscription_only | default(false)) }}
      tags: [amneziawg, awg, p2, transport]
    - name: Reconcile forwarding after accepted AWG lifecycle
      ansible.builtin.import_role:
        name: baseline
        tasks_from: forwarding
      vars:
        baseline_defer_awg_forwarding: false
        baseline_forwarding_amneziawg_active: >-
          {{ (vpn.enable_amneziawg | default(true)) and not (vpn_subscription_only | default(false)) }}
      tags: [amneziawg, awg, p2, transport]
    - name: Reconcile subscription-host runtime
      ansible.builtin.import_role:
        name: subscription-host
        public: true
      vars:
        subscription_host_role_enabled: >-
          {{ (vpn.enable_subscription_host | default(false)) or (vpn_subscription_only | default(false)) }}
      tags: [subscription]
    - name: Reconcile honeypot runtime
      ansible.builtin.import_role:
        name: honeypot
        public: true
      vars:
        honeypot_role_enabled: >-
          {{ (vpn.enable_honeypot | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [honeypot, defensive]
    - name: Reconcile policy-ratelimit runtime
      ansible.builtin.import_role:
        name: policy-ratelimit
        public: true
      vars:
        policy_ratelimit_role_enabled: >-
          {{ (vpn.enable_policy_ratelimit | default(false)) and not (vpn_subscription_only | default(false))
          }}
      tags: [policy-ratelimit, defensive]
    - name: Reconcile dns-morph-bridge runtime
      ansible.builtin.import_role:
        name: dns-morph-bridge
        public: true
      vars:
        dns_morph_bridge_role_enabled: >-
          {{ (vpn.enable_dns_morph_bridge | default(false)) and not (vpn_subscription_only | default(false))
          }}
      tags: [dns-morph-bridge, p4, transport, bootstrap]
    - name: Reconcile hysteria-realm runtime
      ansible.builtin.import_role:
        name: hysteria-realm
        public: true
      vars:
        hysteria_realm_role_enabled: >-
          {{ (vpn.enable_hysteria_realm | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [hysteria-realm, p5, transport, rendezvous]
    - name: Reconcile snell runtime
      ansible.builtin.import_role:
        name: snell
        public: true
      vars:
        snell_role_enabled: >-
          {{ (vpn.enable_snell | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [snell, p3, transport, research]
    - name: Reconcile split-hop-egress runtime
      ansible.builtin.import_role:
        name: split-hop-egress
        public: true
      vars:
        split_hop_egress_role_enabled: >-
          {{ (vpn.enable_split_hop_egress | default(false)) and not (vpn_subscription_only | default(false))
          }}
      tags: [split-hop-egress, topology]
    - name: Reconcile split-hop-ingress runtime
      ansible.builtin.import_role:
        name: split-hop-ingress
        public: true
      vars:
        split_hop_ingress_role_enabled: >-
          {{ (vpn.enable_split_hop_ingress | default(false)) and not (vpn_subscription_only | default(false))
          }}
      tags: [split-hop-ingress, topology, research]
    - name: Reconcile cascade-ingress runtime
      ansible.builtin.import_role:
        name: cascade-ingress
        public: true
      vars:
        cascade_ingress_role_enabled: >-
          {{ (vpn.enable_cascade_ingress | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [cascade-ingress, topology, exception]
    - name: Reconcile cascade-egress runtime
      ansible.builtin.import_role:
        name: cascade-egress
        public: true
      vars:
        cascade_egress_role_enabled: >-
          {{ (vpn.enable_cascade_egress | default(false)) and not (vpn_subscription_only | default(false)) }}
      tags: [cascade-egress, topology, exception]
    - name: Reconcile probe-matrix-target runtime
      ansible.builtin.import_role:
        name: probe-matrix-target
        public: true
      vars:
        probe_matrix_target_role_enabled: >-
          {{ (vpn.enable_probe_matrix_target | default(false)) and not (vpn_subscription_only | default(false))
          }}
      tags: [probe-matrix-target, measurement, research]
    - name: Reconcile monitoring runtime
      ansible.builtin.import_role:
        name: monitoring
        public: true
      vars:
        monitoring_role_enabled: >-
          {{ vpn.enable_monitoring | default(true) }}
      tags: [monitoring]
    - name: Reconcile backup runtime
      ansible.builtin.import_role:
        name: backup
        public: true
      vars:
        backup_role_enabled: >-
          {{ vpn.enable_backup | default(true) }}
      tags: [backup]
    - name: Reconcile watchdog runtime
      ansible.builtin.import_role:
        name: watchdog
        public: true
      vars:
        watchdog_role_enabled: >-
          {{ vpn.enable_watchdog | default(true) }}
      tags: [watchdog, monitoring]
    - name: Reconcile node_manifest runtime
      ansible.builtin.import_role:
        name: node_manifest
        public: true
      tags: [manifest]

- name: Publish and prove the SSH baseline after the VPN stack converges
  hosts: vpn
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: false
  # This phase requires real public and management SSH transports.  Docker
  # full-stack scenarios exercise the preceding convergence phase and skip
  # this tag; the transaction itself is covered by controller tests and the
  # mandatory staging/live acceptance path.
  tags: [ssh-transaction]

  tasks:
    - name: Run the baseline SSH transaction controller
      ansible.builtin.include_role:
        name: baseline
        tasks_from: sshd-transaction
      tags: [always, baseline]
