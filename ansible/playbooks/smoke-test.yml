---
# End-to-end smoke test. Runs on the VPS itself: uses the local Xray binary
# in client mode against its own server listeners with the first client's
# credentials, fetches https://www.google.com/generate_204, asserts 204.
#
# Hysteria similar. AmneziaWG is intentionally skipped — userspace AWG would
# need a peer + routing setup that materially mutates the host network.
# Watchdog already covers the AWG-up case.
#
# This playbook is read-only with respect to deployed config: it writes
# tmpfs-only test configs and reads /etc/xray/config.json + secrets to
# pick a client.

- name: Smoke-test the deployed VPN stack from inside the host
  hosts: vpn
  become: true
  gather_facts: true

  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}

  vars_files:
    - "{{ vpn_secrets_file }}"

  tasks:
    - name: Ensure VPN_SECRETS_FILE was provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path
          to your decrypted secrets file before running this playbook.

    - name: Pre-flight — required vars present
      ansible.builtin.assert:
        that:
          - xray.clients | length > 0
          - xray.reality_public_key is defined
          - xray.server_names | length > 0
        fail_msg: "secrets are missing client/REALITY data; cannot smoke-test"

    - name: Set local test workdir
      ansible.builtin.set_fact:
        smoketest_dir: /run/vpn-smoketest
        smoketest_client: "{{ xray.clients[0] }}"
        smoketest_target: "https://www.google.com/generate_204"
        smoketest_expected_code: 204

    - name: Create tmpfs workdir
      ansible.builtin.file:
        path: "{{ smoketest_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # ---------------------------------------------------------------
    # P0 REALITY — Xray client dial
    # ---------------------------------------------------------------
    - name: Render Xray client config (REALITY)
      when: vpn.enable_xray_reality | default(true)
      ansible.builtin.copy:
        dest: "{{ smoketest_dir }}/xray-client.json"
        owner: root
        group: root
        mode: "0600"
        content: |
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "tag": "smoke-socks",
              "listen": "127.0.0.1",
              "port": 31080,
              "protocol": "socks",
              "settings": { "auth": "noauth", "udp": true }
            }],
            "outbounds": [{
              "tag": "smoke-reality",
              "protocol": "vless",
              "settings": {
                "vnext": [{
                  "address": "127.0.0.1",
                  "port": 443,
                  "users": [{
                    "id": "{{ smoketest_client.uuid }}",
                    "encryption": "none",
                    "flow": "xtls-rprx-vision"
                  }]
                }]
              },
              "streamSettings": {
                "network": "raw",
                "security": "reality",
                "realitySettings": {
                  "fingerprint": "chrome",
                  "serverName": "{{ xray.server_names[0] }}",
                  "publicKey": "{{ xray.reality_public_key }}",
                  "shortId": "{{ smoketest_client.short_id }}"
                }
              }
            }]
          }
      no_log: true
      diff: false

    - name: Run Xray smoke client (REALITY) for 6 seconds
      when: vpn.enable_xray_reality | default(true)
      ansible.builtin.command:
        cmd: |
          systemd-run --quiet --no-block --collect
            --unit=vpn-smoke-xray
            --property=Type=simple
            /usr/local/bin/xray run -config {{ smoketest_dir }}/xray-client.json
      args:
        creates: /run/systemd/transient/vpn-smoke-xray.service
      changed_when: true

    - name: Wait briefly for the smoke listener
      when: vpn.enable_xray_reality | default(true)
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 31080
        timeout: 10

    - name: Probe through REALITY proxy
      when: vpn.enable_xray_reality | default(true)
      ansible.builtin.command:
        cmd: |
          curl -sS -o /dev/null -w '%{http_code}'
            --max-time 15
            --proxy socks5h://127.0.0.1:31080
            {{ smoketest_target }}
      register: reality_probe
      changed_when: false
      failed_when: reality_probe.stdout | int != smoketest_expected_code

    - name: Stop REALITY smoke client
      when: vpn.enable_xray_reality | default(true)
      ansible.builtin.command:
        cmd: systemctl stop vpn-smoke-xray.service
      changed_when: true
      failed_when: false

    # ---------------------------------------------------------------
    # P2 Hysteria2 — client dial
    # ---------------------------------------------------------------
    - name: Render Hysteria client config
      when: vpn.enable_hysteria | default(false)
      ansible.builtin.copy:
        dest: "{{ smoketest_dir }}/hysteria-client.yaml"
        owner: root
        group: root
        mode: "0600"
        content: |
          {% set explicit_obfs_type = hysteria_obfs_type | default('') %}
          {% set smoke_obfs_type =
            explicit_obfs_type
            if explicit_obfs_type
            else ('salamander' if (hysteria.salamander_enabled | default(false)) else 'plain')
          %}
          {% set smoke_obfs_password = hysteria.obfs_password | default(hysteria.salamander_password | default(''), true) %}
          server: 127.0.0.1:{{ hysteria_port | default(443) }}
          auth: "{{ hysteria.clients[0].password }}"
          {% if smoke_obfs_type == 'salamander' %}
          obfs:
            type: salamander
            salamander:
              password: "{{ smoke_obfs_password }}"
          {% elif smoke_obfs_type == 'gecko' %}
          obfs:
            type: gecko
            gecko:
              password: "{{ smoke_obfs_password }}"
              minPacketSize: {{ hysteria_gecko_min_packet_size | default(512) }}
              maxPacketSize: {{ hysteria_gecko_max_packet_size | default(1200) }}
          {% endif %}
          tls:
            sni: "{{ nginx_xhttp.server_name | default(xray.server_names[0]) }}"
            insecure: true
          socks5:
            listen: 127.0.0.1:31081
      no_log: true
      diff: false

    - name: Run Hysteria smoke client
      when: vpn.enable_hysteria | default(false)
      ansible.builtin.command:
        cmd: |
          systemd-run --quiet --no-block --collect
            --unit=vpn-smoke-hysteria
            --property=Type=simple
            /usr/local/bin/hysteria client -c {{ smoketest_dir }}/hysteria-client.yaml
      args:
        creates: /run/systemd/transient/vpn-smoke-hysteria.service
      changed_when: true

    - name: Wait for Hysteria smoke listener
      when: vpn.enable_hysteria | default(false)
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 31081
        timeout: 10

    - name: Probe through Hysteria proxy
      when: vpn.enable_hysteria | default(false)
      ansible.builtin.command:
        cmd: |
          curl -sS -o /dev/null -w '%{http_code}'
            --max-time 15
            --proxy socks5h://127.0.0.1:31081
            {{ smoketest_target }}
      register: hysteria_probe
      changed_when: false
      failed_when: hysteria_probe.stdout | int != smoketest_expected_code

    - name: Stop Hysteria smoke client
      when: vpn.enable_hysteria | default(false)
      ansible.builtin.command:
        cmd: systemctl stop vpn-smoke-hysteria.service
      changed_when: true
      failed_when: false

    - name: Render Snell smoke client configuration
      when: vpn.enable_snell | default(false)
      ansible.builtin.copy:
        dest: "{{ smoketest_dir }}/snell-client.json"
        owner: root
        group: root
        mode: "0600"
        content: "{{ lookup('template', playbook_dir ~ '/../roles/snell/templates/smoke-client.json.j2') }}"
      no_log: true
      diff: false

    - name: Run Snell smoke client
      when: vpn.enable_snell | default(false)
      ansible.builtin.command:
        cmd: >-
          systemd-run --quiet --no-block --collect --unit=vpn-smoke-snell
          --property=Type=simple /usr/local/bin/sing-box-snell run
          -c {{ smoketest_dir }}/snell-client.json
      args:
        creates: /run/systemd/transient/vpn-smoke-snell.service
      changed_when: true

    - name: Wait for Snell smoke listeners
      when: vpn.enable_snell | default(false)
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ snell.smoke_port_base + snell_index }}"
        timeout: 10
      loop: "{{ snell.variants }}"
      loop_control: {index_var: snell_index}

    - name: Probe through every Snell variant
      when: vpn.enable_snell | default(false)
      ansible.builtin.command:
        cmd: >-
          curl -sS -o /dev/null -w '%{http_code}' --max-time 15
          --proxy socks5h://127.0.0.1:{{ snell.smoke_port_base + snell_index }}
          {{ smoketest_target }}
      register: snell_probe
      changed_when: false
      failed_when: snell_probe.stdout | int != smoketest_expected_code
      loop: "{{ snell.variants }}"
      loop_control: {index_var: snell_index}

    - name: Stop Snell smoke client
      when: vpn.enable_snell | default(false)
      ansible.builtin.command: {cmd: systemctl stop vpn-smoke-snell.service}
      changed_when: true
      failed_when: false

    # ---------------------------------------------------------------
    # cleanup
    # ---------------------------------------------------------------
    - name: Remove smoke tmpfs workdir
      ansible.builtin.file:
        path: "{{ smoketest_dir }}"
        state: absent

    - name: Smoke summary
      ansible.builtin.debug:
        msg: |
          REALITY: {{ reality_probe.stdout | default('skipped') }}
          Hysteria: {{ hysteria_probe.stdout | default('skipped') }}
          Snell: {{ snell_probe.results | default('skipped') }}
          (AmneziaWG smoke-test is intentionally skipped — see watchdog role.)
