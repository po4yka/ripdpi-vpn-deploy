---
# The deploy controller shares one SSH master per host, which survives a
# firewall or sshd change that refuses new logins. This proves a fresh strict
# login with the readiness authority while the master stays open for rescue.
# Other callers keep fresh per-task connections and do not define the command.
- name: Prove a fresh strict SSH login outside the shared master
  ansible.builtin.command:
    argv: '{{ deploy_fresh_ssh_argv }}'
    stdin: pass
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  no_log: true
  when: deploy_fresh_ssh_argv is defined
