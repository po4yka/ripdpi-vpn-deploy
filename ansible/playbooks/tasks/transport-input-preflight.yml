---
- name: Resolve active and retired device transport authority
  ansible.builtin.import_tasks: device-runtime-context.yml
  tags: [always]

- name: Validate enabled transport semantics before mutation
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python,
          (role_path ~ '/../../../scripts/transport_semantics.py') if role_path is defined
          else (playbook_dir ~ '/../../scripts/transport_semantics.py')]
         + (transport_input_sections | default([]) | map('regex_replace', '^', '--section=') | list) }}
    stdin: >-
      {{ {'secrets': {'xray': xray | default({}),
                      'nginx_xhttp': nginx_xhttp | default({}),
                      'amneziawg_secrets': amneziawg_secrets | default({}),
                      'hysteria': hysteria | default({}),
                      'transport_egress_secrets': transport_egress_secrets | default(none)},
          'context': {'vpn': (vpn | default({})) | combine(
                         {'enable_xray_reality': false, 'enable_nginx_xhttp': false,
                          'enable_hysteria': false, 'enable_amneziawg': false}
                         if vpn_subscription_only | default(false) | bool else {}),
                      'require_transport_egress': not (vpn_subscription_only | default(false) | bool),
                      'amneziawg': amneziawg | default({}),
                      'amneziawg_cohort': amneziawg_cohort | default({}),
                      'public_site_canonical_url': public_site_canonical_url | default(none),
                      'nginx_xhttp_public_port': nginx_xhttp_public_port | default(8443),
                      'nginx_xhttp_fallback_port': nginx_xhttp_fallback_port | default(2083),
                      'xray_port': xray_port | default(443),
                      'xray_fallback_port': xray_fallback_port | default(2053),
                      'cdn_front_port': cdn_front.port | default(cdn_front_port | default(8443))}} | to_json }}
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  no_log: true
  tags: [always]
