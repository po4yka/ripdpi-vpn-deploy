---
- name: Verify VPN VPS — post-deploy gates
  hosts: vpn
  become: true
  gather_facts: false

  vars:
    vpn_secrets_file: >-
      {{
        lookup('env', 'VPN_SECRETS_FILE')
        | default(playbook_dir ~ '/../../secrets/prod.secrets.example.yaml', true)
      }}

  vars_files:
    - "{{ vpn_secrets_file }}"

  tasks:
    - name: Ensure VPN_SECRETS_FILE was provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'VPN_SECRETS_FILE') | length > 0
        fail_msg: |
          VPN_SECRETS_FILE is not set. Run `make decrypt` or export the path
          to your decrypted secrets file before running this playbook.

    - name: Cloud-init bootstrap marker exists
      ansible.builtin.stat:
        path: /var/lib/cloud-init-vpn-bootstrap.done
      register: cloud_marker
      failed_when: not cloud_marker.stat.exists

    - name: Node capability manifest exists
      ansible.builtin.stat:
        path: /var/lib/ripdpi-vpn-deploy/manifest.json
      register: node_manifest_verify
      failed_when: not node_manifest_verify.stat.exists

    - name: Node capability manifest is valid JSON
      ansible.builtin.command:
        cmd: python3 -m json.tool /var/lib/ripdpi-vpn-deploy/manifest.json
      changed_when: false

    - name: nftables config syntax valid
      ansible.builtin.command:
        cmd: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Xray config valid
      ansible.builtin.command:
        cmd: /usr/local/bin/xray run -test -config /etc/xray/config.json
      changed_when: false
      when: vpn.enable_xray_reality | default(true)

    - name: Xray service active
      ansible.builtin.command:
        cmd: systemctl is-active xray
      register: xray_status
      changed_when: false
      failed_when: xray_status.stdout != "active"
      when: vpn.enable_xray_reality | default(true)

    - name: Xray TCP listener active
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lnt | awk '{print $4}' | grep -q ':{{ xray_port | default(443) }}$'
        executable: /bin/bash
      changed_when: false
      when: vpn.enable_xray_reality | default(true)

    - name: Run authenticated watchdog REALITY round trips
      ansible.builtin.shell:
        cmd: |
          set -a
          . /etc/vpn-watchdog.env
          set +a
          /usr/local/sbin/vpn-watchdog.sh
        executable: /bin/bash
      register: watchdog_reality_verify
      changed_when: false
      failed_when: >-
        'FAIL  xray REALITY' in watchdog_reality_verify.stdout
        or 'OK    xray REALITY' not in watchdog_reality_verify.stdout
      when:
        - vpn.enable_watchdog | default(true)
        - vpn.enable_xray_reality | default(true)
        - not (vpn_subscription_only | default(false))

    - name: nginx-xhttp public TCP listener active
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lnt | awk '{print $4}' | grep -q ':{{ nginx_xhttp_public_port | default(8443) }}$'
        executable: /bin/bash
      changed_when: false
      when: vpn.enable_nginx_xhttp | default(true)

    - name: nginx -t
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      when: vpn.enable_nginx_xhttp | default(true)

    - name: Hysteria service active
      ansible.builtin.command:
        cmd: systemctl is-active hysteria-server
      register: hy_status
      changed_when: false
      failed_when: hy_status.stdout != "active"
      when: vpn.enable_hysteria | default(false)

    - name: Snell configuration is valid
      ansible.builtin.command:
        cmd: /usr/local/bin/sing-box-snell check -c /etc/snell/config.json
      changed_when: false
      when: vpn.enable_snell | default(false)

    - name: Snell service active
      ansible.builtin.command:
        cmd: systemctl is-active snell.service
      register: snell_status
      changed_when: false
      failed_when: snell_status.stdout != "active"
      when: vpn.enable_snell | default(false)

    - name: Snell TCP listeners active
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lnt | awk '{print $4}' | grep -q ':{{ item.listen_port }}$'
        executable: /bin/bash
      changed_when: false
      loop: "{{ snell.variants | default([]) }}"
      loop_control: {label: "{{ item.id }}"}
      when: vpn.enable_snell | default(false)

    - name: UDP/443 listening
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lnu | awk '{print $4}' | grep -q ':443$'
        executable: /bin/bash
      changed_when: false
      when: vpn.enable_hysteria | default(false)

    - name: AmneziaWG interface up
      ansible.builtin.command:
        cmd: awg show awg0
      changed_when: false
      when: vpn.enable_amneziawg | default(false)

    - name: SSH password auth disabled
      ansible.builtin.command:
        cmd: sshd -T
      register: sshd_t
      changed_when: false

    - name: SSH effective hardening is applied
      vars:
        _ssh_controls: "{{ security_controls | default({}) }}"
        _ssh_allow_tcp_forwarding: "{{ 'yes' if (_ssh_controls.ssh_allow_tcp_forwarding | default(false)) else 'no' }}"
        _ssh_max_sessions: "{{ _ssh_controls.ssh_max_sessions | default(2) }}"
        _ssh_max_startups: "{{ _ssh_controls.ssh_max_startups | default('10:30:20') }}"
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in (sshd_t.stdout | lower)"
          - "'permitrootlogin no' in (sshd_t.stdout | lower)"
          - "'kbdinteractiveauthentication no' in (sshd_t.stdout | lower)"
          - "'pubkeyauthentication yes' in (sshd_t.stdout | lower)"
          - "'x11forwarding no' in (sshd_t.stdout | lower)"
          - "'allowtcpforwarding ' ~ _ssh_allow_tcp_forwarding in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'allowagentforwarding no' in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'permittunnel no' in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'permituserenvironment no' in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'permitemptypasswords no' in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'ignorerhosts yes' in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'loglevel verbose' in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'maxsessions ' ~ _ssh_max_sessions in (sshd_t.stdout | lower)"
          - "not (_ssh_controls.ssh_strict | default(true)) or 'maxstartups ' ~ _ssh_max_startups in (sshd_t.stdout | lower)"

    - name: SSH optional RSA key floor is applied
      vars:
        _ssh_controls: "{{ security_controls | default({}) }}"
        _ssh_required_rsa_size: "{{ _ssh_controls.ssh_required_rsa_size | default(0) | int }}"
      ansible.builtin.assert:
        that:
          - "'requiredrsasize ' ~ (_ssh_required_rsa_size | string) in (sshd_t.stdout | lower)"
      when: _ssh_required_rsa_size | int > 0

    - name: Check whether SSH moduli file exists
      ansible.builtin.stat:
        path: /etc/ssh/moduli
      register: verify_ssh_moduli
      when: (security_controls | default({})).ssh_prune_moduli | default(false)

    - name: SSH moduli are pruned to at least 3071 bits
      ansible.builtin.command:
        cmd: awk '$5 < 3071 { print; bad=1 } END { exit bad }' /etc/ssh/moduli
      changed_when: false
      when:
        - (security_controls | default({})).ssh_prune_moduli | default(false)
        - verify_ssh_moduli.stat.exists | default(false)

    - name: Sysctl hardening values are applied
      ansible.builtin.command:
        cmd: "sysctl -n {{ item.key }}"
      loop:
        - key: "fs.protected_hardlinks"
          value: "1"
        - key: "fs.protected_symlinks"
          value: "1"
        - key: "kernel.randomize_va_space"
          value: "2"
        - key: "kernel.kptr_restrict"
          value: "2"
        - key: "kernel.yama.ptrace_scope"
          value: "2"
        - key: "net.ipv4.conf.all.accept_redirects"
          value: "0"
      register: verify_sysctl_value
      changed_when: false
      failed_when: verify_sysctl_value.stdout != item.value
