---
- name: Inspect redacted Xray diagnostics
  hosts: vpn
  become: true
  gather_facts: false

  tasks:
    - name: Query local Xray StatsService
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/xray api statsquery
          --server={{ xray_api_listen }}
      changed_when: false
      no_log: true
      when: >-
        (vpn.enable_monitoring | default(true)) and
        not (vpn_subscription_only | default(false)) and
        ((vpn.enable_xray_reality | default(true)) or
         (vpn.enable_nginx_xhttp | default(true)))

    - name: Read fresh redacted Xray metrics
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          metrics="$(curl --fail --silent --show-error --max-time 5 \
            http://{{ monitoring.node_exporter_listen | default('127.0.0.1:9100') }}/metrics \
            | awk '/^vpn_xray_/')"
          grep -q '^vpn_xray_stats_collection_success 1$' <<<"$metrics"
          age="$(awk -v now="$(date +%s)" '
            $1 == "vpn_xray_stats_collected_timestamp_seconds" {
              printf "%.0f", now - $2
              found=1
            }
            END { if (!found) exit 1 }
          ' <<<"$metrics")"
          test "$age" -ge 0
          test "$age" -le 180
          printf 'age_seconds=%s\n%s\n' "$age" "$metrics"
        executable: /bin/bash
      register: xray_diagnostics
      changed_when: false
      when: >-
        (vpn.enable_monitoring | default(true)) and
        not (vpn_subscription_only | default(false)) and
        ((vpn.enable_xray_reality | default(true)) or
         (vpn.enable_nginx_xhttp | default(true)))

    - name: Show redacted Xray diagnostics
      ansible.builtin.debug:
        var: xray_diagnostics.stdout_lines
      when:
        - xray_diagnostics is not skipped
        - xray_diagnostics.stdout_lines is defined
