---
# AmneziaWG runtime defaults. Override in group_vars or playbook vars if needed.

amneziawg_go_version: ""
amneziawg_tools_version: ""

# Supply-chain hardening. git tags are mutable — upstream can re-point them.
# Family deploys must provide both the tag/ref used for checkout and the exact
# resolved commit SHA expected after clone; the role refuses to build if either
# commit pin is empty or the checked-out tree resolves elsewhere.
amneziawg_go_commit: ""
amneziawg_tools_commit: ""

amneziawg:
  listen_port: "{{ amneziawg_listen_port }}"
  interface: awg0
  address_v4: "10.66.66.1/24"
  address_v6: "fd42:42:42::1/64"
  dns_servers:
    - "1.1.1.1"
    - "1.0.0.1"

# Cohort profile data, populated by include_vars when vpn.awg_cohort is
# set to a slug matching vars/cohorts/<slug>.yml. Empty by default so
# the role falls back to either amneziawg_secrets.* (explicit per-deploy
# overrides) or the hard-coded broad defaults below.
amneziawg_cohort: {}
