---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload amneziawg
  ansible.builtin.systemd_service:
    name: "awg-quick@{{ item.name }}"
    state: reloaded
  loop: "{{ _awg_instances | default([{'name': amneziawg.interface}]) }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
