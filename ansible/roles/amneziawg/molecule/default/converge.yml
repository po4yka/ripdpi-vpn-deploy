---
# The real role builds these synthetic local sources and runs no-TUN tools.
# This exercises role ownership, not an upstream build or an AWG tunnel.
- name: Converge the real AmneziaWG role against local source fixtures
  hosts: all
  become: true
  environment:
    GIT_CONFIG_GLOBAL: /opt/molecule-awg-fixture/gitconfig
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_ALLOW_PROTOCOL: file
  vars:
    amneziawg_go_version: molecule-fixture-v1
    amneziawg_go_commit: "{{ molecule_awg_go_head.stdout | trim }}"
    amneziawg_tools_version: molecule-fixture-v1
    amneziawg_tools_commit: "{{ molecule_awg_tools_head.stdout | trim }}"
    amneziawg_config_dir: /etc/amneziawg
    amneziawg:
      listen_port: 51820
      interface: awg0
      address_v4: "10.66.66.1/24"
      address_v6: "fd42:42:42::1/64"
    vpn:
      awg_cohort: narrow-junk-sequential
    amneziawg_secrets:
      server_private_key: "MOLECULE_STUB_PRIVATE_KEY_NOT_REAL_AAAAAAAAAAAAA="
      peers: []
  pre_tasks:
    - name: Read the synthetic AmneziaWG Go source pin
      ansible.builtin.command:
        argv: [git, -C, /opt/molecule-awg-fixture/amneziawg-go, rev-parse, HEAD]
      register: molecule_awg_go_head
      changed_when: false

    - name: Read the synthetic AmneziaWG tools source pin
      ansible.builtin.command:
        argv: [git, -C, /opt/molecule-awg-fixture/amneziawg-tools, rev-parse, HEAD]
      register: molecule_awg_tools_head
      changed_when: false

  tasks:
    - name: Execute the AmneziaWG role
      ansible.builtin.include_role:
        name: amneziawg
