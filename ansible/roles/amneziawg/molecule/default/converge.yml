---
# Executes real role tasks with pinned upstream source and no-TUN binary fixtures.
- name: Converge actual amneziawg role with stubbed runtime binaries
  hosts: all
  become: true
  vars:
    amneziawg_config_dir: /etc/amneziawg
    amneziawg_go_version: "v0.2.12"
    amneziawg_go_commit: "2e3f7d122ca8ef61e403fddc48a9db8fccd95dbf"
    amneziawg_tools_version: "v1.0.20241018"
    amneziawg_tools_commit: "c0b400c6dfc046f5cae8f3051b14cb61686fcf55"
    amneziawg:
      listen_port: 51820
      interface: awg0
      address_v4: "10.66.66.1/24"
      address_v6: "fd42:42:42::1/64"
    # Cohort selection drives jc/jmin/jmax/s1/s2/h1..h4 from
    # roles/amneziawg/vars/cohorts/narrow-junk-sequential.yml — the
    # inline obfuscation params here are intentionally omitted so
    # verify.yml exercises the cohort-file load path.
    vpn:
      awg_cohort: narrow-junk-sequential
    amneziawg_secrets:
      server_private_key: "MOLECULE_STUB_PRIVATE_KEY_NOT_REAL_AAAAAAAAAAAAA="
      peers: []

  pre_tasks:
    - name: Install fixture prerequisites
      ansible.builtin.apt:
        name: [git, procps]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Prepare real pinned source trees for the role build-receipt path
      ansible.builtin.git:
        repo: "https://github.com/amnezia-vpn/{{ item.name }}"
        dest: "/opt/src/{{ item.name }}"
        version: "{{ item.version }}"
        update: false
      loop:
        - name: amneziawg-go
          version: "{{ amneziawg_go_version }}"
        - name: amneziawg-tools
          version: "{{ amneziawg_tools_version }}"

    - name: Install deterministic runtime fixture binaries
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Molecule fixture: no tunnel or protocol liveness is claimed.
          printf '%s\n' "$*" >> /run/molecule-awg-calls
        force: false
      loop:
        - /opt/src/amneziawg-go/amneziawg-go
        - /usr/local/bin/amneziawg-go
        - /opt/src/amneziawg-tools/src/wg
        - /usr/bin/awg
        - /usr/bin/awg-quick

    - name: Bind fixture artifacts to the real checked-out commits
      ansible.builtin.copy:
        dest: "/opt/src/{{ item.name }}/.ripdpi-built-commit"
        content: "{{ item.commit }}\n"
        owner: root
        group: root
        mode: "0644"
      loop:
        - name: amneziawg-go
          commit: "{{ amneziawg_go_commit }}"
        - name: amneziawg-tools
          commit: "{{ amneziawg_tools_commit }}"

  tasks:
    - name: Execute amneziawg role including configuration and service lifecycle
      ansible.builtin.include_role:
        name: amneziawg
