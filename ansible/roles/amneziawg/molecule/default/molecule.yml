---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-awg-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:b4d9e93c00d16f482db3068cde61340113c74e77b725b4e770b3978de0c8215d
    platform: linux/amd64
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    capabilities: [NET_ADMIN]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    host_vars:
      vpn-awg-debian13:
        ansible_user: root
  config_options:
    defaults:
      callback_result_format: yaml

verifier:
  name: ansible

# The real role clones/builds local synthetic inputs and starts its own unit
# with a no-TUN tool. Receipts/config/service ownership and idempotence are
# tested; upstream source builds and working tunnels remain separate evidence.
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
