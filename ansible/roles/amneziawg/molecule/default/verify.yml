---
# Verify real role-owned builds, receipts, configuration and systemd lifecycle
# using explicitly synthetic local sources and no-TUN tools. Not tunnel proof.
# Cohort under test: narrow-junk-sequential
# (jc=4, jmin=10, jmax=50, s1=0, s2=0, h1..h4=1..4).

- name: Verify AmneziaWG role ownership and cohort configuration
  hosts: all
  become: true
  tasks:
    - name: Read the two synthetic source repository commits
      ansible.builtin.command:
        argv: [git, -C, "/opt/molecule-awg-fixture/{{ item }}", rev-parse, HEAD]
      loop: [amneziawg-go, amneziawg-tools]
      register: molecule_awg_fixture_heads
      changed_when: false

    - name: Read the role-cloned source repository commits
      ansible.builtin.command:
        argv:
          - git
          - -C
          - >-
            /opt/src/{{ item.name }}-{{
              molecule_awg_fixture_heads.results[item.index].stdout | trim
            }}
          - rev-parse
          - HEAD
      loop:
        - {name: amneziawg-go, index: 0}
        - {name: amneziawg-tools, index: 1}
      register: molecule_awg_clone_heads
      changed_when: false

    - name: Read build receipts written by the real role
      ansible.builtin.slurp:
        src: "/var/lib/ripdpi/runtime-build-receipts/{{ item }}.json"
      loop: [amneziawg-go, amneziawg-tools]
      register: molecule_awg_receipts

    - name: Decode build receipts written by the real role
      ansible.builtin.set_fact:
        molecule_awg_receipt_payloads: >-
          {{
            molecule_awg_receipts.results
            | map(attribute='content')
            | map('b64decode')
            | map('from_json')
            | list
          }}

    - name: Require matching fixture pins, cloned commits and typed receipts
      ansible.builtin.assert:
        that:
          - molecule_awg_fixture_heads.results[item].stdout | trim == molecule_awg_clone_heads.results[item].stdout | trim
          - molecule_awg_receipt_payloads[item].schema_version == 1
          - molecule_awg_receipt_payloads[item].source.commit == molecule_awg_clone_heads.results[item].stdout | trim
          - molecule_awg_receipt_payloads[item].source.ref == 'molecule-fixture-v1'
          - molecule_awg_receipt_payloads[item].outputs | length == (1 if item == 0 else 2)
      loop: [0, 1]

    - name: Require old per-checkout receipt files to remain retired
      ansible.builtin.stat:
        path: >-
          /opt/src/{{ item.name }}-{{
            molecule_awg_fixture_heads.results[item.index].stdout | trim
          }}/.ripdpi-built-commit
      loop:
        - {name: amneziawg-go, index: 0}
        - {name: amneziawg-tools, index: 1}
      register: molecule_awg_legacy_receipts

    - name: Confirm no legacy receipt was recreated
      ansible.builtin.assert:
        that:
          - molecule_awg_legacy_receipts.results | selectattr('stat.exists') | list | length == 0

    - name: Inspect source build outputs and installed binaries
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - >-
          /opt/src/amneziawg-go-{{
            molecule_awg_fixture_heads.results[0].stdout | trim
          }}/amneziawg-go
        - /usr/local/bin/amneziawg-go
        - >-
          /opt/src/amneziawg-tools-{{
            molecule_awg_fixture_heads.results[1].stdout | trim
          }}/src/wg
        - /usr/bin/awg
        - /opt/molecule-awg-fixture/amneziawg-tools/src/fixture-awg-quick
        - /usr/bin/awg-quick
      register: molecule_awg_binaries

    - name: Require installed binaries to match the role's real make outputs
      ansible.builtin.assert:
        that:
          - molecule_awg_binaries.results | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg') | list | length == 6
          - molecule_awg_binaries.results[0].stat.checksum == molecule_awg_binaries.results[1].stat.checksum
          - molecule_awg_binaries.results[2].stat.checksum == molecule_awg_binaries.results[3].stat.checksum
          - molecule_awg_binaries.results[4].stat.checksum == molecule_awg_binaries.results[5].stat.checksum
          - molecule_awg_binaries.results[1].stat.mode == '0755'
          - molecule_awg_binaries.results[3].stat.mode == '0755'
          - molecule_awg_binaries.results[5].stat.mode == '0755'

    - name: Require the role's instance service to remain active
      ansible.builtin.command:
        argv: [systemctl, is-active, awg-quick@awg0.service]
      changed_when: false

    - name: Require the role's instance service to be enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, awg-quick@awg0.service]
      changed_when: false

    - name: Read the no-TUN tool's lifecycle record
      ansible.builtin.slurp:
        src: /run/molecule-awg-quick.events
      register: molecule_awg_lifecycle

    - name: Require the actual unit to have executed the installed fixture tool
      ansible.builtin.assert:
        that:
          - (molecule_awg_lifecycle.content | b64decode).splitlines() | last == 'up awg0'

    - name: awg0.conf is present in config directory
      ansible.builtin.stat:
        path: /etc/amneziawg/awg0.conf
      register: awg_conf
      failed_when: not awg_conf.stat.exists

    - name: awg0.conf has restrictive permissions (0600)
      ansible.builtin.assert:
        that:
          - awg_conf.stat.mode == "0600"
        fail_msg: "awg0.conf mode is {{ awg_conf.stat.mode }}, expected 0600"

    - name: Read awg0.conf content
      ansible.builtin.slurp:
        src: /etc/amneziawg/awg0.conf
      register: awg_conf_raw

    - name: Decode awg0.conf
      ansible.builtin.set_fact:
        awg_conf_text: "{{ awg_conf_raw.content | b64decode }}"

    - name: Cohort Jc matches profile value (4)
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^Jc\s*=\s*4\s*$')
        fail_msg: |
          Jc not found or wrong value in awg0.conf.
          Content: {{ awg_conf_text }}

    - name: Cohort Jmin matches profile value (10)
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^Jmin\s*=\s*10\s*$')
        fail_msg: "Jmin not 10 in awg0.conf"

    - name: Cohort Jmax matches profile value (50)
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^Jmax\s*=\s*50\s*$')
        fail_msg: "Jmax not 50 in awg0.conf"

    - name: Cohort S1 matches profile value (0)
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^S1\s*=\s*0\s*$')
        fail_msg: "S1 not 0 in awg0.conf"

    - name: Cohort S2 matches profile value (0)
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^S2\s*=\s*0\s*$')
        fail_msg: "S2 not 0 in awg0.conf"

    - name: H1 through H4 are present in config
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^H1\s*=\s*\d+\s*$')
          - awg_conf_text is search('(?m)^H2\s*=\s*\d+\s*$')
          - awg_conf_text is search('(?m)^H3\s*=\s*\d+\s*$')
          - awg_conf_text is search('(?m)^H4\s*=\s*\d+\s*$')
        fail_msg: "One or more of H1..H4 missing in awg0.conf"

    - name: Interface section is present
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^\[Interface\]')
        fail_msg: "[Interface] section missing from awg0.conf"

    - name: ListenPort is present
      ansible.builtin.assert:
        that:
          - awg_conf_text is search('(?m)^ListenPort\s*=\s*\d+')
        fail_msg: "ListenPort missing from awg0.conf"

    - name: No live awg-quick or wg-quick processes running (TUN not needed)
      ansible.builtin.shell:
        cmd: |
          command -v pgrep >/dev/null &&
          ! pgrep -x awg-quick >/dev/null 2>&1 &&
          ! pgrep -x wg-quick >/dev/null 2>&1
        executable: /bin/bash
      changed_when: false

    - name: awg-quick target unit exists (PartOf= dependency resolves)
      ansible.builtin.stat:
        path: /etc/systemd/system/awg-quick.target
      register: awg_target_unit
      failed_when: not awg_target_unit.stat.exists

    - name: Read awg-quick.target content
      ansible.builtin.slurp:
        src: /etc/systemd/system/awg-quick.target
      register: awg_target_raw

    - name: Decode awg-quick.target
      ansible.builtin.set_fact:
        awg_target_text: "{{ awg_target_raw.content | b64decode }}"

    - name: Target wants exactly the enabled instances
      ansible.builtin.assert:
        that:
          - awg_target_text | regex_findall('(?m)^Wants=(.+)$') == ['awg-quick@awg0.service']
        fail_msg: |
          awg-quick.target does not pin the enabled instance set.
          Content: {{ awg_target_text }}
