---
- name: Select immutable acquired AmneziaWG executables
  ansible.builtin.set_fact:
    _awg_executables:
      - {path: /usr/local/bin/amneziawg-go, source: "/opt/amneziawg/releases/go-{{ amneziawg_go_commit }}/amneziawg-go"}
      - {path: /usr/bin/awg, source: "/opt/amneziawg/releases/tools-{{ amneziawg_tools_commit }}/awg"}
      - {path: /usr/bin/awg-quick, source: "/opt/amneziawg/releases/tools-{{ amneziawg_tools_commit }}/awg-quick"}
    _awg_consumer_candidates: []

- name: Inspect acquired AmneziaWG executable digests
  ansible.builtin.stat:
    path: "{{ item.source }}"
    checksum_algorithm: sha256
    follow: false
  loop: "{{ _awg_executables }}"
  no_log: true
  register: _awg_acquired

- name: Require admitted acquired AmneziaWG executables
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.uid == 0
      - item.stat.mode == '0755'
      - item.stat.nlink == 1
  loop: "{{ _awg_acquired.results }}"
  no_log: true
  when: not ansible_check_mode

- name: Select bounded acquired executable publication candidates
  ansible.builtin.set_fact:
    _awg_consumer_candidates: >-
      {{ _awg_consumer_candidates + [{'path': item.item.path, 'source': item.item.source,
                                      'sha256': item.stat.checksum, 'mode': 493, 'gid': 0}] }}
  loop: "{{ _awg_acquired.results }}"
  no_log: true
  when: item.stat.exists

- name: Stage every complete private AmneziaWG configuration
  ansible.builtin.set_fact:
    _awg_consumer_candidates: >-
      {{ _awg_consumer_candidates + [{'path': amneziawg_config_dir ~ '/' ~ item.name ~ '.conf',
                                      'data': lookup('ansible.builtin.template', 'awg0.conf.j2',
                                                     template_vars={'_inst': item}) | b64encode,
                                      'mode': 384, 'gid': 0}] }}
  loop: "{{ _awg_instances }}"
  no_log: true

- name: Stage exact obsolete AmneziaWG configuration retirement
  ansible.builtin.set_fact:
    _awg_consumer_candidates: >-
      {{ _awg_consumer_candidates + [{'path': _awg_previous.config_dir ~ '/' ~ item ~ '.conf', 'absent': true}] }}
  loop: "{{ _awg_obsolete | default([]) }}"
  no_log: true
  when: _awg_configuration_owns_lifecycle | default(false) | bool

- name: Stage shared units and the complete AWG membership receipt
  ansible.builtin.set_fact:
    _awg_consumer_candidates: >-
      {{ _awg_consumer_candidates + [
           {'path': '/etc/systemd/system/awg-quick@.service', 'mode': 420, 'gid': 0,
            'data': lookup('ansible.builtin.template', 'awg-quick@.service.j2') | b64encode},
           {'path': '/etc/systemd/system/awg-quick.target', 'mode': 420, 'gid': 0,
            'data': lookup('ansible.builtin.template', 'awg-quick.target.j2') | b64encode},
           {'path': '/var/lib/ripdpi/amneziawg/instances.json', 'mode': 384, 'gid': 0,
            'data': {'schema': 1, 'config_dir': amneziawg_config_dir,
                     'instances': _awg_instances | map(attribute='name') | list} | to_json | b64encode} ] }}
  no_log: true

- name: Predict fresh AmneziaWG acquisition and complete consumer publication
  ansible.builtin.debug:
    msg: Complete AWG runtime acquisition and consumer publication are planned.
  changed_when: true
  when: >-
    ansible_check_mode and ((_awg_acquired.results | selectattr('stat.exists', 'equalto', false) | list | length
    > 0) or _awg_consumer_install.changed)

- name: Accept complete AmneziaWG runtime and firewall together
  ansible.builtin.command:
    argv: [python3, -Es, /usr/local/libexec/ripdpi-consumer/amneziawg_consumer.py, apply]
    stdin: >-
      {{ {'check': ansible_check_mode, 'candidates': _awg_consumer_candidates,
          'firewall': _firewall_consumer_candidate | default(none)} | to_json }}
    stdin_add_newline: false
  register: _awg_consumer_publication
  changed_when: (_awg_consumer_publication.stdout | from_json).changed | bool
  check_mode: false
  no_log: true
  when: >-
    not (ansible_check_mode and ((_awg_acquired.results | selectattr('stat.exists', 'equalto', false) | list |
    length > 0) or _awg_consumer_install.changed))

- name: Release accepted AWG firewall preparation facts
  ansible.builtin.set_fact:
    _firewall_consumer_candidate: null
