---
- name: Inspect retained AmneziaWG consumer authority before disable
  ansible.builtin.stat:
    path: /var/lib/ripdpi/amneziawg/runtime/accepted.json
    follow: false
  register: _awg_consumer_before_disable

- name: Reconcile adopted complete AWG runtime retirement
  ansible.builtin.import_tasks: consumer-disable.yml
  when: _awg_consumer_before_disable.stat.exists or (_firewall_site_enabled | default(false) | bool)

- name: Retire exact legacy membership without inventing runtime adoption
  when: not _awg_consumer_before_disable.stat.exists and not (_firewall_site_enabled | default(false) | bool)
  block:
    - name: Resolve recorded AmneziaWG ownership before disable
      ansible.builtin.import_tasks: ownership.yml
    - name: Refuse shared target stop propagation into unrecorded active members
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', role_path ~ '/files/verify_target_ownership.py') }}"
        stdin: "{{ _awg_previous.instances | to_json }}"
      changed_when: false
      check_mode: false

    - name: Select all recorded AmneziaWG instances for retirement
      ansible.builtin.set_fact:
        _awg_obsolete: '{{ _awg_previous.instances }}'
        _awg_instances: []
      no_log: true
    - name: Retire recorded AmneziaWG interfaces before removing their unit
      ansible.builtin.import_tasks: retire-instances.yml
    - name: Retire AmneziaWG shared runtime authority
      ansible.builtin.include_role:
        name: runtime-release
        tasks_from: retire
      vars:
        runtime_retire_units: [awg-quick.target]
        runtime_retire_paths:
          - /etc/systemd/system/awg-quick@.service
          - /etc/systemd/system/awg-quick.target
          - /var/lib/ripdpi/amneziawg/instances.json
