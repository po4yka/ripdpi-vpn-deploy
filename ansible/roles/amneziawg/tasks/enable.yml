---
# P2 device-VPN transport: AmneziaWG userspace install on Debian 13 / Ubuntu 24.04.
#
# Userspace path is preferred for portability across kernels. The kernel module
# variant ships separately and is not assumed here.

- name: Admit the exact systemd-safe AWG configuration directory before mutation
  ansible.builtin.assert:
    that:
      - amneziawg_config_dir is string
      - amneziawg_config_dir is match('^/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+$')
      - "'.' not in amneziawg_config_dir.split('/')"
      - "'..' not in amneziawg_config_dir.split('/')"
    fail_msg: AWG configuration directory must be absolute, canonical and systemd-safe.

- name: Preflight amneziawg input semantics
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-input-preflight.yml"
  vars:
    transport_input_sections: [awg]

- name: Admit AmneziaWG uplink before runtime mutation
  ansible.builtin.import_tasks: "{{ role_path }}/../firewall/tasks/awg-uplink.yml"
  vars:
    awg_uplink_required: true

- name: Pre-flight - AmneziaWG source refs and commits are pinned
  ansible.builtin.assert:
    that:
      - amneziawg_go_version | length > 0
      - amneziawg_tools_version | length > 0
      - amneziawg_go_commit | length > 0
      - amneziawg_tools_commit | length > 0
      - (amneziawg_go_version | lower) not in ['main', 'master', 'head']
      - (amneziawg_tools_version | lower) not in ['main', 'master', 'head']
      - amneziawg_go_commit is match('^[0-9a-fA-F]{40,64}$')
      - amneziawg_tools_commit is match('^[0-9a-fA-F]{40,64}$')
    fail_msg: |
      Set amneziawg_go_version and amneziawg_tools_version to pinned upstream
      tags or commit SHAs, and set amneziawg_go_commit / amneziawg_tools_commit
      to the exact resolved commit SHAs expected after checkout. The role does
      not clone moving branches such as main, master, or HEAD, and it no longer
      accepts tag-only pinning for family deploys.

- name: Resolve the reviewed AmneziaWG source correction on the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -Es
      - "{{ role_path }}/files/awg_source_correction.py"
      - describe
      - --commit
      - "{{ amneziawg_go_commit }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: _awg_correction_description

- name: Select exact AmneziaWG source correction identity
  ansible.builtin.set_fact:
    _awg_source_correction: "{{ _awg_correction_description.stdout | from_json }}"

- name: Select correction-qualified AmneziaWG acquisition paths
  ansible.builtin.set_fact:
    _awg_go_source_dir: "/opt/src/amneziawg-go-{{ amneziawg_go_commit }}-{{ _awg_source_correction.digest }}"
    _awg_go_release_dir: "/opt/amneziawg/releases/go-{{ amneziawg_go_commit }}-{{ _awg_source_correction.digest }}"
    _awg_correction_dir: "/usr/local/libexec/ripdpi/awg-source-{{ _awg_source_correction.digest }}"

- name: Prepare and recover complete retained AmneziaWG runtime
  ansible.builtin.import_tasks: consumer-prepare.yml

- name: Resolve recorded AmneziaWG ownership
  ansible.builtin.import_tasks: ownership.yml

- name: Install build dependencies for AmneziaWG userspace
  ansible.builtin.apt:
    name:
      - golang
      - git
      - make
      - gcc
      - libc6-dev
      - libmnl-dev
      - resolvconf
      - iproute2
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clone amneziawg-go
  ansible.builtin.git:
    repo: https://github.com/amnezia-vpn/amneziawg-go
    dest: "{{ _awg_go_source_dir }}"
    version: "{{ amneziawg_go_version }}"
    update: false
  when: not ansible_check_mode

- name: Resolve the amneziawg-go checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ _awg_go_source_dir }}"
  register: _awg_go_head
  check_mode: false
  changed_when: false
  when: not ansible_check_mode

- name: Verify amneziawg-go resolved to the pinned commit
  ansible.builtin.assert:
    that:
      - _awg_go_head.stdout | trim == amneziawg_go_commit
    fail_msg: >-
      amneziawg-go is at {{ _awg_go_head.stdout | trim }} but
      amneziawg_go_commit pins {{ amneziawg_go_commit }}. Tag
      {{ amneziawg_go_version }} appears to have moved upstream — refusing
      to build unverified source.
  when: not ansible_check_mode

- name: Clone amneziawg-tools
  ansible.builtin.git:
    repo: https://github.com/amnezia-vpn/amneziawg-tools
    dest: "/opt/src/amneziawg-tools-{{ amneziawg_tools_commit }}"
    version: "{{ amneziawg_tools_version }}"
    update: false
  when: not ansible_check_mode

- name: Resolve the amneziawg-tools checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "/opt/src/amneziawg-tools-{{ amneziawg_tools_commit }}"
  register: _awg_tools_head
  check_mode: false
  changed_when: false
  when: not ansible_check_mode

- name: Verify amneziawg-tools resolved to the pinned commit
  ansible.builtin.assert:
    that:
      - _awg_tools_head.stdout | trim == amneziawg_tools_commit
    fail_msg: >-
      amneziawg-tools is at {{ _awg_tools_head.stdout | trim }} but
      amneziawg_tools_commit pins {{ amneziawg_tools_commit }}. Tag
      {{ amneziawg_tools_version }} appears to have moved upstream — refusing
      to build unverified source.
  when: not ansible_check_mode

- name: Define pinned AmneziaWG source-build descriptors
  ansible.builtin.set_fact:
    _amneziawg_build_descriptors:
      - schema_version: 1
        name: amneziawg-go
        source:
          repository: https://github.com/amnezia-vpn/amneziawg-go
          ref: "{{ amneziawg_go_version }}"
          commit: "{{ amneziawg_go_commit }}"
          patches: "{{ _awg_source_correction }}"
        steps:
          - argv:
              - /usr/bin/python3
              - -Es
              - "{{ _awg_correction_dir }}/awg_source_correction.py"
              - apply
              - --commit
              - "{{ amneziawg_go_commit }}"
              - --identity-digest
              - "{{ _awg_source_correction.digest }}"
              - --source
              - "{{ _awg_go_source_dir }}"
            chdir: "{{ _awg_go_source_dir }}"
            environment: {}
            timeout_seconds: 60
          - argv: [/usr/bin/make, -B]
            chdir: "{{ _awg_go_source_dir }}"
            environment: {}
            timeout_seconds: 1800
          - argv:
              - /usr/bin/python3
              - -Es
              - "{{ _awg_correction_dir }}/awg_source_correction.py"
              - verify
              - --commit
              - "{{ amneziawg_go_commit }}"
              - --identity-digest
              - "{{ _awg_source_correction.digest }}"
              - --source
              - "{{ _awg_go_source_dir }}"
            chdir: "{{ _awg_go_source_dir }}"
            environment: {}
            timeout_seconds: 60
          - argv:
              - /usr/bin/install
              - -m
              - "0755"
              - "{{ _awg_go_source_dir }}/amneziawg-go"
              - /var/lib/ripdpi/runtime-build-staging/amneziawg-go/amneziawg-go
            chdir: "{{ _awg_go_source_dir }}"
            environment: {}
            timeout_seconds: 60
        outputs:
          - name: installed
            staged_path: /var/lib/ripdpi/runtime-build-staging/amneziawg-go/amneziawg-go
            path: "{{ _awg_go_release_dir }}/amneziawg-go"
      - schema_version: 1
        name: amneziawg-tools
        source:
          repository: https://github.com/amnezia-vpn/amneziawg-tools
          ref: "{{ amneziawg_tools_version }}"
          commit: "{{ amneziawg_tools_commit }}"
        steps:
          - argv: [/usr/bin/make]
            chdir: "/opt/src/amneziawg-tools-{{ amneziawg_tools_commit }}/src"
            environment: {}
            timeout_seconds: 1800
          - argv:
              - /usr/bin/make
              - install
              - DESTDIR=/var/lib/ripdpi/runtime-build-staging/amneziawg-tools/root
              - WITH_WGQUICK=yes
            chdir: "/opt/src/amneziawg-tools-{{ amneziawg_tools_commit }}/src"
            environment: {}
            timeout_seconds: 300
        outputs:
          - name: awg
            staged_path: /var/lib/ripdpi/runtime-build-staging/amneziawg-tools/root/usr/bin/awg
            path: "/opt/amneziawg/releases/tools-{{ amneziawg_tools_commit }}/awg"
          - name: awg-quick
            staged_path: /var/lib/ripdpi/runtime-build-staging/amneziawg-tools/root/usr/bin/awg-quick
            path: "/opt/amneziawg/releases/tools-{{ amneziawg_tools_commit }}/awg-quick"

- name: Admit immutable AWG acquisition ancestry before directory convergence
  ansible.builtin.import_tasks: "{{ role_path }}/../runtime-release/tasks/consumer-authority.yml"
  vars:
    consumer_guard_directories:
      - "{{ _awg_correction_dir }}"
      - "{{ _awg_go_release_dir }}"
      - "/opt/amneziawg/releases/tools-{{ amneziawg_tools_commit }}"

- name: Prepare immutable AmneziaWG acquisition directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ _awg_correction_dir }}"
    - "{{ _awg_go_release_dir }}"
    - "/opt/amneziawg/releases/tools-{{ amneziawg_tools_commit }}"

- name: Install the exact AmneziaWG source correction assets
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _awg_correction_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - awg_source_correction.py
    - awg-source-correction.json
    - awg-udp-checksum-zero.patch.json

- name: Converge pinned AmneziaWG source builds
  ansible.builtin.include_role:
    name: runtime-release
    tasks_from: source-build
    defaults_from: source-build
  loop: "{{ _amneziawg_build_descriptors }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    runtime_build_descriptor: "{{ item }}"

- name: Admit private AWG configuration ancestry before directory convergence
  ansible.builtin.import_tasks: "{{ role_path }}/../runtime-release/tasks/consumer-authority.yml"
  vars:
    consumer_private_directories: "{{ [amneziawg_config_dir] }}"

- name: Ensure AmneziaWG config directory
  ansible.builtin.file:
    path: "{{ amneziawg_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Compute effective AmneziaWG instances
  ansible.builtin.import_tasks: instances.yml

- name: Validate current AmneziaWG instance names before reconciliation
  ansible.builtin.assert:
    that:
      - item.name is string
      - item.name is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,14}$')
  loop: "{{ _awg_instances }}"
  no_log: true


- name: Enforce AmneziaWG arm64 S3/S4 version floor
  ansible.builtin.import_tasks: guard-s34.yml

- name: Require unique bounded current AmneziaWG members
  ansible.builtin.assert:
    that:
      - _awg_instances | map(attribute='name') | unique | length == _awg_instances | length
      - _awg_instances | length <= 32
  no_log: true

- name: Select obsolete recorded AmneziaWG instances
  ansible.builtin.set_fact:
    _awg_obsolete: >-
      {{ _awg_previous.instances if _awg_previous.config_dir != amneziawg_config_dir
         else (_awg_previous.instances | difference(_awg_instances | map(attribute='name') | list)) }}
  no_log: true

# Forward guard: the role does not emit S3/S4 today, but a future cohort or
# instance author might add them. Non-zero S3/S4 trigger an H4 transport-header
# byte misalignment in awg-go on arm64 Android (amneziawg-go#110) that SILENTLY
# drops transport packets. The machine-readable version-floor policy has no
# verified safe floor, so fail closed instead of trusting an issue transition or
# release-note claim and shipping a tunnel that carries no data.

- name: Stage the desired AWG firewall after protected consumer commit
  ansible.builtin.include_role:
    name: firewall
  vars:
    firewall_stage_candidate: true
    firewall_site_transaction: false
  when: _firewall_site_enabled | default(false) | bool

- name: Activate complete AmneziaWG configurations transactionally
  ansible.builtin.import_tasks: configure.yml
  vars:
    _awg_configuration_owns_lifecycle: true
