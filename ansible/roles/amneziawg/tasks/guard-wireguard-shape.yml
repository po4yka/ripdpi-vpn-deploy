---
- name: "Guard: an AmneziaWG instance with a WireGuard message type as header needs a recorded measurement on production"
  vars:
    _awg_wireguard_shaped: >-
      {{ (_awg_instances | selectattr('h1', 'in', ['1', '2', '3', '4']) | list
          + _awg_instances | selectattr('h2', 'in', ['1', '2', '3', '4']) | list
          + _awg_instances | selectattr('h3', 'in', ['1', '2', '3', '4']) | list
          + _awg_instances | selectattr('h4', 'in', ['1', '2', '3', '4']) | list)
         | map(attribute='name') | unique | list }}
  ansible.builtin.assert:
    that:
      - >-
        (_awg_wireguard_shaped | length == 0)
        or ((env | default('')) != 'prod')
        or ((awg_wireguard_shaped_measurement | default('')) | trim | length > 0)
    quiet: true
    fail_msg: |
      AmneziaWG instance(s) {{ _awg_wireguard_shaped | join(', ') }} use a header value
      from 1 to 4. With H4 = 4 every data packet and keepalive is a plain WireGuard
      transport message, whatever S1 and S2 are; with H1 = 1 and S1 = 0 the handshake
      is the plain 148-byte Initiation that docs/reference/awg-cohorts.md calls
      deterministically identifiable. A production host may keep such a value only
      for a measured path: set awg_wireguard_shaped_measurement to the measurement
      record (path, date, outcome) in the same private extra-vars file as
      public_site_canonical_url, or give the instance random headers above 4.
