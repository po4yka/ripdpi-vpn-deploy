---
# One private instance authority serves convergence, observers and issuance.

- name: Admit the repository-owned AmneziaWG cohort slug
  ansible.builtin.assert:
    that:
      - vpn.awg_cohort | default('') == '' or vpn.awg_cohort is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
    quiet: true
  no_log: true

- name: Load AmneziaWG cohort profile
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/cohorts/{{ vpn.awg_cohort }}.yml"
  when:
    - vpn.awg_cohort | default('') | length > 0

- name: Resolve admitted effective AmneziaWG instances on the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/awg_device_binding.py"
      - normalize
    stdin: >-
      {{ {'secrets': {'amneziawg_secrets': amneziawg_secrets},
          'context': {'amneziawg': amneziawg, 'amneziawg_cohort': amneziawg_cohort}} | to_json }}
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: _awg_effective
  no_log: true

- name: Compute effective AmneziaWG instances
  ansible.builtin.set_fact:
    _awg_instances: "{{ _awg_effective.stdout | from_json }}"
  no_log: true
