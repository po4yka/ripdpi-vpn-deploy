---
# P2 device-VPN transport: AmneziaWG userspace install on Debian 13 / Ubuntu 24.04.
#
# Userspace path is preferred for portability across kernels. The kernel module
# variant ships separately and is not assumed here.

- name: Pre-flight - AmneziaWG source refs and commits are pinned
  ansible.builtin.assert:
    that:
      - amneziawg_go_version | length > 0
      - amneziawg_tools_version | length > 0
      - amneziawg_go_commit | length > 0
      - amneziawg_tools_commit | length > 0
      - (amneziawg_go_version | lower) not in ['main', 'master', 'head']
      - (amneziawg_tools_version | lower) not in ['main', 'master', 'head']
      - amneziawg_go_commit is match('^[0-9a-fA-F]{40,64}$')
      - amneziawg_tools_commit is match('^[0-9a-fA-F]{40,64}$')
    fail_msg: |
      Set amneziawg_go_version and amneziawg_tools_version to pinned upstream
      tags or commit SHAs, and set amneziawg_go_commit / amneziawg_tools_commit
      to the exact resolved commit SHAs expected after checkout. The role does
      not clone moving branches such as main, master, or HEAD, and it no longer
      accepts tag-only pinning for family deploys.

- name: Install build dependencies for AmneziaWG userspace
  ansible.builtin.apt:
    name:
      - golang
      - git
      - make
      - libmnl-dev
      - resolvconf
      - iproute2
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clone amneziawg-go
  ansible.builtin.git:
    repo: https://github.com/amnezia-vpn/amneziawg-go
    dest: /opt/src/amneziawg-go
    version: "{{ amneziawg_go_version }}"
    update: false

- name: Resolve the amneziawg-go checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: /opt/src/amneziawg-go
  register: _awg_go_head
  changed_when: false

- name: Verify amneziawg-go resolved to the pinned commit
  ansible.builtin.assert:
    that:
      - _awg_go_head.stdout | trim == amneziawg_go_commit
    fail_msg: >-
      amneziawg-go is at {{ _awg_go_head.stdout | trim }} but
      amneziawg_go_commit pins {{ amneziawg_go_commit }}. Tag
      {{ amneziawg_go_version }} appears to have moved upstream — refusing
      to build unverified source.

- name: Build amneziawg-go
  ansible.builtin.command:
    cmd: make
    chdir: /opt/src/amneziawg-go
    creates: /opt/src/amneziawg-go/amneziawg-go

- name: Install amneziawg-go binary
  ansible.builtin.copy:
    src: /opt/src/amneziawg-go/amneziawg-go
    dest: /usr/local/bin/amneziawg-go
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Clone amneziawg-tools
  ansible.builtin.git:
    repo: https://github.com/amnezia-vpn/amneziawg-tools
    dest: /opt/src/amneziawg-tools
    version: "{{ amneziawg_tools_version }}"
    update: false

- name: Resolve the amneziawg-tools checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: /opt/src/amneziawg-tools
  register: _awg_tools_head
  changed_when: false

- name: Verify amneziawg-tools resolved to the pinned commit
  ansible.builtin.assert:
    that:
      - _awg_tools_head.stdout | trim == amneziawg_tools_commit
    fail_msg: >-
      amneziawg-tools is at {{ _awg_tools_head.stdout | trim }} but
      amneziawg_tools_commit pins {{ amneziawg_tools_commit }}. Tag
      {{ amneziawg_tools_version }} appears to have moved upstream — refusing
      to build unverified source.

- name: Build amneziawg-tools
  ansible.builtin.command:
    cmd: make
    chdir: /opt/src/amneziawg-tools/src
    creates: /opt/src/amneziawg-tools/src/awg

- name: Install amneziawg-tools
  ansible.builtin.command:
    cmd: make install
    chdir: /opt/src/amneziawg-tools/src
  args:
    creates: /usr/bin/awg

- name: Ensure AmneziaWG config directory
  ansible.builtin.file:
    path: "{{ amneziawg_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Load AmneziaWG cohort profile
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/cohorts/{{ vpn.awg_cohort }}.yml"
  when:
    - vpn.awg_cohort | default('') | length > 0
    - amneziawg_secrets.instances | default([]) | length == 0

# Forward guard: the role does not emit S3/S4 today, but a future cohort or
# instance author might add them. Non-zero S3/S4 trigger an H4 transport-header
# byte misalignment in awg-go on arm64 Android (amneziawg-go#110, unfixed as of
# 2026-05-28) that SILENTLY drops transport packets. Fail closed instead of
# shipping a tunnel that comes up but carries no data on family arm64 peers.
- name: "Guard: AmneziaWG S3/S4 must stay zero (amneziawg-go#110 — arm64 Android silent packet drop)"
  vars:
    _awg_instances_raw: "{{ amneziawg_secrets.instances | default([]) }}"
    _awg_s34: >-
      {{ ([ (amneziawg_cohort | default({})).s3 | default(0),
            (amneziawg_cohort | default({})).s4 | default(0),
            (amneziawg_secrets | default({})).s3 | default(0),
            (amneziawg_secrets | default({})).s4 | default(0) ]
          + (_awg_instances_raw | selectattr('s3', 'defined') | map(attribute='s3') | list)
          + (_awg_instances_raw | selectattr('s4', 'defined') | map(attribute='s4') | list)
         ) | map('int') | list }}
  ansible.builtin.assert:
    that:
      - _awg_s34 | max == 0
    quiet: true
    fail_msg: |
      AmneziaWG S3/S4 must be 0 — a cohort or instance set a non-zero value
      (S3/S4 values seen: {{ _awg_s34 }}).

      Per amneziawg-go#110 (no fix as of 2026-05-28), non-zero S3/S4 cause an
      H4 transport-header byte misalignment in awg-go on arm64 Android: the
      tunnel handshake succeeds but transport packets are SILENTLY dropped —
      a family arm64-Android peer gets a connected interface with zero data
      flow and no error. Keep S3=S4=0 (the role emits neither today).

      Tradeoff: S3=S4=0 disables H4 transport-junk, so obfuscation degrades to
      S1/S2 handshake-junk only. If transport-packet obfuscation is required on
      arm64, use VLESS+REALITY instead. See docs/AWG-COHORTS.md.
    success_msg: "AmneziaWG S3/S4 are zero — safe for arm64 Android (amneziawg-go#110)."

- name: Compute effective AmneziaWG instances
  ansible.builtin.set_fact:
    _awg_instances: >-
      {{ (amneziawg_secrets.instances | default([])) if
         (amneziawg_secrets.instances | default([])) | length > 0
         else [{
           'name': amneziawg.interface,
           'listen_port': amneziawg.listen_port,
           'address_v4': amneziawg.address_v4,
           'address_v6': amneziawg.address_v6,
           'server_private_key': amneziawg_secrets.server_private_key,
           'jc': amneziawg_secrets.jc | default(amneziawg_cohort.jc | default(4)),
           'jmin': amneziawg_secrets.jmin | default(amneziawg_cohort.jmin | default(40)),
           'jmax': amneziawg_secrets.jmax | default(amneziawg_cohort.jmax | default(70)),
           's1': amneziawg_secrets.s1 | default(amneziawg_cohort.s1 | default(50)),
           's2': amneziawg_secrets.s2 | default(amneziawg_cohort.s2 | default(100)),
           'h1': amneziawg_secrets.h1 | default(amneziawg_cohort.h1),
           'h2': amneziawg_secrets.h2 | default(amneziawg_cohort.h2),
           'h3': amneziawg_secrets.h3 | default(amneziawg_cohort.h3),
           'h4': amneziawg_secrets.h4 | default(amneziawg_cohort.h4),
           'peers': amneziawg_secrets.peers,
         }] }}

- name: Install awg-quick systemd unit (shared across instances)
  ansible.builtin.template:
    src: awg-quick@.service.j2
    dest: /etc/systemd/system/awg-quick@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Render AmneziaWG interface configs
  ansible.builtin.template:
    src: awg0.conf.j2
    dest: "{{ amneziawg_config_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  loop: "{{ _awg_instances }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _inst: "{{ item }}"
  notify: Reload amneziawg

- name: Enable and start awg-quick@<iface> for every instance
  ansible.builtin.systemd_service:
    name: "awg-quick@{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ _awg_instances }}"
  loop_control:
    label: "{{ item.name }}"
