---
# P2 device-VPN transport: AmneziaWG userspace install on Debian 13 / Ubuntu 24.04.
#
# Userspace path is preferred for portability across kernels. The kernel module
# variant ships separately and is not assumed here.

- name: Pre-flight - AmneziaWG source refs and commits are pinned
  ansible.builtin.assert:
    that:
      - amneziawg_go_version | length > 0
      - amneziawg_tools_version | length > 0
      - amneziawg_go_commit | length > 0
      - amneziawg_tools_commit | length > 0
      - (amneziawg_go_version | lower) not in ['main', 'master', 'head']
      - (amneziawg_tools_version | lower) not in ['main', 'master', 'head']
      - amneziawg_go_commit is match('^[0-9a-fA-F]{40,64}$')
      - amneziawg_tools_commit is match('^[0-9a-fA-F]{40,64}$')
    fail_msg: |
      Set amneziawg_go_version and amneziawg_tools_version to pinned upstream
      tags or commit SHAs, and set amneziawg_go_commit / amneziawg_tools_commit
      to the exact resolved commit SHAs expected after checkout. The role does
      not clone moving branches such as main, master, or HEAD, and it no longer
      accepts tag-only pinning for family deploys.

- name: Install build dependencies for AmneziaWG userspace
  ansible.builtin.apt:
    name:
      - golang
      - git
      - make
      - libmnl-dev
      - resolvconf
      - iproute2
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clone amneziawg-go
  ansible.builtin.git:
    repo: https://github.com/amnezia-vpn/amneziawg-go
    dest: /opt/src/amneziawg-go
    version: "{{ amneziawg_go_version }}"
    update: false

- name: Resolve the amneziawg-go checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: /opt/src/amneziawg-go
  register: _awg_go_head
  changed_when: false

- name: Verify amneziawg-go resolved to the pinned commit
  ansible.builtin.assert:
    that:
      - _awg_go_head.stdout | trim == amneziawg_go_commit
    fail_msg: >-
      amneziawg-go is at {{ _awg_go_head.stdout | trim }} but
      amneziawg_go_commit pins {{ amneziawg_go_commit }}. Tag
      {{ amneziawg_go_version }} appears to have moved upstream — refusing
      to build unverified source.

- name: Build amneziawg-go
  ansible.builtin.command:
    cmd: make
    chdir: /opt/src/amneziawg-go
    creates: /opt/src/amneziawg-go/amneziawg-go

- name: Install amneziawg-go binary
  ansible.builtin.copy:
    src: /opt/src/amneziawg-go/amneziawg-go
    dest: /usr/local/bin/amneziawg-go
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Clone amneziawg-tools
  ansible.builtin.git:
    repo: https://github.com/amnezia-vpn/amneziawg-tools
    dest: /opt/src/amneziawg-tools
    version: "{{ amneziawg_tools_version }}"
    update: false

- name: Resolve the amneziawg-tools checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: /opt/src/amneziawg-tools
  register: _awg_tools_head
  changed_when: false

- name: Verify amneziawg-tools resolved to the pinned commit
  ansible.builtin.assert:
    that:
      - _awg_tools_head.stdout | trim == amneziawg_tools_commit
    fail_msg: >-
      amneziawg-tools is at {{ _awg_tools_head.stdout | trim }} but
      amneziawg_tools_commit pins {{ amneziawg_tools_commit }}. Tag
      {{ amneziawg_tools_version }} appears to have moved upstream — refusing
      to build unverified source.

- name: Build amneziawg-tools
  ansible.builtin.command:
    cmd: make
    chdir: /opt/src/amneziawg-tools/src
    creates: /opt/src/amneziawg-tools/src/awg

- name: Install amneziawg-tools
  ansible.builtin.command:
    cmd: make install
    chdir: /opt/src/amneziawg-tools/src
  args:
    creates: /usr/bin/awg

- name: Ensure AmneziaWG config directory
  ansible.builtin.file:
    path: "{{ amneziawg_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Compute effective AmneziaWG instances
  ansible.builtin.import_tasks: instances.yml

# Forward guard: the role does not emit S3/S4 today, but a future cohort or
# instance author might add them. Non-zero S3/S4 trigger an H4 transport-header
# byte misalignment in awg-go on arm64 Android (amneziawg-go#110) that SILENTLY
# drops transport packets. The machine-readable version-floor policy has no
# verified safe floor, so fail closed instead of trusting an issue transition or
# release-note claim and shipping a tunnel that carries no data.
- name: Enforce AmneziaWG arm64 S3/S4 version floor
  ansible.builtin.import_tasks: guard-s34.yml

- name: Install awg-quick systemd unit (shared across instances)
  ansible.builtin.template:
    src: awg-quick@.service.j2
    dest: /etc/systemd/system/awg-quick@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Render AmneziaWG interface configs
  ansible.builtin.template:
    src: awg0.conf.j2
    dest: "{{ amneziawg_config_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  loop: "{{ _awg_instances }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _inst: "{{ item }}"
  notify: Reload amneziawg

- name: Enable and start awg-quick@<iface> for every instance
  ansible.builtin.systemd_service:
    name: "awg-quick@{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ _awg_instances }}"
  loop_control:
    label: "{{ item.name }}"
