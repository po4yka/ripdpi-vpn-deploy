---
- name: Converge backup role
  hosts: all
  become: true
  vars:
    vpn:
      enable_xray_reality: true
      enable_nginx_xhttp: false
      enable_hysteria: false
      enable_amneziawg: false
  pre_tasks:
    - name: Ensure backup input directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/restic
        - /etc/xray
        - /etc/hysteria
        - /etc/amnezia
        - /etc/nginx
        - /etc/ssh/sshd_config.d
        - /etc/sysctl.d

    - name: Seed representative backup artifacts
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - path: /etc/xray/config.json
          content: "{}\n"
        - path: /etc/hysteria/.backup-placeholder
          content: "hysteria placeholder\n"
        - path: /etc/amnezia/.backup-placeholder
          content: "amnezia placeholder\n"
        - path: /etc/nginx/.backup-placeholder
          content: "nginx placeholder\n"
        - path: /etc/nftables.conf
          content: "table inet filter {}\n"
        - path: /etc/ssh/sshd_config.d/20-ansible-hardening.conf
          content: "PasswordAuthentication no\n"
        - path: /etc/sysctl.d/90-vpn.conf
          content: "net.ipv4.ip_forward = 1\n"
        - path: /etc/systemd/system/vpn-drill-sentinel.service
          content: "[Service]\nType=oneshot\nExecStart=/bin/true\n"
        - path: /etc/vpn-watchdog.env
          content: "DRILL_SENTINEL=unchanged\n"
  roles:
    - role: backup
