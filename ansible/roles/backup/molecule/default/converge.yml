---
- name: Converge backup role
  hosts: all
  become: true
  vars:
    vpn:
      enable_xray_reality: true
      enable_nginx_xhttp: false
      enable_hysteria: false
      enable_amneziawg: false
      enable_watchdog: false
  pre_tasks:
    - name: Read rclone package state before fresh check mode
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Status}\t${Version}', rclone]
        expand_argument_vars: false
      register: backup_check_before
      changed_when: false
      failed_when: backup_check_before.rc not in [0, 1]
      check_mode: false
      when:
        - ansible_check_mode
        - backup.remote.enabled

    - name: Exercise the real package installer in fresh check mode
      ansible.builtin.include_role:
        name: backup
        tasks_from: install-rclone
      when: ansible_check_mode

    - name: Read rclone package state after fresh check mode
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Status}\t${Version}', rclone]
        expand_argument_vars: false
      register: backup_check_after
      changed_when: false
      failed_when: backup_check_after.rc not in [0, 1]
      check_mode: false
      when:
        - ansible_check_mode
        - backup.remote.enabled

    - name: Require check mode to preserve package absence or identity
      ansible.builtin.assert:
        that:
          - backup_check_before.rc == backup_check_after.rc
          - backup_check_before.stdout == backup_check_after.stdout
      when:
        - ansible_check_mode
        - backup.remote.enabled

    - name: Ensure backup input directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/restic
        - /etc/xray
        - /etc/ssh/sshd_config.d
        - /etc/sysctl.d

    - name: Seed representative backup artifacts
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - path: /etc/xray/config.json
          content: "{}\n"
        - path: /etc/nftables.conf
          content: "table inet filter {}\n"
        - path: /etc/ssh/sshd_config.d/20-ansible-hardening.conf
          content: "PasswordAuthentication no\n"
        - path: /etc/sysctl.d/90-vpn.conf
          content: "net.ipv4.ip_forward = 1\n"
        - path: /etc/systemd/system/vpn-drill-sentinel.service
          content: "[Service]\nType=oneshot\nExecStart=/bin/true\n"
  roles:
    - role: backup
