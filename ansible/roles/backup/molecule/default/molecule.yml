---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-backup-local-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:cc316a12f7673b5606decb1154e4437ecf25f842c281cf9474889fb7539525fc
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
  - name: vpn-backup-remote-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:cc316a12f7673b5606decb1154e4437ecf25f842c281cf9474889fb7539525fc
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    host_vars:
      vpn-backup-local-debian13:
        ansible_user: root
        restic_repo_dir: /var/backups/vpn-restic
        backup_restore_drill_enabled: true
        backup:
          restic_password: molecule-stub-password
          remote:
            enabled: false
      vpn-backup-remote-debian13:
        ansible_user: root
        restic_repo_dir: /var/backups/vpn-restic
        backup_restore_drill_enabled: false
        backup:
          restic_password: molecule-stub-password
          remote:
            enabled: true
            rclone_remote: offsite
            rclone_path: /var/backups/vpn-restic-offsite
            transfers: 1
            bwlimit: "off"
            rclone_config: |
              [offsite]
              type = local

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
