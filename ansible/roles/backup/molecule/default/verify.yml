---
- name: Verify backup role
  hosts: all
  become: true
  tasks:
    - name: Restic installed
      ansible.builtin.command:
        cmd: restic version
      changed_when: false

    - name: Restic repo initialized
      ansible.builtin.stat:
        path: /var/backups/vpn-restic/config
      register: restic_repo
      failed_when: not restic_repo.stat.exists

    - name: Backup scripts pass shell syntax checks
      ansible.builtin.command:
        cmd: "bash -n {{ item }}"
      loop:
        - /usr/local/sbin/vpn-backup.sh
        - /usr/local/sbin/vpn-backup-restore-drill.sh
      changed_when: false

    - name: Backup script remote block matches host configuration
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if {{ backup.remote.enabled | bool | ternary('true', 'false') }}; then
            grep -q 'rclone sync' /usr/local/sbin/vpn-backup.sh
          else
            ! grep -q 'rclone sync' /usr/local/sbin/vpn-backup.sh
          fi
        executable: /bin/bash
      changed_when: false

    - name: Daily backup timer enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled vpn-backup.timer
      register: backup_timer
      changed_when: false
      failed_when: backup_timer.stdout != "enabled"

    - name: Restore drill timer state matches configuration
      ansible.builtin.command:
        cmd: systemctl is-enabled vpn-backup-restore-drill.timer
      register: drill_timer
      changed_when: false
      failed_when: >-
        (backup_restore_drill_enabled | bool and drill_timer.stdout != 'enabled') or
        (not (backup_restore_drill_enabled | bool) and drill_timer.stdout != 'disabled')

    - name: Hash live sentinel before backup and restore drill
      ansible.builtin.command:
        cmd: sha256sum /etc/vpn-watchdog.env
      register: live_hash_before
      changed_when: false

    - name: Take and verify a real backup
      ansible.builtin.command:
        cmd: systemctl start vpn-backup.service
      changed_when: false

    - name: Run a real isolated restore drill
      ansible.builtin.command:
        cmd: systemctl start vpn-backup-restore-drill.service
      changed_when: false

    - name: Read restore drill success marker
      ansible.builtin.slurp:
        src: /var/lib/vpn-backup/restore-drill-last-success.json
      register: marker_before_failure

    - name: Parse restore drill success marker
      ansible.builtin.set_fact:
        marker_payload: "{{ marker_before_failure.content | b64decode | from_json }}"

    - name: Restore drill marker describes the selected repository
      ansible.builtin.assert:
        that:
          - marker_payload.version == 1
          - marker_payload.repository_source == ('remote' if backup.remote.enabled else 'local')
          - marker_payload.snapshot_id | length == 64
          - marker_payload.snapshot_time | length > 0
          - marker_payload.verified_at | length > 0

    - name: Hash live sentinel after restore drill
      ansible.builtin.command:
        cmd: sha256sum /etc/vpn-watchdog.env
      register: live_hash_after
      changed_when: false
      failed_when: live_hash_after.stdout != live_hash_before.stdout

    - name: Check restore runtime directory was removed
      ansible.builtin.stat:
        path: /run/vpn-backup-restore-drill
      register: drill_runtime
      failed_when: drill_runtime.stat.exists

    - name: Break remote repository and require the drill to fail closed
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          remote_config="/var/backups/vpn-restic-offsite/$(hostname)/config"
          mv "$remote_config" "${remote_config}.disabled"
          trap 'mv "${remote_config}.disabled" "$remote_config"' EXIT
          if systemctl start vpn-backup-restore-drill.service; then
            echo "restore drill unexpectedly succeeded with broken remote" >&2
            exit 1
          fi
        executable: /bin/bash
      when: backup.remote.enabled | bool
      changed_when: false

    - name: Read marker after failed remote drill
      ansible.builtin.slurp:
        src: /var/lib/vpn-backup/restore-drill-last-success.json
      register: marker_after_failure
      when: backup.remote.enabled | bool

    - name: Failed remote drill preserved previous success marker
      ansible.builtin.assert:
        that:
          - marker_after_failure.content == marker_before_failure.content
      when: backup.remote.enabled | bool

    - name: Backup service unit exists
      ansible.builtin.stat:
        path: /etc/systemd/system/vpn-backup.service
      register: backup_unit

    - name: Backup unit carries the root-oneshot hardening floor
      ansible.builtin.slurp:
        src: /etc/systemd/system/vpn-backup.service
      register: backup_unit_raw

    - name: Decode backup unit content
      ansible.builtin.set_fact:
        backup_unit_text: "{{ backup_unit_raw.content | b64decode }}"

    - name: Assert hardening floor directives present
      ansible.builtin.assert:
        that:
          - "'NoNewPrivileges=true' in backup_unit_text"
          - "'ProtectSystem=strict' in backup_unit_text"
          - "'PrivateTmp=true' in backup_unit_text"
          - "'ReadWritePaths=' in backup_unit_text"
          - "'RESTIC_CACHE_DIR=/var/lib/vpn-backup/cache' in backup_unit_text"
        fail_msg: "vpn-backup.service lost its sandbox floor or cache pin"

    - name: systemd-analyze verify accepts vpn-backup.service
      ansible.builtin.command:
        cmd: systemd-analyze verify /etc/systemd/system/vpn-backup.service
      changed_when: false

    - name: Exercise configuration-only positive path with real stopped systemd units
      when: backup.remote.enabled | bool
      vars:
        vpn:
          enable_xray_reality: true
          enable_nginx_xhttp: false
          enable_hysteria: false
          enable_amneziawg: false
      block:
        - name: Stop backup automatic triggers for the exclusive test window
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - vpn-backup.timer
            - vpn-backup-restore-drill.timer
            - vpn-backup.service
            - vpn-backup-restore-drill.service

        - name: Persistently disable fixture timers before configuration
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
          loop:
            - vpn-backup.timer
            - vpn-backup-restore-drill.timer

        - name: Clear the intentionally failed prior restore fixture
          ansible.builtin.command:
            argv: [systemctl, reset-failed, vpn-backup-restore-drill.service]
          changed_when: false

        - name: Record service execution timestamps before configuration
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - --property=Id,ExecMainStartTimestampMonotonic,ActiveState,SubState
              - vpn-backup.service
              - vpn-backup-restore-drill.service
              - vpn-backup.timer
              - vpn-backup-restore-drill.timer
          register: backup_configuration_before
          changed_when: false

        - name: Remove rclone to exercise the real dependency installation
          ansible.builtin.apt:
            name: rclone
            state: absent

        - name: Configure remote backup without the role lifecycle
          ansible.builtin.include_role:
            name: backup
            tasks_from: configure-only

        - name: Verify rclone was installed by the configuration intent
          ansible.builtin.command:
            argv: [rclone, version]
          changed_when: false

        - name: Configure the same files again to prove idempotent publication
          ansible.builtin.include_role:
            name: backup
            tasks_from: configure-only

        - name: Require the second publication to be unchanged
          ansible.builtin.assert:
            that: not ((_backup_publication.stdout | from_json).changed | bool)

        - name: Record service execution timestamps after configuration
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - --property=Id,ExecMainStartTimestampMonotonic,ActiveState,SubState
              - vpn-backup.service
              - vpn-backup-restore-drill.service
              - vpn-backup.timer
              - vpn-backup-restore-drill.timer
          register: backup_configuration_after
          changed_when: false

        - name: Configuration never ran a backup or restore and left timers stopped
          ansible.builtin.assert:
            that: backup_configuration_before.stdout == backup_configuration_after.stdout

        - name: Verify owned staging secrets were removed
          ansible.builtin.stat:
            path: /run/vpn-backup-configure.lock
          register: backup_configuration_lock
          failed_when: backup_configuration_lock.stat.exists
