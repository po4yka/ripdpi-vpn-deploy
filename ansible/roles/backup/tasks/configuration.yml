---
# The configuration-only intent supplies a fixed private staging prefix.
# No unit, notification, repository initialization or execution belongs here.
- name: Ensure rclone configuration directory
  ansible.builtin.file:
    path: "{{ _backup_configuration_prefix | default('') }}/etc/rclone"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: backup.remote.enabled | default(false)
  register: _backup_configuration_directory
  changed_when: >-
    _backup_configuration_directory.changed and
    (_backup_configuration_prefix | default('') == '')

- name: Read the hostname that names this node's offsite replica directory
  ansible.builtin.command: hostname
  register: _backup_replica_host
  changed_when: false
  check_mode: false
  when: backup.remote.enabled | default(false)

# A credential that can delete would let a compromised node erase its offsite copy.
- name: Refuse an offsite credential beyond the append-only node grant
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/backup-storage-grant.py"
      - --remote
      - "{{ backup.remote.rclone_remote }}"
      - --path
      - "{{ backup.remote.rclone_path }}"
      - --host
      - "{{ _backup_replica_host.stdout }}"
    stdin: "{{ backup.remote.rclone_config }}"
  delegate_to: localhost
  become: false
  register: _backup_storage_grant
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: backup.remote.enabled | default(false)

- name: Require the append-only node grant before credential delivery
  ansible.builtin.assert:
    that: _backup_storage_grant.rc == 0
    fail_msg: "{{ _backup_storage_grant.stderr_lines | default(['backup-storage-grant-refused: helper-failed']) | last }}"
    quiet: true
  when: backup.remote.enabled | default(false)

- name: Drop rclone config (full content from secrets)
  ansible.builtin.copy:
    content: "{{ backup.remote.rclone_config }}"
    dest: "{{ _backup_configuration_prefix | default('') }}/etc/rclone/rclone.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: backup.remote.enabled | default(false)
  register: _backup_configuration_remote
  changed_when: >-
    _backup_configuration_remote.changed and
    (_backup_configuration_prefix | default('') == '')

- name: Render backup scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ _backup_configuration_prefix | default('') }}/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
    validate: /bin/bash -n %s
  loop:
    - vpn-backup.sh
    - vpn-backup-restore-drill.sh
  no_log: true
  diff: false
  register: _backup_configuration_scripts
  changed_when: >-
    _backup_configuration_scripts.changed and
    (_backup_configuration_prefix | default('') == '')
