---
# Additional accounts are admitted only through the recoverable SSH controller.
baseline_ssh_extra_allowed_users: []

# Stock cloud-image accounts that cloud-init created before the template dropped
# `default`; they keep passwordless sudo beside the managed admin user.
baseline_stock_accounts:
  - ubuntu
  - debian
  - linuxuser

# Per-socket UDP ceilings; bounded independently from TCP congestion control.
baseline_udp_receive_buffer_max: 7500000
baseline_udp_send_buffer_max: 7500000
