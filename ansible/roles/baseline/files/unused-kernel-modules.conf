# These subsystems are outside the supported VPN node contract.
blacklist ksmbd
install ksmbd /bin/false
# Nonempty ksmbd soft dependencies bypass install rules in kmod 31.
alias ksmbd vpn_denied_ksmbd
install vpn_denied_ksmbd /bin/false
blacklist nfsd
install nfsd /bin/false
blacklist tipc
install tipc /bin/false
blacklist rdma_rxe
install rdma_rxe /bin/false
blacklist siw
install siw /bin/false
blacklist ib_srpt
install ib_srpt /bin/false
blacklist rpcrdma
install rpcrdma /bin/false
blacklist ceph
install ceph /bin/false
blacklist libceph
install libceph /bin/false
blacklist nvmet
install nvmet /bin/false
blacklist fou
install fou /bin/false
blacklist fou6
install fou6 /bin/false
