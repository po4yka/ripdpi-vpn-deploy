---
- name: Converge baseline role
  hosts: all
  # Connect as the user molecule.yml put in host_vars (root). Don't pin
  # ansible_user here — overriding it forces the very first connect to use
  # a user that doesn't exist yet, so pre_tasks (which create that user)
  # can never run.
  become: true
  vars:
    vpn:
      enable_xray_reality: true
      enable_nginx_xhttp: true
      enable_hysteria: false
      enable_amneziawg: false
    security_controls:
      ssh_prune_moduli: true
  pre_tasks:
    - name: Create deploy user (mirrors what cloud-init does in prod)
      ansible.builtin.user:
        name: deploy
        groups: sudo
        shell: /bin/bash
        create_home: true
        state: present
  tasks:
    - name: Exercise the actual baseline role with bounded fixture failure evidence
      block:
        - name: Converge the production baseline role
          ansible.builtin.include_role:
            name: baseline
      rescue:
        - name: Diagnose rejected mandatory sysctl keys without setting values
          ansible.builtin.command:
            argv: [python3, '-']
            stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/diagnose-sysctl.py') }}"
          register: _baseline_fixture_diagnostics
          changed_when: false
          failed_when: false

        - name: Show sanitized baseline fixture failure evidence
          ansible.builtin.debug:
            msg: "{{ _baseline_fixture_diagnostics.stdout | default('fixture diagnostic unavailable') }}"

        - name: Preserve the original baseline convergence failure
          ansible.builtin.fail:
            msg: Baseline convergence failed; fixture diagnostics do not accept or suppress mandatory failures.
