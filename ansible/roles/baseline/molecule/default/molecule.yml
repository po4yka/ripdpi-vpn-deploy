---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-baseline-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:f3ca174e84d53f68cd87abdcc1f585d295e7f76b855546e17c2c6ec9aeffec4f
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

  - name: vpn-baseline-ubuntu2404
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-ubuntu2404@sha256:4f260aba1e82b795e58e515edf52c1f97fb3aceb3a90bcc251c3b7449aebd06a
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    # Throwaway fixture public keys. The scenario writes both, then revokes the
    # second one (the CI key) and expects the operator key to remain.
    group_vars:
      all:
        fixture_operator_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIACuqbmHay9Ja1UTyK6Xs0ld57/VDX6uINKx2394i/LI operator@fixture
        fixture_ci_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG+8VoYO+6vtXu/2l7zZRRVQIn+9VtZyMU3jpV5zwvzQ ci@fixture
        admin_ssh_public_keys:
          - "{{ fixture_operator_key }}"
          - "{{ fixture_ci_key }}"
    host_vars:
      vpn-baseline-debian13:
        ansible_user: root
      vpn-baseline-ubuntu2404:
        ansible_user: root
  config_options:
    defaults:
      callback_result_format: yaml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
