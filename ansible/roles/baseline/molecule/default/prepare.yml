---
# Runs once before converge, so the idempotence pass does not recreate the fixture.
- name: Prepare a node that still has its stock image account
  hosts: all
  become: true
  tasks:
    - name: Create a stock image account with a cloud-init sudo grant
      ansible.builtin.user:
        name: ubuntu
        groups: sudo
        create_home: true
    - name: Grant the stock and admin accounts sudo as cloud-init does
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-cloud-init-users
        content: |
          deploy ALL=(ALL) NOPASSWD:ALL
          ubuntu ALL=(ALL) NOPASSWD:ALL
        mode: "0440"
