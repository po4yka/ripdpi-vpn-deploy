---
- name: Verify baseline role
  hosts: all
  become: true
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: nftables installed
      ansible.builtin.command:
        cmd: nft --version
      changed_when: false

    - name: Host-firmware tooling is absent from the VPS baseline
      ansible.builtin.command:
        cmd: dpkg-query -W fwupd
      register: fwupd_package
      changed_when: false
      failed_when: fwupd_package.rc == 0

    - name: systemd-resolved drop-in present when service exists
      ansible.builtin.stat:
        path: /etc/systemd/resolved.conf.d/no-stub.conf
      register: resolved_dropin
      failed_when: not resolved_dropin.stat.exists or not resolved_dropin.stat.isreg
      when: "'systemd-resolved.service' in ansible_facts.services"

    - name: SSH hardening drop-in present
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/20-ansible-hardening.conf
      register: hardening
      failed_when: not hardening.stat.exists

    - name: sysctl tuning installed
      ansible.builtin.stat:
        path: /etc/sysctl.d/90-vpn.conf
      register: sysctl
      failed_when: not sysctl.stat.exists

    - name: timesync enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled systemd-timesyncd
      register: ts
      changed_when: false
      failed_when: ts.stdout != "enabled"

    # State-level: prove sshd is alive and the hardening drop-in took
    # effect (PasswordAuthentication=no must appear in the effective
    # config rendered by sshd -T).
    - name: sshd.service is active
      ansible.builtin.command:
        cmd: systemctl is-active ssh.service
      register: sshd_active
      changed_when: false
      failed_when: sshd_active.stdout != "active"

    - name: Collect effective sshd config
      ansible.builtin.command:
        cmd: sshd -T
      register: sshd_t
      changed_when: false

    - name: sshd -T applies the hardening drop-in
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_t.stdout | lower"
          - "'kbdinteractiveauthentication no' in sshd_t.stdout | lower"
          - "'permitrootlogin no' in sshd_t.stdout | lower"
          - "'pubkeyauthentication yes' in sshd_t.stdout | lower"
          - "'x11forwarding no' in sshd_t.stdout | lower"
          - "'allowtcpforwarding no' in sshd_t.stdout | lower"
          - "'allowagentforwarding no' in sshd_t.stdout | lower"
          - "'permittunnel no' in sshd_t.stdout | lower"
          - "'permituserenvironment no' in sshd_t.stdout | lower"
          - "'permitemptypasswords no' in sshd_t.stdout | lower"
          - "'ignorerhosts yes' in sshd_t.stdout | lower"
          - "'loglevel verbose' in sshd_t.stdout | lower"
          - "'maxsessions 2' in sshd_t.stdout | lower"
          - "'maxstartups 10:30:20' in sshd_t.stdout | lower"

    - name: Effective SSH policy matches all owned directives and pinned algorithms
      ansible.builtin.command:
        cmd: /usr/local/sbin/vpn-validate-sshd /etc/ssh/sshd_config.d/20-ansible-hardening.conf
      changed_when: false

    - name: Reject duplicate ownership and unmanaged effective-policy shadows
      block:
        - name: Create duplicate boot directive candidate
          ansible.builtin.copy:
            dest: /run/molecule-sshd-candidate
            mode: "0600"
            content: "PasswordAuthentication no\n"

        - name: Validate duplicate candidate without installing it
          ansible.builtin.command:
            cmd: /usr/local/sbin/vpn-validate-sshd /run/molecule-sshd-candidate
          register: ssh_duplicate
          changed_when: false
          failed_when: false

        - name: Duplicate ownership is rejected by key
          ansible.builtin.assert:
            that:
              - ssh_duplicate.rc != 0
              - "'duplicate SSH directive ownership: passwordauthentication' in ssh_duplicate.stderr"

        - name: Inject an unmanaged earlier forwarding directive
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/00-molecule-shadow.conf
            mode: "0644"
            content: "AllowTcpForwarding yes\n"

        - name: Validate assembled configuration without reloading the service
          ansible.builtin.command:
            cmd: /usr/local/sbin/vpn-validate-sshd /etc/ssh/sshd_config.d/20-ansible-hardening.conf
          register: ssh_shadow
          changed_when: false
          failed_when: false

        - name: Effective configuration mismatch is rejected by key
          ansible.builtin.assert:
            that:
              - ssh_shadow.rc != 0
              - "'effective SSH directive mismatch: allowtcpforwarding' in ssh_shadow.stderr"
      always:
        - name: Remove SSH negative-test fixtures without reloading
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /run/molecule-sshd-candidate
            - /etc/ssh/sshd_config.d/00-molecule-shadow.conf

    - name: Check whether SSH moduli file exists
      ansible.builtin.stat:
        path: /etc/ssh/moduli
      register: verify_ssh_moduli

    - name: SSH moduli are pruned to at least 3071 bits
      ansible.builtin.command:
        cmd: awk '$5 < 3071 { print; bad=1 } END { exit bad }' /etc/ssh/moduli
      changed_when: false
      when: verify_ssh_moduli.stat.exists

    - name: Sysctl redirect hardening is rendered
      ansible.builtin.command:
        cmd: grep -Eq '^net\.ipv4\.conf\.(all|default)\.accept_redirects = 0$' /etc/sysctl.d/90-vpn.conf
      changed_when: false

    - name: Sysctl hardening values are applied
      ansible.builtin.command:
        cmd: "sysctl -n {{ item.key }}"
      loop:
        - key: "fs.protected_hardlinks"
          value: "1"
        - key: "fs.protected_symlinks"
          value: "1"
        - key: "kernel.randomize_va_space"
          value: "2"
        - key: "kernel.kptr_restrict"
          value: "2"
        - key: "kernel.yama.ptrace_scope"
          value: "2"
      register: verify_sysctl_value
      changed_when: false
      failed_when: verify_sysctl_value.stdout != item.value
