---
- name: Verify baseline role
  hosts: all
  become: true
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: nftables installed
      ansible.builtin.command:
        cmd: nft --version
      changed_when: false

    - name: Host-firmware tooling is absent from the VPS baseline
      ansible.builtin.command:
        cmd: dpkg-query -W fwupd
      register: fwupd_package
      changed_when: false
      failed_when: fwupd_package.rc == 0

    - name: systemd-resolved drop-in present when service exists
      ansible.builtin.stat:
        path: /etc/systemd/resolved.conf.d/no-stub.conf
      register: resolved_dropin
      failed_when: not resolved_dropin.stat.exists or not resolved_dropin.stat.isreg
      when: "'systemd-resolved.service' in ansible_facts.services"

    - name: sysctl tuning installed
      ansible.builtin.stat:
        path: /etc/sysctl.d/90-vpn.conf
      register: sysctl
      failed_when: not sysctl.stat.exists

    - name: timesync enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled systemd-timesyncd
      register: ts
      changed_when: false
      failed_when: ts.stdout != "enabled"

    # The role still installs and starts OpenSSH. Policy publication is a
    # separate controller-owned transaction after full stack convergence.
    - name: sshd.service is active
      ansible.builtin.command:
        cmd: systemctl is-active ssh.service
      register: sshd_active
      changed_when: false
      failed_when: sshd_active.stdout != "active"

    - name: Check whether SSH moduli file exists
      ansible.builtin.stat:
        path: /etc/ssh/moduli
      register: verify_ssh_moduli

    - name: SSH moduli are pruned to at least 3071 bits
      ansible.builtin.command:
        cmd: awk '$5 < 3071 { print; bad=1 } END { exit bad }' /etc/ssh/moduli
      changed_when: false
      when: verify_ssh_moduli.stat.exists

    - name: Sysctl redirect hardening is rendered
      ansible.builtin.command:
        cmd: grep -Eq '^net\.ipv4\.conf\.(all|default)\.accept_redirects = 0$' /etc/sysctl.d/90-vpn.conf
      changed_when: false

    - name: Sysctl hardening values are applied
      ansible.builtin.command:
        cmd: "sysctl -n {{ item.key }}"
      loop:
        - key: "fs.protected_hardlinks"
          value: "1"
        - key: "fs.protected_symlinks"
          value: "1"
        - key: "kernel.randomize_va_space"
          value: "2"
        - key: "kernel.kptr_restrict"
          value: "2"
        - key: "kernel.yama.ptrace_scope"
          value: "2"
      register: verify_sysctl_value
      changed_when: false
      failed_when: verify_sysctl_value.stdout != item.value
