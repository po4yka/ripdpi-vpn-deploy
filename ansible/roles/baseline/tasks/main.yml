---
# Baseline OS hardening: distro packages, sshd hardening, sysctl tuning,
# timesync. Runs on every VPS as the first role in site.yml.

- name: Validate bounded UDP socket ceilings before host changes
  ansible.builtin.assert:
    that:
      - baseline_udp_receive_buffer_max is integer
      - baseline_udp_send_buffer_max is integer
      - baseline_udp_receive_buffer_max | int >= 1048576
      - baseline_udp_receive_buffer_max | int <= 67108864
      - baseline_udp_send_buffer_max | int >= 1048576
      - baseline_udp_send_buffer_max | int <= 67108864
    fail_msg: UDP socket ceilings must be integers between 1 MiB and 64 MiB.
  tags: [always]

- name: Admit the unused kernel module policy before host changes
  ansible.builtin.import_tasks: module-admission.yml
  tags: [always]

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - unzip
      - nftables
      - kmod
      - logrotate
      - systemd-timesyncd
      - rsync
      - htop
      - dnsutils
      # openssh-server is what `sshd` lives in. The hardening drop-in below
      # uses `validate: sshd -t -f %s`, which needs the binary present.
      - openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: baseline_packages

- name: Reconcile persistent unused kernel module denial
  ansible.builtin.import_tasks: module-policy.yml

- name: Remove unsupported VPS hardware management packages
  ansible.builtin.apt:
    name:
      - fwupd
      - openipmi
    state: absent
    purge: true

- name: Clear obsolete VPS hardware management failed units
  ansible.builtin.command:
    cmd: systemctl reset-failed fwupd.service fwupd-refresh.service openipmi.service
  changed_when: false
  failed_when: false

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Reconcile the host resolver before any transport claims DNS ports
  ansible.builtin.import_tasks: resolver.yml
  when: "'systemd-resolved.service' in ansible_facts.services"

- name: Require planned timesync installation when check mode lacks the unit
  ansible.builtin.assert:
    that:
      - baseline_packages.changed
    fail_msg: Check mode found no timesync unit and no planned package installation.
  when:
    - ansible_check_mode
    - "'systemd-timesyncd.service' not in ansible_facts.services"

- name: Ensure timesync is enabled
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  register: baseline_timesync
  changed_when: >-
    baseline_timesync.changed and
    ansible_facts.get("virtualization_type", "") != "docker"
  when: >-
    not ansible_check_mode or
    'systemd-timesyncd.service' in ansible_facts.services

- name: Remove stock cloud-image account sudo grants
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/90-cloud-init-users
    regexp: '^{{ item }}\s'
    state: absent
    validate: visudo -cf %s
  loop: "{{ baseline_stock_accounts | difference([ansible_user] + baseline_ssh_extra_allowed_users) }}"

- name: Remove stock cloud-image accounts
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ baseline_stock_accounts | difference([ansible_user] + baseline_ssh_extra_allowed_users) }}"

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure sshd runtime directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Main and the managed 20-file are published together only by the second,
# controller-owned site play.  Direct writes here would bypass durable
# schema-two recovery and could confirm before the VPN stack is probeable.

- name: Prune weak SSH Diffie-Hellman moduli
  ansible.builtin.include_tasks: ssh_moduli.yml
  when: (security_controls | default({})).ssh_prune_moduli | default(false)

- name: Detect kernel MPTCP support
  ansible.builtin.stat:
    path: /proc/sys/net/mptcp/enabled
  register: _baseline_mptcp_sysctl

- name: Drop sysctl tuning
  ansible.builtin.template:
    src: sysctl-vpn.conf.j2
    dest: /etc/sysctl.d/90-vpn.conf
    owner: root
    group: root
    mode: "0644"

- name: Reconcile forwarding for every enabled routing workload
  ansible.builtin.import_tasks: forwarding.yml

- name: Read effective MPTCP policy
  ansible.builtin.command:
    cmd: sysctl -n net.mptcp.enabled
  changed_when: false
  register: _baseline_mptcp_effective
  when:
    - _baseline_mptcp_sysctl.stat.exists
    - not ansible_check_mode

- name: Require disabled MPTCP on supported kernels
  ansible.builtin.assert:
    that:
      - _baseline_mptcp_effective.stdout == '0'
    fail_msg: The unused MPTCP path must be disabled.
  when:
    - _baseline_mptcp_sysctl.stat.exists
    - not ansible_check_mode
