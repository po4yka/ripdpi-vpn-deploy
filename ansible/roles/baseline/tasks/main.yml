---
# Baseline OS hardening: distro packages, sshd hardening, sysctl tuning,
# timesync. Runs on every VPS as the first role in site.yml.

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - unzip
      - nftables
      - logrotate
      - systemd-timesyncd
      - rsync
      - htop
      - dnsutils
      # The assembled configuration validator needs the real sshd parser.
      - openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove VPS firmware update tooling
  ansible.builtin.apt:
    name:
      - fwupd
    state: absent
    purge: true

- name: Clear obsolete fwupd failed units
  ansible.builtin.command:
    cmd: systemctl reset-failed fwupd.service fwupd-refresh.service
  changed_when: false
  failed_when: false

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Ensure systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'systemd-resolved.service' in ansible_facts.services"

- name: Disable systemd-resolved listening on 53 (we'll let resolvconf manage)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/no-stub.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Resolve]
      DNSStubListener=no
  notify: Restart systemd-resolved
  when: "'systemd-resolved.service' in ansible_facts.services"

- name: Ensure timesync is enabled
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  register: baseline_timesync
  changed_when: >-
    baseline_timesync.changed and
    ansible_facts.get("virtualization_type", "") != "docker"

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure sshd runtime directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable packaged SFTP subsystem before managed drop-in
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(\s*Subsystem\s+sftp\s+.*)$'
    line: '# \1'
    backrefs: true
    validate: "sshd -t -f %s"
  notify: Reload ssh

- name: Install assembled SSH configuration validator
  ansible.builtin.copy:
    src: validate-sshd.py
    dest: /usr/local/sbin/vpn-validate-sshd
    owner: root
    group: root
    mode: "0755"

- name: Drop SSH hardening config after ownership and effective-policy validation
  ansible.builtin.template:
    src: sshd_config.d-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/20-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/local/sbin/vpn-validate-sshd %s"
  notify: Reload ssh

- name: Validate assembled SSH policy before queued reload
  ansible.builtin.command:
    cmd: /usr/local/sbin/vpn-validate-sshd /etc/ssh/sshd_config.d/20-ansible-hardening.conf
  changed_when: false
  when: not ansible_check_mode

- name: Prune weak SSH Diffie-Hellman moduli
  ansible.builtin.include_tasks: ssh_moduli.yml
  when: (security_controls | default({})).ssh_prune_moduli | default(false)

- name: Drop sysctl tuning
  ansible.builtin.template:
    src: sysctl-vpn.conf.j2
    dest: /etc/sysctl.d/90-vpn.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable IP forwarding only when AmneziaWG is in scope
  ansible.builtin.copy:
    dest: /etc/sysctl.d/91-vpn-forward.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  when: vpn.enable_amneziawg | default(true)

- name: Remove forwarding sysctl when AmneziaWG is disabled
  ansible.builtin.file:
    path: /etc/sysctl.d/91-vpn-forward.conf
    state: absent
  when: not (vpn.enable_amneziawg | default(true))

- name: Reconcile effective sysctl values on every converge
  ansible.builtin.command:
    cmd: sysctl -e --system
  register: baseline_sysctl_apply
  changed_when: false
  failed_when: >-
    baseline_sysctl_apply.rc != 0 and
    'net.ipv4.tcp_congestion_control' not in baseline_sysctl_apply.stderr
