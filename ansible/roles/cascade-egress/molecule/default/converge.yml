---
- name: Converge cascade egress scaffold
  hosts: all
  become: true
  vars:
    cascade_egress:
      validate_policy: false
      wg_interface: cse0
      tunnel_address: 10.203.0.2/30
      listen_port: 51831
      ingress_allowed_ips: 10.203.0.1/32
      policy_path: /etc/wireguard/cascade-egress.nft
    cascade_secrets:
      ingress_private_key: ""
      ingress_public_key: MOLECULE_STUB_INGRESS_PUBLIC_KEY_NOT_REAL_AAAAAAAA=
      egress_private_key: MOLECULE_STUB_EGRESS_PRIVATE_KEY_NOT_REAL_BBBBBBBB=
      egress_public_key: ""
      preshared_key: ""
  roles:
    - role: cascade-egress
