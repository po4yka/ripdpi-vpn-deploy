---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml
driver: {name: docker}
platforms:
  - name: vpn-cascade-egress-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:fd0443883979e0879e912231914df2093769d45fcb82af251704b30e2fc5c42e
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    cgroupns_mode: host
provisioner:
  name: ansible
  env: {ANSIBLE_ROLES_PATH: ../../..}
  inventory:
    host_vars:
      vpn-cascade-egress-debian13: {ansible_user: root}
verifier: {name: ansible}
scenario:
  test_sequence: [dependency, syntax, create, converge, idempotence, verify, destroy]
