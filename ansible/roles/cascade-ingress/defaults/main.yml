---
cascade_ingress:
  validate_policy: true
  direct_interface: ""
  wg_interface: csi0
  tunnel_address: 10.203.0.1/30
  egress_endpoint: ""
  egress_port: 51831
  egress_allowed_ips: 0.0.0.0/0
  keepalive_seconds: 25
  geodata_path: /usr/local/share/xray/geoip.dat
  classifier_path: /usr/local/libexec/cascade-classifier.py
  classifier_library_path: /usr/local/libexec/cascade_classifier_lib.py
  classifier_proxy_path: /usr/local/libexec/cascade-classifier-proxy.py
  classifier_proxy_host: 127.0.0.1
  classifier_proxy_port: 10808
  classifier_proxy_unit_path: /etc/systemd/system/cascade-classifier-proxy.service
  classifier_proxy_password_path: /etc/cascade/classifier-proxy.password
  classifier_interface_path: /etc/cascade/classifier-interface.json
  leg_probe_path: /usr/local/libexec/cascade-leg-probe.py
  leg_probe_schema_path: /usr/local/share/cascade/cascade-leg-probe-config.schema.json
  leg_probe_config_path: /etc/cascade/leg-probe.json
  leg_probe_token_path: /etc/cascade/leg-probe.token
  leg_probe_state_path: /var/lib/cascade/leg-probe-state.json
  leg_probe_health_path: /var/lib/cascade/leg-health.json
  leg_probe_evidence_dir: /var/lib/cascade/evidence
  policy_path: /etc/wireguard/cascade-ingress.nft

cascade_secrets:
  ingress_private_key: ""
  ingress_public_key: ""
  egress_private_key: ""
  egress_public_key: ""
  preshared_key: ""
  classifier_proxy_password: ""
