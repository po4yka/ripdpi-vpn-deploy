---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml
driver:
  name: docker
platforms:
  - name: vpn-cascade-ingress-populated-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:0de09c528cdbf83545420a1b3a9524af9f38d65fc1b28ff6a8af1eff052987da
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    cgroupns_mode: host
provisioner:
  name: ansible
  env: {ANSIBLE_ROLES_PATH: ../../..}
  inventory:
    host_vars:
      vpn-cascade-ingress-populated-debian13: {ansible_user: root}
verifier:
  name: ansible
scenario:
  test_sequence: [dependency, syntax, create, prepare, converge, idempotence, verify, destroy]
