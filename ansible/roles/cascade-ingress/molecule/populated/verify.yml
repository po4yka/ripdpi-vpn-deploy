---
- name: Verify populated cascade ingress scaffold
  hosts: all
  become: true
  tasks:
    - name: Re-run classifier dataset preflight
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/cascade-classifier.py --dataset /usr/local/share/xray/geoip.dat --check-dataset
      register: classifier_ready
      changed_when: false
      failed_when: classifier_ready.rc != 0
    - name: Read ingress tunnel configuration
      ansible.builtin.slurp:
        src: /etc/wireguard/csi0.conf
      register: ingress_config
    - name: Read ingress scoped policy
      ansible.builtin.slurp:
        src: /etc/wireguard/cascade-ingress.nft
      register: ingress_policy
    - name: Read classifier integration contract
      ansible.builtin.slurp:
        src: /etc/cascade/classifier-interface.json
      register: classifier_interface
    - name: Read repository-disabled classifier unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/cascade-classifier-proxy.service
      register: classifier_unit
    - name: Inspect classifier proxy password permissions
      ansible.builtin.stat:
        path: /etc/cascade/classifier-proxy.password
      register: classifier_proxy_password
    - name: Read repository-disabled leg probe unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/cascade-leg-probe.service
      register: leg_probe_unit
    - name: Inspect leg probe timer enablement
      ansible.builtin.command:
        cmd: systemctl is-enabled cascade-leg-probe.timer
      register: leg_probe_timer
      changed_when: false
      failed_when: false
    - name: Assert classifier and directional scaffold
      ansible.builtin.assert:
        that:
          - (classifier_ready.stdout | from_json).state == 'ready'
          - (ingress_config.content | b64decode) is search('Endpoint =')
          - (ingress_config.content | b64decode) is not search('ListenPort')
          - (ingress_config.content | b64decode) is search('(?m)^Table = off$')
          - (ingress_config.content | b64decode) is search('fwmark 203')
          - (ingress_config.content | b64decode) is search('table 203')
          - (ingress_config.content | b64decode) is not search('ip route replace default')
          - (ingress_policy.content | b64decode) is search('table inet cascade_ingress')
          - (ingress_policy.content | b64decode) is not search('masquerade')
          - ((classifier_interface.content | b64decode | from_json).outcomes.ru) == 'direct'
          - ((classifier_interface.content | b64decode | from_json).outcomes.foreign) == 'cascade-egress'
          - ((classifier_interface.content | b64decode | from_json).outcomes['dataset-unavailable']) == 'block-serving'
          - (classifier_interface.content | b64decode | from_json).fallback == none
          - (classifier_interface.content | b64decode | from_json).activation_state == 'implementation-only'
          - ((classifier_interface.content | b64decode | from_json).invocation.transport) == 'socks5-connect'
          - (classifier_unit.content | b64decode) is search('ExecCondition=/usr/bin/false')
          - classifier_proxy_password.stat.mode == '0600'
          - (leg_probe_unit.content | b64decode) is search('ExecCondition=/usr/bin/false')
          - leg_probe_timer.stdout == 'disabled'
