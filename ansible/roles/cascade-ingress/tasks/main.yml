---
- name: Assert cascade and split-hop role families are not co-located
  vars:
    split_hop_role_family_enabled: >-
      {{ (vpn.enable_split_hop_ingress | default(false) | bool) or
         (vpn.enable_split_hop_egress | default(false) | bool) }}
    split_hop_conflicting_roles: >-
      {{ (['split-hop-ingress'] if vpn.enable_split_hop_ingress | default(false) | bool else []) +
         (['split-hop-egress'] if vpn.enable_split_hop_egress | default(false) | bool else []) }}
  ansible.builtin.assert:
    that:
      - not split_hop_role_family_enabled
    fail_msg: >-
      Host {{ inventory_hostname }} may not apply cascade-ingress while
      split-hop roles {{ split_hop_conflicting_roles }} are enabled.
  tags:
    - always

- name: Validate cascade ingress contract
  ansible.builtin.assert:
    that:
      - cascade_ingress.direct_interface | length > 0
      - cascade_ingress.direct_interface != cascade_ingress.wg_interface
      - cascade_ingress.egress_endpoint | length > 0
      - cascade_ingress.egress_port | int > 0
      - cascade_ingress.egress_port | int <= 65535
      - cascade_ingress.routing_table | int > 0
      - cascade_ingress.routing_table | int <= 4294967295
      - cascade_ingress.fwmark | int > 0
      - cascade_ingress.fwmark | int <= 4294967295
      - cascade_secrets.ingress_private_key | length > 0
      - cascade_secrets.egress_public_key | length > 0
      - cascade_secrets.classifier_proxy_password | length >= 43
    fail_msg: Cascade ingress requires an egress endpoint plus its own private key and the egress public key.
  no_log: true

- name: Assert cascade classifier is the only optional egress selector
  ansible.builtin.assert:
    that:
      - not (vpn.enable_warp_outbound | default(false) | bool)
    fail_msg: Cascade ingress cannot coexist with WARP routing because every client connection must pass through the classifier.
  tags:
    - always

- name: Install cascade ingress packages
  ansible.builtin.apt:
    name: [wireguard, wireguard-tools, nftables, python3, python3-jsonschema]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure cascade runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /usr/local/libexec, mode: "0755"}
    - {path: /usr/local/share/cascade, mode: "0755"}
    - {path: /etc/wireguard, mode: "0700"}
    - {path: /etc/cascade, mode: "0755"}
    - {path: /var/lib/cascade, mode: "0700"}
    - {path: /var/lib/cascade/evidence, mode: "0700"}

- name: Install canonical cascade classifier module
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/cascade-classifier.py"
    dest: "{{ cascade_ingress.classifier_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install cascade classifier library
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/cascade_classifier_lib.py"
    dest: "{{ cascade_ingress.classifier_library_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Install per-connection cascade classifier proxy
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/cascade-classifier-proxy.py"
    dest: "{{ cascade_ingress.classifier_proxy_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install cascade authenticated leg probe
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/cascade-leg-probe.py"
    dest: "{{ cascade_ingress.leg_probe_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install cascade leg probe configuration schema
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../contract/cascade-leg-probe-config.schema.json"
    dest: "{{ cascade_ingress.leg_probe_schema_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Preflight classifier dataset before serving configuration
  ansible.builtin.command:
    cmd: >-
      python3 {{ cascade_ingress.classifier_path | quote }}
      --dataset {{ cascade_ingress.geodata_path | quote }}
      --check-dataset
  register: cascade_classifier_preflight
  changed_when: false
  failed_when: cascade_classifier_preflight.rc != 0

- name: Install classifier proxy authentication secret
  ansible.builtin.copy:
    content: "{{ cascade_secrets.classifier_proxy_password }}\n"
    dest: "{{ cascade_ingress.classifier_proxy_password_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Render disabled classifier integration contract
  ansible.builtin.template:
    src: classifier-interface.json.j2
    dest: "{{ cascade_ingress.classifier_interface_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Render repository-disabled classifier proxy unit
  ansible.builtin.template:
    src: cascade-classifier-proxy.service.j2
    dest: "{{ cascade_ingress.classifier_proxy_unit_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Render repository-disabled cascade leg probe units
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {source: cascade-leg-probe.service.j2, destination: /etc/systemd/system/cascade-leg-probe.service}
    - {source: cascade-leg-probe.timer.j2, destination: /etc/systemd/system/cascade-leg-probe.timer}

- name: Render cascade ingress scoped policy
  ansible.builtin.template:
    src: cascade-ingress.nft.j2
    dest: "{{ cascade_ingress.policy_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ 'nft -c -f %s' if cascade_ingress.validate_policy | bool else omit }}"

- name: Render cascade ingress tunnel configuration
  ansible.builtin.template:
    src: cascade-ingress.conf.j2
    dest: "/etc/wireguard/{{ cascade_ingress.wg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
