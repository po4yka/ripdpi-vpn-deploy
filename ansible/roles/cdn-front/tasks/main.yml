---
- name: Ensure nginx is present
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure prefix-list directory
  ansible.builtin.file:
    path: "{{ cdn_front.cf_prefix_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install refresh script
  ansible.builtin.template:
    src: refresh-cf-prefixes.sh.j2
    dest: /etc/cron.daily/cdn-front-refresh-cf-prefixes
    owner: root
    group: root
    mode: "0755"

- name: Seed CF prefix list (first run)
  ansible.builtin.command: /etc/cron.daily/cdn-front-refresh-cf-prefixes
  register: _cf_seed
  changed_when: false
  # Tolerate transient network failures on first-deploy (rc != 0 and empty
  # output is expected when the VPS has no internet egress at provision time).
  # Surface failures that indicate a genuine misconfiguration: a non-zero
  # exit with non-empty stderr that is NOT a network/curl/wget error.
  failed_when:
    - _cf_seed.rc != 0
    - >-
      not (
        'Could not resolve' in (_cf_seed.stderr | default('')) or
        'Connection refused' in (_cf_seed.stderr | default('')) or
        'Network is unreachable' in (_cf_seed.stderr | default('')) or
        'curl' in (_cf_seed.stderr | default('')) or
        'wget' in (_cf_seed.stderr | default(''))
      )

- name: Drop nginx CDN-front site
  ansible.builtin.template:
    src: cdn-front.conf.j2
    dest: /etc/nginx/sites-available/cdn-front.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx CDN-front site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/cdn-front.conf
    dest: /etc/nginx/sites-enabled/cdn-front.conf
    state: link
    force: true
  notify: Reload nginx

- name: Validate the full nginx config
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
