---
- name: Validate explicit cdn-front lifecycle selection
  ansible.builtin.assert:
    that: cdn_front_role_enabled is boolean

- name: Converge enabled cdn-front runtime
  ansible.builtin.include_tasks: enable.yml
  when: cdn_front_role_enabled

- name: Reconcile disabled cdn-front ownership
  ansible.builtin.include_tasks: disable.yml
  when: not cdn_front_role_enabled
