---
# DNS-Morph bridge — opt-in bootstrap-channel transport listening on
# UDP/53. The bridge interprets handshake-shaped queries as DNS-Morph
# fragments and forwards every other query to a localhost recursor so
# the listener answers like a normal DNS server for active probes.
#
# Off by default (vpn.enable_dns_morph_bridge in group_vars/all.yml).
# Companion to the client-side bootstrap path; both must ship together.
#
# Layering with other transports:
#   * UDP/53 is the only port the bridge owns. It is independent of
#     P0/P1/P2 (TCP/443, TCP/8443, UDP/443, UDP/cohort) — co-residency
#     with the full stack is supported.
#   * The upstream data plane (where decoded fragments egress to) is
#     pointed at an existing inbound on this host or another host via
#     `dns_morph_bridge.upstream_endpoint`. Typically a VLESS+REALITY
#     inbound on a separate port; the bridge does not terminate VPN
#     traffic itself.

dns_morph_bridge:
  # Where the bridge binary lives on disk after install.
  install_root: /opt/dns-morph-bridge
  bin_path: /usr/local/bin/dns-morph-bridge

  # Listener binding. 0.0.0.0 is the operational baseline because UDP/53
  # is unauthenticated and any address-specific bind would require a
  # second public IP (out of scope for v1 single-VPS deploys).
  listen_addr: "0.0.0.0"
  listen_port: 53

  # Localhost recursor used for the active-probing-defense forwarder.
  # Unbound binds 127.0.0.1:5353 so it does not collide with the bridge.
  recursor_addr: "127.0.0.1"
  recursor_port: 5353

  # Upstream data-plane endpoint that decoded handshakes are stitched
  # into. The operator points this at an existing transport on this
  # host (e.g. 127.0.0.1:443 to the local REALITY listener) or at a
  # remote VPS. Empty string makes the bridge run in "echo-only" mode
  # for smoke testing without forwarding anywhere.
  upstream_endpoint: ""

  # Per-minute query cap. UDP/53 attracts indiscriminate scanner
  # traffic; without a cap the log file can fill the disk in hours.
  # The cap applies to the active-probing-defense path only —
  # handshake-shaped queries bypass the cap so legitimate clients
  # are not throttled by scanner volume.
  events_per_minute_max: 5000

  log_dir: /var/log/dns-morph-bridge
  config_dir: /etc/dns-morph-bridge

# Secrets surface — populated from SOPS at deploy time. Declared here
# with an empty default so `check-secrets-coverage.py` accepts the
# template references even when the role is disabled and the operator
# has not yet filled the example secrets block.
dns_morph_bridge_secrets:
  signing_key: ""
  binary_url: ""
  binary_sha256: ""
