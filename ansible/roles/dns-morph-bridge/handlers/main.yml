---
- name: Restart dns-morph-bridge
  ansible.builtin.systemd_service:
    name: dns-morph-bridge.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Wait for dns-morph-bridge to become active
  ansible.builtin.command:
    cmd: systemctl is-active dns-morph-bridge.service
  register: dns_morph_active
  retries: 5
  delay: 2
  until: dns_morph_active.stdout == "active"
  changed_when: false
  when: not ansible_check_mode
  listen: Restart dns-morph-bridge

- name: Restart unbound
  ansible.builtin.systemd_service:
    name: unbound.service
    state: restarted
  when: not ansible_check_mode
