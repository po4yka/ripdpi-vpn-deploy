---
- name: Reload systemd for the egress proxy drop-in
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Restart egress proxy

- name: Restart egress proxy
  ansible.builtin.systemd_service:
    name: squid
    state: restarted
  # A first dry-run only plans the install, so the unit does not exist yet.
  when: not (ansible_check_mode and _egress_proxy_install is changed)
