---
- name: Converge egress proxy role
  hosts: all
  become: true
  pre_tasks:
    # Squid reads /etc/hosts at start. Without `dstdomain -n` a CONNECT to this
    # TEST-NET address would be reverse-mapped to the allowlisted name.
    - name: Map a TEST-NET address to an allowlisted API name
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: 198.51.100.7 api.vultr.com
        regexp: ^198\.51\.100\.7\s
        unsafe_writes: true
  roles:
    - role: egress-proxy
      vars:
        egress_proxy_listen_address: 127.0.0.1
        egress_proxy_require_tailnet_listen: false
        egress_proxy_client_cidrs:
          - 127.0.0.1/32
        egress_proxy_state_host: s3.fr-par.scw.cloud
