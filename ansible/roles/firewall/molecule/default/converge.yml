---
- name: Converge firewall role
  hosts: all
  become: true
  vars:
    allowed_ssh_cidrs:
      - "10.0.0.0/8"
      - "203.0.113.0/24"
    vpn:
      enable_hysteria: true
      enable_amneziawg: true
      enable_policy_ratelimit: true
    firewall_awg_uplink_interface: eth0
    amneziawg:
      listen_port: 51820
    public_listener_contract:
      - {name: xray, protocol: tcp, port: 443, port_range: null}
      - {name: xray-fallback, protocol: tcp, port: 2053, port_range: null}
      - {name: nginx-xhttp, protocol: tcp, port: 8443, port_range: null}
      - {name: hysteria, protocol: udp, port: 443, port_range: null}
      - {name: amneziawg, protocol: udp, port: 51820, port_range: null}
  pre_tasks:
    - name: Install firewall and SSH fixtures
      ansible.builtin.apt:
        name:
          - nftables
          - openssh-server
          - ufw
        state: present
        update_cache: true

    - name: Start the real SSH service required by firewall discovery
      ansible.builtin.systemd_service:
        name: ssh
        state: started

    - name: Check whether the provider-image UFW fixture was initialized
      ansible.builtin.stat:
        path: /etc/molecule-ufw-fixture-initialized
      register: _firewall_molecule_ufw_fixture

    - name: Simulate a provider image with UFW enabled on first converge
      ansible.builtin.command: ufw --force enable
      when: not _firewall_molecule_ufw_fixture.stat.exists
      changed_when: true

    - name: Record provider-image UFW fixture initialization
      ansible.builtin.file:
        path: /etc/molecule-ufw-fixture-initialized
        state: touch
        mode: "0600"
      when: not _firewall_molecule_ufw_fixture.stat.exists

    - name: Remove Tailnet SSH sets fixture before clean check-mode convergence
      ansible.builtin.file:
        path: /etc/nftables.d
        state: absent

    - name: Exercise clean firewall check mode before Tailnet fragment exists
      check_mode: true
      block:
        - name: Run the firewall role without creating the Tailnet fragment
          ansible.builtin.include_role:
            name: firewall

    - name: Confirm clean firewall check mode created no Tailnet fragment path
      ansible.builtin.stat:
        path: /etc/nftables.d
      register: _firewall_clean_check_tailnet_dir
      changed_when: false

    - name: Require clean firewall check mode to preserve an absent Tailnet fragment path
      ansible.builtin.assert:
        that:
          - not _firewall_clean_check_tailnet_dir.stat.exists
  roles:
    - role: firewall

  post_tasks:
    - name: Read the initially installed empty Tailnet SSH sets fragment
      ansible.builtin.slurp:
        src: /etc/nftables.d/vpn-tailnet-ssh-sets.nft
      register: _firewall_empty_tailnet_sets
      changed_when: false

    - name: Require the initially installed fragment to be exactly empty
      ansible.builtin.assert:
        that:
          - >-
            (_firewall_empty_tailnet_sets.content | b64decode) ==
            '# vpn-tailnet-ssh-sets schema=1\n'
            ~ 'set vpn_tailnet_ssh_v4 {\n'
            ~ '  type ipv4_addr\n'
            ~ '  flags interval\n'
            ~ '  elements = { }\n'
            ~ '}\n\n'
            ~ 'set vpn_tailnet_ssh_v6 {\n'
            ~ '  type ipv6_addr\n'
            ~ '  flags interval\n'
            ~ '  elements = { }\n'
            ~ '}\n'

    - name: Install representative canonical Tailnet SSH sets fragment
      ansible.builtin.copy:
        dest: /etc/nftables.d/vpn-tailnet-ssh-sets.nft
        owner: root
        group: root
        mode: "0644"
        content: |
          # vpn-tailnet-ssh-sets schema=1
          set vpn_tailnet_ssh_v4 {
            type ipv4_addr
            flags interval
            elements = { 100.64.10.20/32 }
          }

          set vpn_tailnet_ssh_v6 {
            type ipv6_addr
            flags interval
            elements = { fd7a:115c:a1e0::1234/128 }
          }

    - name: Build the Tailnet-enabled firewall fixture
      ansible.builtin.set_fact:
        _firewall_tailnet_enabled_vpn: >-
          {{ vpn | combine({'enable_tailnet_management': true}) }}
      changed_when: false

    - name: Converge the real Tailnet-enabled firewall branch
      ansible.builtin.include_role:
        name: firewall
      vars:
        vpn: "{{ _firewall_tailnet_enabled_vpn }}"

    - name: Repeat the role in check mode with UFW preinstalled
      check_mode: true
      block:
        - name: Exercise the actual dry-run task path
          ansible.builtin.include_role:
            name: firewall
          vars:
            vpn: "{{ _firewall_tailnet_enabled_vpn }}"

    - name: Dry-run still probes the installed UFW state
      ansible.builtin.assert:
        that:
          - not (_firewall_ufw_status.skipped | default(false))
          - "'Status: inactive' in _firewall_ufw_status.stdout"
