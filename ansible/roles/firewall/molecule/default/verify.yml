---
- name: Verify firewall role
  hosts: all
  become: true
  tasks:
    - name: Provider-image UFW is inactive after converge
      ansible.builtin.command: ufw status
      register: _firewall_verify_ufw
      changed_when: false
      failed_when: "'Status: inactive' not in _firewall_verify_ufw.stdout"

    - name: nftables.conf parses
      ansible.builtin.command:
        cmd: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Validate complete nftables candidate with representative Tailnet sets
      ansible.builtin.command:
        cmd: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Require exact set-backed Tailnet SSH accepts in the live candidate
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -Fqx '    iifname "tailscale0" tcp dport 22 ip saddr @vpn_tailnet_ssh_v4 accept' /etc/nftables.conf
          grep -Fqx '    iifname "tailscale0" tcp dport 22 ip6 saddr @vpn_tailnet_ssh_v6 accept' /etc/nftables.conf
          ! grep -Fqx '    iifname "tailscale0" tcp dport 22 accept' /etc/nftables.conf
        executable: /bin/bash
      changed_when: false

    - name: Install an independent split-hop NAT sentinel
      ansible.builtin.shell:
        cmd: |
          nft -f - <<'NFT'
          add table inet split_hop_egress
          add chain inet split_hop_egress postrouting { type nat hook postrouting priority 100; }
          add rule inet split_hop_egress postrouting counter comment "split-hop-sentinel"
          NFT
        executable: /bin/bash
      changed_when: false

    - name: Remove firewall-owned tables before a fresh reload
      ansible.builtin.shell:
        cmd: |
          nft delete table inet filter || true
          nft delete table inet nat || true
        executable: /bin/bash
      changed_when: false

    - name: Apply firewall configuration with split-hop table present
      ansible.builtin.command:
        cmd: nft -f /etc/nftables.conf
      changed_when: false

    - name: Verify scoped reload preserves split-hop and restores firewall tables
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          nft list table inet split_hop_egress | grep -q 'split-hop-sentinel'
          nft list table inet filter >/dev/null
          nft list table inet nat >/dev/null
        executable: /bin/bash
      changed_when: false

    - name: nftables config mentions expected ports
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'tcp dport 443' /etc/nftables.conf
          grep -q 'tcp dport 22'  /etc/nftables.conf
          grep -q 'udp dport 443' /etc/nftables.conf
        executable: /bin/bash
      changed_when: false

    - name: Policy-ratelimit offender sets exist after the firewall role
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          nft list set inet filter policy_offenders >/dev/null
          nft list set inet filter policy_offenders6 >/dev/null
        executable: /bin/bash
      changed_when: false

    - name: Forward chain permits only AWG to uplink
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          forward_chain="$(nft list chain inet filter forward)"
          grep -q 'policy drop' <<< "$forward_chain"
          grep -q 'ct state established,related accept' <<< "$forward_chain"
          grep -q 'ct state new iifname "awg0" oifname "eth0" accept' <<< "$forward_chain"
          ! grep -q 'policy accept' <<< "$forward_chain"
          ! grep -q 'iifname "awg0" accept' <<< "$forward_chain"
          ! grep -q 'oifname "awg0" accept' <<< "$forward_chain"
        executable: /bin/bash
      changed_when: false

    - name: Timed IPv4 and IPv6 bans survive actual atomic ruleset replacement
      ansible.builtin.command:
        argv: [python3, '-']
        stdin: |
          import ipaddress
          import json
          import pathlib
          import subprocess
          import time

          selected = [
              ('f2b_sshd4', '198.51.100.22'),
              ('f2b_sshd6', '2001:db8::22'),
              ('policy_offenders', '198.51.100.23'),
              ('policy_offenders6', '2001:db8::23'),
          ]
          def nft(*args):
              return subprocess.run(['nft', *args], check=True, capture_output=True, text=True).stdout
          def expiry(name, address):
              payload = json.loads(nft('-j', 'get', 'element', 'inet', 'filter', name, '{', address, '}'))
              current = next(row['set'] for row in payload['nftables'] if 'set' in row)
              entry = current['elem'][0]['elem']
              assert ipaddress.ip_address(entry['val']) == ipaddress.ip_address(address)
              assert type(entry['expires']) is int and entry['expires'] > 0
              return entry['expires']
          for name, address in selected:
              nft('add', 'element', 'inet', 'filter', name, '{', address, 'timeout', '90s', '}')
          previous = {name: expiry(name, address) for name, address in selected}
          candidate = pathlib.Path('/run/vpn-firewall-dynamic-regression.nft')
          source = pathlib.Path('/etc/nftables.conf').read_text()
          candidate.write_text(source.replace('counter drop', 'counter drop comment "molecule-rule-refresh"', 1))
          try:
              nft('-c', '-f', str(candidate))
              time.sleep(1.1)
              nft('-f', str(candidate))
              for name, address in selected:
                  remaining = expiry(name, address)
                  assert 0 < remaining < previous[name], 'ban timeout was refreshed instead of preserved'
              rules = nft('list', 'chain', 'inet', 'filter', 'input')
              for name, _address in selected:
                  assert '@' + name + ' drop' in rules
          finally:
              candidate.unlink(missing_ok=True)
              for name, address in selected:
                  nft('delete', 'element', 'inet', 'filter', name, '{', address, '}')
      changed_when: false
