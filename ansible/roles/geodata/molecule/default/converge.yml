---
# Exercise real get_url and sandboxed curl downloads against pinned local
# files; source fixtures stay outside PrivateTmp and outside install_dir.
- name: Converge geodata role with pinned local downloads
  hosts: all
  become: true

  pre_tasks:
    - name: Read fixture checksums from prepare.yml
      ansible.builtin.slurp:
        src: /tmp/geodata-fixture-checksums.env
      register: fixture_env_raw

    - name: Parse fixture checksums into facts
      ansible.builtin.set_fact:
        _geosite_sha256: >-
          {{ (fixture_env_raw.content | b64decode)
             | regex_search('GEOSITE_SHA256=([0-9a-f]+)', '\1') | first }}
        _geoip_sha256: >-
          {{ (fixture_env_raw.content | b64decode)
             | regex_search('GEOIP_SHA256=([0-9a-f]+)', '\1') | first }}

  roles:
    - role: geodata
      vars:
        geodata:
          geosite_url: "file:///var/lib/molecule-geodata-source/geosite.dat"
          geoip_url: "file:///var/lib/molecule-geodata-source/geoip.dat"
          geosite_sha256: "{{ _geosite_sha256 }}"
          geoip_sha256: "{{ _geoip_sha256 }}"
          install_dir: /usr/local/share/xray
          refresh_interval: "1d"
