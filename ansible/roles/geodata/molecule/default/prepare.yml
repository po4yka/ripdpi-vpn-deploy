---
# Keep immutable source fixtures separate from downloaded outputs. The real
# refresh service must read them through its sandbox and verify their hashes.

- name: Prepare pinned geodata source fixtures
  hosts: all
  become: true
  vars:
    geodata_fixture_dir: /var/lib/molecule-geodata-source

  tasks:
    - name: Ensure geodata fixture source directory
      ansible.builtin.file:
        path: "{{ geodata_fixture_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create fixture geosite.dat (deterministic fixture)
      ansible.builtin.copy:
        dest: "{{ geodata_fixture_dir }}/geosite.dat"
        owner: root
        group: root
        mode: "0644"
        content: "MOLECULE_GEOSITE_FIXTURE"

    - name: Create fixture geoip.dat (deterministic fixture)
      ansible.builtin.copy:
        dest: "{{ geodata_fixture_dir }}/geoip.dat"
        owner: root
        group: root
        mode: "0644"
        content: "MOLECULE_GEOIP_FIXTURE"

    - name: Compute geosite.dat sha256 for converge vars reference
      ansible.builtin.command:
        cmd: sha256sum /var/lib/molecule-geodata-source/geosite.dat
      register: geosite_sha256_out
      changed_when: false

    - name: Compute geoip.dat sha256 for converge vars reference
      ansible.builtin.command:
        cmd: sha256sum /var/lib/molecule-geodata-source/geoip.dat
      register: geoip_sha256_out
      changed_when: false

    - name: Store checksums as facts for verify.yml reference
      ansible.builtin.copy:
        dest: /tmp/geodata-fixture-checksums.env
        owner: root
        group: root
        mode: "0644"
        content: |
          GEOSITE_SHA256={{ geosite_sha256_out.stdout.split()[0] }}
          GEOIP_SHA256={{ geoip_sha256_out.stdout.split()[0] }}
