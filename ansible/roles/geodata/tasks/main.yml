---
- name: Validate explicit geodata lifecycle selection
  ansible.builtin.assert:
    that: geodata_role_enabled is boolean

- name: Converge enabled geodata runtime
  ansible.builtin.include_tasks: enable.yml
  when: geodata_role_enabled

- name: Reconcile disabled geodata ownership
  ansible.builtin.include_tasks: disable.yml
  when: not geodata_role_enabled
