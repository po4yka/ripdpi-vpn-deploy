---
# Pinned geodata refresher. Hot-reloads Xray via SIGHUP on Xray v26.4.x+;
# older or unknown versions use a fail-safe service restart.

- name: Pre-flight - geodata sources are pinned
  ansible.builtin.assert:
    that:
      - geodata.geosite_url | length > 0
      - geodata.geoip_url | length > 0
      - "'/latest/' not in geodata.geosite_url"
      - "'/latest/' not in geodata.geoip_url"
      - geodata.geosite_sha256 is match('^[0-9a-fA-F]{64}$')
      - geodata.geoip_sha256 is match('^[0-9a-fA-F]{64}$')
    fail_msg: |
      geodata requires pinned release URLs and SHA256 checksums. Set
      geodata.geosite_url, geodata.geosite_sha256, geodata.geoip_url, and
      geodata.geoip_sha256 to concrete release artifacts before enabling
      vpn.enable_geodata.

- name: Install the scheduled refresher download dependency
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect geodata directory before check-mode publication
  ansible.builtin.stat:
    path: "{{ geodata.install_dir }}"
    follow: false
  register: _geodata_directory_before
  changed_when: false
  when: ansible_check_mode

- name: Ensure geodata install directory
  ansible.builtin.file:
    path: "{{ geodata.install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: _geodata_directory_plan

- name: Require a planned geodata directory on a fresh check-mode host
  ansible.builtin.assert:
    that:
      - _geodata_directory_plan.changed
    fail_msg: Check mode found no geodata directory and no planned creation.
  when:
    - ansible_check_mode
    - not (_geodata_directory_before.stat.isdir | default(false))

- name: Check pinned geodata URLs without writing on a fresh check-mode host
  ansible.builtin.uri:
    url: "{{ item }}"
    method: HEAD
    follow_redirects: all
    status_code: 200
    timeout: 30
  loop:
    - "{{ geodata.geosite_url }}"
    - "{{ geodata.geoip_url }}"
  check_mode: false
  changed_when: false
  when:
    - ansible_check_mode
    - not (_geodata_directory_before.stat.isdir | default(false))

- name: Drop version-aware Xray geodata activation helper
  ansible.builtin.template:
    src: vpn-xray-geodata-activate.sh.j2
    dest: /usr/local/sbin/vpn-xray-geodata-activate.sh
    owner: root
    group: root
    mode: "0750"

- name: Download geosite.dat
  ansible.builtin.get_url:
    url: "{{ geodata.geosite_url }}"
    dest: "{{ geodata.install_dir }}/geosite.dat"
    mode: "0644"
    checksum: "sha256:{{ geodata.geosite_sha256 }}"
  notify: Reload xray geodata
  when: not ansible_check_mode or (_geodata_directory_before.stat.isdir | default(false))

- name: Download geoip.dat
  ansible.builtin.get_url:
    url: "{{ geodata.geoip_url }}"
    dest: "{{ geodata.install_dir }}/geoip.dat"
    mode: "0644"
    checksum: "sha256:{{ geodata.geoip_sha256 }}"
  notify: Reload xray geodata
  when: not ansible_check_mode or (_geodata_directory_before.stat.isdir | default(false))

- name: Drop refresh script
  ansible.builtin.template:
    src: vpn-geodata-refresh.sh.j2
    dest: /usr/local/sbin/vpn-geodata-refresh.sh
    owner: root
    group: root
    mode: "0750"

- name: Install geodata refresh systemd service unit
  # Template carries the root-oneshot hardening floor (NoNewPrivileges,
  # ProtectSystem=strict, PrivateTmp and peers) with the only writable
  # surface being the geodata install directory.
  ansible.builtin.template:
    src: vpn-geodata-refresh.service.j2
    dest: /etc/systemd/system/vpn-geodata-refresh.service
    owner: root
    group: root
    mode: "0644"

- name: Inspect existing geodata timer before check-mode publication
  ansible.builtin.stat:
    path: /etc/systemd/system/vpn-geodata-refresh.timer
    follow: false
  register: _geodata_timer_before
  changed_when: false
  when: ansible_check_mode

- name: Drop refresh systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/vpn-geodata-refresh.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Refresh Xray geodata daily

      [Timer]
      OnCalendar=*-*-* 04:00:00
      RandomizedDelaySec=30m
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd
  register: _geodata_timer_plan

- name: Require a planned geodata timer on a fresh check-mode host
  ansible.builtin.assert:
    that:
      - _geodata_timer_plan.changed
    fail_msg: Check mode found no geodata timer and no planned installation.
  when:
    - ansible_check_mode
    - not (_geodata_timer_before.stat.exists | default(false))

- name: Enable refresh timer
  ansible.builtin.systemd_service:
    name: vpn-geodata-refresh.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or (_geodata_timer_before.stat.exists | default(false))
