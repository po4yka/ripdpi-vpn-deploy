---
- name: Verify honeypot role
  hosts: all
  become: true
  tasks:
    - name: Service is active
      ansible.builtin.command:
        cmd: systemctl is-active honeypot.service
      register: svc
      changed_when: false
      failed_when: svc.stdout != "active"

    - name: IPv4 listener bound on configured port
      ansible.builtin.shell:
        cmd: "set -o pipefail && ss -H -lnt4 | awk '{print $4}' | grep -E ':4443$'"
        executable: /bin/bash
      register: bound_ipv4
      changed_when: false
      failed_when: bound_ipv4.rc != 0

    - name: IPv6 listener bound on configured port
      ansible.builtin.shell:
        cmd: "set -o pipefail && ss -H -lnt6 | awk '{print $4}' | grep -E ':4443$'"
        executable: /bin/bash
      register: bound_ipv6
      changed_when: false
      failed_when: bound_ipv6.rc != 0

    - name: Listener script present
      ansible.builtin.stat:
        path: /usr/local/bin/honeypot.py
      register: script
      failed_when: not script.stat.exists or not script.stat.executable

    - name: Actual service bounds a client that continually dribbles bytes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import runpy
            import socket
            import time

            config = runpy.run_path("/usr/local/bin/honeypot.py")
            budget = config["CONNECTION_DEADLINE_SECONDS"]
            started = time.monotonic()
            closed = False
            with socket.create_connection((config["LISTEN_ADDR"], 4443), timeout=2) as client:
                client.settimeout(0.1)
                while time.monotonic() - started < budget + 3:
                    try:
                        client.sendall(b"x")
                        if client.recv(1) == b"":
                            closed = True
                            break
                    except socket.timeout:
                        continue
                    except (BrokenPipeError, ConnectionResetError):
                        closed = True
                        break
            elapsed = time.monotonic() - started
            assert closed, f"dribbling client exceeded deadline: {elapsed:.2f}s"
            assert budget * 0.8 <= elapsed < budget + 3, elapsed
      changed_when: false

    - name: Logrotate timer is enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled --quiet honeypot-logrotate.timer
      register: logrotate_timer_enabled
      changed_when: false
      failed_when: logrotate_timer_enabled.rc != 0

    - name: Logrotate timer is active
      ansible.builtin.command:
        cmd: systemctl is-active --quiet honeypot-logrotate.timer
      register: logrotate_timer_active
      changed_when: false
      failed_when: logrotate_timer_active.rc != 0

    - name: Seed the connection log for a threshold rotation
      ansible.builtin.copy:
        dest: /var/log/honeypot/connections.log
        content: '{"event":"molecule-logrotate-check"}\n'
        owner: honeypot
        group: honeypot
        mode: "0640"

    - name: Grow the connection log beyond the rotation threshold
      ansible.builtin.command:
        cmd: truncate --size 11M /var/log/honeypot/connections.log
      changed_when: true

    - name: Exercise the installed logrotate service
      ansible.builtin.command:
        cmd: systemctl start honeypot-logrotate.service
      changed_when: false

    - name: Inspect the recreated connection log
      ansible.builtin.stat:
        path: /var/log/honeypot/connections.log
      register: rotated_log

    - name: Inspect the rotated connection log
      ansible.builtin.stat:
        path: /var/log/honeypot/connections.log.1
      register: archived_log

    - name: Rotation preserves a writable bounded log
      ansible.builtin.assert:
        that:
          - rotated_log.stat.exists
          - rotated_log.stat.pw_name == 'honeypot'
          - rotated_log.stat.gr_name == 'honeypot'
          - rotated_log.stat.mode == '0640'
          - archived_log.stat.exists

    - name: Validate listener and secondary address units
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/honeypot.service
          - /etc/systemd/system/vpn-honeypot-address-198.51.100.20-lo.service
      changed_when: false

    - name: Stop listener and its address ownership
      ansible.builtin.systemd_service:
        name: honeypot.service
        state: stopped

    - name: Confirm stopping the listener removes only its dedicated address
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, subprocess
            data = json.loads(subprocess.check_output(['ip', '-j', '-4', 'address', 'show', 'dev', 'lo']))
            addresses = {a['local'] for a in data[0]['addr_info']}
            assert '198.51.100.20' not in addresses
            assert '127.0.0.1' in addresses
      changed_when: false

    - name: Confirm repeated exact address cleanup accepts absence
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - /usr/local/libexec/vpn-honeypot-remove-address.py
          - "198.51.100.20"
          - lo
      changed_when: false

    - name: Start listener to restore the address through its dependency
      ansible.builtin.systemd_service:
        name: honeypot.service
        state: started

    - name: Confirm the restored address accepts connections
      ansible.builtin.wait_for:
        host: "198.51.100.20"
        port: 4443
        timeout: 10

    - name: Simulate guest address drift while the oneshot remains active
      ansible.builtin.command:
        argv: [ip, address, del, 198.51.100.20/32, dev, lo]
      changed_when: true

    - name: Repair the missing address through normal role convergence
      ansible.builtin.include_role:
        name: honeypot
      vars:
        honeypot_port: 4443
        honeypot_listen_addr: "198.51.100.20"

    - name: Activate the reconciled listener
      ansible.builtin.meta: flush_handlers

    - name: Confirm address drift recovery restores listener reachability
      ansible.builtin.wait_for:
        host: "198.51.100.20"
        port: 4443
        timeout: 10

    - name: Confirm address ownership restart completed without ignored errors
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - vpn-honeypot-address-198.51.100.20-lo.service
          - --property=Result
          - --value
      register: honeypot_address_result
      changed_when: false
      failed_when: honeypot_address_result.stdout != 'success'

    - name: Reconfigure the dedicated address
      ansible.builtin.include_role:
        name: honeypot
      vars:
        honeypot_port: 4443
        honeypot_listen_addr: "198.51.100.21"

    - name: Activate the replacement listener
      ansible.builtin.meta: flush_handlers

    - name: Confirm address replacement removed the previous ownership
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, socket, subprocess
            data = json.loads(subprocess.check_output(['ip', '-j', '-4', 'address', 'show', 'dev', 'lo']))
            addresses = {a['local'] for a in data[0]['addr_info']}
            assert '198.51.100.20' not in addresses
            assert '198.51.100.21' in addresses
            assert '127.0.0.1' in addresses
            with socket.create_connection(('198.51.100.21', 4443), timeout=3):
                pass
      changed_when: false

    - name: Revert to primary address listening
      ansible.builtin.include_role:
        name: honeypot
      vars:
        honeypot_port: 4443
        honeypot_listen_addr: "0.0.0.0"

    - name: Activate primary address listening
      ansible.builtin.meta: flush_handlers

    - name: Confirm optional-address retirement preserves primary connectivity
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, socket, subprocess
            from pathlib import Path
            data = json.loads(subprocess.check_output(['ip', '-j', '-4', 'address', 'show', 'dev', 'lo']))
            addresses = {a['local'] for a in data[0]['addr_info']}
            assert not addresses.intersection({'198.51.100.20', '198.51.100.21'})
            assert '127.0.0.1' in addresses
            assert not list(Path('/etc/systemd/system').glob('vpn-honeypot-address-*.service'))
            with socket.create_connection(('127.0.0.1', 4443), timeout=3):
                pass
      changed_when: false
