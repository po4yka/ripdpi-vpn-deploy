---
# Hysteria Realm rendezvous — see defaults/main.yml for rationale. The global
# listener manifest guard in site.yml owns every protocol/port collision.

- name: Pre-flight — sing-box archive sha256 must be pinned in secrets
  ansible.builtin.assert:
    that:
      - (hysteria_realm_secrets.linux_amd64_sha256 | default('') | length) > 0
        or (hysteria_realm_secrets.linux_arm64_sha256 | default('') | length) > 0
      - (hysteria_realm_secrets.auth_token | default('') | length) > 0
    fail_msg: |
      hysteria-realm requires hysteria_realm_secrets.linux_{amd64,arm64}_sha256
      (at least one matching the host architecture) and
      hysteria_realm_secrets.auth_token to be set in the SOPS secrets file.

- name: Set architecture-specific sing-box archive facts
  ansible.builtin.set_fact:
    sing_box_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    sing_box_sha256: >-
      {{ (hysteria_realm_secrets.linux_amd64_sha256
          if ansible_facts['architecture'] == 'x86_64'
          else hysteria_realm_secrets.linux_arm64_sha256 | default('')) }}

- name: SHA256 for current architecture is set
  ansible.builtin.assert:
    that:
      - sing_box_sha256 | length > 0
    fail_msg: "Add hysteria_realm_secrets.linux_{{ sing_box_arch }}_sha256 to your secrets file."

- name: Ensure system user
  # With share_hysteria_tls the TLS material stays owned root:hysteria
  # 0640 in the hysteria role's config dir; grant this service identity
  # read access via an appended supplementary group rather than
  # re-owning or widening the shared PEMs.
  ansible.builtin.user:
    name: hysteria-realm
    system: true
    shell: /usr/sbin/nologin
    home: "{{ hysteria_realm.install_root }}"
    create_home: false
    groups: "{{ ['hysteria'] if (hysteria_realm.share_hysteria_tls | default(true)) else omit }}"
    append: "{{ hysteria_realm.share_hysteria_tls | default(true) }}"

- name: Ensure directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hysteria_realm.config_dir }}"
      owner: root
      group: hysteria-realm
      mode: "0750"
    - path: "{{ hysteria_realm.log_dir }}"
      owner: hysteria-realm
      group: hysteria-realm
      mode: "0750"

- name: Install pinned hysteria-realm runtime through runtime-release
  ansible.builtin.include_role:
    name: runtime-release
  vars:
    runtime_release_version: "{{ hysteria_realm.version }}"
    runtime_release_install_root: "{{ hysteria_realm.install_root }}"
    runtime_release_binary_name: sing-box
    runtime_release_public_link: /usr/local/bin/sing-box-realm
    runtime_release_urls:
      amd64: "{{ hysteria_realm_release_urls.amd64 }}"
      arm64: "{{ hysteria_realm_release_urls.arm64 }}"
    runtime_release_sha256:
      amd64: "{{ hysteria_realm_secrets.linux_amd64_sha256 }}"
      arm64: "{{ hysteria_realm_secrets.linux_arm64_sha256 }}"
    runtime_release_arch_slugs:
      amd64: amd64
      arm64: arm64
    runtime_release_artifact_filename: sing-box.tar.gz
    runtime_release_artifact_type: archive
    runtime_release_archive_members:
      amd64: >-
        sing-box-{{ hysteria_realm.version | regex_replace('^v', '') }}-linux-amd64/sing-box
      arm64: >-
        sing-box-{{ hysteria_realm.version | regex_replace('^v', '') }}-linux-arm64/sing-box
    runtime_release_archive_strip_components: 1

- name: Notify hysteria-realm restart after runtime release activation
  ansible.builtin.debug:
    msg: >-
      hysteria-realm runtime release activation changed={{ runtime_release_changed | bool }}
  changed_when: runtime_release_changed | bool
  notify: Restart hysteria-realm
  when: not ansible_check_mode

- name: Drop TLS material when not sharing the hysteria cert
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: root
    group: hysteria-realm
    mode: "0640"
  loop:
    - content: "{{ hysteria.cert_pem | default('') }}"
      dest: "{{ hysteria_realm.tls_cert_path }}"
    - content: "{{ hysteria.key_pem | default('') }}"
      dest: "{{ hysteria_realm.tls_key_path }}"
  no_log: true
  diff: false
  when:
    - not (hysteria_realm.share_hysteria_tls | default(true))
    - (hysteria.cert_pem | default('') | length) > 0

- name: Stage shared TLS material from hysteria config dir
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ hysteria_config_dir }}/server.fullchain.pem"
      dest: "{{ hysteria_realm.tls_cert_path }}"
    - src: "{{ hysteria_config_dir }}/server.key"
      dest: "{{ hysteria_realm.tls_key_path }}"
  when: hysteria_realm.share_hysteria_tls | default(true)

- name: Render sing-box realm config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ hysteria_realm.config_dir }}/config.json"
    owner: root
    group: hysteria-realm
    mode: "0640"
    validate: /usr/local/bin/sing-box-realm check -c %s
  no_log: true
  diff: false
  notify: Restart hysteria-realm

- name: Install systemd unit
  ansible.builtin.template:
    src: hysteria-realm.service.j2
    dest: /etc/systemd/system/hysteria-realm.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart hysteria-realm

- name: Enable + start hysteria-realm
  ansible.builtin.systemd_service:
    name: hysteria-realm.service
    enabled: true
    state: started
    daemon_reload: true
