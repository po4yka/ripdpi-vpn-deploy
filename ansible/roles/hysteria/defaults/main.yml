---
# Version sentinel — must be overridden in secrets/group_vars.
# The role asserts this is non-empty at task start.
hysteria:
  resource_profile: bandwidth-capped
  version: ""
  linux_amd64_sha256: ""
  linux_arm64_sha256: ""
  cert_pem: ""
  key_pem: ""
  # Masquerade behaviour presented to active probers.
  # 'proxy' (default) forwards unmatched requests to masquerade_url,
  # making the server look like a reverse proxy rather than a VPN endpoint.
  # '404' is the upstream Hysteria2 default but is a well-known fingerprint.
  masquerade_type: "proxy"
  # Override with an operator-owned HTTPS site; production secrets require it.
  masquerade_url: "https://vpn.example.com"

# These remain role-owned rather than secret inputs: versions and digest pins
# come from the Hysteria contract above, while Molecule can supply deterministic
# local artifacts through this narrow consumer seam.
# This immutable identity belongs to the exact stable source and compiler build.
hysteria_runtime_release_version: v2.13.0-go1.27.3
hysteria_release_urls:
  amd64: "https://github.com/po4yka/ripdpi-vpn-deploy/releases/download/runtime-go1.27.3-20261102/hysteria-linux-amd64"
  arm64: "https://github.com/po4yka/ripdpi-vpn-deploy/releases/download/runtime-go1.27.3-20261102/hysteria-linux-arm64"

hysteria_role_enabled: true
