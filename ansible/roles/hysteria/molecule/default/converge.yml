---
- name: Converge Hysteria using genuine pinned runtime-release artifacts
  hosts: all
  become: true
  vars:
    hysteria_install_root: /opt/hysteria
    hysteria_config_dir: /etc/hysteria
    hysteria_log_dir: /var/log/hysteria
    hysteria_port: 443
    hysteria_port_range: ''
    public_site_canonical_url: https://vpn.example.com
    hysteria_release_urls:
      amd64: file:///var/tmp/hysteria-molecule/hysteria-v2.8.2
      arm64: file:///var/tmp/hysteria-molecule/hysteria-v2.8.2-arm64
    hysteria:
      version: v2.8.2
      linux_amd64_sha256: b11bf0fb5f84a3f5c6baff3696e899539e68af4cee868c9203cfb896784ad3b0
      linux_arm64_sha256: 802d77ae3ca37bdc235ec848edfaaa7cb9109007d9044f50b0746239269cb8cf
      cert_pem: '{{ transport_native_hysteria_tls.cert_pem }}'
      key_pem: '{{ transport_native_hysteria_tls.key_pem }}'
      bandwidth_up: 100 mbps
      bandwidth_down: 200 mbps
      masquerade_url: https://vpn.example.com
      salamander_enabled: false
      clients:
        - name: alice
          password: stub-pw-1
        - name: bob
          password: stub-pw-2
    vpn:
      enable_xray_reality: false
      enable_nginx_xhttp: false
      enable_hysteria: true
      enable_warp_outbound: false
      enable_transport_egress: true
      enable_geodata: false
    xray: '{{ transport_native_xray_runtime }}'
  pre_tasks:
    - name: Prepare the shared owned transport canary
      ansible.builtin.import_tasks: ../../../../molecule/tasks/transport-canary.yml
    - name: Create deterministic Hysteria fixture artifacts
      ansible.builtin.file:
        path: /var/tmp/hysteria-molecule
        state: directory
        mode: '0755'
    - name: Pre-create system user (the role itself does this; molecule pre_tasks short-circuit get_url)
      ansible.builtin.user:
        name: hysteria
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/hysteria
        create_home: true
    - name: Fetch verified Hysteria 2.8.2 amd64 fixture
      ansible.builtin.get_url:
        url: https://github.com/HyNetworks/hysteria/releases/download/app/v2.8.2/hysteria-linux-amd64
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.2
        checksum: sha256:b11bf0fb5f84a3f5c6baff3696e899539e68af4cee868c9203cfb896784ad3b0
        owner: root
        group: root
        mode: '0755'
    - name: Fetch verified Hysteria 2.8.2 arm64 fixture
      ansible.builtin.get_url:
        url: https://github.com/HyNetworks/hysteria/releases/download/app/v2.8.2/hysteria-linux-arm64
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.2-arm64
        checksum: sha256:802d77ae3ca37bdc235ec848edfaaa7cb9109007d9044f50b0746239269cb8cf
        owner: root
        group: root
        mode: '0755'
    - name: Fetch verified Hysteria 2.9.0 amd64 fixture
      ansible.builtin.get_url:
        url: https://github.com/HyNetworks/hysteria/releases/download/app/v2.13.0/hysteria-linux-amd64
        dest: /var/tmp/hysteria-molecule/hysteria-v2.13.0
        checksum: sha256:907ba8c9693edb104b20582681fb7dc15639d5b64a9cbb616a7b539190a86691
        owner: root
        group: root
        mode: '0755'
    - name: Fetch verified Hysteria 2.9.0 arm64 fixture
      ansible.builtin.get_url:
        url: https://github.com/HyNetworks/hysteria/releases/download/app/v2.13.0/hysteria-linux-arm64
        dest: /var/tmp/hysteria-molecule/hysteria-v2.13.0-arm64
        checksum: sha256:a68a61a84452ca250ce0368202521965ca9cc9d801a404f1dc9008ac6cf677a7
        owner: root
        group: root
        mode: '0755'
  roles:
    - role: hysteria
  vars_files:
    - ../../../../molecule/vars/transport-native.yml
