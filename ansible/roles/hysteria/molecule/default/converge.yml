---
- name: Converge Hysteria role with deterministic runtime-release artifacts
  hosts: all
  become: true
  vars:
    hysteria_install_root: /opt/hysteria
    hysteria_config_dir: /etc/hysteria
    hysteria_log_dir: /var/log/hysteria
    hysteria_port: 443
    hysteria_port_range: ""
    public_site_canonical_url: "https://vpn.example.test"
    hysteria_release_urls:
      amd64: file:///var/tmp/hysteria-molecule/hysteria-v2.8.2
      arm64: file:///var/tmp/hysteria-molecule/hysteria-v2.8.2-arm64
    hysteria:
      version: "v2.8.2"
      linux_amd64_sha256: "ff2fe5e3c9d0cc3ce2b219580faca6767b2ebe8de43511157b12edbe57ac88fc"
      linux_arm64_sha256: "33cdb04ed03021bf9b67c34e2b15e385b72b596ee72fa481fc897f7fe51579bc"
      cert_pem: |
        -----BEGIN CERTIFICATE-----
        STUB_CERT_FOR_MOLECULE
        -----END CERTIFICATE-----
      key_pem: |
        -----BEGIN PRIVATE KEY-----
        STUB_KEY_FOR_MOLECULE
        -----END PRIVATE KEY-----
      bandwidth_up: "100 mbps"
      bandwidth_down: "200 mbps"
      masquerade_url: "https://vpn.example.test"
      salamander_enabled: false
      clients:
        - name: alice
          password: stub-pw-1
        - name: bob
          password: stub-pw-2
  pre_tasks:
    - name: Create deterministic Hysteria fixture artifacts
      ansible.builtin.file:
        path: /var/tmp/hysteria-molecule
        state: directory
        mode: "0755"

    - name: Write deterministic Hysteria v2.8.2 artifact
      ansible.builtin.copy:
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.2
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "server" ]; then
            trap 'exit 0' TERM INT
            while true; do
              sleep 3600 &
              wait $!
            done
          fi
          printf '%s\n' 'v2.8.2'
          exit 0

    - name: Write deterministic Hysteria v2.8.3 artifact
      ansible.builtin.copy:
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.3
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "server" ]; then
            trap 'exit 0' TERM INT
            while true; do
              sleep 3600 &
              wait $!
            done
          fi
          printf '%s\n' 'v2.8.3'
          exit 0

    - name: Write deterministic Hysteria v2.8.2 arm64 artifact
      ansible.builtin.copy:
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.2-arm64
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "server" ]; then
            trap 'exit 0' TERM INT
            while true; do
              sleep 3600 &
              wait $!
            done
          fi
          printf '%s\n' 'v2.8.2-arm64'
          exit 0

    - name: Write deterministic Hysteria v2.8.3 arm64 artifact
      ansible.builtin.copy:
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.3-arm64
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "server" ]; then
            trap 'exit 0' TERM INT
            while true; do
              sleep 3600 &
              wait $!
            done
          fi
          printf '%s\n' 'v2.8.3-arm64'
          exit 0

    - name: Write deterministic Hysteria v2.8.4 artifact
      ansible.builtin.copy:
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.4
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "server" ]; then
            trap 'exit 0' TERM INT
            while true; do
              sleep 3600 &
              wait $!
            done
          fi
          printf '%s\n' 'v2.8.4'
          exit 0

    - name: Write deterministic Hysteria v2.8.4 arm64 artifact
      ansible.builtin.copy:
        dest: /var/tmp/hysteria-molecule/hysteria-v2.8.4-arm64
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "server" ]; then
            trap 'exit 0' TERM INT
            while true; do
              sleep 3600 &
              wait $!
            done
          fi
          printf '%s\n' 'v2.8.4-arm64'
          exit 0

    - name: Pre-create system user (the role itself does this; molecule pre_tasks short-circuit get_url)
      ansible.builtin.user:
        name: hysteria
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/hysteria
        create_home: true
  # Use `roles:` (static binding) so the role's handlers (Restart
  # hysteria, Reload systemd) register with the play and notify
  # resolves correctly.
  roles:
    - role: hysteria
