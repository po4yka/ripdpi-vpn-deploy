---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-hysteria-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:f3ca174e84d53f68cd87abdcc1f585d295e7f76b855546e17c2c6ec9aeffec4f
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    host_vars:
      vpn-hysteria-debian13:
        ansible_user: root
        # The node-local masquerade origin of vpn-p2-udp: prepare.yml publishes the
        # tree as the public-site publisher would; the TCP listeners serve it.
        hysteria_masquerade_tcp: true
        hysteria_public_site_dir: /srv/molecule-site-bundle
        public_site_published:
          /srv/molecule-site-bundle: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
