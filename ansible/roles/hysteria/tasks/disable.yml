---
- name: Select standalone frontend retirement topology
  ansible.builtin.set_fact:
    vpn: "{{ vpn | combine({'enable_hysteria': false}) }}"
  when: not (transport_egress_prepared | default(false) | bool)

- name: Prepare remaining protected route before standalone retirement
  ansible.builtin.include_role:
    name: transport-egress
    tasks_from: prepare-site
  when: not (transport_egress_prepared | default(false) | bool)

- name: Retire hysteria runtime authority
  ansible.builtin.include_role:
    name: runtime-release
    tasks_from: retire
  vars:
    runtime_retire_units:
      - hysteria-server.service
    runtime_retire_paths:
      - /etc/systemd/system/hysteria-server.service
      - '{{ hysteria_config_dir }}/config.yaml'
      - '{{ hysteria_config_dir }}/config.yaml.prev'
      - '{{ hysteria_config_dir }}/server.fullchain.pem'
      - '{{ hysteria_config_dir }}/server.key'
      - '{{ hysteria_config_dir }}/ech.key'
