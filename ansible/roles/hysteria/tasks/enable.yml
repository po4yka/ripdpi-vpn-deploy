---
# P2 transport: Hysteria2 over QUIC/HTTP3 on UDP/443. Pinned release activation
# is delegated to runtime-release so current/public/previous links and receipts
# share one serialized transaction.

- name: Preflight hysteria input semantics
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-input-preflight.yml"
  vars:
    transport_input_sections: [hysteria, egress]

- name: Derive private masquerade origin resolution without global host changes
  ansible.builtin.command:
    argv:
      - '{{ ansible_playbook_python }}'
      - -c
      - '{{ lookup("ansible.builtin.file", role_path ~ "/files/masquerade_hosts.py") }}'
    stdin: >-
      {{ {'origin': hysteria.masquerade_url, 'server_name': nginx_xhttp.server_name | default(''),
          'nginx_enabled': vpn.enable_nginx_xhttp | default(true) | bool,
          'service_address': vpn_service_address | default('')} | to_json }}
  delegate_to: localhost
  become: false
  register: _hysteria_masquerade_projection
  changed_when: false
  check_mode: false
  no_log: true

- name: Retain scoped private origin resolution authority
  ansible.builtin.set_fact:
    hysteria_masquerade_hosts: '{{ _hysteria_masquerade_projection.stdout | from_json }}'
  no_log: true

- name: Prepare guarded topology for standalone frontend convergence
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-egress-prepare.yml"
  when: not (transport_egress_prepared | default(false) | bool)

- name: Pre-flight — hysteria version must be pinned
  ansible.builtin.assert:
    that:
      - hysteria.version | default('') | length > 0
    fail_msg: >-
      hysteria.version is empty. Set hysteria.version (and the matching
      linux_amd64_sha256 / linux_arm64_sha256) in your secrets file or
      group_vars before running this role.

- name: Pre-flight — masquerade must use an owned HTTPS origin
  ansible.builtin.assert:
    that:
      - hysteria.masquerade_url == public_site_canonical_url
    fail_msg: Set hysteria.masquerade_url to public_site_canonical_url so probes see the owned public site.

- name: Install Hysteria configuration validation dependency
  ansible.builtin.apt:
    name: python3-yaml
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create hysteria system user
  ansible.builtin.user:
    name: hysteria
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/hysteria
    create_home: true

- name: Ensure hysteria directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hysteria_config_dir }}"
      mode: "0750"
      owner: root
      group: hysteria
    - path: "{{ hysteria_log_dir }}"
      mode: "0750"
      owner: hysteria
      group: hysteria

- name: Install pinned Hysteria release through runtime-release
  ansible.builtin.include_role:
    name: runtime-release
  vars:
    runtime_release_stage_only: true
    runtime_release_version: "{{ hysteria.version }}"
    runtime_release_install_root: "{{ hysteria_install_root }}"
    runtime_release_binary_name: hysteria
    runtime_release_public_link: /usr/local/bin/hysteria
    runtime_release_urls:
      amd64: "{{ hysteria_release_urls.amd64 }}"
      arm64: "{{ hysteria_release_urls.arm64 }}"
    runtime_release_sha256:
      amd64: "{{ hysteria.linux_amd64_sha256 | default('') }}"
      arm64: "{{ hysteria.linux_arm64_sha256 | default('') }}"
    runtime_release_arch_slugs:
      amd64: amd64
      arm64: arm64
    runtime_release_artifact_filename: hysteria
    runtime_release_artifact_type: binary

- name: Retain staged selection in the transport plan
  ansible.builtin.set_fact:
    transport_runtime_candidates: >-
      {{ (transport_runtime_candidates | default([])) + runtime_release_candidates }}

- name: Validate Hysteria candidate before quiescing the accepted route
  # Private candidates are removed below; accepted publication reports runtime changes.
  when: not ansible_check_mode
  block:
    - name: Allocate an owned private Hysteria validation candidate
      ansible.builtin.tempfile:
        state: directory
        suffix: .hysteria-validation
      register: _hysteria_validation_candidate
      changed_when: false
      no_log: true

    - name: Stage candidate validator with its exact semantic companion privately
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ _hysteria_validation_candidate.path }}/{{ item.name }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - {source: "{{ role_path }}/../../../scripts/transport_semantics.py", name: transport_semantics.py}
        - {source: "{{ role_path }}/../runtime-release/files/validate_yaml_mapping.py", name: validate_yaml_mapping.py}
      changed_when: false

    - name: Prove guarded Hysteria candidate admission
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ _hysteria_validation_candidate.path }}/config.yaml"
        owner: root
        group: root
        mode: '0600'
        validate: /usr/bin/python3 {{ _hysteria_validation_candidate.path }}/validate_yaml_mapping.py --profile hysteria %s
      no_log: true
      diff: false
      changed_when: false
  always:
    - name: Remove only the owned Hysteria validation candidate
      ansible.builtin.file:
        path: "{{ _hysteria_validation_candidate.path }}"
        state: absent
      no_log: true
      changed_when: false
      when: _hysteria_validation_candidate.path is defined

- name: Detect Hysteria frontend authority change before publication
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {source: config.yaml.j2, destination: "{{ hysteria_config_dir }}/config.yaml", group: hysteria, mode: '0640'}
    - {source: hysteria-server.service.j2, destination: /etc/systemd/system/hysteria-server.service, group: root, mode: '0644'}
  check_mode: true
  register: _hysteria_frontend_change
  no_log: true
  diff: false

- name: Detect private masquerade hosts change before publication
  ansible.builtin.copy:
    content: '{{ hysteria_masquerade_hosts.content }}'
    dest: '{{ hysteria_config_dir }}/masquerade-hosts'
    owner: root
    group: hysteria
    mode: '0640'
  check_mode: true
  register: _hysteria_hosts_change
  no_log: true
  diff: false

- name: Detect Hysteria TLS authority change before publication
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.destination }}"
    owner: root
    group: hysteria
    mode: '0640'
  loop:
    - {content: "{{ hysteria.cert_pem }}", destination: "{{ hysteria_config_dir }}/server.fullchain.pem"}
    - {content: "{{ hysteria.key_pem }}", destination: "{{ hysteria_config_dir }}/server.key"}
  check_mode: true
  register: _hysteria_tls_change
  no_log: true
  diff: false

- name: Detect Hysteria ECH authority change without publication
  ansible.builtin.copy:
    content: "{{ hysteria.ech.keys_pem }}"
    dest: "{{ hysteria_config_dir }}/ech.key"
    owner: root
    group: root
    mode: '0600'
  check_mode: true
  no_log: true
  diff: false
  when: hysteria.ech is defined

- name: Detect Hysteria validator authority changes without publication
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - source: "{{ role_path }}/../../../scripts/transport_semantics.py"
      destination: /usr/local/libexec/transport_semantics.py
      mode: '0644'
    - source: "{{ role_path }}/../runtime-release/files/validate_yaml_mapping.py"
      destination: /usr/local/libexec/ripdpi-validate-yaml-mapping
      mode: '0755'
  check_mode: true
  register: _hysteria_validator_change

- name: Stage complete Hysteria authority for guarded consumer acceptance
  ansible.builtin.set_fact:
    transport_runtime_candidates: >-
      {{ (transport_runtime_candidates | default([])) + [
         {'path': hysteria_config_dir ~ '/config.yaml', 'mode': 416,
          'gid': transport_egress_frontend_gids.hysteria | int,
          'data': lookup('ansible.builtin.template', 'config.yaml.j2') | b64encode},
         {'path': '/etc/systemd/system/hysteria-server.service', 'mode': 420, 'gid': 0,
          'data': lookup('ansible.builtin.template', 'hysteria-server.service.j2') | b64encode},
         {'path': hysteria_config_dir ~ '/masquerade-hosts', 'mode': 416,
          'gid': transport_egress_frontend_gids.hysteria | int, 'data': hysteria_masquerade_hosts.content | b64encode},
         {'path': hysteria_config_dir ~ '/server.fullchain.pem', 'mode': 416,
          'gid': transport_egress_frontend_gids.hysteria | int, 'data': hysteria.cert_pem | b64encode},
         {'path': hysteria_config_dir ~ '/server.key', 'mode': 416,
          'gid': transport_egress_frontend_gids.hysteria | int, 'data': hysteria.key_pem | b64encode},
         {'path': '/usr/local/libexec/transport_semantics.py', 'mode': 420, 'gid': 0,
          'data': lookup('ansible.builtin.file', role_path ~ '/../../../scripts/transport_semantics.py', rstrip=false) | b64encode},
         {'path': '/usr/local/libexec/ripdpi-validate-yaml-mapping', 'mode': 493, 'gid': 0,
          'data': lookup('ansible.builtin.file',
                         role_path ~ '/../runtime-release/files/validate_yaml_mapping.py', rstrip=false) | b64encode}
         ] + ([{'path': hysteria_config_dir ~ '/ech.key', 'mode': 384, 'gid': 0,
                 'data': hysteria.ech.keys_pem | b64encode}] if hysteria.ech is defined
                 else [{'path': hysteria_config_dir ~ '/ech.key', 'absent': true}]) }}
  no_log: true
  diff: false
  when: not (transport_egress_fresh_check_mode | default(false) | bool)

- name: Activate guarded standalone frontend generation
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-egress-activate.yml"
  when: not (transport_egress_site_staging | default(false) | bool)
