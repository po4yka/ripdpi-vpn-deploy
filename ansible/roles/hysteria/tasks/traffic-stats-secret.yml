---
# The Traffic Stats API secret is generated on the node and never leaves it:
# no SOPS key, no controller file, only the root-only file and the rendered config.
- name: Inspect the node-local Hysteria traffic API secret
  ansible.builtin.stat:
    path: "{{ hysteria_config_dir }}/traffic-stats.secret"
    follow: false
  register: _hysteria_traffic_secret_file

- name: Refuse a redirected Hysteria traffic API secret
  ansible.builtin.assert:
    that:
      - >-
        not _hysteria_traffic_secret_file.stat.exists
        or (_hysteria_traffic_secret_file.stat.isreg and _hysteria_traffic_secret_file.stat.uid == 0
            and _hysteria_traffic_secret_file.stat.mode == '0600')
    fail_msg: hysteria-traffic-secret-unsafe

- name: Generate the node-local Hysteria traffic API secret
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os, secrets, sys;
        fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600);
        os.write(fd, secrets.token_urlsafe(32).encode()); os.fsync(fd); os.close(fd)
      - "{{ hysteria_config_dir }}/traffic-stats.secret"
    creates: "{{ hysteria_config_dir }}/traffic-stats.secret"
  when: not _hysteria_traffic_secret_file.stat.exists

- name: Read the node-local Hysteria traffic API secret
  ansible.builtin.slurp:
    src: "{{ hysteria_config_dir }}/traffic-stats.secret"
  register: _hysteria_traffic_secret
  no_log: true
  when: _hysteria_traffic_secret_file.stat.exists or not ansible_check_mode

- name: Retain the Hysteria traffic API secret for configuration rendering
  ansible.builtin.set_fact:
    # Check mode on a fresh node cannot create the file; it predicts a changed configuration.
    hysteria_traffic_stats_secret: >-
      {{ (_hysteria_traffic_secret.content | b64decode | trim)
         if _hysteria_traffic_secret.content is defined else 'check-mode-secret-not-yet-generated' }}
  no_log: true
