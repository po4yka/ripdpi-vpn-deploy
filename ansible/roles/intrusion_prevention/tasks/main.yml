---
- name: Validate explicit intrusion-prevention lifecycle selection
  ansible.builtin.assert:
    that: intrusion_prevention_role_enabled is boolean

- name: Resolve effective sshd enforcement selection
  ansible.builtin.set_fact:
    _intrusion_prevention_effective_enabled: >-
      {{ intrusion_prevention_role_enabled and (intrusion_prevention.sshd.enabled | default(true)) }}

- name: Converge enabled intrusion-prevention policy
  ansible.builtin.include_tasks: enable.yml
  when: _intrusion_prevention_effective_enabled

- name: Retire only owned sshd enforcement
  ansible.builtin.include_tasks: disable.yml
  when: not _intrusion_prevention_effective_enabled
