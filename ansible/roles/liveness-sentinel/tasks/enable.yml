---
- name: Select the pinned artifact architecture
  ansible.builtin.set_fact:
    _liveness_sentinel_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default('') }}"
    liveness_sentinel_expected_runtime: {}

- name: Assert the sentinel contract
  ansible.builtin.assert:
    that:
      - _liveness_sentinel_arch | length > 0
      # The offline AWG installer links awg commands into /usr/local/bin, which the family amneziawg role owns.
      # Same predicate as the amneziawg import in playbooks/site.yml (enabled unless the toggle says otherwise).
      - >-
        not (liveness_sentinel_install_awg | bool
        and (vpn.enable_amneziawg | default(true)) and not (vpn_subscription_only | default(false)))
    fail_msg: liveness-sentinel needs a supported architecture and no family amneziawg on the same node.

# Every controller-side AWG input is validated before the first host change, in check mode too.
- name: Validate the AWG inputs and resolve the source correction
  ansible.builtin.include_tasks: awg-preflight.yml
  when: liveness_sentinel_install_awg | bool

# The native probe reads engines only from this fixed directory (scripts/vpn-protocol-liveness.py ENGINE_BIN);
# another prefix would leave the probe on PATH binaries.
- name: Require the prefix the native probe reads
  ansible.builtin.assert:
    that:
      - liveness_sentinel_prefix == '/opt/ripdpi-liveness-sentinel'
    fail_msg: liveness-sentinel installs engines only under /opt/ripdpi-liveness-sentinel, where the native probe reads them.

- name: Install sentinel prerequisites without upgrading unrelated packages
  ansible.builtin.apt:
    name: >-
      {{ liveness_sentinel_packages
         + ((liveness_sentinel_awg_build_packages + [liveness_sentinel_go_package]) if liveness_sentinel_install_awg | bool else []) }}
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Verify the probe's host tools are present
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [ip, -V]
    - [curl, --version]
    - [python3, --version]
  changed_when: false

- name: Create the role-owned prefix
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ '0700' if item.endswith('/staging') else '0755' }}"
  loop:
    - "{{ liveness_sentinel_prefix }}"
    - "{{ liveness_sentinel_prefix }}/bin"
    - "{{ liveness_sentinel_prefix }}/state"
    - "{{ liveness_sentinel_prefix }}/staging"

- name: Install each pinned engine
  ansible.builtin.include_tasks: engine.yml
  loop: "{{ liveness_sentinel_engines | dict2items }}"
  loop_control:
    loop_var: _liveness_engine
    label: "{{ _liveness_engine.key }}"
  when: not ansible_check_mode

- name: Install the immutable AWG client toolchain
  ansible.builtin.include_tasks: awg.yml
  when: liveness_sentinel_install_awg | bool and not ansible_check_mode

- name: Publish the installed expected_runtime pins
  ansible.builtin.copy:
    content: "{{ liveness_sentinel_expected_runtime | to_nice_json(sort_keys=True) }}\n"
    dest: "{{ liveness_sentinel_prefix }}/expected-runtime.json"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode
