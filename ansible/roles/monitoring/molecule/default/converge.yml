---
- name: Converge monitoring role
  hosts: all
  become: true
  vars:
    xray_log_dir: /var/log/xray
    xray_api_listen: 127.0.0.1:10086
    vpn:
      enable_xray_reality: true
      enable_nginx_xhttp: false
      enable_honeypot: true
  pre_tasks:
    - name: Create synthetic Xray runtime account
      ansible.builtin.user:
        name: xray
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/xray
        create_home: true

    - name: Install synthetic Xray StatsService client
      ansible.builtin.copy:
        dest: /usr/local/bin/xray
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = "api" ] && [ "$2" = "statsquery" ]; then
            printf '%s\n' '{"stat":[{"name":"inbound>>>vless-reality>>>traffic>>>uplink","value":"1024"}]}'
            exit 0
          fi
          exit 2

    - name: Install synthetic active Xray service
      ansible.builtin.copy:
        dest: /etc/systemd/system/xray.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Synthetic active Xray service for monitoring tests
          [Service]
          Type=simple
          ExecStart=/bin/sleep infinity

    - name: Start synthetic Xray service
      ansible.builtin.systemd_service:
        name: xray.service
        enabled: true
        state: started
        daemon_reload: true
  roles:
    - role: honeypot
    - role: monitoring
