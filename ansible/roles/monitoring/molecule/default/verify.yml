---
- name: Verify monitoring role
  hosts: all
  become: true
  tasks:
    - name: node_exporter installed
      ansible.builtin.stat:
        path: /usr/bin/prometheus-node-exporter
      register: ne
      failed_when: not ne.stat.exists

    - name: node_exporter listens on loopback only
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q '127.0.0.1:9100' /etc/default/prometheus-node-exporter
          grep -q -- '--collector.textfile.directory=/var/lib/node_exporter/textfile' /etc/default/prometheus-node-exporter
        executable: /bin/bash
      changed_when: false

    - name: node_exporter runs with systemd and textfile collectors enabled
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pid="$(systemctl show prometheus-node-exporter -p MainPID --value)"
          tr '\0' '\n' < "/proc/${pid}/cmdline" | grep -q -- '--collector.systemd'
          tr '\0' '\n' < "/proc/${pid}/cmdline" | grep -q -- '--collector.textfile.directory=/var/lib/node_exporter/textfile'
        executable: /bin/bash
      changed_when: false

    - name: node_exporter belongs to the protected textfile reader group
      ansible.builtin.command:
        cmd: id -nG prometheus
      register: node_exporter_groups
      changed_when: false
      failed_when: "'node_exporter_textfile' not in node_exporter_groups.stdout.split()"

    - name: Textfile directory preserves honeypot write access
      ansible.builtin.stat:
        path: /var/lib/node_exporter/textfile
      register: textfile_dir
      failed_when: >-
        textfile_dir.stat.pw_name != 'root' or
        textfile_dir.stat.gr_name != 'node_exporter_textfile' or
        textfile_dir.stat.mode != '3775'

    - name: Xray stats exporter timer is enabled and active
      ansible.builtin.command:
        cmd: systemctl is-enabled --quiet xray-stats-exporter.timer
      changed_when: false

    - name: Xray stats exporter timer is running
      ansible.builtin.command:
        cmd: systemctl is-active --quiet xray-stats-exporter.timer
      changed_when: false

    - name: Xray stats exporter emits redacted counters
      ansible.builtin.command:
        cmd: >-
          grep -q
          'vpn_xray_inbound_traffic_bytes_total{inbound="vless-reality",direction="uplink"} 1024'
          /var/lib/node_exporter/textfile/vpn_xray.prom
      changed_when: false

    - name: Inspect Xray diagnostic textfile permissions
      ansible.builtin.stat:
        path: /var/lib/node_exporter/textfile/vpn_xray.prom
      register: xray_stats_textfile
      failed_when: >-
        not xray_stats_textfile.stat.exists or
        xray_stats_textfile.stat.pw_name != 'xray' or
        xray_stats_textfile.stat.gr_name != 'node_exporter_textfile' or
        xray_stats_textfile.stat.mode != '0640'

    - name: node_exporter reads the protected Xray metric
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_metrics
      failed_when: >-
        'vpn_xray_inbound_traffic_bytes_total{direction="uplink",inbound="vless-reality"} 1024'
        not in node_exporter_metrics.content

    - name: Xray collector API and output stay local and redacted
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q -- '--server 127.0.0.1:10086' /etc/systemd/system/xray-stats-exporter.service
          grep -q 'vpn_xray_stats_collection_success 1' /var/lib/node_exporter/textfile/vpn_xray.prom
          ! grep -q 'user>>>' /var/lib/node_exporter/textfile/vpn_xray.prom
        executable: /bin/bash
      changed_when: false

    - name: Honeypot user can create and remove its textfile metric
      ansible.builtin.command:
        cmd: |
          runuser -u honeypot -- sh -c '
            metric=/var/lib/node_exporter/textfile/vpn_honeypot.prom
            printf "vpn_honeypot_events_total 0\\n" > "$metric"
            rm "$metric"
          '
      changed_when: false

    - name: journald hardening config present
      ansible.builtin.stat:
        path: /etc/systemd/journald.conf.d/vpn.conf
      register: jc
      failed_when: not jc.stat.exists

    - name: logrotate xray config present
      ansible.builtin.stat:
        path: /etc/logrotate.d/xray
      register: lr
      failed_when: not lr.stat.exists

    - name: Inspect nginx logrotate ownership
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/logrotate.d/nginx
        - /etc/logrotate.d/nginx-vpn
      register: nginx_logrotate_files

    - name: Nginx logs have one package-wide rotation policy
      ansible.builtin.assert:
        that:
          - nginx_logrotate_files.results[0].stat.exists
          - not nginx_logrotate_files.results[1].stat.exists

    - name: Nginx rotation policy covers the complete log directory
      ansible.builtin.command:
        cmd: grep -Fq '/var/log/nginx/*.log {' /etc/logrotate.d/nginx
      changed_when: false
