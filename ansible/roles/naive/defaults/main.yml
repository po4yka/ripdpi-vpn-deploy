---
# NaiveProxy as an alternative P1 transport. Mutually exclusive with
# nginx-xhttp on the same host (both want 443/tcp). Off by default.

naive:
  # Build the Caddy + forwardproxy@naive binary on first install. Subsequent
  # runs use the pinned binary at /usr/local/bin/caddy-naive.
  build_with_xcaddy: true
  # Pin xcaddy version for reproducibility.
  xcaddy_version: "v0.4.5"
  # Caddy version that xcaddy will pin during build. The role passes this as
  # the `--caddy=` flag.
  caddy_version: "v2.11.2"
  # Forwardproxy fork (klzgrad's naive-enhanced fork).
  forwardproxy_module: "github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@d62c80d3dd2c706b6b87579844d2397bddd18317"
  install_dir: /opt/naive
  config_dir: /etc/naive
  log_dir: /var/log/naive
  bind_port: "{{ naive_bind_port }}" # must be 443 to look like a real HTTPS site
  decoy_root: /var/www/naive-decoy
  # Required post-build sha256 of the caddy-naive binary. When set the
  # role asserts the freshly-built binary matches this hash so a supply-chain
  # substitution in xcaddy/forwardproxy is caught at deploy time. Compute
  # after a trusted first build:
  #   sha256sum /usr/local/bin/caddy-naive
  # Set this from a trusted reproducible build before enabling the role.
  xcaddy_sha256: ""
