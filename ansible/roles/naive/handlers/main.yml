---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart caddy-naive
  ansible.builtin.systemd_service:
    name: caddy-naive
    state: restarted
  when: naive_role_enabled | bool and not ansible_check_mode

- name: Wait for caddy-naive to become active
  ansible.builtin.command:
    cmd: systemctl is-active caddy-naive.service
  register: naive_active
  retries: 5
  delay: 2
  until: naive_active.stdout == "active"
  changed_when: false
  when: naive_role_enabled | bool and not ansible_check_mode
  listen: Restart caddy-naive
