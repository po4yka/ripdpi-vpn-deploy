---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-naive-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:3eaa352852855158e752c94f2ea9b47aa03ba014d5ea3e51c06e74c45a57ad08
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    host_vars:
      vpn-naive-debian13:
        ansible_user: root
  config_options:
    defaults:
      callback_result_format: yaml

verifier:
  name: ansible

# The source-build path needs Go and network. This scenario instead binds an
# explicitly supplied synthetic binary to its digest with source builds
# disabled, then verifies the surrounding role contract.
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - destroy
