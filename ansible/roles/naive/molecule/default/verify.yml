---
# Verify naive molecule scenario.
# Asserts:
#   1. native JSON configuration is present at expected path (/etc/naive/caddy.json).
#   2. native JSON configuration contains expected NaiveProxy upstream (forward_proxy) block.
#   3. xcaddy version matches the pinned value from defaults/main.yml.
#   4. the digest-bound operator-supplied fixture remains executable.
# Live xcaddy build is outside this scenario and requires separate evidence.

- name: Verify naive role
  hosts: all
  become: true
  tasks:
    - name: Inspect exact service-owned log inodes
      ansible.builtin.stat:
        path: "/var/log/naive/{{ item }}"
        follow: false
      loop:
        - access.log
        - site-error.log
      register: naive_logs

    - name: Require private appendable logs for the dedicated service
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.nlink == 1
          - item.stat.pw_name == 'naive'
          - item.stat.gr_name == 'naive'
          - item.stat.mode == '0640'
      loop: "{{ naive_logs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require actual canonical service activation
      ansible.builtin.command:
        argv: [systemctl, is-active, caddy-naive.service]
      changed_when: false

    - name: native JSON configuration is present at expected path
      ansible.builtin.stat:
        path: /etc/naive/caddy.json
      register: caddyfile_stat
      failed_when: not caddyfile_stat.stat.exists

    - name: native JSON configuration has restrictive permissions (group naive can read)
      ansible.builtin.assert:
        that:
          - caddyfile_stat.stat.mode == "0640"
        fail_msg: "native JSON configuration mode is {{ caddyfile_stat.stat.mode }}, expected 0640"

    - name: Read native JSON configuration content
      ansible.builtin.slurp:
        src: /etc/naive/caddy.json
      register: caddyfile_raw

    - name: Decode native JSON configuration
      ansible.builtin.set_fact:
        caddyfile_text: "{{ caddyfile_raw.content | b64decode }}"

    - name: native JSON configuration contains forward_proxy block (NaiveProxy upstream)
      ansible.builtin.assert:
        that:
          - caddyfile_text is search('forward_proxy')
        fail_msg: "forward_proxy directive missing from native JSON configuration"

    - name: native JSON configuration contains per-device authentication array
      ansible.builtin.assert:
        that:
          - caddyfile_text is search('auth_credentials')
        fail_msg: "auth_credentials missing from native JSON configuration forward_proxy block"

    - name: native JSON configuration contains probe_resistance directive
      ansible.builtin.assert:
        that:
          - caddyfile_text is search('probe_resistance')
        fail_msg: "probe_resistance missing from native JSON configuration"

    - name: native JSON configuration contains hide_ip directive
      ansible.builtin.assert:
        that:
          - caddyfile_text is search('hide_ip')
        fail_msg: "hide_ip missing from native JSON configuration"

    - name: native JSON configuration references TLS cert and key paths
      ansible.builtin.assert:
        that:
          - caddyfile_text is search('/etc/naive/server.fullchain.pem')
          - caddyfile_text is search('/etc/naive/server.key')
        fail_msg: "TLS cert/key paths missing or wrong in native JSON configuration"

    - name: caddy-naive binary is present
      ansible.builtin.stat:
        path: /usr/local/bin/caddy-naive
      register: caddy_naive_bin
      failed_when: not caddy_naive_bin.stat.exists

    - name: caddy-naive binary is executable
      ansible.builtin.assert:
        that:
          - caddy_naive_bin.stat.executable
        fail_msg: "caddy-naive is not executable"

    - name: Systemd unit for caddy-naive is present
      ansible.builtin.stat:
        path: /etc/systemd/system/caddy-naive.service
      register: naive_unit
      failed_when: not naive_unit.stat.exists

    - name: Naive config directory has correct group ownership
      ansible.builtin.stat:
        path: /etc/naive
      register: naive_dir
      failed_when: not naive_dir.stat.exists

    - name: Naive config dir is accessible to naive group
      ansible.builtin.assert:
        that:
          - naive_dir.stat.gr_name == "naive"
        fail_msg: "Expected /etc/naive group=naive, got {{ naive_dir.stat.gr_name }}"
