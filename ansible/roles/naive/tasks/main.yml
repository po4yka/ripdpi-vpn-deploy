---
- name: Prepare retained naive credential revocation admission
  ansible.builtin.include_role:
    name: runtime-release
    tasks_from: revocation-prepare
  vars:
    device_revocation_unit: caddy-naive.service

- name: Inspect existing naive unit before arming its boot fence
  ansible.builtin.stat:
    path: /etc/systemd/system/caddy-naive.service
    follow: false
  register: _device_revocation_unit_before

- name: Install revocation start admission before changing existing naive credentials
  ansible.builtin.template:
    src: caddy-naive.service.j2
    dest: /etc/systemd/system/caddy-naive.service
    owner: root
    group: root
    mode: '0644'
  when:
    - vpn_device_revocation | default(none) is not none
    - _device_revocation_unit_before.stat.exists

- name: Reconcile naive authority under its retained revocation fence
  block:
    - name: Reconcile naive runtime lifecycle
      ansible.builtin.include_tasks: "{{ 'enable.yml' if naive_role_enabled | bool else 'disable.yml' }}"
  rescue:
    - name: Stop naive after an unacknowledged revocation
      ansible.builtin.include_role:
        name: runtime-release
        tasks_from: revocation-barrier
      vars:
        device_revocation_unit: caddy-naive.service
        device_revocation_action: abort
    - name: Refuse incomplete naive authority
      ansible.builtin.fail:
        msg: naive-runtime-activation-failed
