---
- name: Verify nginx-xhttp role
  hosts: all
  become: true
  tasks:
    - name: nginx -t
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Site is enabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/vpn-xhttp.conf
      register: site
      failed_when: not site.stat.exists or not site.stat.islnk

    - name: TLS material present with safe perms
      ansible.builtin.stat:
        path: /etc/nginx/tls/vpn.example.test.key
      register: keyf
      failed_when: keyf.stat.mode != "0600"

    - name: Default site is disabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site
      failed_when: default_site.stat.exists

    - name: Site config references the XHTTP path
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q '/app-sync/' /etc/nginx/sites-available/vpn-xhttp.conf
        executable: /bin/bash
      changed_when: false

    - name: Site listens on configured public port and proxies to localhost XHTTP
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'listen 8443 ssl http2;' /etc/nginx/sites-available/vpn-xhttp.conf
          grep -q 'proxy_pass http://127.0.0.1:10085;' /etc/nginx/sites-available/vpn-xhttp.conf
          grep -q 'ssl_protocols       TLSv1.3;' /etc/nginx/sites-available/vpn-xhttp.conf
          ! grep -q 'TLSv1.2' /etc/nginx/sites-available/vpn-xhttp.conf
        executable: /bin/bash
      changed_when: false

    - name: Public site content is installed
      ansible.builtin.stat:
        path: /var/www/public-site/index.html
      register: public_site
      failed_when: not public_site.stat.exists or not public_site.stat.isreg

    - name: HTTP redirects to the configured HTTPS listener
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: vpn.example.test' http://127.0.0.1/)" = 301
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' \
            --header 'Host: vpn.example.test' http://127.0.0.1/)" = https://vpn.example.test:8443/
        executable: /bin/bash
      changed_when: false

    - name: HTTPS GET and HEAD return the public site
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl --silent --show-error --fail --insecure \
            --resolve vpn.example.test:8443:127.0.0.1 \
            https://vpn.example.test:8443/ | grep -q 'LLM Model Notes'
          test "$(curl --silent --insecure --head --output /dev/null --write-out '%{http_code}' \
            --resolve vpn.example.test:8443:127.0.0.1 \
            https://vpn.example.test:8443/about.html)" = 200
          for path in \
            notes/reading-benchmark-results.html \
            notes/latency-throughput-context.html \
            notes/repeatable-model-comparisons.html; do
            test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
              --resolve vpn.example.test:8443:127.0.0.1 \
              "https://vpn.example.test:8443/${path}")" = 200
          done
          curl --silent --show-error --fail --insecure \
            --resolve vpn.example.test:8443:127.0.0.1 \
            https://vpn.example.test:8443/ | grep -q '/notes/reading-benchmark-results.html'
        executable: /bin/bash
      changed_when: false

    - name: Public responses carry the hardened header set
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          headers="$(curl --silent --insecure --head \
            --resolve vpn.example.test:8443:127.0.0.1 \
            https://vpn.example.test:8443/)"
          grep -qi '^Content-Security-Policy:' <<<"$headers"
          grep -qi '^Permissions-Policy:' <<<"$headers"
          grep -qi '^Referrer-Policy:' <<<"$headers"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
        executable: /bin/bash
      changed_when: false

    - name: Missing and forbidden paths return the normal site 404
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          test "$(curl --silent --insecure --output /tmp/site-404.html --write-out '%{http_code}' \
            --resolve vpn.example.test:8443:127.0.0.1 \
            https://vpn.example.test:8443/not-present)" = 404
          grep -q 'Page not found' /tmp/site-404.html
          for path in health status metrics admin .well-known/security.txt; do
            test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
              --resolve vpn.example.test:8443:127.0.0.1 \
              "https://vpn.example.test:8443/${path}")" = 404
          done
        executable: /bin/bash
      changed_when: false

    - name: Discovery files are publicly readable
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for path in robots.txt sitemap.xml favicon.svg; do
            test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
              --resolve vpn.example.test:8443:127.0.0.1 \
              "https://vpn.example.test:8443/${path}")" = 200
          done
        executable: /bin/bash
      changed_when: false

    - name: Site has no Cloudflare-specific real_ip directives (RU baseline)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ! grep -q 'CF-Connecting-IP\|real_ip_header' /etc/nginx/sites-available/vpn-xhttp.conf
        executable: /bin/bash
      changed_when: false

    # State-level
    - name: nginx.service is active
      ansible.builtin.command:
        cmd: systemctl is-active nginx.service
      register: nginx_active
      changed_when: false
      failed_when: nginx_active.stdout != "active"

    - name: nginx binds the configured public XHTTP port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lntp '( sport = :8443 )' | grep -q ':8443'
        executable: /bin/bash
      changed_when: false
