---
# P1 transport: nginx fronts a configurable public TCP port and proxies a path to the Xray XHTTP
# inbound on 127.0.0.1:{{ nginx_xhttp_port }}. RU baseline = direct foreign
# VPS, no CDN. See docs/decisions/0001-cdn-not-filtered-path-baseline.md.

- name: Preflight direct XHTTP endpoint semantics
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-input-preflight.yml"
  vars:
    transport_input_sections: [xhttp]

- name: Pre-flight — nginx public listener must not collide with REALITY
  ansible.builtin.assert:
    that:
      - >-
        not (
          (vpn.enable_xray_reality | default(true) | bool)
          and ((nginx_xhttp_public_port | int) == (xray_port | int))
        )
    fail_msg: |
      nginx_xhttp_public_port={{ nginx_xhttp_public_port }} collides with
      xray_port={{ xray_port }} while REALITY is enabled. Keep REALITY
      on TCP/443 for full-stack hosts and move nginx-xhttp to another public port,
      or disable REALITY for a direct-only cohort before using 443.

- name: Pre-flight — public site hostname matches the canonical URL
  ansible.builtin.assert:
    that:
      - >-
        public_site_canonical_url == 'https://' ~ nginx_xhttp.server_name ~
        ((':' ~ nginx_xhttp_public_port) if (nginx_xhttp_public_port | int) != 443 else '')
    fail_msg: public_site_canonical_url must equal the served primary HTTPS host and port.

- name: Pre-flight — fallback frontend port must not collide with other listeners
  ansible.builtin.assert:
    that:
      - >-
        not (
          (nginx_xhttp.fallback_enabled | default(false) | bool)
          and (
            (nginx_xhttp_fallback_port | int) in [
              xray_port | int,
              xray_fallback_port | int,
              nginx_xhttp_public_port | int,
              cdn_front.port | default(cdn_front_port) | int,
            ]
          )
        )
    fail_msg: |
      nginx_xhttp_fallback_port={{ nginx_xhttp_fallback_port }} collides
      with an existing public listener (xray_port={{ xray_port }},
      xray_fallback_port={{ xray_fallback_port }},
      nginx_xhttp_public_port={{ nginx_xhttp_public_port }},
      cdn_front.port={{ cdn_front.port | default(cdn_front_port) }}). Pick a free port for the
      direct (non-CDN) XHTTP fallback frontend.

- name: Inspect native certificate timer before supplied TLS selection
  ansible.builtin.stat:
    path: /etc/systemd/system/vpn-public-tls.timer
    follow: false
  register: _nginx_managed_tls_timer
  when: nginx_xhttp.acme is not defined

- name: Refuse an overlapping supplied and native certificate authority
  ansible.builtin.assert:
    that: not (_nginx_managed_tls_timer.stat.exists | default(false)) and not (_nginx_managed_tls_timer.stat.islnk | default(false))
    fail_msg: Changing between supplied and managed TLS requires node recreation.
  when: nginx_xhttp.acme is not defined

- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx
      - openssl
      - util-linux
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  register: _nginx_xhttp_install_plan

- name: Prepare managed public TLS for standalone convergence
  ansible.builtin.include_tasks: tls-prepare.yml
  when:
    - nginx_xhttp.acme is defined
    - _transport_ingress_request is not defined

- name: Establish managed public TLS for standalone convergence
  ansible.builtin.include_tasks: tls-bootstrap.yml
  when:
    - nginx_xhttp.acme is defined
    - _transport_ingress_request is not defined

- name: Ensure TLS material directory
  ansible.builtin.file:
    path: /etc/nginx/tls
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Inspect the public candidate root before any file publication
  ansible.builtin.stat:
    path: /var/www/public-site
    follow: false
  register: _nginx_public_site_root

- name: Require an existing public candidate root to retain owned safe authority
  ansible.builtin.assert:
    that:
      - not (_nginx_public_site_root.stat.exists | default(false)) or (_nginx_public_site_root.stat.isdir | default(false))
      - not (_nginx_public_site_root.stat.islnk | default(false))
      - not (_nginx_public_site_root.stat.exists | default(false)) or _nginx_public_site_root.stat.uid == 0
      - not (_nginx_public_site_root.stat.exists | default(false)) or _nginx_public_site_root.stat.mode is match('^[0-7]+[0145][0145]$')
    fail_msg: Public site candidates require an owned non-symlink directory.

- name: Prepare an absent public root for private candidate binding
  ansible.builtin.file:
    path: /var/www/public-site
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: not (_nginx_public_site_root.stat.exists | default(false))

- name: Inspect public asset parent directories before candidate binding
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
  loop:
    - /var/www/public-site/assets
    - /var/www/public-site/notes
  register: _nginx_public_site_directories

- name: Require public asset parents to retain owned safe directory authority
  ansible.builtin.assert:
    that:
      - not (item.stat.exists | default(false)) or (item.stat.isdir | default(false))
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.uid == 0
      - not (item.stat.exists | default(false)) or item.stat.mode is match('^[0-7]+[0145][0145]$')
    fail_msg: Public assets require owned non-symlink parent directories.
  loop: '{{ _nginx_public_site_directories.results }}'

- name: Prepare absent public asset parents with nginx-readable traversal
  ansible.builtin.file:
    path: '{{ item.item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ _nginx_public_site_directories.results }}'
  when: not (item.stat.exists | default(false))

- name: Stage complete XHTTP vhost authority
  ansible.builtin.set_fact:
    nginx_transaction_files:
      - path: /etc/nginx/sites-available/vpn-xhttp.conf
        kind: file
        content_b64: "{{ lookup('ansible.builtin.template', 'site.conf.j2') | b64encode }}"
        mode: "0640"
        uid: 0
        gid: 0
      - path: /etc/nginx/sites-enabled/vpn-xhttp.conf
        kind: link
        target: /etc/nginx/sites-available/vpn-xhttp.conf
        mode: "0777"
        uid: 0
        gid: 0
      - {path: /etc/nginx/sites-enabled/default, kind: absent}
  no_log: true
  diff: false

- name: Stage supplied TLS only for the application-owned certificate authority
  ansible.builtin.set_fact:
    nginx_transaction_files: >-
      {{ nginx_transaction_files + [
          {'path': '/etc/nginx/tls/' ~ nginx_xhttp.server_name ~ '.fullchain.pem',
           'kind': 'file', 'content_b64': nginx_xhttp.cert_pem | b64encode, 'mode': '0644', 'uid': 0, 'gid': 0},
          {'path': '/etc/nginx/tls/' ~ nginx_xhttp.server_name ~ '.key',
           'kind': 'file', 'content_b64': nginx_xhttp.key_pem | b64encode, 'mode': '0600', 'uid': 0, 'gid': 0}] }}
  when: nginx_xhttp.acme is not defined
  no_log: true
  diff: false

- name: Stage distinct fallback TLS authority
  ansible.builtin.set_fact:
    nginx_transaction_files: >-
      {{ nginx_transaction_files + [
        {'path': '/etc/nginx/tls/' ~ nginx_xhttp.fallback_server_name ~ '.fullchain.pem',
         'kind': 'file', 'content_b64': nginx_xhttp.fallback_cert_pem | b64encode, 'mode': '0644', 'uid': 0, 'gid': 0},
        {'path': '/etc/nginx/tls/' ~ nginx_xhttp.fallback_server_name ~ '.key',
         'kind': 'file', 'content_b64': nginx_xhttp.fallback_key_pem | b64encode, 'mode': '0600', 'uid': 0, 'gid': 0}] }}
  when:
    - nginx_xhttp.fallback_enabled | default(false)
    - (nginx_xhttp.fallback_server_name | default(nginx_xhttp.server_name)) != nginx_xhttp.server_name
  no_log: true
  diff: false

- name: Stage exact public assets in the same compensated nginx publication
  ansible.builtin.set_fact:
    nginx_transaction_files: >-
      {{ nginx_transaction_files + [{'path': '/var/www/public-site/' ~ item,
          'kind': 'file', 'content_b64': lookup('ansible.builtin.file', role_path ~ '/files/public-site/' ~ item, rstrip=false) | b64encode,
          'mode': '0644', 'uid': 0, 'gid': 0}] }}
  loop:
    - favicon.svg
    - logo.svg
    - 404.html
    - assets/site.css
  no_log: true
  diff: false

- name: Stage hostname-bound public pages in the same compensated publication
  ansible.builtin.set_fact:
    nginx_transaction_files: >-
      {{ nginx_transaction_files + [{'path': '/var/www/public-site/' ~ item.dest,
          'kind': 'file', 'content_b64': lookup('ansible.builtin.template', 'public-site/' ~ item.src) | b64encode,
          'mode': '0644', 'uid': 0, 'gid': 0}] }}
  loop:
    - {src: index.html.j2, dest: index.html}
    - {src: about.html.j2, dest: about.html}
    - {src: methodology.html.j2, dest: methodology.html}
    - {src: updates.html.j2, dest: updates.html}
    - {src: reading-benchmark-results.html.j2, dest: notes/reading-benchmark-results.html}
    - {src: latency-throughput-context.html.j2, dest: notes/latency-throughput-context.html}
    - {src: repeatable-model-comparisons.html.j2, dest: notes/repeatable-model-comparisons.html}
    - {src: feed.xml.j2, dest: feed.xml}
    - {src: robots.txt.j2, dest: robots.txt}
    - {src: sitemap.xml.j2, dest: sitemap.xml}
  no_log: true
  diff: false

- name: Stage removal of the exact retired security contact alongside the site
  ansible.builtin.set_fact:
    nginx_transaction_files: >-
      {{ nginx_transaction_files + [{'path': '/var/www/public-site/.well-known/security.txt', 'kind': 'absent'}] }}
  no_log: true
  diff: false

- name: Validate publish and activate complete XHTTP authority
  ansible.builtin.include_role:
    name: nginx-xhttp
    tasks_from: transaction
  vars:
    nginx_transaction_owner: nginx-xhttp
    nginx_transaction_roots: [/etc/nginx, /var/www/public-site]
    nginx_transaction_validate_argv: [/usr/sbin/nginx, -t]
    nginx_transaction_unit: nginx.service
    nginx_transaction_activation: reload
    nginx_transaction_desired_enabled: true

- name: Inspect nginx unit before check-mode activation
  ansible.builtin.stat:
    path: /lib/systemd/system/nginx.service
    follow: false
  register: _nginx_xhttp_unit_before
  changed_when: false
  when: ansible_check_mode

- name: Require planned nginx installation on a fresh check-mode host
  ansible.builtin.assert:
    that:
      - _nginx_xhttp_install_plan.changed
    fail_msg: Check mode found no nginx unit and no planned installation.
  when:
    - ansible_check_mode
    - not (_nginx_xhttp_unit_before.stat.exists | default(false))

- name: Ensure nginx is enabled and started
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
  when: not ansible_check_mode or _nginx_xhttp_unit_before.stat.exists | default(false)

- name: Enable managed public TLS renewal after standalone acceptance
  ansible.builtin.include_tasks: tls-finish.yml
  when:
    - nginx_xhttp.acme is defined
    - _transport_ingress_request is not defined
