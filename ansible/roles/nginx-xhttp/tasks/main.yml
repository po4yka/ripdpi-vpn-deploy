---
# P1 transport: nginx fronts a configurable public TCP port and proxies a path to the Xray XHTTP
# inbound on 127.0.0.1:{{ nginx_xhttp_port }}. RU baseline = direct foreign
# VPS, no CDN. See docs/CDN-DECISION.md.

- name: Pre-flight — nginx public listener must not collide with REALITY
  ansible.builtin.assert:
    that:
      - >-
        not (
          (vpn.enable_xray_reality | default(true) | bool)
          and ((nginx_xhttp_public_port | default(8443) | int) == (xray_port | default(443) | int))
        )
    fail_msg: |
      nginx_xhttp_public_port={{ nginx_xhttp_public_port | default(8443) }} collides with
      xray_port={{ xray_port | default(443) }} while REALITY is enabled. Keep REALITY
      on TCP/443 for full-stack hosts and move nginx-xhttp to another public port,
      or disable REALITY for a direct-only cohort before using 443.

- name: Pre-flight — public site hostname matches the canonical URL
  ansible.builtin.assert:
    that:
      - public_site_canonical_url == 'https://' ~ nginx_xhttp.server_name
    fail_msg: public_site_canonical_url must equal the HTTPS URL for nginx_xhttp.server_name.

- name: Pre-flight — public service address is available for self-resolution
  ansible.builtin.assert:
    that:
      - vpn_service_address is defined
      - vpn_service_address | length > 0
      - vpn_service_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: vpn_service_address must contain the provider-assigned public IPv4 address.

- name: Pin public hostname for node-local resolution
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} RIPDPI nginx self-resolution"
    block: "{{ vpn_service_address }} {{ nginx_xhttp.server_name }}"
    owner: root
    group: root
    mode: "0644"
    unsafe_writes: true
  no_log: true
  diff: false

- name: Verify node-local public hostname resolution
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ nginx_xhttp.server_name }}"
  register: nginx_xhttp_self_resolution
  changed_when: false
  failed_when: >-
    nginx_xhttp_self_resolution.rc != 0 or
    not (
      nginx_xhttp_self_resolution.stdout is search(
        '(?m)^' ~ (vpn_service_address | regex_escape) ~ '\\s'
      )
    )
  no_log: true

- name: Pre-flight — fallback frontend port must not collide with other listeners
  ansible.builtin.assert:
    that:
      - >-
        not (
          (nginx_xhttp.fallback_enabled | default(false) | bool)
          and (
            (nginx_xhttp_fallback_port | default(2083) | int) in [
              xray_port | default(443) | int,
              xray_fallback_port | default(0) | int,
              nginx_xhttp_public_port | default(8443) | int,
              cdn_front.port | default(8443) | int,
            ]
          )
        )
    fail_msg: |
      nginx_xhttp_fallback_port={{ nginx_xhttp_fallback_port | default(2083) }} collides
      with an existing public listener (xray_port={{ xray_port | default(443) }},
      xray_fallback_port={{ xray_fallback_port | default(0) }},
      nginx_xhttp_public_port={{ nginx_xhttp_public_port | default(8443) }},
      cdn_front.port={{ cdn_front.port | default(8443) }}). Pick a free port for the
      direct (non-CDN) XHTTP fallback frontend.

- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx
      - openssl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure TLS material directory
  ansible.builtin.file:
    path: /etc/nginx/tls
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Drop server certificate (full chain)
  ansible.builtin.copy:
    content: "{{ nginx_xhttp.cert_pem }}"
    dest: /etc/nginx/tls/{{ nginx_xhttp.server_name }}.fullchain.pem
    owner: root
    group: root
    mode: "0644"
  no_log: true
  diff: false
  notify: Reload nginx-xhttp

- name: Drop server certificate key
  ansible.builtin.copy:
    content: "{{ nginx_xhttp.key_pem }}"
    dest: /etc/nginx/tls/{{ nginx_xhttp.server_name }}.key
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Reload nginx-xhttp

- name: Drop fallback server certificate (full chain) when a distinct domain is used
  ansible.builtin.copy:
    content: "{{ nginx_xhttp.fallback_cert_pem }}"
    dest: /etc/nginx/tls/{{ nginx_xhttp.fallback_server_name }}.fullchain.pem
    owner: root
    group: root
    mode: "0644"
  no_log: true
  diff: false
  notify: Reload nginx-xhttp
  when:
    - nginx_xhttp.fallback_enabled | default(false) | bool
    - (nginx_xhttp.fallback_server_name | default(nginx_xhttp.server_name)) != nginx_xhttp.server_name

- name: Drop fallback server certificate key when a distinct domain is used
  ansible.builtin.copy:
    content: "{{ nginx_xhttp.fallback_key_pem }}"
    dest: /etc/nginx/tls/{{ nginx_xhttp.fallback_server_name }}.key
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Reload nginx-xhttp
  when:
    - nginx_xhttp.fallback_enabled | default(false) | bool
    - (nginx_xhttp.fallback_server_name | default(nginx_xhttp.server_name)) != nginx_xhttp.server_name

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx-xhttp

- name: Publish static site content
  ansible.builtin.copy:
    src: public-site/
    dest: /var/www/public-site/
    owner: root
    group: root
    mode: "u=rwX,go=rX"
  notify: Reload nginx-xhttp

- name: Ensure the public notes directory exists
  ansible.builtin.file:
    path: /var/www/public-site/notes
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render public site pages
  ansible.builtin.template:
    src: "public-site/{{ item.src }}"
    dest: "/var/www/public-site/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: index.html.j2
      dest: index.html
    - src: about.html.j2
      dest: about.html
    - src: methodology.html.j2
      dest: methodology.html
    - src: updates.html.j2
      dest: updates.html
    - src: reading-benchmark-results.html.j2
      dest: notes/reading-benchmark-results.html
    - src: latency-throughput-context.html.j2
      dest: notes/latency-throughput-context.html
    - src: repeatable-model-comparisons.html.j2
      dest: notes/repeatable-model-comparisons.html
  notify: Reload nginx-xhttp

- name: Remove the retired security contact file
  ansible.builtin.file:
    path: /var/www/public-site/.well-known/security.txt
    state: absent

- name: Render hostname-bound site discovery files
  ansible.builtin.template:
    src: "public-site/{{ item.src }}"
    dest: "/var/www/public-site/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: feed.xml.j2
      dest: feed.xml
    - src: robots.txt.j2
      dest: robots.txt
    - src: sitemap.xml.j2
      dest: sitemap.xml
  notify: Reload nginx-xhttp

- name: Render nginx site
  # `template.validate` requires the validate command to contain `%s`
  # (the rendered tempfile path). Validating a single nginx server-block
  # outside the parent http {} context fails on its own, so we run a
  # separate `nginx -t` after the symlink is in place.
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/vpn-xhttp.conf
    owner: root
    group: root
    mode: "0640"
  no_log: true
  diff: false
  notify: Reload nginx-xhttp

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/vpn-xhttp.conf
    dest: /etc/nginx/sites-enabled/vpn-xhttp.conf
    state: link
    force: true
  notify: Reload nginx-xhttp

- name: Validate the full nginx config now the new site is enabled
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Activate the validated nginx site before later roles run
  ansible.builtin.meta: flush_handlers

- name: Ensure nginx is enabled and started
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
