---
- name: Validate explicit nginx-xhttp lifecycle selection
  ansible.builtin.assert:
    that: nginx_xhttp_role_enabled is boolean

- name: Converge enabled nginx-xhttp runtime
  ansible.builtin.include_tasks: enable.yml
  when: nginx_xhttp_role_enabled

- name: Reconcile disabled nginx-xhttp ownership
  ansible.builtin.include_tasks: disable.yml
  when: not nginx_xhttp_role_enabled
