---
- name: Create the routing list system group
  ansible.builtin.group:
    name: vpn-routing-lists
    system: true

- name: Create the routing list system user
  ansible.builtin.user:
    name: vpn-routing-lists
    group: vpn-routing-lists
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Ensure routing list publication root
  ansible.builtin.file:
    path: /var/lib/vpn-routing-lists
    state: directory
    follow: false
    owner: vpn-routing-lists
    group: www-data
    # Setgid, so generations the service writes inherit nginx's group.
    mode: "2750"

- name: Ensure refresher directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install routing list refresher
  ansible.builtin.copy:
    src: routing_lists_refresh.py
    dest: /usr/local/libexec/vpn-routing-lists-refresh
    owner: root
    group: root
    mode: "0755"

- name: Publish routing list refresher policy
  ansible.builtin.copy:
    content: >-
      {{ {'root': '/var/lib/vpn-routing-lists',
          'token': nginx_xhttp_routing_lists.token,
          'base_url': 'https://' ~ nginx_xhttp.server_name ~ ':' ~ nginx_xhttp_public_port
                      ~ '/routing/' ~ nginx_xhttp_routing_lists.token,
          'geosite_url': nginx_xhttp_routing_lists.geosite_url,
          'geoip_url': nginx_xhttp_routing_lists.geoip_url,
          'profile': nginx_xhttp_routing_lists.profile,
          'policy': nginx_xhttp_routing_lists.policy} | to_json(ensure_ascii=false) }}
    dest: /etc/vpn-routing-lists.json
    owner: root
    group: vpn-routing-lists
    mode: "0640"
  no_log: true
  diff: false
  register: _nginx_routing_policy

- name: Install routing list refresh units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [vpn-routing-lists.service, vpn-routing-lists.timer]
  register: _nginx_routing_units

- name: Reload routing list unit graph
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode and _nginx_routing_units.changed

- name: Enable routing list refresh
  ansible.builtin.systemd_service:
    name: vpn-routing-lists.timer
    enabled: true
    state: started
  when: not ansible_check_mode

# A rotated token or new policy must not wait for the daily run.
- name: Refresh routing lists after a policy change
  ansible.builtin.systemd_service:
    name: vpn-routing-lists.service
    state: started
    no_block: true
  when: not ansible_check_mode and _nginx_routing_policy.changed
