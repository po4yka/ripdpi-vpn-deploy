---
- name: Ensure node manifest directory
  ansible.builtin.file:
    path: "{{ node_manifest.dir | default('/var/lib/ripdpi-vpn-deploy') }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Capture operator environment labels for manifest
  ansible.builtin.set_fact:
    node_manifest_environment: "{{ env | default(lookup('env', 'ENV'), true) }}"
    node_manifest_provider: "{{ provider | default(lookup('env', 'PROVIDER'), true) }}"
    node_manifest_source_revision: "{{ lookup('env', 'DEPLOY_SOURCE_REVISION') }}"
    node_manifest_deployable_digest: "{{ lookup('env', 'DEPLOYABLE_SOURCE_DIGEST') }}"

- name: Require immutable deploy source identity
  ansible.builtin.assert:
    that:
      - node_manifest_source_revision is match('^[0-9a-f]{40}$')
      - node_manifest_deployable_digest is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Run deployment through the repository Makefile from a clean checkout;
      direct playbook execution cannot produce an auditable source manifest.

- name: Build public listener manifest when role runs directly
  ansible.builtin.set_fact:
    public_listener_manifest: "{{ lookup('template', playbook_dir ~ '/../templates/listener-manifest.json.j2') | from_json }}"
  when: public_listener_manifest is not defined

- name: Write node capability manifest
  ansible.builtin.template:
    src: manifest.json.j2
    dest: "{{ node_manifest.path | default('/var/lib/ripdpi-vpn-deploy/manifest.json') }}"
    owner: root
    group: root
    mode: "0644"
    validate: "python3 -m json.tool %s"
