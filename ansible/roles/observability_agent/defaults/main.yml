---
observability_agent:
  enabled: false
  version: ""
  release_urls:
    amd64: ""
    arm64: ""
  linux_amd64_sha256: ""
  linux_arm64_sha256: ""
  node_id: ""
  environment: ""
  receiver_origin: ""
  receiver_address: ""
  install_root: /opt/observability-vmagent
  config_dir: /etc/observability-agent
  credential_dir: /etc/observability-agent/credentials
  queue_dir: /var/lib/observability-agent/queue
  queue_max_disk_bytes: 536870912
  web_listen: 127.0.0.1:19090
  scrape_interval: 60s
  scrape_sample_limit: 2000
  scrape_label_limit: 16
  scrape_label_name_length_limit: 64
  scrape_label_value_length_limit: 128
  memory_max: 192M
  tasks_max: 64
  nofile_limit: 65536
observability_agent_watchdog_state_path: /var/lib/vpn-watchdog/state
observability_agent_watchdog_max_age_seconds: 900
observability_agent_backup_stage_path: /var/lib/vpn-backup/backup-stage-status.json
observability_agent_backup_stage_max_age_seconds: 129600
observability_agent_restore_drill_path: /var/lib/vpn-backup/restore-drill-last-success.json
observability_agent_restore_drill_max_age_seconds: 3024000

_observability_agent_service_generation: ""
