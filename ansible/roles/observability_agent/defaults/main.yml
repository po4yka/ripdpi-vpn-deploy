---
observability_agent:
  enabled: false
  version: ""
  release_urls:
    amd64: ""
    arm64: ""
  linux_amd64_sha256: ""
  linux_arm64_sha256: ""
  node_id: ""
  environment: ""
  receiver_origin: ""
  receiver_sni: ""
  install_root: /opt/observability-agent
  config_dir: /etc/observability-agent
  credential_dir: /etc/credstore/observability-agent
  wal_dir: /var/lib/observability-agent/wal
  wal_max_size: 128MB
  wal_max_time: 1h
  web_listen: 127.0.0.1:19090
  scrape_interval: 30s
  queue_capacity: 5000
  queue_max_samples_per_send: 1000
  queue_batch_send_deadline: 5s
  metric_name_allowlist: >-
    ^(?:node_(?:cpu|memory|filesystem|load|time|boot|network|disk|filefd|uname)_.*|process_.*|go_.*|prometheus_.*|vpn_(?:xray_stats|observability_).*)$
