---
observability_agent:
  enabled: false
  version: ""
  release_urls:
    amd64: ""
    arm64: ""
  linux_amd64_sha256: ""
  linux_arm64_sha256: ""
  node_id: ""
  environment: ""
  receiver_origin: ""
  receiver_sni: ""
  install_root: /opt/observability-agent
  promtool_install_root: /opt/observability-agent-promtool
  config_dir: /etc/observability-agent
  credential_dir: /etc/credstore/observability-agent
  wal_dir: /var/lib/observability-agent/wal
  wal_max_time: 1h
  web_listen: 127.0.0.1:19090
  scrape_interval: 30s
  scrape_sample_limit: 2000
  scrape_label_limit: 16
  scrape_label_name_length_limit: 64
  scrape_label_value_length_limit: 128
  queue_capacity: 5000
  queue_max_samples_per_send: 1000
  queue_batch_send_deadline: 5s
  memory_max: 512M
  tasks_max: 64
  nofile_limit: 65536
