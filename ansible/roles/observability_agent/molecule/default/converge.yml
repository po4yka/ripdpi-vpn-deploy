---
- name: Converge observability-agent disable contract
  hosts: all
  become: true
  vars:
    observability_agent:
      enabled: false
      config_dir: /etc/observability-agent
      credential_dir: /etc/observability-agent/credentials
      queue_dir: /var/lib/observability-agent/queue
      install_root: /opt/observability-vmagent
  roles:
    - role: observability_agent
