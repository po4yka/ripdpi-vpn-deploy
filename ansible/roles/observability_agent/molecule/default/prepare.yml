---
- name: Prepare observability-agent disable scenario
  hosts: all
  become: true
  tasks:
    - name: Create existing monitoring textfile directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Create synthetic agent-owned state
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/observability-agent
        - /etc/observability-agent/credentials
        - /var/lib/observability-agent/wal
        - /var/lib/observability-agent/queue
        - /opt/observability-vmagent
        - /opt/observability-agent

    - name: Preserve an explicitly synthetic previous-runtime namespace marker
      ansible.builtin.copy:
        dest: /opt/observability-agent/retained-release-marker
        content: "previous runtime authority retained\n"
        owner: root
        group: root
        mode: '0600'

    - name: Preserve the previous-runtime public reference without executing a substitute
      ansible.builtin.file:
        src: /opt/observability-agent/current/prometheus
        dest: /usr/local/bin/prometheus-observability-agent
        state: link
        force: true


    - name: Create synthetic producer textfile that the agent does not own
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/textfile/producer-owned.prom
        content: "vpn_fixture_producer 1\n"
        owner: root
        group: root
        mode: "0644"

    - name: Create synthetic agent textfile
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/textfile/observability-agent.prom
        content: "vpn_observability_adapter_collection_success 1\n"
        owner: root
        group: root
        mode: "0600"

    - name: Create synthetic health adapter textfile
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/textfile/observability-health.prom
        content: "vpn_watchdog_collection_success 1\n"
        owner: root
        group: root
        mode: "0640"
