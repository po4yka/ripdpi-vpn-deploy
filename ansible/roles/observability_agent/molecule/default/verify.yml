---
- name: Verify observability-agent disable contract
  hosts: all
  become: true
  tasks:
    - name: Inspect removed agent-owned state and preserved producer state
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/observability-agent
        - /etc/observability-agent/credentials
        - /var/lib/observability-agent/wal
        - /opt/observability-agent
        - /var/lib/node_exporter/textfile/observability-agent.prom
        - /var/lib/node_exporter/textfile/observability-health.prom
        - /var/lib/node_exporter/textfile/producer-owned.prom
      register: observability_agent_paths

    - name: Assert only agent-owned state was removed
      ansible.builtin.assert:
        that:
          - not observability_agent_paths.results[0].stat.exists
          - not observability_agent_paths.results[1].stat.exists
          - not observability_agent_paths.results[2].stat.exists
          - not observability_agent_paths.results[3].stat.exists
          - not observability_agent_paths.results[4].stat.exists
          - not observability_agent_paths.results[5].stat.exists
          - observability_agent_paths.results[6].stat.exists
