---
- name: Converge real observability agent
  hosts: all
  become: true
  module_defaults:
    ansible.builtin.get_url:
      timeout: 60
  pre_tasks:
    - name: Read fixture observability credentials
      ansible.builtin.slurp:
        src: "/var/lib/observability-fixture/{{ item }}"
      loop:
        - ca.crt
        - client.crt
        - client.key
      register: observability_fixture_credentials
      no_log: true
    - name: Identify whether the real previous sender still owns activation
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path
            print('previous' if 'ExecStart=/usr/local/bin/prometheus-observability-agent '
                  in Path('/etc/systemd/system/observability-agent.service').read_text() else 'current')
      register: _previous_sender_owner
      changed_when: false

    - name: Bind fixture observability authority
      ansible.builtin.set_fact:
        observability_kuma_secrets:
          schema_version: 1
          tls:
            ca_pem: "{{ observability_fixture_credentials.results[0].content | b64decode }}"
          push_monitors:
            - {node_id: node-fixture, kind: node, token: NodeFixtureToken00000000000000001}
        observability_secrets:
          receiver_ca_pem: "{{ observability_fixture_credentials.results[0].content | b64decode }}"
          senders:
            - node_id: node-fixture
              certificate_pem: "{{ observability_fixture_credentials.results[1].content | b64decode }}"
              private_key_pem: "{{ observability_fixture_credentials.results[2].content | b64decode }}"
      no_log: true

    - name: Prove real failed Prometheus to vmagent cutover restores the previous runtime
      ansible.builtin.include_tasks: tasks/failed-activation.yml
      when: _previous_sender_owner.stdout == 'previous'
  vars:
    # This isolated sender scenario intentionally has no observer receiver;
    # heartbeat failure is honest. Real cohosted ingestion is covered by the
    # control-plane enabled scenario, never by this transport fixture.
    observability_push:
      node_id: node-fixture
      origin: https://10.23.0.2:9444
      kinds: [node]
      services: [observability-agent.service]
      expected_nodes: [node-fixture]
      prometheus_origin: http://127.0.0.1:9090
      relay_origin: http://127.0.0.1:19095
      relay_auth_path: /etc/observability-control-plane/credentials/telegram-relay-auth-token
      textfile_dir: /var/lib/node_exporter/textfile
    observability_alert_policy: >-
      {{ (lookup('ansible.builtin.file',
          playbook_dir ~ '/../../../../group_vars/all.yml') | from_yaml).observability_alert_policy }}
    observability_contract:
      schema_version: 1
      credential_mode: systemd
    monitoring:
      node_exporter_user: prometheus
      node_exporter_group: prometheus
      node_exporter_textfile_group: node_exporter_textfile
      node_exporter_textfile_dir: /var/lib/node_exporter/textfile
    node_manifest:
      path: /var/lib/ripdpi-vpn-deploy/manifest.json
    node_manifest_source_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    node_manifest_deployable_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    observability_agent:
      enabled: true
      version: v1.153.0
      release_urls:
        amd64: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.153.0/vmutils-linux-amd64-v1.153.0.tar.gz
        arm64: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.153.0/vmutils-linux-arm64-v1.153.0.tar.gz
      linux_amd64_sha256: 85aea24a4829cf26033d810aceb7888070bd4eaff321357168ff6db24bf7c00c
      linux_arm64_sha256: 8153c4feb73564215950a299c803d5c1e974772cd34b8c162d43ea2c5b516df5
      node_id: node-fixture
      environment: ci
      receiver_origin: https://10.23.0.2:9443
      receiver_address: 10.23.0.2
      install_root: /opt/observability-vmagent
      config_dir: /etc/observability-agent
      credential_dir: /etc/observability-agent/credentials
      queue_dir: /var/lib/observability-agent/queue
      queue_max_disk_bytes: 536870912
      web_listen: 127.0.0.1:19090
      scrape_interval: 60s
      scrape_sample_limit: 2000
      scrape_label_limit: 16
      scrape_label_name_length_limit: 64
      scrape_label_value_length_limit: 128
      memory_max: 192M
      tasks_max: 64
      nofile_limit: 65536
  tasks:
    - name: Exercise the real observability agent role
      block:
        - name: Converge observability agent
          ansible.builtin.include_role:
            name: observability_agent
      rescue:
        - name: Read bounded observability agent failure properties
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - observability-agent.service
              - --property=Result
              - --property=ExecMainCode
              - --property=ExecMainStatus
              - --property=ExecStartPre
          register: observability_agent_failure_properties
          changed_when: false
          failed_when: false

        - name: Read bounded observability agent fixture journal
          ansible.builtin.command:
            argv:
              - /usr/bin/journalctl
              - --unit=observability-agent.service
              - --no-pager
              - --output=cat
              - --lines=80
          register: observability_agent_failure_journal
          changed_when: false
          failed_when: false

        - name: Report bounded observability agent fixture failure
          ansible.builtin.debug:
            msg:
              properties: "{{ observability_agent_failure_properties.stdout_lines }}"
              journal: "{{ observability_agent_failure_journal.stdout_lines }}"

        - name: Refuse failed observability agent fixture convergence
          ansible.builtin.fail:
            msg: Observability agent fixture convergence failed; bounded diagnostics precede this refusal.
