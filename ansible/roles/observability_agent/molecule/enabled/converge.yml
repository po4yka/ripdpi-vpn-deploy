---
- name: Converge real observability agent
  hosts: all
  become: true
  pre_tasks:
    - name: Read fixture observability credentials
      ansible.builtin.slurp:
        src: "/var/lib/observability-fixture/{{ item }}"
      loop:
        - ca.crt
        - client.crt
        - client.key
      register: observability_fixture_credentials
      no_log: true

    - name: Bind fixture observability authority
      ansible.builtin.set_fact:
        observability_secrets:
          receiver_ca_pem: "{{ observability_fixture_credentials.results[0].content | b64decode }}"
          senders:
            - node_id: node-fixture
              certificate_pem: "{{ observability_fixture_credentials.results[1].content | b64decode }}"
              private_key_pem: "{{ observability_fixture_credentials.results[2].content | b64decode }}"
      no_log: true
  vars:
    observability_contract:
      schema_version: 1
      credential_mode: systemd
    monitoring:
      node_exporter_user: prometheus
      node_exporter_group: prometheus
      node_exporter_textfile_group: node_exporter_textfile
      node_exporter_textfile_dir: /var/lib/node_exporter/textfile
    node_manifest:
      path: /var/lib/ripdpi-vpn-deploy/manifest.json
    node_manifest_source_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    node_manifest_deployable_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    observability_agent:
      enabled: true
      version: 3.14.0
      release_urls:
        amd64: https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
        arm64: https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-arm64.tar.gz
      linux_amd64_sha256: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
      linux_arm64_sha256: 077f3781ab7245dc04c9a3c9b78ba120fc8e41aa0dc97489b0af67247e50ba83
      node_id: node-fixture
      environment: ci
      receiver_origin: https://127.0.0.1:19443
      receiver_sni: ingest.fixture.test
      install_root: /opt/observability-agent
      promtool_install_root: /opt/observability-agent-promtool
      config_dir: /etc/observability-agent
      credential_dir: /etc/observability-agent/credentials
      wal_dir: /var/lib/observability-agent/wal
      wal_max_time: 10m
      web_listen: 127.0.0.1:19090
      scrape_interval: 1s
      scrape_sample_limit: 2000
      scrape_label_limit: 16
      scrape_label_name_length_limit: 64
      scrape_label_value_length_limit: 128
      queue_capacity: 100
      queue_max_samples_per_send: 20
      queue_batch_send_deadline: 1s
      memory_max: 512M
      tasks_max: 64
      nofile_limit: 65536
  tasks:
    - name: Exercise the real observability agent role
      block:
        - name: Converge observability agent
          ansible.builtin.include_role:
            name: observability_agent
      rescue:
        - name: Read bounded observability agent failure properties
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - observability-agent.service
              - --property=Result
              - --property=ExecMainCode
              - --property=ExecMainStatus
              - --property=ExecStartPre
          register: observability_agent_failure_properties
          changed_when: false
          failed_when: false

        - name: Read bounded observability agent fixture journal
          ansible.builtin.command:
            argv:
              - /usr/bin/journalctl
              - --unit=observability-agent.service
              - --no-pager
              - --output=cat
              - --lines=80
          register: observability_agent_failure_journal
          changed_when: false
          failed_when: false

        - name: Report bounded observability agent fixture failure
          ansible.builtin.debug:
            msg:
              properties: "{{ observability_agent_failure_properties.stdout_lines }}"
              journal: "{{ observability_agent_failure_journal.stdout_lines }}"

        - name: Refuse failed observability agent fixture convergence
          ansible.builtin.fail:
            msg: Observability agent fixture convergence failed; bounded diagnostics precede this refusal.
