---
- name: Reload the canonical fixture contract for post-cutover rollback
  ansible.builtin.set_fact:
    observability_agent: '{{ fixture.observability_agent }}'
    observability_contract: '{{ fixture.observability_contract }}'
    observability_push: '{{ fixture.observability_push }}'
    monitoring: '{{ fixture.monitoring }}'
    node_manifest: '{{ fixture.node_manifest }}'
    node_manifest_source_revision: '{{ fixture.node_manifest_source_revision }}'
    node_manifest_deployable_digest: '{{ fixture.node_manifest_deployable_digest }}'
    observability_alert_policy: >-
      {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../../../group_vars/all.yml') | from_yaml).observability_alert_policy }}
  vars:
    fixture: '{{ (lookup("ansible.builtin.file", playbook_dir ~ "/converge.yml") | from_yaml)[0].vars }}'

- name: Read only the generated fixture credential bundle for rollback
  ansible.builtin.slurp:
    src: '/var/lib/observability-fixture/{{ item }}'
  loop: [ca.crt, client.crt, client.key]
  register: _rollback_authority
  no_log: true

- name: Bind the same isolated authority before exercising rollback
  ansible.builtin.set_fact:
    observability_kuma_secrets:
      schema_version: 1
      tls:
        ca_pem: '{{ _rollback_authority.results[0].content | b64decode }}'
      push_monitors:
        - {node_id: node-fixture, kind: node, token: NodeFixtureToken00000000000000001}
    observability_secrets:
      receiver_ca_pem: '{{ _rollback_authority.results[0].content | b64decode }}'
      senders:
        - node_id: node-fixture
          certificate_pem: '{{ _rollback_authority.results[1].content | b64decode }}'
          private_key_pem: '{{ _rollback_authority.results[2].content | b64decode }}'
  no_log: true
