---
- name: Reload systemd for observability control plane
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Restart observability Prometheus

- name: Restart observability Prometheus
  ansible.builtin.systemd_service:
    name: observability-prometheus
    enabled: true
    state: restarted
  when: not ansible_check_mode

- name: Reload observability ingress
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when: not ansible_check_mode
