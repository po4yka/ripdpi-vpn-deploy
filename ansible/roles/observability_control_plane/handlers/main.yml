---
- name: Reload observability resource boundary
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart observability disk guard
  ansible.builtin.systemd_service:
    name: observability-disk-guard
    state: restarted

- name: Reload systemd for observability control plane
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Restart observability Prometheus

- name: Restart observability Prometheus
  ansible.builtin.systemd_service:
    name: observability-prometheus
    enabled: true
    state: restarted
  when: not ansible_check_mode

- name: Reload observability ingress
  ansible.builtin.systemd_service:
    name: observability-ingress
    state: restarted
  when: not ansible_check_mode
