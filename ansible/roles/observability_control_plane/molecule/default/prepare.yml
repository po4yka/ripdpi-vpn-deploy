---
- name: Prepare disabled control-plane lifecycle fixture
  hosts: all
  become: true
  tasks:
    - name: Create historical TSDB directory owned outside disable lifecycle
      ansible.builtin.file:
        path: /var/lib/observability-prometheus
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Seed historical TSDB marker owned outside disable lifecycle
      ansible.builtin.copy:
        dest: /var/lib/observability-prometheus/keep
        content: retained
        owner: root
        group: root
        mode: "0600"
