---
- name: Prepare enabled control-plane receiver fixture
  hosts: all
  become: true
  tasks:
    - name: Create fixture directory
      ansible.builtin.file:
        path: /var/tmp/observability-control-plane-fixture
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create local pinned archive and mTLS fixture
      ansible.builtin.shell: |
        set -eu
        fixture=/var/tmp/observability-control-plane-fixture
        mkdir -p "$fixture/tls" "$fixture/ca/newcerts"
        : > "$fixture/ca/index.txt"
        printf '1000\n' > "$fixture/ca/serial"
        printf '1000\n' > "$fixture/ca/crlnumber"
        cat > "$fixture/ca/openssl.cnf" <<'EOF'
        [ ca ]
        default_ca = CA_default
        [ CA_default ]
        database = /var/tmp/observability-control-plane-fixture/ca/index.txt
        serial = /var/tmp/observability-control-plane-fixture/ca/serial
        crlnumber = /var/tmp/observability-control-plane-fixture/ca/crlnumber
        private_key = /var/tmp/observability-control-plane-fixture/tls/ca.key
        certificate = /var/tmp/observability-control-plane-fixture/tls/ca.crt
        new_certs_dir = /var/tmp/observability-control-plane-fixture/ca/newcerts
        default_md = sha256
        default_crl_days = 1
        policy = policy_any
        [ policy_any ]
        commonName = supplied
        EOF
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=fixture-ca \
          -keyout "$fixture/tls/ca.key" -out "$fixture/tls/ca.crt"
        openssl req -newkey rsa:2048 -nodes -subj /CN=ingest.fixture.test \
          -keyout "$fixture/tls/server.key" -out "$fixture/tls/server.csr"
        printf 'subjectAltName=DNS:ingest.fixture.test,DNS:control.fixture.test\n' > "$fixture/server.ext"
        openssl x509 -req -days 1 -CA "$fixture/tls/ca.crt" -CAkey "$fixture/tls/ca.key" \
          -CAcreateserial -in "$fixture/tls/server.csr" -out "$fixture/tls/server.crt" -extfile "$fixture/server.ext"
        for identity in vpn-p0 vpn-p1; do
          openssl req -newkey rsa:2048 -nodes -subj "/CN=$identity" \
            -keyout "$fixture/tls/client-$identity.key" -out "$fixture/tls/client-$identity.csr"
          printf 'extendedKeyUsage=clientAuth\n' > "$fixture/client.ext"
          openssl x509 -req -days 1 -CA "$fixture/tls/ca.crt" -CAkey "$fixture/tls/ca.key" \
            -CAcreateserial -in "$fixture/tls/client-$identity.csr" -out "$fixture/tls/client-$identity.crt" -extfile "$fixture/client.ext"
        done
        openssl ca -batch -config "$fixture/ca/openssl.cnf" -gencrl -out "$fixture/tls/ca.crl"
        cat > "$fixture/prometheus" <<'EOF'
        #!/usr/bin/env python3
        import http.server
        class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200 if self.path == '/-/ready' else 404); self.end_headers()
            def do_POST(self):
                self.send_response(200 if self.path == '/api/v1/write' else 404); self.end_headers()
            def log_message(self, *_args): pass
        http.server.HTTPServer(('127.0.0.1', 9090), Handler).serve_forever()
        EOF
        chmod 0755 "$fixture/prometheus"
        mkdir -p "$fixture/prometheus-fixture"
        cp "$fixture/prometheus" "$fixture/prometheus-fixture/prometheus"
        tar -C "$fixture" -czf "$fixture/prometheus.tar.gz" prometheus-fixture/prometheus
        dd if=/dev/zero of="$fixture/oversize.bin" bs=1M count=9 status=none
      args:
        creates: /var/tmp/observability-control-plane-fixture/prometheus.tar.gz
      changed_when: false

    - name: Install bounded direct mTLS fixture client
      ansible.builtin.copy:
        dest: /var/tmp/observability-control-plane-fixture/mtls-client.py
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/python3
          import argparse
          import http.client
          import pathlib
          import socket
          import ssl
          import sys

          DIRECT_ADDRESS = "127.0.0.1"
          DIRECT_PORT = 9443


          class DirectHTTPSConnection(http.client.HTTPSConnection):
              def connect(self):
                  raw = socket.create_connection((DIRECT_ADDRESS, DIRECT_PORT), timeout=5)
                  self.sock = self._context.wrap_socket(
                      raw, server_hostname=self.host
                  )


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--server-name", required=True)
              parser.add_argument("--path", required=True)
              parser.add_argument("--method", choices=("GET", "POST"), default="GET")
              parser.add_argument("--ca", required=True)
              parser.add_argument("--cert", required=True)
              parser.add_argument("--key", required=True)
              parser.add_argument("--body", default="")
              parser.add_argument("--body-file")
              args = parser.parse_args()
              body = (
                  pathlib.Path(args.body_file).read_bytes()
                  if args.body_file
                  else args.body.encode("utf-8")
              )
              context = ssl.create_default_context(cafile=args.ca)
              context.load_cert_chain(certfile=args.cert, keyfile=args.key)
              connection = DirectHTTPSConnection(
                  args.server_name, timeout=5, context=context
              )
              try:
                  connection.request(
                      args.method,
                      args.path,
                      body=body,
                      headers={"Host": args.server_name},
                  )
                  response = connection.getresponse()
                  print(response.status)
                  return 0
              except ssl.SSLError:
                  return 60
              except (OSError, http.client.HTTPException):
                  return 2
              finally:
                  connection.close()


          if __name__ == "__main__":
              sys.exit(main())
