---
- name: Prepare enabled control-plane receiver fixture
  hosts: all
  become: true
  vars:
    vpn: {enable_xray_reality: false, enable_nginx_xhttp: false}
    vpn_subscription_only: true
    monitoring:
      node_exporter_listen: 127.0.0.1:9100
      node_exporter_user: prometheus
      node_exporter_group: prometheus
      node_exporter_textfile_dir: /var/lib/node_exporter/textfile
      node_exporter_textfile_group: observability-textfile
  tasks:
    - name: Assign isolated private fixture ingress address
      ansible.builtin.command:
        argv: [ip, address, replace, 10.23.0.2/32, dev, lo]
      changed_when: false

    - name: Create the observability textfile collector group
      ansible.builtin.group:
        name: observability-textfile
        system: true

    - name: Create fixture directory
      ansible.builtin.file:
        path: /var/tmp/observability-control-plane-fixture
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create canonical protocol-liveness publisher and textfile paths
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /var/lib/vpn-protocol-liveness
          mode: '0700'
        # Snapshot parent validation deliberately refuses a sticky or writable
        # ancestor.  Keep this immediate parent production-shaped before the
        # collector's sticky final directory is created.
        - path: /var/lib/node_exporter
          group: root
          mode: '0755'
        - path: /var/lib/node_exporter/textfile
          group: observability-textfile
          mode: '3775'

    - name: Publish canonical protocol-liveness fixture evidence
      ansible.builtin.copy:
        dest: /var/lib/vpn-protocol-liveness/last-evidence.json
        owner: root
        group: root
        mode: '0600'
        content: >-
          {{ {"candidate_policies": [], "decision": "healthy",
          "evaluated_at": ansible_facts['date_time']['epoch'] | int, "evidence": [],
          "failed_vantages": {}, "monitoring_errors": [], "schema_version": 2}
          | to_json }}

    - name: Install curl for the bounded mTLS fixture client
      ansible.builtin.apt:
        name: [curl, logrotate]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create isolated mTLS fixture authority
      ansible.builtin.shell: |
        set -eu
        fixture=/var/tmp/observability-control-plane-fixture
        mkdir -p "$fixture/tls" "$fixture/ca/newcerts"
        : > "$fixture/ca/index.txt"
        printf '1000\n' > "$fixture/ca/serial"
        printf '1000\n' > "$fixture/ca/crlnumber"
        cat > "$fixture/ca/openssl.cnf" <<'EOF'
        [ ca ]
        default_ca = CA_default
        [ CA_default ]
        database = /var/tmp/observability-control-plane-fixture/ca/index.txt
        serial = /var/tmp/observability-control-plane-fixture/ca/serial
        crlnumber = /var/tmp/observability-control-plane-fixture/ca/crlnumber
        private_key = /var/tmp/observability-control-plane-fixture/tls/ca.key
        certificate = /var/tmp/observability-control-plane-fixture/tls/ca.crt
        new_certs_dir = /var/tmp/observability-control-plane-fixture/ca/newcerts
        default_md = sha256
        default_crl_days = 1
        policy = policy_any
        [ policy_any ]
        commonName = supplied
        EOF
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=fixture-ca \
          -addext 'basicConstraints=critical,CA:TRUE' \
          -addext 'keyUsage=critical,keyCertSign,cRLSign' \
          -addext 'subjectKeyIdentifier=hash' \
          -keyout "$fixture/tls/ca.key" -out "$fixture/tls/ca.crt"
        openssl req -newkey rsa:2048 -nodes -subj /CN=ingest.fixture.test \
          -keyout "$fixture/tls/server.key" -out "$fixture/tls/server.csr"
        cat > "$fixture/server.ext" <<'EOF'
        basicConstraints=critical,CA:FALSE
        keyUsage=critical,digitalSignature,keyEncipherment
        extendedKeyUsage=serverAuth
        subjectAltName=IP:10.23.0.2
        authorityKeyIdentifier=keyid,issuer
        subjectKeyIdentifier=hash
        EOF
        openssl x509 -req -days 1 -CA "$fixture/tls/ca.crt" -CAkey "$fixture/tls/ca.key" \
          -CAcreateserial -in "$fixture/tls/server.csr" -out "$fixture/tls/server.crt" -extfile "$fixture/server.ext"
        for identity in vpn-p0 vpn-p1; do
          openssl req -newkey rsa:2048 -nodes -subj "/CN=$identity" \
            -keyout "$fixture/tls/client-$identity.key" -out "$fixture/tls/client-$identity.csr"
          cat > "$fixture/client.ext" <<'EOF'
        basicConstraints=critical,CA:FALSE
        keyUsage=critical,digitalSignature,keyEncipherment
        extendedKeyUsage=clientAuth
        authorityKeyIdentifier=keyid,issuer
        subjectKeyIdentifier=hash
        EOF
          openssl x509 -req -days 1 -CA "$fixture/tls/ca.crt" -CAkey "$fixture/tls/ca.key" \
            -CAcreateserial -in "$fixture/tls/client-$identity.csr" -out "$fixture/tls/client-$identity.crt" -extfile "$fixture/client.ext"
        done
        openssl ca -batch -config "$fixture/ca/openssl.cnf" -gencrl -out "$fixture/tls/ca.crl"
        openssl verify -x509_strict -purpose sslserver -CAfile "$fixture/tls/ca.crt" \
          "$fixture/tls/server.crt"
        for identity in vpn-p0 vpn-p1; do
          openssl verify -x509_strict -purpose sslclient -CAfile "$fixture/tls/ca.crt" \
            "$fixture/tls/client-$identity.crt"
        done
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=silence-fixture-ca \
          -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' \
          -addext 'keyUsage=critical,keyCertSign,cRLSign' \
          -keyout "$fixture/tls/silence-ca.key" -out "$fixture/tls/silence-ca.crt"
        for identity in server client; do
          openssl req -newkey rsa:2048 -nodes -subj "/CN=silence-$identity" \
            -keyout "$fixture/tls/silence-$identity.key" -out "$fixture/tls/silence-$identity.csr"
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' \
            "extendedKeyUsage=${identity}Auth" 'subjectAltName=IP:127.0.0.1' > "$fixture/silence.ext"
          openssl x509 -req -days 1 -CA "$fixture/tls/silence-ca.crt" -CAkey "$fixture/tls/silence-ca.key" \
            -CAcreateserial -in "$fixture/tls/silence-$identity.csr" \
            -out "$fixture/tls/silence-$identity.crt" -extfile "$fixture/silence.ext"
        done
        dd if=/dev/zero of="$fixture/oversize.bin" bs=1M count=9 status=none
        touch "$fixture/.private-fixture-v3"
      args:
        creates: /var/tmp/observability-control-plane-fixture/.private-fixture-v3
      changed_when: false

    - name: Install bounded direct mTLS fixture client
      ansible.builtin.copy:
        dest: /var/tmp/observability-control-plane-fixture/mtls-client.py
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/python3
          import argparse
          import http.client
          import os
          import socket
          import ssl
          import subprocess
          import sys

          DIRECT_ADDRESS = "10.23.0.2"
          DIRECT_PORT = 9443
          MAX_BODY_SIZE = 8 * 1024 * 1024 + 1
          CURL_MAX_TIME = 5
          CURL_PROCESS_TIMEOUT = 6


          class FixtureTransportError(OSError):
              pass


          class DirectHTTPSConnection(http.client.HTTPSConnection):
              def connect(self):
                  raw = socket.create_connection((DIRECT_ADDRESS, DIRECT_PORT), timeout=5)
                  self.sock = self._context.wrap_socket(
                      raw, server_hostname=self.host
                  )


          def send_oversized_request(args, _context):
              command = (
                  "curl",
                  "--disable",
                  "--silent",
                  "--show-error",
                  "--noproxy",
                  "*",
                  "--resolve",
                  "{}:{}:{}".format(args.server_name, DIRECT_PORT, DIRECT_ADDRESS),
                  "--cacert",
                  args.ca,
                  "--cert",
                  args.cert,
                  "--key",
                  args.key,
                  "--connect-timeout",
                  str(CURL_MAX_TIME),
                  "--max-time",
                  str(CURL_MAX_TIME),
                  "--output",
                  os.devnull,
                  "--write-out",
                  "%{http_code}",
                  "--request",
                  args.method,
                  "--header",
                  "Host: {}".format(args.server_name),
                  "--header",
                  "Content-Length: {}".format(args.body_size),
                  "--header",
                  "Expect: 100-continue",
                  "--data-binary",
                  "@-",
                  "https://{}:{}{}".format(
                      args.server_name, DIRECT_PORT, args.path
                  ),
              )
              try:
                  completed = subprocess.run(
                      command,
                      input=b"x" * args.body_size,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      check=False,
                      timeout=CURL_PROCESS_TIMEOUT,
                  )
              except subprocess.TimeoutExpired as error:
                  raise FixtureTransportError("curl_timeout") from error
              except FileNotFoundError as error:
                  raise FixtureTransportError("curl_unavailable") from error
              if completed.returncode == 28:
                  raise FixtureTransportError("curl_timeout")
              if completed.returncode != 0:
                  raise FixtureTransportError("curl_failed")
              try:
                  status = completed.stdout.decode("ascii")
              except UnicodeDecodeError as error:
                  raise ValueError("malformed HTTP response status") from error
              if status != "413":
                  raise ValueError("unexpected HTTP response status")
              return int(status)


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--server-name", required=True)
              parser.add_argument("--path", required=True)
              parser.add_argument("--method", choices=("GET", "POST"), default="GET")
              parser.add_argument("--ca", required=True)
              parser.add_argument("--cert", required=True)
              parser.add_argument("--key", required=True)
              parser.add_argument("--body", default="")
              parser.add_argument("--body-size", type=int)
              args = parser.parse_args()
              if args.body_size is not None:
                  if args.body or args.body_size <= 0 or args.body_size > MAX_BODY_SIZE:
                      return 2
              context = ssl.create_default_context(cafile=args.ca)
              context.load_cert_chain(certfile=args.cert, keyfile=args.key)
              try:
                  if args.body_size is not None:
                      status = send_oversized_request(args, context)
                  else:
                      connection = DirectHTTPSConnection(
                          args.server_name, timeout=5, context=context
                      )
                      try:
                          connection.request(
                              args.method,
                              args.path,
                              body=args.body.encode("utf-8"),
                              headers={"Host": args.server_name},
                          )
                          status = connection.getresponse().status
                      finally:
                          connection.close()
                  print(status)
                  return 0
              except FixtureTransportError as error:
                  print(str(error), file=sys.stderr)
                  return 2
              except ssl.SSLError:
                  return 60
              except (OSError, http.client.HTTPException, ValueError):
                  return 2


          if __name__ == "__main__":
              sys.exit(main())

    - name: Install actual local exporter through the canonical role
      ansible.builtin.include_role:
        name: monitoring

    - name: Create schema-2 manifest directory
      ansible.builtin.file:
        path: /var/lib/ripdpi-vpn-deploy
        state: directory
        mode: '0755'

    - name: Write explicit source-fixture manifest for the cohosted agent
      ansible.builtin.copy:
        dest: /var/lib/ripdpi-vpn-deploy/manifest.json
        mode: '0644'
        content: >-
          {"schema_version":2,"environment":"staging","provider":"fixture",
          "source_revision":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
          "deployable_digest":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}

    - name: Install shared nginx for unchanged public-listener ownership proof
      ansible.builtin.apt:
        name: nginx
        state: present
        policy_rc_d: 101

    - name: Publish fixture public TLS listener outside observability ownership
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/public-fixture.conf
        mode: '0644'
        content: |
          server {
            listen 443 ssl;
            server_name 10.23.0.2;
            ssl_certificate /var/tmp/observability-control-plane-fixture/tls/server.crt;
            ssl_certificate_key /var/tmp/observability-control-plane-fixture/tls/server.key;
            location = /public-fixture { return 200 'public-listener-preserved'; }
          }

    - name: Validate shared fixture nginx
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    - name: Start shared fixture nginx before monitoring convergence
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true

    - name: Capture public nginx original process identity
      ansible.builtin.command:
        argv: [systemctl, show, nginx, --property=MainPID, --value]
      register: public_nginx_pid
      changed_when: false

    - name: Preserve public nginx process identity for the isolation assertion
      ansible.builtin.copy:
        dest: /var/tmp/observability-control-plane-fixture/public-nginx.pid
        mode: '0600'
        content: "{{ public_nginx_pid.stdout }}"

    - name: Create fixture-only Telegram egress refusal boundary
      ansible.builtin.file:
        path: /etc/systemd/system/observability-telegram-relay.service.d
        state: directory
        mode: '0755'

    - name: Refuse external Telegram access from credential-free runtime tests
      ansible.builtin.copy:
        dest: /etc/systemd/system/observability-telegram-relay.service.d/no-external-api.conf
        mode: '0644'
        content: |
          [Service]
          IPAddressDeny=any
          IPAddressAllow=localhost

    - name: Install explicit TLS push-transport test endpoint
      ansible.builtin.copy:
        dest: /var/tmp/observability-control-plane-fixture/push-transport.py
        mode: '0700'
        content: |
          #!/usr/bin/env python3
          # This endpoint proves HTTPS transport only, never Kuma monitor behavior.
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json, ssl, time
          from pathlib import Path
          root = Path('/var/tmp/observability-control-plane-fixture')
          tokens = {
              'NodeFixtureToken00000000000000001': 'node',
              'PipelineFixtureToken0000000000001': 'pipeline',
              'DeliveryFixtureToken0000000000001': 'delivery',
          }
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  token = self.path.removeprefix('/api/push/')
                  if not self.path.startswith('/api/push/') or token not in tokens:
                      self.send_response(404); self.end_headers(); return
                  path = root / 'push-observations.json'
                  value = json.loads(path.read_text()) if path.exists() else {}
                  value[tokens[token]] = time.time()
                  path.write_text(json.dumps(value))
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"ok":true}')
              def log_message(self, *_args): pass
          server = HTTPServer(('10.23.0.2', 9444), Handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(root/'tls/server.crt', root/'tls/server.key')
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()

    - name: Install isolated transport test service
      ansible.builtin.copy:
        dest: /etc/systemd/system/observability-push-transport-fixture.service
        mode: '0644'
        content: |
          [Service]
          ExecStart=/usr/bin/python3 /var/tmp/observability-control-plane-fixture/push-transport.py
          [Install]
          WantedBy=multi-user.target

    - name: Start explicit push transport fixture
      ansible.builtin.systemd_service:
        name: observability-push-transport-fixture
        state: started
        daemon_reload: true
