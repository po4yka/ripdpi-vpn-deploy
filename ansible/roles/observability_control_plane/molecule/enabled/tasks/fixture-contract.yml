---
- name: Read enabled fixture TLS inputs
  ansible.builtin.slurp:
    src: "/var/tmp/observability-control-plane-fixture/{{ item }}"
  loop:
    - tls/server.crt
    - tls/server.key
    - tls/ca.crt
    - tls/ca.crl
    - tls/client-vpn-p0.crt
    - tls/silence-ca.crt
    - tls/silence-server.crt
    - tls/silence-server.key
    - tls/silence-client.crt
    - tls/silence-client.key
    - tls/client-vpn-p0.key
  register: control_plane_fixture_tls
  no_log: true

- name: Define complete enabled control-plane fixture contract
  ansible.builtin.set_fact:
    observability_alert_policy: >-
      {{ (lookup('ansible.builtin.file',
          playbook_dir ~ '/../../../../group_vars/all.yml') | from_yaml).observability_alert_policy }}
    observability_secrets:
      telegram:
        relay_auth_token: "{{ 'd4' * 32 }}"
      receiver_ca_pem: "{{ control_plane_fixture_tls.results[2].content | b64decode }}"
      senders:
        - node_id: vpn-p0
          certificate_pem: "{{ control_plane_fixture_tls.results[4].content | b64decode }}"
          private_key_pem: "{{ control_plane_fixture_tls.results[10].content | b64decode }}"
    monitoring:
      node_exporter_user: prometheus
      node_exporter_group: prometheus
      node_exporter_textfile_group: observability-textfile
      node_exporter_textfile_dir: /var/lib/node_exporter/textfile
    observability_kuma_secrets:
      schema_version: 1
      tls:
        ca_pem: "{{ control_plane_fixture_tls.results[2].content | b64decode }}"
      push_monitors:
        - {node_id: vpn-p0, kind: node, token: NodeFixtureToken00000000000000001}
        - {node_id: vpn-p0, kind: pipeline, token: PipelineFixtureToken0000000000001}
        - {node_id: vpn-p0, kind: delivery, token: DeliveryFixtureToken0000000000001}
    observability_push:
      node_id: vpn-p0
      origin: https://10.23.0.2:9444
      kinds: [pipeline, delivery]
      services: [nginx.service]
      expected_nodes: [vpn-p0]
      prometheus_origin: http://127.0.0.1:9090
      relay_origin: http://127.0.0.1:19095
      relay_auth_path: /etc/observability-control-plane/credentials/telegram-relay-auth-token
      textfile_dir: /var/lib/node_exporter/textfile
    observability_control_plane:
      enabled: true
      service_user: observability-prometheus
      service_group: observability-prometheus
      install_root: /opt/observability-prometheus
      binary_link: /usr/local/libexec/observability-prometheus
      config_root: /etc/observability-control-plane
      data_dir: /var/lib/observability-prometheus
      ingress_port: 9443
      ingress_address: 10.23.0.2
      prometheus_listen: 127.0.0.1:9090
      remote_write_path_prefix: /remote-write/v1/nodes
      request_body_limit: 8m
      request_concurrency: 4
      request_rate: 20r/s
      request_rate_burst: 40
      tsdb_retention_time: 7d
      tsdb_retention_size: 1GB
      tsdb_required_bytes: 2147483648
      tsdb_high_water_bytes: 2147483648
      disk_reserve_bytes: 5368709120
      disk_reserve_percent: 20
      guard_interval_seconds: 5
      disk_write_headroom_bytes: 134217728
      disk_measured_peak_bytes_per_second: 1048576
      disk_measured_stop_seconds: 30
      disk_guard_state_dir: /var/lib/observability-disk-guard
      prometheus:
        version: 3.14.0
        urls:
          amd64: https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
          arm64: https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-arm64.tar.gz
        sha256:
          amd64: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
          arm64: 077f3781ab7245dc04c9a3c9b78ba120fc8e41aa0dc97489b0af67247e50ba83
        archive_members:
          amd64: prometheus-3.14.0.linux-amd64/prometheus
          arm64: prometheus-3.14.0.linux-arm64/prometheus
        promtool_archive_members:
          amd64: prometheus-3.14.0.linux-amd64/promtool
          arm64: prometheus-3.14.0.linux-arm64/promtool
      tls:
        server_cert_pem: "{{ control_plane_fixture_tls.results[0].content | b64decode }}"
        server_key_pem: "{{ control_plane_fixture_tls.results[1].content | b64decode }}"
        client_ca_pem: "{{ control_plane_fixture_tls.results[2].content | b64decode }}"
        client_crl_pem: "{{ control_plane_fixture_tls.results[3].content | b64decode }}"
      ingest_identities:
        - node_id: vpn-p0
          client_cert_pem: "{{ control_plane_fixture_tls.results[4].content | b64decode }}"
      expected_targets:
        enabled: true
        inventory:
          schema_version: 1
          generation: inventory-v1
          source_id: inventory-source-v1
          max_future_seconds: 30
          targets:
            - target: vpn-p0
              role: edge
              lifecycle: enabled
              ever_seen: false
              label_values:
                node: [vpn-p0]
                role: [edge]
              required_families: [vpn_watchdog_collection_success]
        textfile_directory: /var/lib/node_exporter/textfile
        expected_source_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        observed_source_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        expected_deployable_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        observed_deployable_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      protocol_liveness:
        enabled: true
        evidence_directory: /var/lib/vpn-protocol-liveness
        evidence_path: /var/lib/vpn-protocol-liveness/last-evidence.json
        output_directory: /var/lib/node_exporter/textfile
        output_path: /var/lib/node_exporter/textfile/protocol-liveness.prom
        stale_after_seconds: 180
        max_future_seconds: 60
      alerting:
        enabled: true
        source_generation: cccccccccccccccccccccccccccccccccccccccc
        listen: 127.0.0.1:9093
        data_dir: /var/lib/observability-alertmanager
        install_root: /opt/observability-alertmanager
        binary_link: /usr/local/libexec/observability-alertmanager
        amtool_install_root: /opt/observability-amtool
        amtool_binary_link: /usr/local/libexec/observability-amtool
        promtool_install_root: /opt/observability-promtool
        promtool_binary_link: /usr/local/libexec/observability-promtool
        credential_path: /etc/observability-control-plane/credentials/telegram-bot-token
        alertmanager:
          version: 0.28.1
          urls:
            amd64: https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz
            arm64: https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-arm64.tar.gz
          sha256:
            amd64: 5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311
            arm64: d8832540e5b9f613d2fd759e31d603173b9c61cc7bb5e3bc7ae2f12038b1ce4f
          archive_members:
            amd64: alertmanager-0.28.1.linux-amd64/alertmanager
            arm64: alertmanager-0.28.1.linux-arm64/alertmanager
          amtool_archive_members:
            amd64: alertmanager-0.28.1.linux-amd64/amtool
            arm64: alertmanager-0.28.1.linux-arm64/amtool
        silence_gateway:
          enabled: true
          listen: 127.0.0.1:19094
          environment: staging
          max_ttl_seconds: 14400
          operators:
            - owner: operator-a
              token: "{{ 'a1' * 32 }}"
          sender_token: "{{ 'b2' * 32 }}"
          backend_ca_pem: "{{ control_plane_fixture_tls.results[5].content | b64decode }}"
          backend_server_cert_pem: "{{ control_plane_fixture_tls.results[6].content | b64decode }}"
          backend_server_key_pem: "{{ control_plane_fixture_tls.results[7].content | b64decode }}"
          backend_client_cert_pem: "{{ control_plane_fixture_tls.results[8].content | b64decode }}"
          backend_client_key_pem: "{{ control_plane_fixture_tls.results[9].content | b64decode }}"
        telegram:
          bot_token: 123456789:molecule-token-not-real-value
          chat_id: '-100000000001'
          topic_id: 42
          parse_mode: HTML
          max_alerts: 5
        group_wait: 30s
        group_interval: 5m
        critical_repeat_interval: 1h
        warning_repeat_interval: 6h
        recovery_stability: 3m
  no_log: true
