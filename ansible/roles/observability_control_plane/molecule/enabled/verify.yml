---
- name: Verify enabled observability control-plane receiver
  hosts: all
  become: true
  tasks:
    - name: Assert isolated ingress and Prometheus are enabled and active
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, observability-ingress]
      changed_when: false

    - name: Assert the node-label relay listens only on loopback
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import socket
            socket.create_connection(('127.0.0.1', 19091), timeout=5).close()
            try:
                socket.create_connection(('10.23.0.2', 19091), timeout=5).close()
            except ConnectionRefusedError:
                pass
            else:
                raise SystemExit('relay reachable on the private ingress address')
      changed_when: false

    - name: Wait for the receiver and assert the authenticated GET refusal
      ansible.builtin.command:
        argv:
          - /var/tmp/observability-control-plane-fixture/mtls-client.py
          - --ca
          - /var/tmp/observability-control-plane-fixture/tls/ca.crt
          - --cert
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.crt
          - --key
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.key
          - --server-name
          - 10.23.0.2
          - --path
          - /remote-write/v1/nodes/vpn-p0
      register: get_request
      changed_when: false
      failed_when: false
      retries: 10
      delay: 1
      until: get_request.stdout == '405'

    - name: Assert Prometheus remains active after expected-target opt-out
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, observability-prometheus]
      changed_when: false

    - name: Assert expected-target opt-out removed only its owned surfaces
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/observability-control-plane-adapter.service
        - /etc/systemd/system/observability-control-plane-adapter.timer
        - /usr/local/libexec/observability-control-plane-adapter.py
        - /usr/local/libexec/observability-expected-target-renderer.py
        - /etc/observability-control-plane/expected-targets.json
        - /var/lib/node_exporter/textfile/observability-expected-targets.prom
        - /var/lib/node_exporter/textfile/observability-control-plane.prom
      register: expected_target_opt_out_surfaces
      failed_when: expected_target_opt_out_surfaces.stat.exists

    - name: Assert mandatory alerting retains its owned runtime surfaces
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /etc/systemd/system/observability-alertmanager.service
        - /etc/systemd/system/observability-silence-gateway.service
        - /usr/local/libexec/observability-silence-gateway
        - /etc/observability-control-plane/alertmanager-current.yml
      register: alerting_opt_out_surfaces
      failed_when: not alerting_opt_out_surfaces.stat.exists

    - name: Assert Alertmanager state remains after expected-target opt-out
      ansible.builtin.stat:
        path: /var/lib/observability-alertmanager
      register: retained_alertmanager_state
      failed_when: not retained_alertmanager_state.stat.isdir

    - name: Assert TSDB content remains after expected-target opt-out
      ansible.builtin.command:
        argv: [test, -f, /var/lib/observability-prometheus/molecule-retained]
      changed_when: false

    - name: Assert protocol-liveness adapter timer is enabled and active
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, observability-protocol-liveness-adapter.timer]
      changed_when: false

    - name: Read current time for protocol-liveness fixture publication
      ansible.builtin.command:
        argv: [date, '+%s']
      register: protocol_liveness_fixture_clock
      changed_when: false

    - name: Refresh canonical evidence after convergence and idempotence
      ansible.builtin.copy:
        dest: /var/lib/vpn-protocol-liveness/last-evidence.json
        owner: root
        group: root
        mode: '0600'
        content: >-
          {{ {"candidate_policies": [], "decision": "healthy",
          "evaluated_at": protocol_liveness_fixture_clock.stdout | int, "evidence": [],
          "failed_vantages": {}, "monitoring_errors": [], "schema_version": 2}
          | to_json }}

    - name: Run protocol-liveness adapter once against canonical evidence
      ansible.builtin.command:
        argv: [systemctl, start, observability-protocol-liveness-adapter.service]
      changed_when: false

    - name: Assert protocol-liveness adapter published the bounded textfile
      ansible.builtin.command:
        argv: [grep, -F, 'vpn_observability_evidence_state', /var/lib/node_exporter/textfile/protocol-liveness.prom]
      changed_when: false

    - name: Assert remote-write receiver rejects a missing or wrong SNI
      ansible.builtin.command:
        argv:
          - /var/tmp/observability-control-plane-fixture/mtls-client.py
          - --ca
          - /var/tmp/observability-control-plane-fixture/tls/ca.crt
          - --cert
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.crt
          - --key
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.key
          - --server-name
          - wrong.fixture.test
          - --path
          - /remote-write/v1/nodes/vpn-p0
      register: wrong_sni
      changed_when: false
      failed_when: wrong_sni.rc != 60
      retries: 2
      delay: 1
      until: (wrong_sni.msg | default('')) != 'Error executing command.'

    - name: Assert remote-write receiver rejects a CN path mismatch
      ansible.builtin.command:
        argv:
          - /var/tmp/observability-control-plane-fixture/mtls-client.py
          - --method
          - POST
          - --ca
          - /var/tmp/observability-control-plane-fixture/tls/ca.crt
          - --cert
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.crt
          - --key
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.key
          - --server-name
          - 10.23.0.2
          - --path
          - /remote-write/v1/nodes/vpn-p1
      register: mismatched_cn
      changed_when: false
      failed_when: mismatched_cn.stdout != '403' and mismatched_cn.rc != 60
      retries: 2
      delay: 1
      until: (mismatched_cn.msg | default('')) != 'Error executing command.'

    - name: Reject authenticated query parameters before remote-write forwarding
      ansible.builtin.command:
        argv:
          - /var/tmp/observability-control-plane-fixture/mtls-client.py
          - --method
          - POST
          - --ca
          - /var/tmp/observability-control-plane-fixture/tls/ca.crt
          - --cert
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.crt
          - --key
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.key
          - --server-name
          - 10.23.0.2
          - --path
          - /remote-write/v1/nodes/vpn-p0?probe=1
      register: query_request
      changed_when: false
      failed_when: query_request.stdout != '400' or query_request.rc != 0
      retries: 2
      delay: 1
      until: (query_request.msg | default('')) != 'Error executing command.'

    - name: Submit an oversized request and require exact server-side 413
      ansible.builtin.command:
        argv:
          - /var/tmp/observability-control-plane-fixture/mtls-client.py
          - --method
          - POST
          - --body-size
          - '8388609'
          - --ca
          - /var/tmp/observability-control-plane-fixture/tls/ca.crt
          - --cert
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.crt
          - --key
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.key
          - --server-name
          - 10.23.0.2
          - --path
          - /remote-write/v1/nodes/vpn-p0
      register: oversized_request
      changed_when: false
      failed_when: oversized_request.stdout != '413' or oversized_request.rc != 0
      retries: 2
      delay: 1
      until: oversized_request.stdout == '413' and oversized_request.rc == 0

    - name: Assert invalid protobuf reaches the node-label relay and is rejected
      ansible.builtin.command:
        argv:
          - /var/tmp/observability-control-plane-fixture/mtls-client.py
          - --method
          - POST
          - --body
          - fixture
          - --ca
          - /var/tmp/observability-control-plane-fixture/tls/ca.crt
          - --cert
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.crt
          - --key
          - /var/tmp/observability-control-plane-fixture/tls/client-vpn-p0.key
          - --server-name
          - 10.23.0.2
          - --path
          - /remote-write/v1/nodes/vpn-p0
      register: valid_write
      changed_when: false
      failed_when: valid_write.stdout != '400'
      retries: 2
      delay: 1
      until: (valid_write.msg | default('')) != 'Error executing command.'

    - name: Assert published generation remains content-addressed
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib
            from pathlib import Path
            link = Path('/etc/observability-control-plane/current.yml')
            assert link.is_symlink()
            target = link.resolve(strict=True)
            assert target.parent == link.parent / 'generations'
            assert target.stem == hashlib.sha256(target.read_bytes()).hexdigest()
      changed_when: false

    - name: Assert TSDB free-space preflight remains enforced
      ansible.builtin.command:
        argv: [df, -PB1, /var/lib/observability-prometheus]
      changed_when: false

    - name: Exercise real cohosted receiver and monitoring-only failure boundaries
      ansible.builtin.include_tasks: tasks/bounded-runtime.yml

    - name: Assert the relay replaces a forged payload node label with the sender identity
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, time, urllib.parse, urllib.request
            opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
            nonce = str(time.time_ns())
            body = ('relay_node_label_probe{node="forged-node",nonce="%s"} 1\n' % nonce).encode()
            request = urllib.request.Request('http://127.0.0.1:19090/api/v1/import/prometheus', data=body, method='POST')
            with opener.open(request, timeout=10) as response:
                assert response.status == 204
            query = 'http://127.0.0.1:9090/api/v1/query?' + urllib.parse.urlencode(
                {'query': 'relay_node_label_probe{nonce="%s"}' % nonce})
            deadline = time.monotonic() + 120
            while time.monotonic() < deadline:
                with opener.open(query, timeout=5) as response:
                    result = json.load(response)['data']['result']
                if result:
                    nodes = sorted(row['metric'].get('node') for row in result)
                    assert nodes == ['vpn-p0'], nodes
                    raise SystemExit(0)
                time.sleep(2)
            raise SystemExit('relay_node_label_probe_missing')
      changed_when: false
