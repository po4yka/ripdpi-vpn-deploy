---
- name: Require complete bounded Alertmanager and Telegram configuration
  ansible.builtin.assert:
    that:
      - observability_control_plane.alerting.listen == '127.0.0.1:9093'
      - observability_control_plane.alerting.source_generation is match('^[0-9a-f]{40,64}$')
      - >-
        observability_control_plane.alerting.credential_path ==
        '/etc/observability-control-plane/credentials/telegram-bot-token'
      - observability_control_plane.alerting.alertmanager.version is match('^[A-Za-z0-9._+-]+$')
      - observability_control_plane.alerting.alertmanager.urls.amd64 is match('^https://|^file://')
      - observability_control_plane.alerting.alertmanager.urls.arm64 is match('^https://|^file://')
      - observability_control_plane.alerting.alertmanager.sha256.amd64 is match('^[0-9a-fA-F]{64}$')
      - observability_control_plane.alerting.alertmanager.sha256.arm64 is match('^[0-9a-fA-F]{64}$')
      - observability_control_plane.alerting.alertmanager.archive_members.amd64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.alerting.alertmanager.archive_members.arm64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.alerting.alertmanager.amtool_archive_members.amd64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.alerting.alertmanager.amtool_archive_members.arm64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.prometheus.promtool_archive_members.amd64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.prometheus.promtool_archive_members.arm64 is match('^[A-Za-z0-9._+/+-]+$')
      - >-
        observability_control_plane.alerting.telegram.bot_token is
        match('^[0-9]{6,16}:[A-Za-z0-9_-]{20,128}$')
      - >-
        observability_control_plane.alerting.telegram.api_url |
        default('https://api.telegram.org') == 'https://api.telegram.org'
      - observability_control_plane.alerting.telegram.chat_id | string is match('^-?[0-9]{1,20}$')
      - observability_control_plane.alerting.telegram.topic_id | int >= 0
      - observability_control_plane.alerting.telegram.topic_id | int <= 2147483647
      - observability_control_plane.alerting.telegram.max_alerts | int == 5
      - >-
        observability_control_plane.alerting.telegram.relay_listen |
        default('127.0.0.1:19095') == '127.0.0.1:19095'
      - >-
        observability_control_plane.alerting.telegram.relay_url |
        default('http://127.0.0.1:19095/alert') == 'http://127.0.0.1:19095/alert'
      - >-
        observability_control_plane.alerting.telegram.relay_auth_path |
        default('/etc/observability-control-plane/credentials/telegram-relay-auth-token') ==
        '/etc/observability-control-plane/credentials/telegram-relay-auth-token'
      - >-
        observability_control_plane.alerting.telegram.relay_auth_credential |
        default('/run/credentials/observability-alertmanager.service/telegram-relay-auth-token') ==
        '/run/credentials/observability-alertmanager.service/telegram-relay-auth-token'
      - >-
        observability_control_plane.alerting.telegram.webhook_timeout |
        default('20s') == '20s'
      - observability_control_plane.alerting.group_wait == '30s'
      - observability_control_plane.alerting.group_interval == '5m'
      - observability_control_plane.alerting.critical_repeat_interval == '1h'
      - observability_control_plane.alerting.warning_repeat_interval == '6h'
      - observability_control_plane.alerting.recovery_stability == '3m'
      - >-
        observability_alert_policy.keys() | list | sort ==
        ['burn_stale_seconds', 'certificate_critical_seconds',
         'certificate_warning_seconds', 'clock_skew_seconds',
         'cpu_warning_ratio', 'critical_hold', 'critical_severity',
         'detector_hold', 'detector_stale_seconds', 'disk_critical_ratio',
         'disk_warning_ratio', 'filesystem_mountpoint', 'honeypot_events_60min',
         'inode_critical_ratio', 'inode_warning_ratio', 'memory_warning_ratio',
         'network_device_exclude_regex', 'network_error_rate',
         'policy_events_5min', 'required_systemd_units', 'resource_hold',
         'restart_attempts', 'swap_warning_ratio', 'warning_severity']
      - observability_alert_policy.warning_severity == 'warning'
      - observability_alert_policy.critical_severity == 'critical'
      - observability_alert_policy.resource_hold is match('^(?:[1-9]|[1-5][0-9]|60)m$')
      - observability_alert_policy.critical_hold is match('^(?:[1-9]|[1-5][0-9]|60)m$')
      - observability_alert_policy.detector_hold is match('^(?:[1-9]|[1-5][0-9]|60)m$')
      - observability_alert_policy.cpu_warning_ratio | type_debug in ['float', 'int']
      - observability_alert_policy.cpu_warning_ratio > 0
      - observability_alert_policy.cpu_warning_ratio < 1
      - observability_alert_policy.memory_warning_ratio | type_debug in ['float', 'int']
      - observability_alert_policy.memory_warning_ratio > 0
      - observability_alert_policy.memory_warning_ratio < 1
      - observability_alert_policy.swap_warning_ratio | type_debug in ['float', 'int']
      - observability_alert_policy.swap_warning_ratio > 0
      - observability_alert_policy.swap_warning_ratio < 1
      - observability_alert_policy.disk_critical_ratio | type_debug in ['float', 'int']
      - observability_alert_policy.disk_warning_ratio | type_debug in ['float', 'int']
      - observability_alert_policy.disk_critical_ratio > 0
      - observability_alert_policy.disk_critical_ratio < observability_alert_policy.disk_warning_ratio
      - observability_alert_policy.disk_warning_ratio < 1
      - observability_alert_policy.inode_critical_ratio | type_debug in ['float', 'int']
      - observability_alert_policy.inode_warning_ratio | type_debug in ['float', 'int']
      - observability_alert_policy.inode_critical_ratio > 0
      - observability_alert_policy.inode_critical_ratio < observability_alert_policy.inode_warning_ratio
      - observability_alert_policy.inode_warning_ratio < 1
      - observability_alert_policy.clock_skew_seconds | type_debug == 'int'
      - observability_alert_policy.clock_skew_seconds >= 1
      - observability_alert_policy.clock_skew_seconds <= 3600
      - observability_alert_policy.certificate_critical_seconds | type_debug == 'int'
      - observability_alert_policy.certificate_warning_seconds | type_debug == 'int'
      - observability_alert_policy.certificate_critical_seconds >= 3600
      - observability_alert_policy.certificate_critical_seconds < observability_alert_policy.certificate_warning_seconds
      - observability_alert_policy.certificate_warning_seconds <= 7776000
      - observability_alert_policy.network_error_rate | type_debug in ['float', 'int']
      - observability_alert_policy.network_error_rate >= 0
      - observability_alert_policy.restart_attempts | type_debug == 'int'
      - observability_alert_policy.restart_attempts >= 1
      - observability_alert_policy.restart_attempts <= 20
      - observability_alert_policy.detector_stale_seconds | type_debug == 'int'
      - observability_alert_policy.detector_stale_seconds >= 60
      - observability_alert_policy.detector_stale_seconds <= 3600
      - observability_alert_policy.burn_stale_seconds | type_debug == 'int'
      - observability_alert_policy.burn_stale_seconds >= 300
      - observability_alert_policy.burn_stale_seconds <= 86400
      - observability_alert_policy.honeypot_events_60min | type_debug == 'int'
      - observability_alert_policy.honeypot_events_60min >= 1
      - observability_alert_policy.honeypot_events_60min <= 100000
      - observability_alert_policy.policy_events_5min | type_debug == 'int'
      - observability_alert_policy.policy_events_5min >= 1
      - observability_alert_policy.policy_events_5min <= 100000
      - observability_alert_policy.filesystem_mountpoint == '/'
      - observability_alert_policy.network_device_exclude_regex == '^lo$'
      - observability_alert_policy.required_systemd_units | length >= 1
      - observability_alert_policy.required_systemd_units | length <= 64
      - >-
        observability_alert_policy.required_systemd_units | unique | length ==
        observability_alert_policy.required_systemd_units | length
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_control_plane.alerting.deadman.receiver_url is
        match('^http://127[.]0[.]0[.]1:[0-9]{2,5}/[A-Za-z0-9._/-]+$')
      - observability_control_plane.alerting.deadman.repeat_interval == '1m'
    fail_msg: >-
      Alerting requires pinned validator/runtime archives, a private numeric
      Telegram destination, a credential token, fixed bounded routing, and an
      optional loopback-only dead-man canary receiver.
  no_log: true

- name: Validate each required systemd selector
  ansible.builtin.assert:
    that:
      - item is match('^[a-z0-9][a-z0-9@_-]{0,62}[.]service$')
  loop: "{{ observability_alert_policy.required_systemd_units }}"
  no_log: true

- name: Require finite authenticated silence authority before any host changes
  ansible.builtin.assert:
    that:
      - observability_control_plane.config_root == '/etc/observability-control-plane'
      - observability_control_plane.service_user != 'observability-silence'
      - observability_control_plane.alerting.silence_gateway.enabled | bool
      - observability_control_plane.alerting.silence_gateway.listen == '127.0.0.1:19094'
      - observability_control_plane.alerting.silence_gateway.environment is match('^[a-z][a-z0-9_-]{0,63}\\Z')
      - observability_control_plane.alerting.silence_gateway.max_ttl_seconds is integer
      - observability_control_plane.alerting.silence_gateway.max_ttl_seconds >= 60
      - observability_control_plane.alerting.silence_gateway.max_ttl_seconds <= 86400
      - observability_control_plane.alerting.silence_gateway.operators | length >= 1
      - observability_control_plane.alerting.silence_gateway.operators | length <= 32
      - observability_control_plane.alerting.silence_gateway.sender_token is match('^[0-9a-f]{64}\\Z')
      - >-
        observability_control_plane.alerting.silence_gateway.operators | map(attribute='owner') | unique | length ==
        observability_control_plane.alerting.silence_gateway.operators | length
      - >-
        observability_control_plane.alerting.silence_gateway.operators | map(attribute='token') | unique | length ==
        observability_control_plane.alerting.silence_gateway.operators | length
      - >-
        observability_control_plane.alerting.silence_gateway.sender_token not in
        (observability_control_plane.alerting.silence_gateway.operators | map(attribute='token') | list)
    fail_msg: Alerting requires the private finite silence gateway and distinct bounded owner and sender identities.
  no_log: true

- name: Validate each authenticated maintenance owner
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['owner', 'token']
      - item.owner is match('^[a-z][a-z0-9_-]{0,63}\\Z')
      - item.token is match('^[0-9a-f]{64}\\Z')
  loop: "{{ observability_control_plane.alerting.silence_gateway.operators }}"
  no_log: true

- name: Verify dedicated backend certificate identities on the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/validate-silence-backend.py') }}"
    stdin: "{{ observability_control_plane | to_json }}"
    stdin_add_newline: false
  delegate_to: localhost
  connection: local
  become: false
  changed_when: false
  check_mode: false
  no_log: true
