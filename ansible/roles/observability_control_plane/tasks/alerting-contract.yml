---
- name: Require complete bounded Alertmanager and Telegram configuration
  ansible.builtin.assert:
    that:
      - observability_control_plane.alerting.listen == '127.0.0.1:9093'
      - observability_control_plane.alerting.source_generation is match('^[0-9a-f]{40,64}$')
      - >-
        observability_control_plane.alerting.credential_path ==
        '/etc/observability-control-plane/credentials/telegram-bot-token'
      - observability_control_plane.alerting.alertmanager.version is match('^[A-Za-z0-9._+-]+$')
      - observability_control_plane.alerting.alertmanager.urls.amd64 is match('^https://|^file://')
      - observability_control_plane.alerting.alertmanager.urls.arm64 is match('^https://|^file://')
      - observability_control_plane.alerting.alertmanager.sha256.amd64 is match('^[0-9a-fA-F]{64}$')
      - observability_control_plane.alerting.alertmanager.sha256.arm64 is match('^[0-9a-fA-F]{64}$')
      - observability_control_plane.alerting.alertmanager.archive_members.amd64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.alerting.alertmanager.archive_members.arm64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.alerting.alertmanager.amtool_archive_members.amd64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.alerting.alertmanager.amtool_archive_members.arm64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.prometheus.promtool_archive_members.amd64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.prometheus.promtool_archive_members.arm64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.alerting.telegram.bot_token is match('^\\S{20,128}$')
      - observability_control_plane.alerting.telegram.chat_id | string is match('^-?[0-9]{1,20}$')
      - observability_control_plane.alerting.telegram.topic_id | int >= 0
      - observability_control_plane.alerting.telegram.parse_mode == 'HTML'
      - observability_control_plane.alerting.telegram.max_alerts | int >= 1
      - observability_control_plane.alerting.telegram.max_alerts | int <= 10
      - observability_control_plane.alerting.group_wait == '30s'
      - observability_control_plane.alerting.group_interval == '5m'
      - observability_control_plane.alerting.critical_repeat_interval == '1h'
      - observability_control_plane.alerting.warning_repeat_interval == '6h'
      - observability_control_plane.alerting.recovery_stability == '3m'
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_control_plane.alerting.deadman.receiver_url is
        match('^http://127[.]0[.]0[.]1:[0-9]{2,5}/[A-Za-z0-9._/-]+$')
      - observability_control_plane.alerting.deadman.repeat_interval == '1m'
    fail_msg: >-
      Alerting requires pinned validator/runtime archives, a private numeric
      Telegram destination, a credential token, fixed bounded routing, and an
      optional loopback-only dead-man canary receiver.
  no_log: true

- name: Require finite authenticated silence authority before any host changes
  ansible.builtin.assert:
    that:
      - observability_control_plane.config_root == '/etc/observability-control-plane'
      - observability_control_plane.service_user != 'observability-silence'
      - observability_control_plane.alerting.silence_gateway.enabled | bool
      - observability_control_plane.alerting.silence_gateway.listen == '127.0.0.1:19094'
      - observability_control_plane.alerting.silence_gateway.environment is match('^[a-z][a-z0-9_-]{0,63}\\Z')
      - observability_control_plane.alerting.silence_gateway.max_ttl_seconds is integer
      - observability_control_plane.alerting.silence_gateway.max_ttl_seconds >= 60
      - observability_control_plane.alerting.silence_gateway.max_ttl_seconds <= 86400
      - observability_control_plane.alerting.silence_gateway.operators | length >= 1
      - observability_control_plane.alerting.silence_gateway.operators | length <= 32
      - observability_control_plane.alerting.silence_gateway.sender_token is match('^[0-9a-f]{64}\\Z')
      - >-
        observability_control_plane.alerting.silence_gateway.operators | map(attribute='owner') | unique | length ==
        observability_control_plane.alerting.silence_gateway.operators | length
      - >-
        observability_control_plane.alerting.silence_gateway.operators | map(attribute='token') | unique | length ==
        observability_control_plane.alerting.silence_gateway.operators | length
      - >-
        observability_control_plane.alerting.silence_gateway.sender_token not in
        (observability_control_plane.alerting.silence_gateway.operators | map(attribute='token') | list)
    fail_msg: Alerting requires the private finite silence gateway and distinct bounded owner and sender identities.
  no_log: true

- name: Validate each authenticated maintenance owner
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['owner', 'token']
      - item.owner is match('^[a-z][a-z0-9_-]{0,63}\\Z')
      - item.token is match('^[0-9a-f]{64}\\Z')
  loop: "{{ observability_control_plane.alerting.silence_gateway.operators }}"
  no_log: true

- name: Verify dedicated backend certificate identities on the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/validate-silence-backend.py') }}"
    stdin: "{{ observability_control_plane | to_json }}"
    stdin_add_newline: false
  delegate_to: localhost
  connection: local
  become: false
  changed_when: false
  check_mode: false
  no_log: true
