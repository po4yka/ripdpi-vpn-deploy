---
- name: Require a dedicated Telegram relay authority before any host changes
  ansible.builtin.assert:
    that:
      - observability_secrets.telegram.relay_auth_token is match('^[0-9a-f]{64}\\Z')
      - >-
        observability_secrets.telegram.relay_auth_token !=
        observability_control_plane.alerting.telegram.bot_token
      - >-
        observability_secrets.telegram.relay_auth_token !=
        observability_control_plane.alerting.silence_gateway.sender_token
      - >-
        observability_secrets.telegram.relay_auth_token not in
        (observability_control_plane.alerting.silence_gateway.operators |
         map(attribute='token') | list)
    fail_msg: >-
      Alerting requires a distinct private 64-hex Telegram relay authority.
  no_log: true
