---
- name: Require a dedicated Telegram relay authority before any host changes
  ansible.builtin.assert:
    that:
      - observability_secrets.telegram.relay_auth_token is match('^[0-9a-f]{64}\\Z')
      - >-
        observability_secrets.telegram.relay_auth_token !=
        observability_control_plane.alerting.telegram.bot_token
      - >-
        observability_secrets.telegram.relay_auth_token !=
        observability_control_plane.alerting.silence_gateway.sender_token
      - >-
        observability_secrets.telegram.relay_auth_token not in
        (observability_control_plane.alerting.silence_gateway.operators |
         map(attribute='token') | list)
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.schema_version | default(0) | int == 1
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.pulse_token | default('') is match('^\\S{20,128}$')
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.canary_token | default('') is match('^\\S{20,128}$')
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.pulse_tls | default({}) is mapping
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.pulse_tls.ca_pem | default('') |
        length <= 65536
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.pulse_tls.ca_pem | default('') is
        match('(?s)^-----BEGIN CERTIFICATE-----\\n.+\\n-----END CERTIFICATE-----\\n?$')
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.canary_token != observability_deadman_secrets.pulse_token
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.canary_token !=
        observability_secrets.telegram.relay_auth_token
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.canary_token !=
        observability_control_plane.alerting.telegram.bot_token
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.pulse_token !=
        observability_secrets.telegram.relay_auth_token
      - >-
        not (observability_control_plane.alerting.deadman.enabled | bool) or
        observability_deadman_secrets.pulse_token !=
        observability_control_plane.alerting.telegram.bot_token
    fail_msg: >-
      Alerting requires distinct bounded relay, pulse, and canary credentials.
  no_log: true
