---
- name: Inspect retained authority recovery before disable
  ansible.builtin.stat:
    path: /etc/observability-control-plane/.authority-rollback
    follow: false
  register: _observability_authority_pending
  changed_when: false

- name: Preserve unresolved authority snapshot instead of disabling its surfaces
  ansible.builtin.assert:
    that:
      - not (_observability_authority_pending.stat.exists | default(false))
    fail_msg: Private authority recovery is pending; recover it before disabling or deleting configuration.

- name: Gather control-plane service facts before disable
  ansible.builtin.service_facts:

- name: Stop collector producers without stopping independent node heartbeat
  ansible.builtin.include_role:
    name: observability_kuma
    tasks_from: producers-disable
  vars:
    observability_push_disable_kinds: [pipeline, delivery]

- name: Stop and disable existing control-plane service
  ansible.builtin.systemd_service:
    name: observability-prometheus
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode
    - "'observability-prometheus.service' in ansible_facts.services"

- name: Stop and disable existing silence authority
  ansible.builtin.systemd_service:
    name: observability-silence-gateway
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode
    - "'observability-silence-gateway.service' in ansible_facts.services"

- name: Stop persistent disk guard without clearing its latch
  ansible.builtin.systemd_service:
    name: observability-disk-guard
    state: stopped
  when:
    - not ansible_check_mode
    - "'observability-disk-guard.service' in ansible_facts.services"

- name: Stop isolated private ingress without touching VPN nginx
  ansible.builtin.systemd_service:
    name: observability-ingress
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode
    - "'observability-ingress.service' in ansible_facts.services"

- name: Stop and disable existing Alertmanager service
  ansible.builtin.systemd_service:
    name: observability-alertmanager
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode
    - "'observability-alertmanager.service' in ansible_facts.services"

- name: Stop and disable existing primary Telegram relay
  ansible.builtin.systemd_service:
    name: observability-telegram-relay
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode
    - "'observability-telegram-relay.service' in ansible_facts.services"

- name: Inspect owned adapter units before disable
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - observability-protocol-liveness-adapter.timer
    - observability-control-plane-adapter.timer
    - observability-protocol-liveness-adapter.service
    - observability-control-plane-adapter.service
  register: _observability_collector_adapter_units

- name: Stop and disable collector adapter timers and in-flight services
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ _observability_collector_adapter_units.results }}"
  when:
    - not ansible_check_mode
    - item.stat.exists

- name: Remove protocol-liveness adapter owned surfaces
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/observability-protocol-liveness-adapter.service
    - /etc/systemd/system/observability-protocol-liveness-adapter.timer
    - /usr/local/libexec/observability-protocol-liveness-adapter.py
    - "{{ observability_control_plane.protocol_liveness.output_path }}"

- name: Remove expected-target adapter owned surfaces
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/observability-control-plane-adapter.service
    - /etc/systemd/system/observability-control-plane-adapter.timer
    - /usr/local/libexec/observability-expected-target-renderer.py
    - /usr/local/libexec/observability-control-plane-adapter.py
    - "{{ observability_control_plane.expected_targets.textfile_directory }}/observability-expected-targets.prom"
    - "{{ observability_control_plane.expected_targets.textfile_directory }}/observability-control-plane.prom"
    - "{{ observability_control_plane.config_root }}/expected-targets.json"

- name: Remove control-plane units and ingress only
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/observability-prometheus.service
    - /etc/systemd/system/observability-ingress.service
    - /etc/systemd/system/observability-disk-guard.service
    - /etc/systemd/system/observability-collector.slice
    - /usr/local/libexec/observability-disk-guard.py
    - /etc/systemd/system/observability-alertmanager.service
    - /etc/systemd/system/observability-telegram-relay.service
    - /etc/systemd/system/observability-silence-gateway.service
    - /usr/local/libexec/observability-telegram-relay
    - /usr/local/libexec/observability-silence-gateway

- name: Reload systemd after removing owned service unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Preserve TSDB on convergent disable
  ansible.builtin.stat:
    path: "{{ observability_control_plane.data_dir }}"
  register: _observability_tsdb_preserved
  changed_when: false

- name: Refuse a disable operation that would remove historical TSDB
  ansible.builtin.assert:
    that: _observability_tsdb_preserved.stat.exists | default(false)
    fail_msg: Control-plane disable preserves TSDB; destructive retention is separate.
  when: _observability_tsdb_preserved.stat.exists | default(false)
