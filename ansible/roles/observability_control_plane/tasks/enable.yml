---
- name: Require a complete bounded control-plane contract
  ansible.builtin.assert:
    that:
      - observability_control_plane.service_user == 'observability-prometheus'
      - observability_control_plane.service_group == 'observability-prometheus'
      - observability_control_plane.ingress_port | int == 9443
      - observability_control_plane.prometheus_listen == '127.0.0.1:9090'
      - observability_control_plane.remote_write_path_prefix == '/remote-write/v1/nodes'
      - observability_control_plane.request_body_limit == '8m'
      - observability_control_plane.request_concurrency | int == 4
      - observability_control_plane.request_rate == '20r/s'
      - observability_control_plane.request_rate_burst | int == 40
      - observability_control_plane.tsdb_retention_time == '7d'
      - observability_control_plane.tsdb_retention_size == '1GB'
      - observability_control_plane.tsdb_required_bytes | int == 2147483648
      - observability_control_plane.tsdb_high_water_bytes | int == 2147483648
      - observability_control_plane.disk_reserve_bytes | int == 5368709120
      - observability_control_plane.disk_reserve_percent | int == 20
      - observability_control_plane.guard_interval_seconds | int == 5
      - observability_control_plane.disk_guard_state_dir == '/var/lib/observability-disk-guard'
      - observability_control_plane.data_dir == '/var/lib/observability-prometheus'
      - observability_control_plane.ingress_address is match('^[0-9.]+$')
      - observability_control_plane.prometheus.version is match('^[A-Za-z0-9._+-]+$')
      - observability_control_plane.prometheus.urls.amd64 is match('^https://|^file://')
      - observability_control_plane.prometheus.urls.arm64 is match('^https://|^file://')
      - observability_control_plane.prometheus.sha256.amd64 is match('^[0-9a-fA-F]{64}$')
      - observability_control_plane.prometheus.sha256.arm64 is match('^[0-9a-fA-F]{64}$')
      - observability_control_plane.prometheus.archive_members.amd64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.prometheus.archive_members.arm64 is match('^[A-Za-z0-9._+/+-]+$')
      - observability_control_plane.tls.server_cert_pem | length > 0
      - observability_control_plane.tls.server_key_pem | length > 0
      - observability_control_plane.tls.client_ca_pem | length > 0
      - observability_control_plane.tls.client_crl_pem | length > 0
      - observability_control_plane.ingest_identities | length > 0
      - >-
        observability_control_plane.ingest_identities | map(attribute='node_id') |
        list | unique | length == observability_control_plane.ingest_identities | length
    fail_msg: >-
      observability_control_plane requires exact bounded receiver settings,
      a pinned Prometheus archive, private ingress IP SAN identity,
      and complete mTLS/CRL material before it writes a host.
  no_log: true

- name: Require independent collector and delivery producer scope before mutation
  ansible.builtin.assert:
    that:
      - observability_push is defined
      - observability_push.kinds | sort == ['delivery', 'pipeline']
      - observability_control_plane.alerting.enabled | bool
      - >-
        observability_push.expected_nodes | sort ==
        observability_control_plane.ingest_identities | map(attribute='node_id') | sort
      - observability_push.node_id in observability_push.expected_nodes
    fail_msg: >-
      Enabled collector requires active primary alerting, independent pipeline and delivery pushes,
      and exact enrolled-node coverage including its cohosted agent.

- name: Validate independent collector producer credentials before mutation
  ansible.builtin.include_role:
    name: observability_kuma
    tasks_from: producers-contract

- name: Require measured capacity and private address before host mutation
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/observability-disk-guard.py') }}"
      - --preflight
      - --data-dir
      - "{{ observability_control_plane.data_dir }}"
      - --ingress-address
      - "{{ observability_control_plane.ingress_address }}"
      - --headroom-bytes
      - "{{ observability_control_plane.disk_write_headroom_bytes | string }}"
      - --peak-bytes-per-second
      - "{{ observability_control_plane.disk_measured_peak_bytes_per_second | string }}"
      - --stop-seconds
      - "{{ observability_control_plane.disk_measured_stop_seconds | string }}"
  changed_when: false
  check_mode: false

- name: Inspect existing observability route ownership before mutation
  ansible.builtin.service_facts:

- name: Inspect historical shared ingress ownership without altering it
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/observability-remote-write.conf
    follow: false
  register: _observability_legacy_ingress

- name: Preserve historical ingress until explicit private cutover
  ansible.builtin.assert:
    that:
      - not (_observability_legacy_ingress.stat.exists | default(false))
      - not (_observability_legacy_ingress.stat.islnk | default(false))
    fail_msg: A historical shared ingress exists; explicit private cutover is required before replacement.

- name: Inspect historical alarm services and timers including active timer units
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, "{{ item }}"]
  loop:
    - observability-deadman-pipeline.service
    - observability-deadman-pulse.timer
    - observability-primary-canary.timer
  register: _observability_legacy_alarm_states
  changed_when: false
  failed_when: _observability_legacy_alarm_states.rc not in [0, 3, 4]
  check_mode: false

- name: Preserve any working historical alarm route until explicit cutover
  ansible.builtin.assert:
    that:
      - item.rc != 0
    fail_msg: A historical alarm route is active; explicit verified cutover is required before replacing it.
  loop: "{{ _observability_legacy_alarm_states.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Reject obsolete dedicated observer runtime configuration
  ansible.builtin.assert:
    that:
      - observability_control_plane.alerting.deadman is not defined
    fail_msg: Dedicated deadman runtime is obsolete; use the private Kuma producer contract.

- name: Require safe technical node identities
  ansible.builtin.assert:
    that:
      - item.node_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$')
      - item.client_cert_pem | default('') | length > 0
    fail_msg: Each ingestion identity requires one bounded node_id and client certificate.
  loop: "{{ observability_control_plane.ingest_identities }}"
  no_log: true

- name: Require the opt-in alerting secret contract before host mutation
  ansible.builtin.include_tasks: alerting-secret-contract.yml
  when: observability_control_plane.alerting.enabled | bool

- name: Require the opt-in alerting contract before host mutation
  ansible.builtin.include_tasks: alerting-contract.yml
  when: observability_control_plane.alerting.enabled | bool

- name: Create dedicated control-plane account
  ansible.builtin.group:
    name: "{{ observability_control_plane.service_group }}"
    system: true

- name: Create dedicated control-plane account
  ansible.builtin.user:
    name: "{{ observability_control_plane.service_user }}"
    group: "{{ observability_control_plane.service_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ observability_control_plane.data_dir }}"
    create_home: false

- name: Install hardened ingress package
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Install pinned Prometheus through runtime-release
  ansible.builtin.include_role:
    name: runtime-release
  vars:
    runtime_release_version: "{{ observability_control_plane.prometheus.version }}"
    runtime_release_install_root: "{{ observability_control_plane.install_root }}"
    runtime_release_binary_name: prometheus
    runtime_release_public_link: "{{ observability_control_plane.binary_link }}"
    runtime_release_urls: "{{ observability_control_plane.prometheus.urls }}"
    runtime_release_sha256: "{{ observability_control_plane.prometheus.sha256 }}"
    runtime_release_arch_slugs: {amd64: amd64, arm64: arm64}
    runtime_release_artifact_filename: prometheus.tar.gz
    runtime_release_artifact_type: archive
    runtime_release_archive_members: "{{ observability_control_plane.prometheus.archive_members }}"
    runtime_release_archive_strip_components: 1

- name: Create private control-plane directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ observability_control_plane.config_root }}"
      owner: root
      group: "{{ observability_control_plane.service_group }}"
      mode: '0750'
    - path: "{{ observability_control_plane.config_root }}/generations"
      owner: root
      group: root
      mode: '0755'
    - path: "{{ observability_control_plane.config_root }}/tls"
      owner: root
      group: "{{ observability_control_plane.service_group }}"
      mode: '0750'
    - path: "{{ observability_control_plane.config_root }}/clients"
      owner: root
      group: root
      mode: '0750'
    - path: "{{ observability_control_plane.data_dir }}"
      owner: "{{ observability_control_plane.service_user }}"
      group: "{{ observability_control_plane.service_group }}"
      mode: '0750'

- name: Create persistent disk guard latch directory
  ansible.builtin.file:
    path: "{{ observability_control_plane.disk_guard_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install monitoring disk guard
  ansible.builtin.copy:
    src: observability-disk-guard.py
    dest: /usr/local/libexec/observability-disk-guard.py
    owner: root
    group: root
    mode: '0755'
  notify: Restart observability disk guard

- name: Install aggregate collector resource boundary and reserve guard
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - observability-collector.slice
    - observability-disk-guard.service
  register: _observability_resource_units
  notify:
    - Reload observability resource boundary
    - Restart observability disk guard

- name: Reload aggregate collector resource units before dependent services
  ansible.builtin.meta: flush_handlers

- name: Materialize ingress TLS and revocation authority
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ observability_control_plane.service_group }}"
    mode: "{{ item.mode }}"
  loop:
    - content: "{{ observability_control_plane.tls.server_cert_pem }}"
      dest: "{{ observability_control_plane.config_root }}/tls/server.crt"
      mode: '0640'
    - content: "{{ observability_control_plane.tls.server_key_pem }}"
      dest: "{{ observability_control_plane.config_root }}/tls/server.key"
      mode: '0640'
    - content: "{{ observability_control_plane.tls.client_ca_pem }}"
      dest: "{{ observability_control_plane.config_root }}/tls/client-ca.crt"
      mode: '0640'
    - content: "{{ observability_control_plane.tls.client_crl_pem }}"
      dest: "{{ observability_control_plane.config_root }}/tls/client.crl"
      mode: '0640'
  no_log: true
  diff: false
  register: _observability_ingress_tls

- name: Materialize identity certificates for preflight only
  ansible.builtin.copy:
    content: "{{ item.client_cert_pem }}"
    dest: "{{ observability_control_plane.config_root }}/clients/{{ item.node_id }}.crt"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ observability_control_plane.ingest_identities }}"
  no_log: true
  diff: false

- name: Verify server certificate contains the private ingress IP SAN
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ observability_control_plane.config_root }}/tls/server.crt"
      - -noout
      - -checkip
      - "{{ observability_control_plane.ingress_address }}"
  register: _observability_server_ip_san
  changed_when: false
  no_log: true

- name: Refuse a server certificate with a mismatched private IP SAN
  ansible.builtin.assert:
    that:
      - "'does match certificate' in _observability_server_ip_san.stdout"
      - "'does NOT match' not in _observability_server_ip_san.stdout"
    fail_msg: The ingestion certificate must verify the exact private IP SAN.
  no_log: true

- name: Verify each client certificate identity, EKU, CA and CRL
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -purpose
      - sslclient
      - -crl_check_all
      - -CAfile
      - "{{ observability_control_plane.config_root }}/tls/client-ca.crt"
      - -CRLfile
      - "{{ observability_control_plane.config_root }}/tls/client.crl"
      - "{{ observability_control_plane.config_root }}/clients/{{ item.node_id }}.crt"
  loop: "{{ observability_control_plane.ingest_identities }}"
  changed_when: false
  no_log: true

- name: Verify each client certificate subject equals its technical node identity
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ observability_control_plane.config_root }}/clients/{{ item.node_id }}.crt"
      - -noout
      - -subject
      - -nameopt
      - RFC2253
  loop: "{{ observability_control_plane.ingest_identities }}"
  register: _observability_client_subjects
  changed_when: false
  no_log: true

- name: Refuse client certificate subject/path mismatches
  ansible.builtin.assert:
    that: item.stdout == 'subject=CN=' ~ item.item.node_id
    fail_msg: Client certificate CN must exactly equal its assigned node_id.
  loop: "{{ _observability_client_subjects.results }}"
  no_log: true

- name: Configure expected-target observation artifacts
  ansible.builtin.include_tasks: expected-targets.yml
  when: >-
    (observability_control_plane.expected_targets | default({'enabled': false}, true)).enabled | default(false) | bool

- name: Remove disabled expected-target observation artifacts
  ansible.builtin.include_tasks: expected-targets-disable.yml
  when: >-
    not ((observability_control_plane.expected_targets |
    default({'enabled': false}, true)).enabled | default(false) | bool)

- name: Configure bounded alerting and Telegram routing
  ansible.builtin.include_tasks: alerting.yml
  when: observability_control_plane.alerting.enabled | bool

- name: Remove disabled alerting artifacts
  ansible.builtin.include_tasks: alerting-disable.yml
  when: not (observability_control_plane.alerting.enabled | bool)

- name: Derive the immutable Prometheus generation from candidate content
  ansible.builtin.set_fact:
    _observability_generation: "{{ lookup('ansible.builtin.template', 'prometheus.yml.j2') | hash('sha256') }}"
  no_log: true

- name: Inspect immutable Prometheus generation before publication
  ansible.builtin.stat:
    path: "{{ observability_control_plane.config_root }}/generations/{{ _observability_generation }}.yml"
    checksum_algorithm: sha256
  register: _observability_candidate_generation
  changed_when: false

- name: Refuse a conflicting immutable Prometheus generation
  ansible.builtin.assert:
    that: >-
      not (_observability_candidate_generation.stat.exists | default(false)) or
      _observability_candidate_generation.stat.checksum == _observability_generation
    fail_msg: A different configuration already occupies the derived immutable generation.
  no_log: true

- name: Publish isolated immutable Prometheus generation
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.template', 'prometheus.yml.j2') }}"
    dest: "{{ observability_control_plane.config_root }}/generations/{{ _observability_generation }}.yml"
    owner: root
    group: "{{ observability_control_plane.service_group }}"
    mode: '0640'
    force: false
  no_log: true
  diff: false

- name: Install Prometheus service unit
  ansible.builtin.template:
    src: observability-prometheus.service.j2
    dest: /etc/systemd/system/observability-prometheus.service
    owner: root
    group: root
    mode: '0644'
  register: _observability_prometheus_unit

- name: Inspect current generation before activation
  ansible.builtin.stat:
    path: "{{ observability_control_plane.config_root }}/current.yml"
    follow: false
  register: _observability_current

- name: Refuse an unsafe existing control-plane generation link
  ansible.builtin.assert:
    that:
      - >-
        not (_observability_current.stat.exists | default(false)) or
        (_observability_current.stat.islnk | default(false))
      - >-
        not (_observability_current.stat.exists | default(false)) or
        _observability_current.stat.lnk_source is match(
          '^' ~ observability_control_plane.config_root ~
          '/generations/[a-f0-9]{64}[.]yml$')
    fail_msg: Existing control-plane current.yml must be an owned generation link.

- name: Preserve ready control-plane generation before activation
  ansible.builtin.file:
    src: "{{ _observability_current.stat.lnk_source }}"
    dest: "{{ observability_control_plane.config_root }}/previous.yml"
    state: link
    force: true
    owner: root
    group: "{{ observability_control_plane.service_group }}"
  when: _observability_current.stat.exists | default(false)
  changed_when: false

- name: Activate complete validated Prometheus generation with rollback
  block:
    - name: Point current configuration at candidate generation
      ansible.builtin.file:
        src: "{{ observability_control_plane.config_root }}/generations/{{ _observability_generation }}.yml"
        dest: "{{ observability_control_plane.config_root }}/current.yml"
        state: link
        force: true
      register: _observability_prometheus_activation

    - name: Start or restart Prometheus for the published generation
      ansible.builtin.systemd_service:
        name: observability-prometheus
        daemon_reload: "{{ _observability_prometheus_unit.changed }}"
        enabled: true
        state: >-
          {{ 'restarted' if (_observability_prometheus_unit.changed or
          _observability_prometheus_activation.changed) else 'started' }}

    - name: Require loopback-only Prometheus candidate readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        status_code: 200
        return_content: false
      register: _observability_ready
      retries: 5
      delay: 2
      until: _observability_ready.status == 200
      no_log: true
  rescue:
    - name: Restore previous ready configuration after failed candidate
      ansible.builtin.file:
        src: "{{ _observability_current.stat.lnk_source }}"
        dest: "{{ observability_control_plane.config_root }}/current.yml"
        state: link
        force: true
      when: _observability_current.stat.exists | default(false)

    - name: Restore previous ready Prometheus service
      ansible.builtin.systemd_service:
        name: observability-prometheus
        daemon_reload: true
        state: restarted
      when: _observability_current.stat.exists | default(false)

    - name: Fail closed when no previous ready generation exists
      ansible.builtin.fail:
        msg: Candidate control-plane generation did not become ready; previous ready generation was restored when available.

- name: Create unprivileged isolated ingress group
  ansible.builtin.group:
    name: observability-ingress
    system: true

- name: Create unprivileged isolated ingress account
  ansible.builtin.user:
    name: observability-ingress
    group: observability-ingress
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Render isolated write-only mTLS ingress
  ansible.builtin.template:
    src: observability-nginx.conf.j2
    dest: "{{ observability_control_plane.config_root }}/nginx.conf"
    owner: root
    group: root
    mode: '0644'
  register: _observability_ingress_config

- name: Install isolated ingress unit with pre-start config validation
  ansible.builtin.template:
    src: observability-ingress.service.j2
    dest: /etc/systemd/system/observability-ingress.service
    owner: root
    group: root
    mode: '0644'
  register: _observability_ingress_unit

- name: Start isolated ingress without changing shared VPN nginx
  ansible.builtin.systemd_service:
    name: observability-ingress
    enabled: true
    daemon_reload: true
    state: >-
      {{ 'restarted' if (_observability_ingress_tls.changed or _observability_ingress_config.changed or
      _observability_ingress_unit.changed) else 'started' }}

- name: Require the opt-in protocol-liveness adapter contract
  ansible.builtin.assert:
    that:
      - observability_control_plane.protocol_liveness.evidence_directory == '/var/lib/vpn-protocol-liveness'
      - >-
        observability_control_plane.protocol_liveness.evidence_path ==
        observability_control_plane.protocol_liveness.evidence_directory ~ '/last-evidence.json'
      - observability_control_plane.protocol_liveness.output_directory == '/var/lib/node_exporter/textfile'
      - >-
        observability_control_plane.protocol_liveness.output_path ==
        observability_control_plane.protocol_liveness.output_directory ~ '/protocol-liveness.prom'
      - observability_control_plane.protocol_liveness.stale_after_seconds | int >= 60
      - observability_control_plane.protocol_liveness.stale_after_seconds | int <= 3600
      - observability_control_plane.protocol_liveness.max_future_seconds | int >= 0
      - observability_control_plane.protocol_liveness.max_future_seconds | int <= 300
    fail_msg: >-
      Protocol-liveness adaptation requires the canonical publisher path, the
      existing node_exporter textfile path, and bounded freshness limits.
  when: observability_control_plane.protocol_liveness.enabled | bool

- name: Install protocol-liveness adapter
  ansible.builtin.copy:
    src: observability-protocol-liveness-adapter.py
    dest: /usr/local/libexec/observability-protocol-liveness-adapter.py
    owner: root
    group: root
    mode: '0755'
  when: observability_control_plane.protocol_liveness.enabled | bool

- name: Install protocol-liveness adapter systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - observability-protocol-liveness-adapter.service
    - observability-protocol-liveness-adapter.timer
  when: observability_control_plane.protocol_liveness.enabled | bool

- name: Enable protocol-liveness adapter timer
  ansible.builtin.systemd_service:
    name: observability-protocol-liveness-adapter.timer
    daemon_reload: true
    enabled: true
    state: started
  when:
    - not ansible_check_mode
    - observability_control_plane.protocol_liveness.enabled | bool

- name: Remove disabled protocol-liveness adapter artifacts
  ansible.builtin.include_tasks: protocol-liveness-disable.yml
  when: not (observability_control_plane.protocol_liveness.enabled | bool)

- name: Install explicitly scoped independent collector and delivery producers
  ansible.builtin.include_role:
    name: observability_kuma
    tasks_from: producers
