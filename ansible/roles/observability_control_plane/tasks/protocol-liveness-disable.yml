---
- name: Gather protocol-liveness adapter service facts
  ansible.builtin.service_facts:

- name: Stop and disable protocol-liveness adapter units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - observability-protocol-liveness-adapter.timer
    - observability-protocol-liveness-adapter.service
  when:
    - not ansible_check_mode
    - item in ansible_facts.services

- name: Remove protocol-liveness adapter owned surfaces
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/observability-protocol-liveness-adapter.service
    - /etc/systemd/system/observability-protocol-liveness-adapter.timer
    - /usr/local/libexec/observability-protocol-liveness-adapter.py
    - "{{ observability_control_plane.protocol_liveness.output_path }}"
