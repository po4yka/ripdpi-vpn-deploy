---
- name: Verify enabled then disabled dead-man lifecycle
  hosts: all
  become: true
  pre_tasks:
    - name: Read fixture reverse-health trust material
      ansible.builtin.slurp:
        src: "/var/tmp/observability-deadman-fixture/{{ item }}"
      loop: [ca.pem, client.pem, client.key, ca.sha256, client.sha256, pulse-ca.pem, pulse-server.pem, pulse-server.key]
      register: deadman_reverse_tls_files
      no_log: true
  vars:
    fixture_reverse_health_tls:
      ca_pem: "{{ deadman_reverse_tls_files.results[0].content | b64decode }}"
      client_cert_pem: "{{ deadman_reverse_tls_files.results[1].content | b64decode }}"
      client_key_pem: "{{ deadman_reverse_tls_files.results[2].content | b64decode }}"
      client_cn: deadman-control
      client_cert_fingerprint_sha256: "{{ deadman_reverse_tls_files.results[4].content | b64decode | trim }}"
      ca_fingerprint_sha256: "{{ deadman_reverse_tls_files.results[3].content | b64decode | trim }}"
      ca_credential: reverse-health-ca
      client_cert_credential: reverse-health-client-cert
      client_key_credential: reverse-health-client-key
    fixture_pulse_tls:
      server_name: reverse.fixture.invalid
      server_cert_credential: pulse-server-cert
      server_key_credential: pulse-server-key
    fixture_pulse_tls_secrets:
      ca_pem: "{{ deadman_reverse_tls_files.results[5].content | b64decode }}"
      server_cert_pem: "{{ deadman_reverse_tls_files.results[6].content | b64decode }}"
      server_key_pem: "{{ deadman_reverse_tls_files.results[7].content | b64decode }}"
    disabled_deadman:
      enabled: false
      service_user: observability-deadman
      service_group: observability-deadman
      config_root: /etc/observability-deadman
      state_dir: /var/lib/observability-deadman
      pulse_credential_path: /etc/observability-deadman/credentials/pulse-token
      telegram_credential_path: /etc/observability-deadman/credentials/telegram-bot-token
      pulse_listen: 0.0.0.0:9444
      status_listen: 127.0.0.1:19094
      pulse_path: /v1/pulse
      pulse_tls: "{{ fixture_pulse_tls }}"
      reverse_health_url: https://reverse.fixture.invalid:9443/observability/v1/deadman/reverse
      reverse_health_max_bytes: 1024
      source_generation: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      required_units: [observability-deadman.service]
      reverse_health_tls: "{{ fixture_reverse_health_tls }}"
      pulse_interval_seconds: 60
      missed_pulse_limit: 5
      max_future_seconds: 30
      max_pulse_bytes: 4096
      retry_attempts: 2
      retry_timeout_seconds: 5
      reminder_interval_seconds: 3600
      canary_interval_seconds: 86400
      telegram:
        chat_id: "-100000000001"
        topic_id: 7
    token_rotated_deadman:
      enabled: true
      service_user: observability-deadman
      service_group: observability-deadman
      config_root: /etc/observability-deadman
      state_dir: /var/lib/observability-deadman
      pulse_credential_path: /etc/observability-deadman/credentials/pulse-token
      telegram_credential_path: /etc/observability-deadman/credentials/telegram-bot-token
      pulse_listen: 0.0.0.0:9444
      status_listen: 127.0.0.1:19094
      pulse_path: /v1/pulse
      pulse_tls: "{{ fixture_pulse_tls }}"
      reverse_health_url: https://reverse.fixture.invalid:9443/observability/v1/deadman/reverse
      reverse_health_max_bytes: 1024
      source_generation: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      required_units: [observability-deadman.service]
      reverse_health_tls: "{{ fixture_reverse_health_tls }}"
      pulse_interval_seconds: 60
      missed_pulse_limit: 5
      max_future_seconds: 30
      max_pulse_bytes: 4096
      retry_attempts: 2
      retry_timeout_seconds: 5
      reminder_interval_seconds: 3600
      canary_interval_seconds: 86400
      telegram:
        chat_id: "-100000000001"
        topic_id: 7
    rotated_deadman:
      enabled: true
      service_user: observability-deadman
      service_group: observability-deadman
      config_root: /etc/observability-deadman
      state_dir: /var/lib/observability-deadman
      pulse_credential_path: /etc/observability-deadman/credentials/pulse-token
      telegram_credential_path: /etc/observability-deadman/credentials/telegram-bot-token
      pulse_listen: 0.0.0.0:9444
      status_listen: 127.0.0.1:19094
      pulse_path: /v1/pulse
      pulse_tls: "{{ fixture_pulse_tls }}"
      reverse_health_url: https://reverse.fixture.invalid:9443/observability/v1/deadman/reverse
      reverse_health_max_bytes: 1024
      source_generation: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      required_units: [observability-deadman.service]
      reverse_health_tls: "{{ fixture_reverse_health_tls }}"
      pulse_interval_seconds: 60
      missed_pulse_limit: 5
      max_future_seconds: 30
      max_pulse_bytes: 512
      retry_attempts: 2
      retry_timeout_seconds: 5
      reminder_interval_seconds: 3600
      canary_interval_seconds: 86400
      telegram:
        chat_id: "-100000000001"
        topic_id: 8
    rotated_deadman_secrets:
      schema_version: 1
      pulse_token: fixture-rotated-pulse-token-012345678
      pulse_tls: "{{ fixture_pulse_tls_secrets }}"
      telegram:
        bot_token: fixture-rotated-telegram-token-012345
    deadman_rotation_probe: |
      from datetime import UTC, datetime, timedelta
      import hashlib
      import hmac
      from http.client import RemoteDisconnected
      import json
      import socket
      import ssl
      import sys
      from urllib.error import HTTPError, URLError
      from urllib.request import (
          HTTPRedirectHandler,
          HTTPSHandler,
          ProxyHandler,
          Request,
          build_opener,
      )

      class NoRedirect(HTTPRedirectHandler):
          def redirect_request(self, *_args, **_kwargs):
              return None

      def post(token, sequence, padding=0, expiry_seconds=10):
          now = datetime.now(UTC)
          payload = {
              'schema': 1,
              'generation': 'a' * 40,
              'sequence': sequence,
              'issued_at': now.isoformat().replace('+00:00', 'Z'),
              'expires_at': (now + timedelta(seconds=expiry_seconds)).isoformat().replace('+00:00', 'Z'),
              'health': {
                  'prometheus': True,
                  'alertmanager': True,
                  'canary': True,
                  'primary_telegram': True,
              },
          }
          payload['signature'] = hmac.new(
              token,
              json.dumps(payload, separators=(',', ':'), sort_keys=True).encode(),
              hashlib.sha256,
          ).hexdigest()
          body = json.dumps(payload, separators=(',', ':')).encode() + b' ' * padding
          request = Request(
              'https://reverse.fixture.invalid:9444/v1/pulse', data=body, method='POST'
          )
          try:
              context = ssl.create_default_context(
                  cafile='/var/tmp/observability-deadman-fixture/pulse-ca.pem'
              )
              opener = build_opener(
                  ProxyHandler({}), HTTPSHandler(context=context), NoRedirect()
              )
              with opener.open(request, timeout=5) as response:
                  return response.status
          except HTTPError as error:
              return error.code

      def status_or_exit(token, sequence, padding=0, expiry_seconds=10):
          try:
              return post(token, sequence, padding, expiry_seconds)
          except OSError as error:
              transport_error = error.reason if isinstance(error, URLError) else error
              if isinstance(transport_error, ssl.SSLError):
                  raise SystemExit(20) from None
              if isinstance(transport_error, ConnectionRefusedError):
                  raise SystemExit(25) from None
              if isinstance(transport_error, TimeoutError):
                  raise SystemExit(26) from None
              if isinstance(transport_error, socket.gaierror):
                  raise SystemExit(27) from None
              if isinstance(
                  transport_error, (RemoteDisconnected, ConnectionResetError)
              ):
                  raise SystemExit(28) from None
              raise SystemExit(29) from None

      if sys.argv[1] == 'token':
          if status_or_exit(b'fixture-rotated-pulse-token-012345678', 1) != 204:
              raise SystemExit(21)
          previous_status = status_or_exit(b'fixture-pulse-token-0123456789', 2)
          if previous_status == 204:
              raise SystemExit(22)
          if previous_status != 400:
              raise SystemExit(23)
      elif sys.argv[1] == 'config':
          if status_or_exit(
              b'fixture-rotated-pulse-token-012345678',
              2,
              padding=600,
              expiry_seconds=20,
          ) != 400:
              raise SystemExit(23)
      else:
          raise SystemExit(24)
  tasks:
    - name: Assert enabled dead-man units are active
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, "{{ item }}"]
      loop:
        - observability-deadman.service
        - observability-deadman-tick.timer
      changed_when: false

    - name: Assert enabled dead-man units are enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, --quiet, "{{ item }}"]
      loop:
        - observability-deadman.service
        - observability-deadman-tick.timer
      changed_when: false

    - name: Read enabled immutable dead-man generation link
      ansible.builtin.command:
        argv: [readlink, /etc/observability-deadman/deadman-current.json]
      register: deadman_current_generation
      changed_when: false

    - name: Require enabled current link to target an immutable generation
      ansible.builtin.assert:
        that:
          - deadman_current_generation.stdout is match('^/etc/observability-deadman/generations/deadman-[a-f0-9]{64}[.]json$')

    - name: Validate enabled immutable dead-man candidate
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/observability-deadman.py
          - validate-config
          - --config
          - /etc/observability-deadman/deadman-current.json
      changed_when: false
      no_log: true

    - name: Inspect enabled dead-man mode and ownership boundaries
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /etc/observability-deadman
        - /etc/observability-deadman/credentials
        - /etc/observability-deadman/credentials/pulse-token
        - /etc/observability-deadman/credentials/telegram-bot-token
        - /etc/observability-deadman/credentials/pulse-server.crt
        - /etc/observability-deadman/credentials/pulse-server.key
        - /var/lib/observability-deadman
        - /etc/observability-deadman/deadman-current.json
      register: deadman_enabled_paths

    - name: Require enabled dead-man mode and ownership boundaries
      ansible.builtin.assert:
        that:
          - deadman_enabled_paths.results[0].stat.isdir
          - deadman_enabled_paths.results[0].stat.mode == '0755'
          - deadman_enabled_paths.results[1].stat.isdir
          - deadman_enabled_paths.results[1].stat.mode == '0700'
          - deadman_enabled_paths.results[4].stat.mode == '0600'
          - deadman_enabled_paths.results[5].stat.mode == '0600'
          - deadman_enabled_paths.results[2].stat.isreg
          - deadman_enabled_paths.results[2].stat.mode == '0600'
          - deadman_enabled_paths.results[2].stat.pw_name == 'root'
          - deadman_enabled_paths.results[3].stat.isreg
          - deadman_enabled_paths.results[3].stat.mode == '0600'
          - deadman_enabled_paths.results[3].stat.pw_name == 'root'
          - deadman_enabled_paths.results[4].stat.isreg
          - deadman_enabled_paths.results[4].stat.pw_name == 'root'
          - deadman_enabled_paths.results[5].stat.isreg
          - deadman_enabled_paths.results[5].stat.pw_name == 'root'
          - deadman_enabled_paths.results[6].stat.isdir
          - deadman_enabled_paths.results[6].stat.mode == '0700'
          - deadman_enabled_paths.results[6].stat.pw_name == 'observability-deadman'
          - deadman_enabled_paths.results[7].stat.islnk

    - name: Include token-only rotated dead-man role
      ansible.builtin.include_role:
        name: observability_deadman
      vars:
        observability_contract:
          schema_version: 1
          credential_mode: systemd
        observability_deadman: "{{ token_rotated_deadman }}"
        observability_deadman_secrets: "{{ rotated_deadman_secrets }}"

    - name: Read token-only immutable dead-man generation link
      ansible.builtin.command:
        argv: [readlink, /etc/observability-deadman/deadman-current.json]
      register: deadman_token_rotated_generation
      changed_when: false

    - name: Require token-only rotation to retain immutable generation link
      ansible.builtin.assert:
        that:
          - deadman_token_rotated_generation.stdout == deadman_current_generation.stdout

    - name: Require token-only receiver credential reload
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ deadman_rotation_probe }}"
          - token
      changed_when: false
      failed_when: false
      register: deadman_token_reload_probe
      no_log: true

    - name: Classify token-only receiver credential reload
      ansible.builtin.assert:
        that:
          - deadman_token_reload_probe.rc == 0
        fail_msg: >-
          Dead-man token credential reload failed category={{
            {
              20: 'tls-error',
              21: 'rotated-token-rejected',
              22: 'previous-token-accepted',
              23: 'unexpected-response',
              24: 'probe-mode',
              25: 'connection-refused',
              26: 'timeout',
              27: 'dns-error',
              28: 'connection-reset',
              29: 'os-error'
            }.get(deadman_token_reload_probe.rc, 'probe-internal')
          }}.

    - name: Include config-only rotated dead-man role
      ansible.builtin.include_role:
        name: observability_deadman
      vars:
        observability_contract:
          schema_version: 1
          credential_mode: systemd
        observability_deadman: "{{ rotated_deadman }}"
        observability_deadman_secrets: "{{ rotated_deadman_secrets }}"

    - name: Read config-only immutable dead-man generation link
      ansible.builtin.command:
        argv: [readlink, /etc/observability-deadman/deadman-current.json]
      register: deadman_config_rotated_generation
      changed_when: false

    - name: Require config-only rotation to change immutable generation link
      ansible.builtin.assert:
        that:
          - deadman_config_rotated_generation.stdout is match('^/etc/observability-deadman/generations/deadman-[a-f0-9]{64}[.]json$')
          - deadman_config_rotated_generation.stdout != deadman_token_rotated_generation.stdout

    - name: Require config-only receiver generation reload
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ deadman_rotation_probe }}"
          - config
      changed_when: false
      failed_when: false
      register: deadman_config_reload_probe
      no_log: true

    - name: Classify config-only receiver generation reload
      ansible.builtin.assert:
        that:
          - deadman_config_reload_probe.rc == 0
        fail_msg: >-
          Dead-man config generation reload failed category={{
            {
              20: 'tls-error',
              21: 'rotated-token-rejected',
              22: 'previous-token-accepted',
              23: 'unexpected-response',
              24: 'probe-mode',
              25: 'connection-refused',
              26: 'timeout',
              27: 'dns-error',
              28: 'connection-reset',
              29: 'os-error'
            }.get(deadman_config_reload_probe.rc, 'probe-internal')
          }}.

    - name: Include disabled dead-man role
      ansible.builtin.include_role:
        name: observability_deadman
      vars:
        observability_deadman: "{{ disabled_deadman }}"

    - name: Flush disabled dead-man systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Assert disabled dead-man surfaces are removed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/observability-deadman.service
        - /etc/systemd/system/observability-deadman-tick.service
        - /etc/systemd/system/observability-deadman-tick.timer
        - /usr/local/libexec/observability-deadman.py
        - /etc/observability-deadman
        - /var/lib/observability-deadman
      register: deadman_disabled_paths
      failed_when: deadman_disabled_paths.stat.exists

    - name: Assert disabled dead-man units are inactive
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, "{{ item }}"]
      loop:
        - observability-deadman.service
        - observability-deadman-tick.timer
      register: deadman_disabled_units
      changed_when: false
      failed_when: false

    - name: Require disabled dead-man units to remain inactive
      ansible.builtin.assert:
        that:
          - item.rc != 0
      loop: "{{ deadman_disabled_units.results }}"
