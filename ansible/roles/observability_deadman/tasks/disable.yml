---
- name: Probe dead-man owned unit manager state
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, "{{ item }}"]
  loop:
    - observability-deadman.service
    - observability-deadman-tick.timer
  register: _observability_deadman_unit_state
  changed_when: false
  failed_when: _observability_deadman_unit_state.rc not in [0, 1, 2, 3, 4]

- name: Stop and disable loaded dead-man owned units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ _observability_deadman_unit_state.results }}"
  when:
    - not ansible_check_mode
    - item.rc != 4

- name: Remove dead-man owned surfaces and stale sender state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/observability-deadman.service
    - /etc/systemd/system/observability-deadman-tick.service
    - /etc/systemd/system/observability-deadman-tick.timer
    - /usr/local/libexec/observability-deadman.py
    - "{{ observability_deadman.config_root }}"
    - "{{ observability_deadman.pulse_credential_path | dirname }}"
    - "{{ observability_deadman.state_dir }}"
  notify: Reload observability dead-man systemd
