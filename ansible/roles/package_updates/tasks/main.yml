---
# Configure safe unattended security updates for Debian-family hosts. This role
# does not reboot hosts and does not touch application package pins.

- name: Resolve effective unattended update policy selection
  ansible.builtin.set_fact:
    _package_updates_effective_enabled: "{{ package_updates_role_enabled and (package_updates.enabled | default(true)) }}"

- name: Package updates role supports Debian-family hosts only
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
    fail_msg: "package_updates supports Debian/Ubuntu hosts only."

- name: Install unattended update packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  register: package_updates_packages
  when: _package_updates_effective_enabled

- name: Check whether apticron is available
  ansible.builtin.command:
    cmd: apt-cache policy apticron
  register: package_updates_apticron_policy
  changed_when: false
  failed_when: false
  when:
    - _package_updates_effective_enabled
    - package_updates.install_apticron | default(false)

- name: Install apticron when explicitly enabled and available
  ansible.builtin.apt:
    name:
      - apticron
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  when:
    - _package_updates_effective_enabled
    - package_updates.install_apticron | default(false)
    - "'Candidate: (none)' not in (package_updates_apticron_policy.stdout | default('Candidate: (none)'))"

- name: Configure apt-listchanges for noninteractive reporting
  ansible.builtin.copy:
    dest: /etc/apt/listchanges.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [apt]
      frontend=text
      email_address={{ package_updates.mail | default('root') }}
      confirm=false
      save_seen=/var/lib/apt/listchanges.db
      which=both
  when: _package_updates_effective_enabled

- name: Configure unattended security updates
  ansible.builtin.template:
    src: 51ripdpi-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/51ripdpi-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Ensure the upgrade timer drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# The distribution timer fires on every host at 06:00 with a one-hour delay.
# A fixed delay is derived from the machine ID, so each host keeps its own
# slot. The calendar time is unchanged, so a deploy never makes the timer due.
- name: Stagger the unattended-upgrade window per host
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/ripdpi-stagger.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Timer]
      RandomizedDelaySec=12h
      FixedRandomDelay=true
  register: _package_updates_stagger

- name: Apply the staggered upgrade window
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - _package_updates_stagger.changed
    - ansible_facts.service_mgr == "systemd"
    - not ansible_check_mode

- name: Validate unattended-upgrades configuration
  ansible.builtin.command:
    cmd: unattended-upgrade -d --dry-run
  changed_when: false
  when:
    - _package_updates_effective_enabled
    - not ansible_check_mode or not (package_updates_packages.changed | default(false))
