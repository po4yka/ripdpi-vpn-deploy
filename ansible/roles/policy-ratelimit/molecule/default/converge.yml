---
- name: Converge policy-ratelimit role
  hosts: all
  become: true
  vars:
    xray_port: 443
    xray_fallback_port: 2053
    allowed_ssh_cidrs:
      - "10.0.0.0/8"
    vpn:
      enable_policy_ratelimit: true
  pre_tasks:
    - name: Provide the private shared textfile export foundation
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        owner: root
        group: root
        mode: "0750"

    # The role expects /var/lib/vpn-xray-logs/access.log; the daemon waits for the
    # file rather than failing, so we just need to ensure the directory
    # exists for service start.
    - name: Ensure /var/lib/vpn-xray-logs exists
      ansible.builtin.file:
        path: /var/lib/vpn-xray-logs
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Install nftables and SSH for the firewall dependency
      ansible.builtin.apt:
        name:
          - nftables
          - openssh-server
        state: present
        update_cache: true

    - name: Start the real SSH service required by firewall discovery
      ansible.builtin.systemd_service:
        name: ssh
        state: started
  roles:
    - role: firewall
    - role: policy-ratelimit
