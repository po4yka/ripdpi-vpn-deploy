---
- name: Converge policy-ratelimit role
  hosts: all
  become: true
  vars:
    xray_port: 443
    xray_fallback_port: 2053
    vpn:
      enable_policy_ratelimit: true
  pre_tasks:
    # The role expects /var/log/xray/access.log; the daemon waits for the
    # file rather than failing, so we just need to ensure the directory
    # exists for service start.
    - name: Ensure /var/log/xray exists
      ansible.builtin.file:
        path: /var/log/xray
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Install nftables for the firewall dependency
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: true
  roles:
    - role: firewall
    - role: policy-ratelimit
