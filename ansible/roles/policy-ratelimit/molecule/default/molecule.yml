---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-prl-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:7e6751a46ab5027958ebaafe698bc62042200c07ee6e662b390f141a4bfa8410
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    capabilities: [NET_ADMIN]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    host_vars:
      vpn-prl-debian13:
        ansible_user: root
  config_options:
    defaults:
      callback_result_format: yaml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
