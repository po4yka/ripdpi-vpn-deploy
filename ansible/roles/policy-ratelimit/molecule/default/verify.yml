---
- name: Verify policy-ratelimit role
  hosts: all
  become: true
  tasks:
    - name: Inspect explicitly provisioned log reader group
      ansible.builtin.getent:
        database: group
        key: xray

    - name: Require narrow log reader membership without DAC capabilities
      ansible.builtin.command:
        argv: [systemctl, show, policy-ratelimit.service, "--property=SupplementaryGroups,CapabilityBoundingSet"]
      register: policy_reader_authority
      changed_when: false
      failed_when: >-
        'SupplementaryGroups=xray' not in policy_reader_authority.stdout or
        'CapabilityBoundingSet=cap_net_admin' not in policy_reader_authority.stdout

    - name: Daemon script installed and executable
      ansible.builtin.stat:
        path: /usr/local/bin/policy-ratelimit.py
      register: scr
      failed_when: not scr.stat.exists or not scr.stat.executable

    - name: systemd unit installed
      ansible.builtin.stat:
        path: /etc/systemd/system/policy-ratelimit.service
      register: unit
      failed_when: not unit.stat.exists

    - name: Firewall dependency provides both offender sets
      ansible.builtin.command:
        cmd: nft list set inet filter {{ item }}
      loop:
        - policy_offenders
        - policy_offenders6
      changed_when: false

    - name: Service is active
      ansible.builtin.command:
        cmd: systemctl is-active policy-ratelimit.service
      register: svc
      changed_when: false
      failed_when: svc.stdout != "active"
