---
- name: Converge probe matrix target rendering
  hosts: all
  become: true
  pre_tasks:
    - name: Inspect pinned Xray archive fixture
      ansible.builtin.stat:
        path: /var/tmp/probe-matrix-xray.zip
        checksum_algorithm: sha256
      register: _probe_matrix_xray_archive
    - name: Pin Xray archive fixture checksum
      ansible.builtin.set_fact:
        xray: >-
          {{ xray | combine({
               'linux_amd64_sha256': _probe_matrix_xray_archive.stat.checksum,
               'linux_arm64_sha256': _probe_matrix_xray_archive.stat.checksum
             }) }}
  vars:
    xray:
      version: vtest
    xray_runtime_release_urls:
      amd64: file:///var/tmp/probe-matrix-xray.zip
      arm64: file:///var/tmp/probe-matrix-xray.zip
    probe_matrix_runtime_users:
      xray_uid: 971
      mtg_uid: 972
    probe_matrix_target:
      topology: single-ip-dual-role
      manage_services: false
      server_name: probe.invalid
      ports: {mtproto: 10443, xhttp_vless: 11443, xhttp_trojan: 12443, tcp_trojan: 13443, tls_non_443: 14443}
      paths: {xhttp_vless: /vless, xhttp_trojan: /trojan}
    probe_matrix_target_secrets:
      mtproto_secret: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      vless_uuid: 00000000-0000-4000-8000-000000000001
      xhttp_trojan_password: bbbbbbbbbbbbbbbbbbbbbbbb
      tcp_trojan_password: cccccccccccccccccccccccc
      cert_pem: "-----BEGIN CERTIFICATE-----\nMOLECULE-NOT-REAL\n-----END CERTIFICATE-----"
      key_pem: "-----BEGIN PRIVATE KEY-----\nMOLECULE-NOT-REAL\n-----END PRIVATE KEY-----"
      mtg_version: v2.2.8
      mtg_linux_amd64_url: file:///tmp/mtg-stub
      mtg_linux_arm64_url: file:///tmp/mtg-stub
      mtg_linux_amd64_sha256: 306c6ca7407560340797866e077e053627ad409277d1b9da58106fce4cf717cb
      mtg_linux_arm64_sha256: 306c6ca7407560340797866e077e053627ad409277d1b9da58106fce4cf717cb
  roles:
    - role: probe-matrix-target
