---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml
driver:
  name: docker
platforms:
  - name: vpn-probe-matrix-target-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:efdae6644c4571f54f76171bf979b71f26e3d7d5c3a87a90feb3f8c488888dc3
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  config_options:
    defaults:
      callback_result_format: yaml
verifier:
  name: ansible
scenario:
  test_sequence: [dependency, syntax, create, prepare, converge, idempotence, verify, destroy]
