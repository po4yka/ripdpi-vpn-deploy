---
- name: Prepare probe matrix orchestration and native mtg inputs
  hosts: all
  become: true
  tasks:
    - name: Create pinned Xray archive fixture directory
      ansible.builtin.file:
        path: /var/tmp/probe-matrix-xray-fixture
        state: directory
        mode: "0755"
    - name: Install Xray validation stub
      ansible.builtin.copy:
        dest: /var/tmp/probe-matrix-xray-fixture/xray
        mode: "0755"
        content: |
          #!/bin/sh
          if [ "$1" = run ] && [ "$2" = -test ]; then
            exit 0
          fi
          exec /bin/sleep infinity
    - name: Build pinned Xray archive fixture
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - zipfile
          - -c
          - /var/tmp/probe-matrix-xray.zip
          - xray
        chdir: /var/tmp/probe-matrix-xray-fixture
        creates: /var/tmp/probe-matrix-xray.zip
    - name: Acquire the pinned native mtg archive
      ansible.builtin.get_url:
        url: >-
          https://github.com/9seconds/mtg/releases/download/v2.2.8/mtg-2.2.8-linux-{{
          'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}.tar.gz
        dest: /var/tmp/probe-matrix-mtg.tar.gz
        checksum: >-
          sha256:{{ '7ef19d079d85f4e00d4f8334ec1f3f3c8718e3d0ed1f3109ea9a8673138a2102'
          if ansible_facts['architecture'] == 'x86_64'
          else '562a94dd4cafcb8f179b76cfeafb76da12747c8e230bc76235bf8746cc189644' }}
        mode: "0600"
