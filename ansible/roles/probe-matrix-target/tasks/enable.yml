---
- name: Validate FakeTLS authority before target mutation
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/transport_semantics.py"
      - --section=mtg
    stdin: "{{ {'secrets': {'probe_matrix_target_secrets': probe_matrix_target_secrets}} | to_json }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Validate probe matrix target configuration
  ansible.builtin.assert:
    that:
      - probe_matrix_target.topology in ['single-ip-dual-role', 'split-hop-ingress']
      - probe_matrix_target.server_name | length > 0
      - probe_matrix_target.ports.values() | map('int') | min > 0
      - probe_matrix_target.ports.values() | map('int') | max <= 65535
      - probe_matrix_target.ports.values() | list | unique | length == 5
      - probe_matrix_target.paths.xhttp_vless is match('^/')
      - probe_matrix_target.paths.xhttp_trojan is match('^/')
      - probe_matrix_target_secrets.vless_uuid | length > 0
      - probe_matrix_target_secrets.xhttp_trojan_password | length >= 16
      - probe_matrix_target_secrets.tcp_trojan_password | length >= 16
      - probe_matrix_target_secrets.cert_pem | length > 30
      - probe_matrix_target_secrets.key_pem | length > 30
    fail_msg: Probe matrix target ports, paths, TLS material, and per-protocol credentials are required.

- name: Install shared Xray runtime
  ansible.builtin.include_role:
    name: xray-runtime

- name: Schedule probe Xray restart after runtime change
  ansible.builtin.debug:
    msg: Pinned Xray runtime changed.
  changed_when: xray_runtime_changed | bool
  notify: Restart probe matrix xray

- name: Create probe matrix runtime users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ item.home }}"
    create_home: true
  loop:
    - name: probe-xray
      uid: "{{ probe_matrix_runtime_users.xray_uid }}"
      home: /var/lib/probe-matrix-xray
    - name: probe-mtg
      uid: "{{ probe_matrix_runtime_users.mtg_uid }}"
      home: /var/lib/probe-matrix-mtg

- name: Install target packages
  ansible.builtin.apt:
    name: [nginx]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure probe matrix directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/probe-matrix
      owner: root
      group: root
      mode: "0755"
    - path: /var/log/probe-matrix-xray
      owner: probe-xray
      group: probe-xray
      mode: "0750"

- name: Resolve probe Xray TLS reader group identity
  ansible.builtin.getent:
    database: group
    key: probe-xray

- name: Render complete owned probe matrix nginx candidate
  ansible.builtin.set_fact:
    _probe_matrix_nginx_candidate: "{{ lookup('ansible.builtin.template', role_path ~ '/templates/nginx.conf.j2') }}"
  no_log: true

- name: Publish probe TLS and control listener as one complete nginx candidate
  ansible.builtin.include_role:
    name: nginx-xhttp
    tasks_from: transaction
  vars:
    nginx_transaction_owner: probe-matrix-target
    nginx_transaction_roots: [/etc/nginx, /etc/probe-matrix]
    nginx_transaction_files:
      - path: /etc/probe-matrix/tls.crt
        kind: file
        content_b64: "{{ probe_matrix_target_secrets.cert_pem | b64encode }}"
        mode: "0644"
        uid: 0
        gid: "{{ ansible_facts.getent_group['probe-xray'][1] | int }}"
      - path: /etc/probe-matrix/tls.key
        kind: file
        content_b64: "{{ probe_matrix_target_secrets.key_pem | b64encode }}"
        mode: "0640"
        uid: 0
        gid: "{{ ansible_facts.getent_group['probe-xray'][1] | int }}"
      - path: /etc/nginx/sites-available/probe-matrix-tls.conf
        kind: file
        content_b64: "{{ _probe_matrix_nginx_candidate | b64encode }}"
        mode: "0644"
        uid: 0
        gid: 0
      - path: /etc/nginx/sites-enabled/probe-matrix-tls.conf
        kind: link
        target: /etc/nginx/sites-available/probe-matrix-tls.conf
        mode: "0777"
        uid: 0
        gid: 0
    nginx_transaction_validate_argv: [/usr/sbin/nginx, -t]
    nginx_transaction_unit: nginx.service
    nginx_transaction_activation: reload
    nginx_transaction_activate_inactive: "{{ probe_matrix_target.manage_services | bool }}"
    nginx_transaction_desired_enabled: "{{ true if probe_matrix_target.manage_services | bool else none }}"

- name: Restart probe Xray after owned TLS publication
  ansible.builtin.debug:
    msg: Probe matrix TLS publication changed.
  changed_when: >-
    (nginx_transaction_result.stdout | from_json).changed
  notify: Restart probe matrix xray
  when: not ansible_check_mode

- name: Render auxiliary Xray target configuration
  ansible.builtin.template:
    src: xray.json.j2
    dest: /etc/probe-matrix/xray.json
    owner: root
    group: probe-xray
    mode: "0640"
    validate: /usr/local/bin/xray run -test -config %s
  no_log: true
  diff: false
  notify: Restart probe matrix xray

- name: Stage pinned mtg runtime through runtime-release
  ansible.builtin.include_role:
    name: runtime-release
  vars:
    runtime_release_version: "{{ probe_matrix_target_secrets.mtg_version }}+archive.1"
    runtime_release_install_root: /opt/probe-matrix/mtg
    runtime_release_binary_name: mtg
    runtime_release_public_link: /usr/local/bin/probe-matrix-mtg
    runtime_release_urls:
      amd64: "{{ probe_matrix_target_secrets.mtg_linux_amd64_url }}"
      arm64: "{{ probe_matrix_target_secrets.mtg_linux_arm64_url }}"
    runtime_release_sha256:
      amd64: "{{ probe_matrix_target_secrets.mtg_linux_amd64_sha256 }}"
      arm64: "{{ probe_matrix_target_secrets.mtg_linux_arm64_sha256 }}"
    runtime_release_arch_slugs:
      amd64: amd64
      arm64: arm64
    runtime_release_artifact_filename: mtg.tar.gz
    runtime_release_artifact_type: archive
    runtime_release_archive_members:
      amd64: "mtg-{{ probe_matrix_target_secrets.mtg_version | regex_replace('^v', '') }}-linux-amd64/mtg"
      arm64: "mtg-{{ probe_matrix_target_secrets.mtg_version | regex_replace('^v', '') }}-linux-arm64/mtg"
    runtime_release_archive_strip_components: 1
    runtime_release_stage_only: true

- name: Install private native mtg validator
  ansible.builtin.copy:
    src: validate_mtg.py
    dest: /usr/local/libexec/vpn-mtg-validate
    owner: root
    group: root
    mode: "0755"

- name: Render mtg configuration
  ansible.builtin.template:
    src: mtg.toml.j2
    validate: >-
      /usr/bin/python3 /usr/local/libexec/vpn-mtg-validate
      --binary /opt/probe-matrix/mtg/releases/{{ probe_matrix_target_secrets.mtg_version }}+archive.1/mtg
      --version {{ probe_matrix_target_secrets.mtg_version }} --config %s
    dest: /etc/probe-matrix/mtg.toml
    owner: root
    group: probe-mtg
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart probe matrix mtg

- name: Validate mtg candidate even when configuration bytes are unchanged
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/libexec/vpn-mtg-validate
      - --binary
      - /opt/probe-matrix/mtg/releases/{{ probe_matrix_target_secrets.mtg_version }}+archive.1/mtg
      - --version
      - "{{ probe_matrix_target_secrets.mtg_version }}"
      - --config
      - /etc/probe-matrix/mtg.toml
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Publish validated mtg runtime through runtime-release
  ansible.builtin.include_role:
    name: runtime-release
  vars:
    runtime_release_version: "{{ probe_matrix_target_secrets.mtg_version }}+archive.1"
    runtime_release_install_root: /opt/probe-matrix/mtg
    runtime_release_binary_name: mtg
    runtime_release_public_link: /usr/local/bin/probe-matrix-mtg
    runtime_release_urls:
      amd64: "{{ probe_matrix_target_secrets.mtg_linux_amd64_url }}"
      arm64: "{{ probe_matrix_target_secrets.mtg_linux_arm64_url }}"
    runtime_release_sha256:
      amd64: "{{ probe_matrix_target_secrets.mtg_linux_amd64_sha256 }}"
      arm64: "{{ probe_matrix_target_secrets.mtg_linux_arm64_sha256 }}"
    runtime_release_arch_slugs:
      amd64: amd64
      arm64: arm64
    runtime_release_artifact_filename: mtg.tar.gz
    runtime_release_artifact_type: archive
    runtime_release_archive_members:
      amd64: "mtg-{{ probe_matrix_target_secrets.mtg_version | regex_replace('^v', '') }}-linux-amd64/mtg"
      arm64: "mtg-{{ probe_matrix_target_secrets.mtg_version | regex_replace('^v', '') }}-linux-arm64/mtg"
    runtime_release_archive_strip_components: 1
    runtime_release_stage_only: false

- name: Notify probe matrix mtg restart after runtime release activation
  ansible.builtin.debug:
    msg: Probe matrix mtg runtime release activation changed={{ runtime_release_changed | bool }}
  changed_when: runtime_release_changed | bool
  notify: Restart probe matrix mtg
  when: not ansible_check_mode

- name: Install probe matrix services
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: [probe-matrix-xray, probe-matrix-mtg]
  register: _probe_matrix_service_units
  notify: Reload probe matrix systemd

- name: Apply changed probe matrix xray unit to its process
  ansible.builtin.debug:
    msg: Probe matrix xray service unit changed.
  changed_when: >-
    (_probe_matrix_service_units.results | selectattr('item', 'equalto', 'probe-matrix-xray')
     | selectattr('changed') | list | length) > 0
  notify: Restart probe matrix xray

- name: Apply changed probe matrix mtg unit to its process
  ansible.builtin.debug:
    msg: Probe matrix mtg service unit changed.
  changed_when: >-
    (_probe_matrix_service_units.results | selectattr('item', 'equalto', 'probe-matrix-mtg')
     | selectattr('changed') | list | length) > 0
  notify: Restart probe matrix mtg

- name: Enable probe matrix services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [probe-matrix-xray, probe-matrix-mtg, nginx]
  when: probe_matrix_target.manage_services | bool
