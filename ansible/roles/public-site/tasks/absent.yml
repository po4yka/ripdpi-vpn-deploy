---
- name: Retire the live page refresh before its user
  ansible.builtin.include_tasks: live-retire.yml

- name: Inspect the public site publisher timer before retirement
  ansible.builtin.stat:
    path: /etc/systemd/system/public-site-publish.timer
    follow: false
  register: _public_site_timer

- name: Stop and disable the public site publisher timer
  ansible.builtin.systemd_service:
    name: public-site-publish.timer
    enabled: false
    state: stopped
  when: _public_site_timer.stat.exists

# The service has no [Install] section, so it is only stopped, never disabled.
- name: Stop the public site publisher service
  ansible.builtin.systemd_service:
    name: public-site-publish.service
    state: stopped
  when: _public_site_timer.stat.exists

- name: Remove the public site publisher units, script, bundles and state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/public-site-publish.timer
    - /etc/systemd/system/public-site-publish.service
    - /usr/local/libexec/public-site-publish
    - /etc/public-site
    - /var/lib/public-site
    # Left by Persistent=true.
    - /var/lib/systemd/timers/stamp-public-site-publish.timer
  register: _public_site_removed

- name: Reload systemd after public site unit removal
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _public_site_removed.changed and not ansible_check_mode

- name: Remove the public site system user
  ansible.builtin.user:
    name: public-site
    state: absent

- name: Remove the public site system group
  ansible.builtin.group:
    name: public-site
    state: absent
