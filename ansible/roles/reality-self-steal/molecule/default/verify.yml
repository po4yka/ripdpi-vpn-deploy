---
- name: Verify REALITY self-steal role
  hosts: all
  become: true
  tasks:
    - name: nginx -t
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: HTTPS root returns the ordinary landing site
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl --silent --show-error --fail --insecure \
            --resolve edge.example.test:8443:127.0.0.1 \
            https://edge.example.test:8443/ | grep -q 'LLM Model Notes'
        executable: /bin/bash
      changed_when: false

    - name: Unknown and sensitive-looking paths return a normal 404
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for path in missing health metrics admin; do
            test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
              --resolve edge.example.test:8443:127.0.0.1 \
              "https://edge.example.test:8443/${path}")" = 404
          done
        executable: /bin/bash
      changed_when: false

    - name: TLS endpoint negotiates HTTP/2 through ALPN
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          openssl s_client -connect 127.0.0.1:8443 -servername edge.example.test -alpn h2 </dev/null 2>/dev/null |
            grep -q 'ALPN protocol: h2'
        executable: /bin/bash
      changed_when: false

    - name: Loopback listener exists and must not expose a wildcard listener
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lnt | grep -q '127.0.0.1:8443'
          ! ss -lnt | grep -q '0.0.0.0:8443'
          ! ss -lnt | grep -q '\[::\]:8443'
        executable: /bin/bash
      changed_when: false

    - name: Private key permissions are restricted
      ansible.builtin.stat:
        path: /etc/nginx/reality-self-steal/current/privkey.pem
      register: self_steal_key
      failed_when: self_steal_key.stat.mode != "0600"
