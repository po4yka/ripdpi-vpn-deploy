---
- name: Stage removal of the exact owned self-steal listener and pointer
  ansible.builtin.set_fact:
    nginx_transaction_files:
      - {path: /etc/nginx/sites-enabled/reality-self-steal.conf, kind: absent}
      - {path: /etc/nginx/sites-available/reality-self-steal.conf, kind: absent}
      - {path: '{{ reality_self_steal_tls_dir }}/current', kind: absent}

- name: Include exact owned landing assets in compensated retirement
  ansible.builtin.set_fact:
    nginx_transaction_files: >-
      {{ nginx_transaction_files + [{'path': reality_self_steal_site_root ~ '/' ~ (item | basename),
          'kind': 'absent'}] }}
  loop: "{{ query('ansible.builtin.fileglob', role_path ~ '/files/public-site/*') }}"
  no_log: true
  diff: false

- name: Validate retire and reload only the owned surface under shared nginx lock
  ansible.builtin.include_role:
    name: nginx-xhttp
    tasks_from: transaction
  vars:
    nginx_transaction_owner: reality-self-steal
    nginx_transaction_prune_releases:
      root: '{{ reality_self_steal_tls_dir }}/releases'
      keep: null
    nginx_transaction_roots: >-
      {{ ['/etc/nginx', reality_self_steal_site_root]
         + ([reality_self_steal_tls_dir] if not reality_self_steal_tls_dir.startswith('/etc/nginx/') else []) }}
    nginx_transaction_validate_argv: [/usr/sbin/nginx, -t]
    nginx_transaction_unit: nginx.service
    nginx_transaction_activation: reload
    nginx_transaction_activate_inactive: false
    nginx_transaction_desired_enabled: null
