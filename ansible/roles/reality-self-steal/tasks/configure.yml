---
- name: Reject collisions with Xray and local transport listeners
  vars:
    reality_self_steal_public_tcp_ports: "{{ public_listener_manifest | default([])\n   | selectattr('enabled',\
      \ 'equalto', true)\n   | selectattr('protocol', 'equalto', 'tcp')\n   | map(attribute='port')\n   | map('int')\n\
      \   | list }}"
  ansible.builtin.assert:
    that:
      - reality_self_steal_port | int >= 1
      - reality_self_steal_port | int <= 65535
      - "(reality_self_steal_port | int) not in [\n  xray_port | int,\n  xray_fallback_port | int,\n  nginx_xhttp_port\
        \ | int\n]"
      - (reality_self_steal_port | int) not in reality_self_steal_public_tcp_ports
    fail_msg: reality_self_steal_port must be a private, non-conflicting TCP port.
- name: Install the self-steal TLS runtime without premature default activation
  ansible.builtin.apt:
    name:
      - curl
      - nginx
      - openssl
      - util-linux
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  register: _self_steal_runtime_plan
- name: Inspect available TLS validator in check mode
  ansible.builtin.stat:
    path: /usr/bin/openssl
  register: _self_steal_tls_validator
  when: ansible_check_mode
- name: Require planned TLS validator installation on fresh check host
  ansible.builtin.assert:
    that: _self_steal_runtime_plan.changed
  when:
    - ansible_check_mode
    - not (_self_steal_tls_validator.stat.executable | default(false))
- name: Validate self-steal identity key and seven-day lifetime in memory
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - '{{ lookup(''ansible.builtin.file'', role_path ~ ''/../subscription-host/files/subscription_tls.py'') }}'
      - '604800'
    stdin: '{{ {''certificate'': reality_self_steal.cert_pem, ''private_key'': reality_self_steal.key_pem, ''hostname'':
      reality_self_steal.server_name} | to_json }}'
  changed_when: false
  check_mode: false
  no_log: true
  diff: false
  when: not ansible_check_mode or (_self_steal_tls_validator.stat.executable | default(false))
- name: Inspect owned candidate roots without following links
  ansible.builtin.stat:
    path: '{{ item.path }}'
    follow: false
  loop:
    - {path: '{{ reality_self_steal_site_root }}', mode: '0755'}
    - {path: '{{ reality_self_steal_tls_dir }}', mode: '0750'}
  register: _self_steal_candidate_roots

- name: Require existing candidate roots to retain safe owned directory authority
  ansible.builtin.assert:
    that:
      - not (item.stat.exists | default(false)) or (item.stat.isdir | default(false))
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.uid == 0
      - not (item.stat.exists | default(false)) or item.stat.mode is match('^[0-7]+[0145][0145]$')
    fail_msg: Self-steal candidate roots must be owned non-symlink directories.
  loop: '{{ _self_steal_candidate_roots.results }}'

- name: Prepare empty directory scaffold for private candidate binding
  ansible.builtin.file:
    path: '{{ item.item.path }}'
    state: directory
    owner: root
    group: root
    mode: '{{ item.item.mode }}'
  loop: '{{ _self_steal_candidate_roots.results }}'

- name: Stage complete immutable self-steal pair pointer and vhost authority
  ansible.builtin.set_fact:
    nginx_transaction_files:
      - path: '{{ reality_self_steal_tls_release_dir }}/fullchain.pem'
        kind: file
        content_b64: '{{ reality_self_steal.cert_pem | b64encode }}'
        mode: '0644'
        uid: 0
        gid: 0
      - path: '{{ reality_self_steal_tls_release_dir }}/privkey.pem'
        kind: file
        content_b64: '{{ reality_self_steal.key_pem | b64encode }}'
        mode: '0600'
        uid: 0
        gid: 0
      - path: '{{ reality_self_steal_tls_dir }}/current'
        kind: link
        target: '{{ reality_self_steal_tls_release_dir }}'
        mode: '0777'
        uid: 0
        gid: 0
      - path: /etc/nginx/sites-available/reality-self-steal.conf
        kind: file
        content_b64: '{{ lookup(''ansible.builtin.template'', ''site.conf.j2'') | b64encode }}'
        mode: '0640'
        uid: 0
        gid: 0
      - path: /etc/nginx/sites-enabled/reality-self-steal.conf
        kind: link
        target: /etc/nginx/sites-available/reality-self-steal.conf
        mode: '0777'
        uid: 0
        gid: 0
      - path: /etc/nginx/sites-enabled/default
        kind: absent
  no_log: true
  diff: false
- name: Add the complete owned landing assets to the same publication
  ansible.builtin.set_fact:
    nginx_transaction_files: "{{ nginx_transaction_files + [{'path': reality_self_steal_site_root ~ '/' ~ (item\
      \ | basename),\n    'kind': 'file', 'content_b64': lookup('ansible.builtin.file', item, rstrip=false) | b64encode,\n\
      \    'mode': '0644', 'uid': 0, 'gid': 0}] }}"
  loop: '{{ query(''ansible.builtin.fileglob'', role_path ~ ''/files/public-site/*'') }}'
  no_log: true
  diff: false
- name: Validate publish and adopt complete self-steal authority under shared nginx lock
  ansible.builtin.include_role:
    name: nginx-xhttp
    tasks_from: transaction
  vars:
    nginx_transaction_owner: reality-self-steal
    nginx_transaction_prune_releases:
      root: '{{ reality_self_steal_tls_dir }}/releases'
      keep: '{{ reality_self_steal_tls_release_dir | basename }}'
    nginx_transaction_roots: >-
      {{ ['/etc/nginx', reality_self_steal_site_root]
         + ([reality_self_steal_tls_dir] if not reality_self_steal_tls_dir.startswith('/etc/nginx/') else []) }}
    nginx_transaction_validate_argv:
      - /usr/sbin/nginx
      - -t
    nginx_transaction_unit: nginx.service
    nginx_transaction_activation: reload
    nginx_transaction_desired_enabled: true
