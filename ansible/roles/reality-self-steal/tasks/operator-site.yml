---
- name: Enumerate the operator-owned self-steal site on the controller
  ansible.builtin.find:
    paths: ['{{ reality_self_steal_public_site_dir }}']
    recurse: true
    file_type: any
  register: _self_steal_operator_site
  delegate_to: localhost
  become: false
  when: reality_self_steal_public_site_dir | length > 0
- name: Resolve the published self-steal site layout
  ansible.builtin.set_fact:
    _self_steal_operator_files: >-
      {{ (_self_steal_operator_site.files | default([])) | selectattr('isreg') | map(attribute='path')
         | map('relpath', reality_self_steal_public_site_dir) | sort }}
    _self_steal_operator_dirs: >-
      {{ (_self_steal_operator_site.files | default([])) | selectattr('isdir') | map(attribute='path')
         | map('relpath', reality_self_steal_public_site_dir) | sort }}
