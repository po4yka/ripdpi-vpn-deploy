---
- name: Install Lynis when enabled
  ansible.builtin.apt:
    name: lynis
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: security_audit_lynis_install
  failed_when: false

- name: Allocate a unique private Lynis report directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ security_audit.report_root | default('/var/log/ripdpi-vpn-deploy/security-audit') }}/{{ security_audit_run_id }}"
    prefix: lynis-
  register: _security_audit_lynis_directory
  when: not ansible_check_mode

- name: Collect and validate the fresh Lynis machine report
  ansible.builtin.command:
    argv: [python3, -c, "{{ lookup('ansible.builtin.file', role_path ~ '/files/lynis_collect.py') }}"]
    stdin: "{{ {'directory': _security_audit_lynis_directory.path} | to_json }}"
  register: _security_audit_lynis_collection
  changed_when: false
  when: not ansible_check_mode

- name: Retain categorical Lynis collection result
  ansible.builtin.set_fact:
    security_audit_lynis_receipt: "{{ _security_audit_lynis_collection.stdout | from_json }}"
  when: not ansible_check_mode

- name: Persist categorical scanner success or unavailable evidence
  ansible.builtin.copy:
    dest: '{{ _security_audit_lynis_directory.path }}/collection.json'
    content: '{{ security_audit_lynis_receipt | to_nice_json }}'
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode

- name: Distinguish check-mode prediction from actual audit evidence
  ansible.builtin.debug:
    msg: Check mode plans Lynis installation and collection; no scan acceptance receipt exists.
  when: ansible_check_mode

- name: Require actual successful clean Lynis collection when explicitly requested
  ansible.builtin.assert:
    that:
      - security_audit_lynis_receipt.collection_success | default(false)
      - security_audit_lynis_receipt.warnings | default(-1) == 0
    fail_msg: Opt-in audit acceptance requires successful fresh collection without warning records.
  when:
    - security_audit.fail_on_high_findings | default(false)
    - not ansible_check_mode
