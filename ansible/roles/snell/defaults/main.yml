---
snell:
  version: "v1.14.0-alpha.42"
  download_url: >-
    https://github.com/SagerNet/sing-box/releases/download/{{ snell.version
    }}/sing-box-{{ snell.version | regex_replace('^v', '')
    }}-linux-{{ snell_arch }}.tar.gz
  install_root: /opt/snell
  config_dir: /etc/snell
  log_dir: /var/log/snell
  listen_addr: "::"
  evaluation_enabled: false
  evaluation_root: /var/lib/snell-evaluation
  smoke_port_base: 31100
  evaluation_sizes: [1024, 4096, 8192, 12288, 14336, 16384, 18432, 20480, 24576, 32768]
  variants:
    - {id: v4-stream, listen_port: 2443, server_version: 5, client_version: 4, obfs_mode: none}
    - {id: v6-default, listen_port: 2444, server_version: 6, client_version: 6, mode: default}
    - {id: v6-unshaped, listen_port: 2445, server_version: 6, client_version: 6, mode: unshaped}

snell_secrets: {}
