---
dependency:
  name: galaxy
  options: {requirements-file: ../../../../requirements.yml}
driver: {name: docker}
platforms:
  - name: vpn-snell-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    cgroupns_mode: host
provisioner:
  name: ansible
  env: {ANSIBLE_ROLES_PATH: ../../..}
  inventory:
    host_vars:
      vpn-snell-debian13: {ansible_user: root}
verifier: {name: ansible}
scenario:
  test_sequence: [dependency, syntax, create, converge, idempotence, verify, destroy]
