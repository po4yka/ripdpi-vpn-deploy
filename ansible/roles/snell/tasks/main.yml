---
- name: Pre-flight — prerelease Snell builds are staging-only
  ansible.builtin.assert:
    that:
      - not ((snell.version is search('-(alpha|beta|rc)')) and ((env | default(lookup('env', 'ENV'), true)) == 'prod'))
    fail_msg: "Snell prerelease {{ snell.version }} is staging-only; refusing ENV=prod."

- name: Pre-flight — Snell secrets and variants are complete
  ansible.builtin.assert:
    that:
      - snell_secrets.linux_amd64_sha256 | default('') | length == 64
      - snell_secrets.linux_arm64_sha256 | default('') | length == 64
      - snell_secrets.variants | default([]) | length == snell.variants | length
      - snell.variants | map(attribute='id') | list | sort == snell_secrets.variants | map(attribute='id') | list | sort
      - not (snell.evaluation_enabled | bool) or (snell_secrets.evaluation_path_token | default('') is match('^[A-Za-z0-9_-]{16,128}$'))
    fail_msg: "Snell requires architecture checksums, an exact secret variant set, and an evaluation token when measurement is enabled."

- name: Pre-flight — every Snell secret variant has a PSK and users
  ansible.builtin.assert:
    that:
      - item.psk | length > 0
      - item.id is not match('^v6-') or item.psk | length >= 12
      - item.users | length > 0
      - item.users | map(attribute='name') | list | unique | length == item.users | length
      - item.users | map(attribute='userkey') | list | unique | length == item.users | length
    fail_msg: "Snell variant {{ item.id }} requires a PSK, a 12+ byte v6 PSK, and unique named users."
  loop: "{{ snell_secrets.variants | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true

- name: Pre-flight — evaluation endpoint requires nginx-xhttp
  ansible.builtin.assert:
    that:
      - vpn.enable_nginx_xhttp | default(false) | bool
    fail_msg: "Snell evaluation requires the same-node nginx-xhttp control endpoint."
  when: snell.evaluation_enabled | bool

- name: Set Snell architecture facts
  ansible.builtin.set_fact:
    snell_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    snell_sha256: >-
      {{ snell_secrets.linux_amd64_sha256
         if ansible_facts['architecture'] == 'x86_64'
         else snell_secrets.linux_arm64_sha256 }}

- name: Ensure Snell user
  ansible.builtin.user:
    name: snell
    system: true
    shell: /usr/sbin/nologin
    home: "{{ snell.install_root }}"
    create_home: false

- name: Ensure Snell directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ snell.config_dir }}", owner: root, group: snell, mode: "0750"}
    - {path: "{{ snell.log_dir }}", owner: snell, group: snell, mode: "0750"}
    - {path: "{{ snell.evaluation_root }}", owner: root, group: root, mode: "0755"}

- name: Install pinned Snell runtime through runtime-release
  ansible.builtin.include_role:
    name: runtime-release
  vars:
    runtime_release_version: "{{ snell.version }}"
    runtime_release_install_root: "{{ snell.install_root }}"
    runtime_release_binary_name: sing-box
    runtime_release_public_link: /usr/local/bin/sing-box-snell
    runtime_release_urls:
      amd64: "{{ snell_release_urls.amd64 }}"
      arm64: "{{ snell_release_urls.arm64 }}"
    runtime_release_sha256:
      amd64: "{{ snell_secrets.linux_amd64_sha256 }}"
      arm64: "{{ snell_secrets.linux_arm64_sha256 }}"
    runtime_release_arch_slugs:
      amd64: amd64
      arm64: arm64
    runtime_release_artifact_filename: sing-box.tar.gz
    runtime_release_artifact_type: archive
    runtime_release_archive_members:
      amd64: >-
        sing-box-{{ snell.version | regex_replace('^v', '') }}-linux-amd64/sing-box
      arm64: >-
        sing-box-{{ snell.version | regex_replace('^v', '') }}-linux-arm64/sing-box
    runtime_release_archive_strip_components: 1

- name: Notify Snell restart after runtime release activation
  ansible.builtin.debug:
    msg: Snell runtime release activation changed={{ runtime_release_changed | bool }}
  changed_when: runtime_release_changed | bool
  notify: Restart snell
  when: not ansible_check_mode

- name: Render validated Snell configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ snell.config_dir }}/config.json"
    owner: root
    group: snell
    mode: "0640"
    validate: "{{ snell.install_root }}/releases/{{ snell.version }}/sing-box check -c %s"
  no_log: true
  diff: false
  notify: Restart snell

- name: Generate exact-size Snell evaluation fixtures
  ansible.builtin.command:
    cmd: "truncate -s {{ item }} {{ snell.evaluation_root }}/{{ item }}.bin"
    creates: "{{ snell.evaluation_root }}/{{ item }}.bin"
  loop: "{{ snell.evaluation_sizes }}"
  when: snell.evaluation_enabled | bool

- name: Install Snell systemd unit
  ansible.builtin.template:
    src: snell.service.j2
    dest: /etc/systemd/system/snell.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart snell

- name: Enable and start Snell
  ansible.builtin.systemd_service:
    name: snell.service
    enabled: true
    state: started
    daemon_reload: true
