---
split_hop_ingress:
  manage_service: true
  validate_policy: true
  wg_interface: shop0
  listen_port: "{{ split_hop_ingress_listen_port }}"
  node_a_address: 10.200.0.1/30
  node_b_address: 10.200.0.2/32
  routing_table: 200
  fwmark: 1

# Family scope routes every recipient flow through Node B: the transport
# normalizer and direct gateway users (Xray and Hysteria egress) and forwarded
# AmneziaWG originals. UIDs are resolved from the host before rendering.
split_hop_ingress_family_users:
  - transport-normalizer
  - transport-gateway
split_hop_ingress_family_uids: []
split_hop_ingress_family_interfaces: >-
  {{ (amneziawg_secrets.instances | default([]) | map(attribute='name') | list)
     if (vpn.enable_amneziawg | default(false) | bool) and amneziawg_secrets is defined else [] }}

split_hop_ingress_secrets:
  node_a_private_key: ""
  node_b_public_key: ""
  preshared_key: ""

split_hop_ingress_role_enabled: true
