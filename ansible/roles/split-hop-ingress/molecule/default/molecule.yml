---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml
driver:
  name: docker
platforms:
  - name: vpn-split-hop-ingress-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:1a91a760258b1004b95b671fe24dcc1e1bd8bd0a402d6a2257bb171d67dc9911
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  config_options:
    defaults:
      callback_result_format: yaml
verifier:
  name: ansible
scenario:
  test_sequence: [dependency, syntax, create, converge, idempotence, verify, destroy]
