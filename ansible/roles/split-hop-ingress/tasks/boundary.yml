---
# Recipient boundary only: site.yml loads it before family transports activate.
- name: Resolve family recipient egress identities
  ansible.builtin.command:
    argv: "{{ ['getent', 'passwd'] + split_hop_ingress_family_users }}"
  register: _split_hop_family_identity
  # getent exits 2 when any requested user is absent; the assert below refuses.
  failed_when: _split_hop_family_identity.rc not in [0, 2]
  changed_when: false
  check_mode: false
  when: vpn.split_hop_family_egress | default(false) | bool

- name: Publish family recipient egress UIDs
  ansible.builtin.set_fact:
    split_hop_ingress_family_uids: >-
      {{ _split_hop_family_identity.stdout_lines | map('split', ':')
         | selectattr(0, 'in', split_hop_ingress_family_users)
         | map(attribute=2) | map('int') | list }}
  when: vpn.split_hop_family_egress | default(false) | bool

- name: Refuse family egress without every recipient identity and device interface
  ansible.builtin.assert:
    that:
      - split_hop_ingress_family_uids | length == split_hop_ingress_family_users | length
      - not (vpn.enable_amneziawg | default(false) | bool) or split_hop_ingress_family_interfaces | length > 0
    fail_msg: >-
      split-hop-family-authority-missing: converge transport-egress (and AmneziaWG
      instances) before routing family egress through Node B.
  when:
    - vpn.split_hop_family_egress | default(false) | bool
    - not ansible_check_mode

- name: Install split-hop ingress packages
  ansible.builtin.apt:
    name: [wireguard, wireguard-tools, nftables]
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: _split_hop_ingress_packages

- name: Ensure WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render split-hop ingress routing policy
  ansible.builtin.template:
    src: policy.nft.j2
    dest: /etc/wireguard/split-hop-ingress.nft
    owner: root
    group: root
    mode: "0644"
    validate: "{{ 'nft -c -f %s' if split_hop_ingress.validate_policy | bool else omit }}"
  register: _split_hop_ingress_policy
  notify: Restart split-hop ingress

- name: Install split-hop ingress boot policy loader
  ansible.builtin.template:
    src: split-hop-ingress-policy.service.j2
    dest: /etc/systemd/system/split-hop-ingress-policy.service
    owner: root
    group: root
    mode: "0644"
  register: _split_hop_ingress_policy_unit

- name: Ensure the owned WireGuard policy dependency directory
  ansible.builtin.file:
    path: "/etc/systemd/system/wg-quick@{{ split_hop_ingress.wg_interface }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Require the recipient boundary before starting WireGuard
  ansible.builtin.copy:
    dest: "/etc/systemd/system/wg-quick@{{ split_hop_ingress.wg_interface }}.service.d/split-hop-policy.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Requires=split-hop-ingress-policy.service
      After=split-hop-ingress-policy.service

- name: Load and retain the ingress boundary before tunnel activation
  ansible.builtin.systemd_service:
    name: split-hop-ingress-policy.service
    enabled: true
    state: "{{ 'restarted' if (_split_hop_ingress_policy.changed or _split_hop_ingress_policy_unit.changed) else 'started' }}"
    daemon_reload: true
  when:
    - split_hop_ingress.manage_service | bool
    - not ansible_check_mode
