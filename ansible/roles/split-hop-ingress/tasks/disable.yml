---
- name: Retire split-hop-ingress owned runtime authority
  ansible.builtin.include_role:
    name: runtime-release
    tasks_from: retire
  vars:
    runtime_retire_units:
      - wg-quick@{{ split_hop_ingress.wg_interface }}.service
    runtime_retire_paths:
      - /etc/wireguard/{{ split_hop_ingress.wg_interface }}.conf
      - /etc/wireguard/split-hop-ingress.nft

- name: Inspect installed packages for scoped ingress policy retirement
  ansible.builtin.package_facts:
    manager: auto

- name: Inspect scoped split-hop ingress policy authority
  ansible.builtin.command:
    argv: [nft, -j, list, tables]
  register: _split_hop_ingress_retire_tables
  check_mode: false
  changed_when: false
  when: "'nftables' in ansible_facts.packages | default({})"

- name: Retire only the split-hop ingress nftables table
  ansible.builtin.command:
    argv: [nft, delete, table, inet, split_hop_ingress]
  changed_when: true
  when:
    - not ansible_check_mode
    - _split_hop_ingress_retire_tables is not skipped
    - >-
      ((_split_hop_ingress_retire_tables.stdout | from_json).nftables | selectattr('table', 'defined')
       | map(attribute='table') | selectattr('family', 'equalto', 'inet')
       | selectattr('name', 'equalto', 'split_hop_ingress') | list | length) > 0

- name: Inspect policy routing rules after stopping the owned ingress
  ansible.builtin.command:
    argv: [ip, -j, rule, show]
  register: _split_hop_ingress_retire_rules
  check_mode: false
  changed_when: false
  when: "'iproute2' in ansible_facts.packages | default({})"

- name: Remove only the owned mark and routing table rule
  ansible.builtin.command:
    argv:
      - ip
      - rule
      - del
      - fwmark
      - "{{ split_hop_ingress.fwmark | string }}"
      - table
      - "{{ split_hop_ingress.routing_table | string }}"
  loop: "{{ (_split_hop_ingress_retire_rules.stdout | default('[]') | from_json) }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - item.table | default('') | string == split_hop_ingress.routing_table | string
    - item.fwmark | default('') | int(base=0) == split_hop_ingress.fwmark | int

- name: Inspect all IPv4 routes before scoped table retirement
  ansible.builtin.command:
    argv: [ip, -j, -4, route, show, table, all]
  register: _split_hop_ingress_retire_routes
  check_mode: false
  changed_when: false
  when: "'iproute2' in ansible_facts.packages | default({})"

- name: Flush only the owned ingress routing table
  ansible.builtin.command:
    argv: [ip, -4, route, flush, table, "{{ split_hop_ingress.routing_table | string }}"]
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      ((_split_hop_ingress_retire_routes.stdout | default('[]') | from_json)
       | selectattr('table', 'defined') | map(attribute='table') | map('string')
       | select('equalto', split_hop_ingress.routing_table | string)
       | list | length) > 0
