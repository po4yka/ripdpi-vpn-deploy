---
subscription:
  port: 8444
  rate_limit: "5r/m"   # per-IP request rate (nginx limit_req)
  rate_burst: 3        # burst allowance before queuing/rejecting
  revoked_tokens: []   # list of sha256 hex hashes; populated from secrets when revocation happens
  # server_name defaults to nginx_xhttp.server_name when not set

  # One-time bootstrap tokens (SUBSCRIPTION-PLANE.md item 1). When
  # enabled, /bootstrap/<token> is served by a tiny Python service on
  # 127.0.0.1:8445; nginx proxies and rate-limits. The Python service
  # atomically reads and deletes the payload file on first successful
  # GET, so the token is single-use.
  enable_bootstrap: false
  # The local Python service handles BOTH /bootstrap/<token> (single-
  # use) and /sub/<token> (long-lived). Both routes use hashed-on-disk
  # storage: the operator hands the client a plaintext token, the
  # service hashes the inbound URL with sha256 and reads from
  # subscription_dir/<route>/<hash>. Disk theft alone never yields a
  # usable subscription URL.
  subscription_dir: /var/lib/vpn-subscription
  bootstrap_listen_addr: "127.0.0.1"
  bootstrap_listen_port: 8445
  # Server-side audit log for token reads. JSONL, one record per
  # successful or rejected fetch. Carries only the first 8 chars of
  # the SHA256 hash (not the plaintext token), source IP, route, and
  # bytes served — enough to detect mass-pull patterns without
  # leaking secrets to disk.
  reads_log: /var/log/vpn-subscription/reads.log
  # Revocation: one sha256 hash per line. Reloaded on every request,
  # so updates to the file take effect on next read without needing
  # a service restart.
  revoked_file: /var/lib/vpn-subscription/revoked
  # Kept for backward-compat with sites that still set
  # subscription.bootstrap_dir; the service no longer reads from this
  # path. New deploys should not set it.
  bootstrap_dir: ""

  # Continuous payload mirror (SUBSCRIPTION-HOST-SEPARATION.md
  # "continuous-issuance" path). When enabled, a systemd oneshot +
  # timer periodically PULLs the hashed-on-disk payload tree
  # (subscription_dir/{sub,bootstrap}/<hash> + .meta sidecars) from a
  # build worker, keeping this delivery host fresh without manual scp.
  # This is an outbound pull only — it opens no new public surface and
  # preserves the host's loopback-only serving posture.
  #
  # All keys default to safe no-ops so existing deploys (where the
  # mirror block is unset, hence mirror.enabled=false) are unchanged.
  mirror:
    enabled: false
    # "rsync" (rsync-over-ssh) or "restic" (restore from a restic repo).
    backend: "rsync"
    # systemd OnUnitActiveSec cadence between pulls.
    interval: "5min"
    # rsync backend: a remote source spec, e.g.
    # "build@worker.internal:/var/lib/vpn-subscription/". Trailing slash
    # controls rsync directory semantics — keep it.
    source: ""
    rsync_opts: "-az --delete"
    # Private key used by rsync-over-ssh (rendered from secrets when set).
    # MUST live OUTSIDE subscription_dir: the rsync `--delete` reconciles the
    # destination against the source tree (which only carries sub/ and
    # bootstrap/), so a credential stored under subscription_dir would be
    # deleted on the first pull. /etc/vpn-subscription is owned by
    # vpn-bootstrap and is never an rsync/restic target.
    ssh_key_path: "/etc/vpn-subscription/mirror_ssh_key"
    # Extra ssh options passed via rsync -e (StrictHostKeyChecking etc.).
    ssh_opts: "-o StrictHostKeyChecking=accept-new -o BatchMode=yes"
    # restic backend: repository URL/path and the snapshot subtree to
    # restore. The repo password is supplied via secrets (rendered to
    # restic_password_file). Leave empty for the rsync backend.
    restic_repo: ""
    restic_snapshot_path: ""
    # Also kept outside subscription_dir — see ssh_key_path rationale above.
    restic_password_file: "/etc/vpn-subscription/mirror_restic_password"
