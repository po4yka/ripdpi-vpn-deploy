---
- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart vpn-bootstrap
  ansible.builtin.systemd_service:
    name: vpn-bootstrap.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode or _subscription_unit_existing.stdout == 'loaded'

- name: Restart vpn-sub-mirror timer
  ansible.builtin.systemd_service:
    name: vpn-sub-mirror.timer
    state: restarted
    daemon_reload: true
  when: subscription.mirror.enabled | default(false)

# Stopping the socket also stops the ingest that requires it; the next handler starts the ingest again.
- name: Restart vpn-field-report socket
  ansible.builtin.systemd_service:
    name: vpn-field-report.socket
    state: restarted
    daemon_reload: true
  when:
    - subscription_field_report.enabled | bool
    - not (ansible_check_mode and _subscription_field_report_socket.changed | default(false))

- name: Restart vpn-field-report
  ansible.builtin.systemd_service:
    name: vpn-field-report.service
    state: restarted
    daemon_reload: true
  when:
    - subscription_field_report.enabled | bool
    - not (ansible_check_mode and (_subscription_field_report_unit.changed | default(false) or
                                   _subscription_field_report_socket.changed | default(false)))
