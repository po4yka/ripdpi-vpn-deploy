---
- name: Converge subscription-host role
  hosts: all
  become: true
  vars:
    nginx_xhttp:
      server_name: sub.example.test
    subscription:
      port: 8444
      rate_limit: "5r/m"
      rate_burst: 3
      enable_bootstrap: true
      revoked_tokens:
        - "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
      # Exercise the continuous payload mirror. rsync with a colon-free
      # local source path performs a local copy (the -e ssh shell is
      # ignored), so the timer-driven pull works self-contained in the
      # container without sshd. The source lives outside /tmp because the
      # systemd unit uses PrivateTmp=true.
      mirror:
        enabled: true
        backend: rsync
        interval: "5min"
        source: "/var/lib/vpn-subscription-mirror-src/"
        # A stub credential exercises the "Drop rsync ssh key" task so the
        # regression guard in verify.yml can prove the key survives a
        # `--delete` pull (it lives outside subscription_dir by design).
        ssh_key: "STUB-NOT-A-REAL-KEY\n"
  pre_tasks:
    - name: Seed a fake mirror source payload tree
      ansible.builtin.file:
        path: "/var/lib/vpn-subscription-mirror-src/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - sub
        - bootstrap
    - name: Seed a fake sub payload + meta sidecar
      ansible.builtin.copy:
        dest: "/var/lib/vpn-subscription-mirror-src/sub/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          content: "{\"v\":1}\n"
        - name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.meta"
          content: "{}\n"
        - name: "{{ 'molecule_header_probe_token' | hash('sha256') }}"
          content: "{\"v\":1}\n"
      loop_control:
        label: "{{ item.name }}"
    - name: Install nginx + openssl
      ansible.builtin.apt:
        name: [nginx, openssl]
        state: present
        update_cache: true
    - name: Ensure TLS material directory
      ansible.builtin.file:
        path: /etc/nginx/tls
        state: directory
        owner: root
        group: root
        mode: "0750"
    - name: Generate a self-signed pair so nginx -t passes
      ansible.builtin.command:
        cmd: |
          openssl req -x509 -newkey rsa:2048 -nodes
            -keyout /etc/nginx/tls/sub.example.test.key
            -out /etc/nginx/tls/sub.example.test.fullchain.pem
            -subj /CN=sub.example.test
            -addext subjectAltName=DNS:sub.example.test
            -days 1
        creates: /etc/nginx/tls/sub.example.test.fullchain.pem
    - name: Read synthetic independent subscription certificate
      ansible.builtin.slurp:
        src: /etc/nginx/tls/sub.example.test.fullchain.pem
      register: _subscription_fixture_certificate
      no_log: true
    - name: Read synthetic independent subscription private key
      ansible.builtin.slurp:
        src: /etc/nginx/tls/sub.example.test.key
      register: _subscription_fixture_key
      no_log: true
    - name: Supply the independent delivery fixture authority
      ansible.builtin.set_fact:
        subscription: >-
          {{ subscription | combine({'cert_pem': _subscription_fixture_certificate.content | b64decode,
                                     'key_pem': _subscription_fixture_key.content | b64decode}) }}
      no_log: true
      diff: false
  roles:
    - role: subscription-host
