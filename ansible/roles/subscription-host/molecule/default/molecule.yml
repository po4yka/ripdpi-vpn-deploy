---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-sub-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:b4d9e93c00d16f482db3068cde61340113c74e77b725b4e770b3978de0c8215d
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    host_vars:
      vpn-sub-debian13:
        ansible_user: root

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
