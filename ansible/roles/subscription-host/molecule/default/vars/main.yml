---
vpn:
  share_bundles:
    - client: synthetic
      token: synthetic-share-token
      local_path: "{{ playbook_dir }}/files/recipient-fixture"
nginx_xhttp:
  server_name: sub.example.test
subscription:
  port: 8444
  rate_limit: "5r/m"
  rate_burst: 3
  enable_bootstrap: true
  revoked_tokens:
    - "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
  # Exercise the continuous payload mirror. rsync with a colon-free
  # local source path performs a local copy (the -e ssh shell is
  # ignored), so the timer-driven pull works self-contained in the
  # container without sshd. The source lives outside /tmp because the
  # systemd unit uses PrivateTmp=true.
  mirror:
    enabled: true
    backend: rsync
    interval: "5min"
    source: "/var/lib/vpn-subscription-mirror-src/"
    # A stub credential exercises the "Drop rsync ssh key" task so the
    # regression guard in verify.yml can prove the key survives a
    # `--delete` pull (it lives outside subscription_dir by design).
    ssh_key: "STUB-NOT-A-REAL-KEY\n"
# Exercise the field-report ingest with placeholder cohort tokens; the
# previous token's overlap has already ended.
subscription_field_report:
  enabled: true
  path: /v1/field-report
  max_body_bytes: 65536
  nginx_rate: "30r/m"
  nginx_burst: 20
  min_attempts: 5
  max_attempts_per_report: 1000
  top_n_min_reports: 3
  asn_top_n: 20
  operator_top_n: 20
  country_top_n: 10
  window_seconds: 3600
  max_series: 400
  jsonschema_package_versions:
    trixie: "4.19.2-6"
    noble: "4.10.3-2ubuntu1"
  server_refs: [p0-reality-upcloud-prod]
  # This dict replaces the role default whole; the hint needs the controller dataset, so it stays off.
  network_hint:
    enabled: false
field_report:
  cohort_token: "{{ 'molecule-current-cohort' | hash('sha1') }}"
  previous_cohort_token: "{{ 'molecule-previous-cohort' | hash('sha1') }}"
  previous_cohort_token_valid_until: "2000-01-01T00:00:00Z"
