---
- name: Verify subscription-host role
  hosts: all
  become: true
  vars_files: [vars/main.yml]
  tasks:
    - name: nginx -t
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Site is enabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/vpn-sub.conf
      register: site
      failed_when: not site.stat.exists or not site.stat.islnk

    - name: rate-limit zone defined
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'limit_req_zone .* zone=vpn_sub_per_ip' /etc/nginx/conf.d/vpn-sub-ratelimit.conf
        executable: /bin/bash
      changed_when: false

    - name: Subscription payload directory exists with safe perms
      ansible.builtin.stat:
        path: /var/lib/vpn-subscription
      register: payload_dir
      failed_when: payload_dir.stat.mode != "0700"

    # State-level: prove the role left the host in a serving state, not
    # merely that the config files were rendered.
    - name: vpn-bootstrap.service is active
      ansible.builtin.command:
        cmd: systemctl is-active vpn-bootstrap.service
      register: bootstrap_active
      changed_when: false
      failed_when: bootstrap_active.stdout != "active"

    - name: nginx.service is active
      ansible.builtin.command:
        cmd: systemctl is-active nginx.service
      register: nginx_active
      changed_when: false
      failed_when: nginx_active.stdout != "active"

    - name: vpn-bootstrap binds 127.0.0.1:8445 (loopback only)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lntp '( sport = :8445 )' | grep -q '127.0.0.1:8445'
        executable: /bin/bash
      changed_when: false

    - name: nginx binds the subscription port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lntp '( sport = :8444 )' | grep -q ':8444'
        executable: /bin/bash
      changed_when: false

    - name: revoked-hashes file contains the seeded revoked entry
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -Fxq 'deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef' /var/lib/vpn-subscription/revoked
        executable: /bin/bash
      changed_when: false

    - name: vpn-bootstrap.service journal has no fatal entries
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ! journalctl -u vpn-bootstrap.service --since "5 minutes ago" \
            --no-pager --output=cat \
            | grep -iE 'traceback|fatal|critical'
        executable: /bin/bash
      changed_when: false

    # -----------------------------------------------------------------
    # Continuous payload mirror (subscription.mirror.enabled: true).
    # -----------------------------------------------------------------
    - name: vpn-sub-mirror.timer is enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled vpn-sub-mirror.timer
      register: mirror_timer_enabled
      changed_when: false
      failed_when: mirror_timer_enabled.stdout != "enabled"

    - name: vpn-sub-mirror.timer is active
      ansible.builtin.command:
        cmd: systemctl is-active vpn-sub-mirror.timer
      register: mirror_timer_active
      changed_when: false
      failed_when: mirror_timer_active.stdout != "active"

    - name: Create vpn-bootstrap SSH state before the --delete pull
      ansible.builtin.file:
        path: /var/lib/vpn-subscription/.ssh
        state: directory
        owner: vpn-bootstrap
        group: vpn-bootstrap
        mode: "0700"

    - name: Seed vpn-bootstrap SSH state before the --delete pull
      ansible.builtin.copy:
        dest: /var/lib/vpn-subscription/.ssh/known_hosts
        content: "molecule-mirror.example.test ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMoleculeKnownHost\n"
        owner: vpn-bootstrap
        group: vpn-bootstrap
        mode: "0600"
        directory_mode: "0700"

    - name: Trigger one mirror pull (oneshot) so payload lands on disk
      ansible.builtin.command:
        cmd: systemctl start vpn-sub-mirror.service
      changed_when: false

    - name: Wait for the oneshot to settle
      ansible.builtin.command:
        cmd: systemctl is-active vpn-sub-mirror.service
      register: mirror_oneshot
      changed_when: false
      # oneshot reports "inactive" after a successful run; "failed" is the
      # error case we want to catch.
      failed_when: mirror_oneshot.stdout == "failed"

    - name: Mirror produced the sub payload in the active generation
      ansible.builtin.stat:
        path: >-
          /var/lib/vpn-subscription/.vpn-sub-mirror-current/sub/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      register: mirrored_payload
      failed_when: not mirrored_payload.stat.exists

    - name: Mirrored payload has 0600 perms owned by vpn-bootstrap
      ansible.builtin.assert:
        that:
          - mirrored_payload.stat.mode == "0600"
          - mirrored_payload.stat.pw_name == "vpn-bootstrap"
          - mirrored_payload.stat.gr_name == "vpn-bootstrap"
        fail_msg: >-
          mirrored payload perms/ownership wrong:
          mode={{ mirrored_payload.stat.mode }}
          owner={{ mirrored_payload.stat.pw_name }}:{{ mirrored_payload.stat.gr_name }}

    - name: Mirror ssh credential survives the --delete pull (lives outside DEST)
      ansible.builtin.stat:
        path: /etc/vpn-subscription/mirror_ssh_key
      register: mirror_ssh_key
      failed_when: >-
        not mirror_ssh_key.stat.exists
        or mirror_ssh_key.stat.mode != "0600"

    - name: Revocation hash list survives the triggered --delete pull
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -Fxq 'deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef' /var/lib/vpn-subscription/revoked
        executable: /bin/bash
      changed_when: false

    - name: Delivery routes retain inherited headers on success and errors
      ansible.builtin.uri:
        url: "https://127.0.0.1:8444/{{ item.route }}/molecule_header_probe_token"
        validate_certs: false
        status_code: "{{ item.status }}"
        headers:
          Host: sub.example.test
      loop:
        - {route: sub, status: 200}
        # A well-shaped but absent token is Gone; only malformed paths are 404.
        - {route: bootstrap, status: 410}
      register: delivery_responses

    - name: Every delivery response has the complete no-store header baseline
      ansible.builtin.assert:
        that:
          - "'no-store' in item.cache_control"
          - "'default-src' in item.content_security_policy"
          - item.x_content_type_options == 'nosniff'
          - item.permissions_policy == 'camera=(), microphone=(), geolocation=()'
          - item.referrer_policy == 'no-referrer'
          - "'max-age=' in item.strict_transport_security"
      loop: "{{ delivery_responses.results }}"
      loop_control:
        label: "{{ item.item.route }}"

    - name: vpn-bootstrap .ssh state survives the triggered --delete pull
      ansible.builtin.stat:
        path: /var/lib/vpn-subscription/.ssh
      register: mirror_ssh_state
      failed_when: not mirror_ssh_state.stat.exists

    - name: vpn-sub-mirror.service journal has no fatal entries
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ! journalctl -u vpn-sub-mirror.service --since "5 minutes ago" \
            --no-pager --output=cat \
            | grep -iE 'traceback|fatal|critical'
        executable: /bin/bash
      changed_when: false

    - name: Verify nginx worker access and deny other local users
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import pathlib, subprocess
            base = pathlib.Path('/var/www/subscription-host')
            for path in (base, base / 'share', base / 'share/synthetic-share-token', base / 'share/synthetic-share-token/nested'):
                assert path.stat().st_mode & 0o777 == 0o750
            config = base / 'share/synthetic-share-token/nested/config.json'
            assert config.stat().st_mode & 0o777 == 0o640
            result = subprocess.run(['runuser', '-u', 'www-data', '--', 'cat', str(config)], capture_output=True)
            assert result.returncode == 0 and result.stdout == b'{"synthetic":true}\n'
            for command in (['ls', str(base / 'share')], ['cat', str(config)]):
                result = subprocess.run(['runuser', '-u', 'nobody', '--', *command], capture_output=True)
                assert result.returncode != 0 and not result.stdout
      changed_when: false
      no_log: true
      diff: false

    - name: Seed conservative consumed bootstrap authority before retirement
      ansible.builtin.copy:
        dest: "/var/lib/vpn-subscription/.vpn-bootstrap-consumed/{{ 'synthetic-consumed-bootstrap' | hash('sha256') }}"
        content: ''
        owner: vpn-bootstrap
        group: vpn-bootstrap
        mode: '0600'
      no_log: true
      diff: false

    # Keep scheduling active for check mode, but drain independent writers before
    # comparing exact authority bytes across the retirement transaction.
    - name: Create owned fixture timer override directories
      ansible.builtin.file:
        path: '/run/systemd/system/{{ item }}.d'
        state: directory
        mode: '0755'
      loop: [vpn-sub-mirror.timer, vpn-subscription-maintenance.timer]

    - name: Defer independent fixture writers beyond the verification window
      ansible.builtin.copy:
        dest: '/run/systemd/system/{{ item }}.d/molecule-retirement.conf'
        content: |
          [Timer]
          OnCalendar=
          OnBootSec=
          OnUnitActiveSec=
          OnActiveSec=365d
          RandomizedDelaySec=0
          Persistent=false
        mode: '0644'
      loop: [vpn-sub-mirror.timer, vpn-subscription-maintenance.timer]

    - name: Keep fixture timers enabled and active with deferred scheduling
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
        state: restarted
        daemon_reload: true
      loop: [vpn-sub-mirror.timer, vpn-subscription-maintenance.timer]

    - name: Drain independent fixture writers before the authority baseline
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: stopped
      loop: [vpn-sub-mirror.service, vpn-subscription-maintenance.service]

    - name: Capture retained delivery authority before mirror retirement
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib, json, os, pathlib
            root = pathlib.Path('/var/lib/vpn-subscription')
            names = ['revoked', '.vpn-bootstrap-retired-before', '.vpn-bootstrap-state.lock',
                     '.vpn-sub-mirror-current/sub/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
                     '/etc/vpn-subscription/mirror_ssh_key']
            print(json.dumps({'pointer': os.readlink(root / '.vpn-sub-mirror-current'),
                              'files': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names},
                              'consumed': sorted(path.name for path in (root / '.vpn-bootstrap-consumed').iterdir())}, sort_keys=True))
      register: _mirror_authority_before
      changed_when: false
      no_log: true

    - name: Read the retained synthetic independent subscription certificate
      ansible.builtin.slurp:
        src: /etc/nginx/tls/sub.example.test.fullchain.pem
      register: _subscription_verify_certificate
      no_log: true

    - name: Read the retained synthetic independent subscription key
      ansible.builtin.slurp:
        src: /etc/nginx/tls/sub.example.test.key
      register: _subscription_verify_key
      no_log: true

    - name: Select the disabled mirror toggle on the enabled delivery role
      ansible.builtin.set_fact:
        subscription: >-
          {{ subscription | combine({'mirror': subscription.mirror | combine({'enabled': false}),
                                     'cert_pem': _subscription_verify_certificate.content | b64decode,
                                     'key_pem': _subscription_verify_key.content | b64decode}) }}
      no_log: true
      diff: false

    - name: Predict mirror retirement without changing running units
      ansible.builtin.include_role:
        name: subscription-host
        apply:
          check_mode: true

    - name: Check mode retains the enabled active mirror timer
      ansible.builtin.command:
        argv: [systemctl, show, vpn-sub-mirror.timer, '--property=ActiveState,UnitFileState']
      register: _mirror_after_check
      changed_when: false
      failed_when: >-
        'ActiveState=active' not in _mirror_after_check.stdout or
        'UnitFileState=enabled' not in _mirror_after_check.stdout

    - name: Retire mirror execution while preserving accepted authority
      ansible.builtin.include_role:
        name: subscription-host

    - name: Repeat mirror retirement without changes
      ansible.builtin.include_role:
        name: subscription-host

    - name: Repeated mirror retirement is idempotent
      ansible.builtin.assert:
        that: not _subscription_mirror_stopped.changed

    - name: Verify mirror stays disabled after manager reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Verify no scheduled mirror publication remains
      ansible.builtin.command:
        argv: [systemctl, show, '{{ item }}', '--property=ActiveState,UnitFileState']
      loop: [vpn-sub-mirror.timer, vpn-sub-mirror.service]
      register: _mirror_retired
      changed_when: false
      failed_when: >-
        'ActiveState=inactive' not in _mirror_retired.stdout or
        'UnitFileState=disabled' not in _mirror_retired.stdout

    - name: Capture retained delivery authority after mirror retirement
      ansible.builtin.command:
        argv: '{{ _mirror_authority_before.cmd }}'
      register: _mirror_authority_after
      changed_when: false
      no_log: true

    - name: Classify retained authority differences without private values
      ansible.builtin.set_fact:
        _mirror_authority_changed:
          pointer: >-
            {{ (_mirror_authority_after.stdout | from_json).pointer != (_mirror_authority_before.stdout | from_json).pointer }}
          revoked: >-
            {{ (_mirror_authority_after.stdout | from_json).files['revoked'] !=
               (_mirror_authority_before.stdout | from_json).files['revoked'] }}
          fence: >-
            {{ (_mirror_authority_after.stdout | from_json).files['.vpn-bootstrap-retired-before'] !=
               (_mirror_authority_before.stdout | from_json).files['.vpn-bootstrap-retired-before'] }}
          lock: >-
            {{ (_mirror_authority_after.stdout | from_json).files['.vpn-bootstrap-state.lock'] !=
               (_mirror_authority_before.stdout | from_json).files['.vpn-bootstrap-state.lock'] }}
          payload: >-
            {{ (_mirror_authority_after.stdout | from_json).files[
                 '.vpn-sub-mirror-current/sub/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'] !=
               (_mirror_authority_before.stdout | from_json).files[
                 '.vpn-sub-mirror-current/sub/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'] }}
          credential: >-
            {{ (_mirror_authority_after.stdout | from_json).files['/etc/vpn-subscription/mirror_ssh_key'] !=
               (_mirror_authority_before.stdout | from_json).files['/etc/vpn-subscription/mirror_ssh_key'] }}
          consumed: >-
            {{ (_mirror_authority_after.stdout | from_json).consumed != (_mirror_authority_before.stdout | from_json).consumed }}
      no_log: true

    - name: Report only changed retained authority categories
      ansible.builtin.debug:
        var: _mirror_authority_changed
      when: _mirror_authority_after.stdout != _mirror_authority_before.stdout

    - name: Retired mirror preserves accepted payload and replay authority
      ansible.builtin.assert:
        that: _mirror_authority_after.stdout == _mirror_authority_before.stdout
      no_log: true

    - name: Remove only the retired fixture timer definition before masking
      ansible.builtin.file:
        path: /etc/systemd/system/vpn-sub-mirror.timer
        state: absent

    - name: Establish an administrative mask on the retired fixture timer
      ansible.builtin.systemd_service:
        name: vpn-sub-mirror.timer
        masked: true
        daemon_reload: true

    - name: Retire an administratively masked mirror without unmasking it
      ansible.builtin.include_role:
        name: subscription-host
        tasks_from: mirror-disable

    - name: Inspect preserved mirror administrative mask
      ansible.builtin.stat:
        path: /etc/systemd/system/vpn-sub-mirror.timer
        follow: false
      register: _mirror_preserved_mask

    - name: Mirror retirement retains the exact administrative mask
      ansible.builtin.assert:
        that:
          - _mirror_preserved_mask.stat.islnk
          - _mirror_preserved_mask.stat.lnk_source == '/dev/null'
