---
- name: Verify subscription-host role
  hosts: all
  become: true
  tasks:
    - name: nginx -t
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Site is enabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/vpn-sub.conf
      register: site
      failed_when: not site.stat.exists or not site.stat.islnk

    - name: rate-limit zone defined
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'limit_req_zone .* zone=vpn_sub_per_ip' /etc/nginx/conf.d/vpn-sub-ratelimit.conf
        executable: /bin/bash
      changed_when: false

    - name: Subscription payload directory exists with safe perms
      ansible.builtin.stat:
        path: /var/lib/vpn-subscription
      register: payload_dir
      failed_when: payload_dir.stat.mode != "0700"

    # State-level: prove the role left the host in a serving state, not
    # merely that the config files were rendered.
    - name: vpn-bootstrap.service is active
      ansible.builtin.command:
        cmd: systemctl is-active vpn-bootstrap.service
      register: bootstrap_active
      changed_when: false
      failed_when: bootstrap_active.stdout != "active"

    - name: nginx.service is active
      ansible.builtin.command:
        cmd: systemctl is-active nginx.service
      register: nginx_active
      changed_when: false
      failed_when: nginx_active.stdout != "active"

    - name: vpn-bootstrap binds 127.0.0.1:8445 (loopback only)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lntp '( sport = :8445 )' | grep -q '127.0.0.1:8445'
        executable: /bin/bash
      changed_when: false

    - name: nginx binds the subscription port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lntp '( sport = :8444 )' | grep -q ':8444'
        executable: /bin/bash
      changed_when: false

    - name: revoked-hashes file contains the seeded revoked entry
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'deadbeefdeadbeefdeadbeef' /var/lib/vpn-subscription/revoked
        executable: /bin/bash
      changed_when: false

    - name: vpn-bootstrap.service journal has no fatal entries
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ! journalctl -u vpn-bootstrap.service --since "5 minutes ago" \
            --no-pager --output=cat \
            | grep -iE 'traceback|fatal|critical'
        executable: /bin/bash
      changed_when: false

    # -----------------------------------------------------------------
    # Continuous payload mirror (subscription.mirror.enabled: true).
    # -----------------------------------------------------------------
    - name: vpn-sub-mirror.timer is enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled vpn-sub-mirror.timer
      register: mirror_timer_enabled
      changed_when: false
      failed_when: mirror_timer_enabled.stdout != "enabled"

    - name: vpn-sub-mirror.timer is active
      ansible.builtin.command:
        cmd: systemctl is-active vpn-sub-mirror.timer
      register: mirror_timer_active
      changed_when: false
      failed_when: mirror_timer_active.stdout != "active"

    - name: Trigger one mirror pull (oneshot) so payload lands on disk
      ansible.builtin.command:
        cmd: systemctl start vpn-sub-mirror.service
      changed_when: false

    - name: Wait for the oneshot to settle
      ansible.builtin.command:
        cmd: systemctl is-active vpn-sub-mirror.service
      register: mirror_oneshot
      changed_when: false
      # oneshot reports "inactive" after a successful run; "failed" is the
      # error case we want to catch.
      failed_when: mirror_oneshot.stdout == "failed"

    - name: Mirror produced the sub payload under subscription_dir
      ansible.builtin.stat:
        path: "/var/lib/vpn-subscription/sub/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      register: mirrored_payload
      failed_when: not mirrored_payload.stat.exists

    - name: Mirrored payload has 0600 perms owned by vpn-bootstrap
      ansible.builtin.assert:
        that:
          - mirrored_payload.stat.mode == "0600"
          - mirrored_payload.stat.pw_name == "vpn-bootstrap"
          - mirrored_payload.stat.gr_name == "vpn-bootstrap"
        fail_msg: >-
          mirrored payload perms/ownership wrong:
          mode={{ mirrored_payload.stat.mode }}
          owner={{ mirrored_payload.stat.pw_name }}:{{ mirrored_payload.stat.gr_name }}

    - name: Malicious source symlink did not land in the payload tree
      ansible.builtin.stat:
        path: /var/lib/vpn-subscription/sub/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      register: malicious_mirrored_payload
      failed_when: malicious_mirrored_payload.stat.exists

    - name: Revocation state survives the --delete pull
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'deadbeefdeadbeefdeadbeef' /var/lib/vpn-subscription/revoked
        executable: /bin/bash
      changed_when: false

    - name: Mirror ssh credential survives the --delete pull (lives outside DEST)
      ansible.builtin.stat:
        path: /etc/vpn-subscription/mirror_ssh_key
      register: mirror_ssh_key
      failed_when: >-
        not mirror_ssh_key.stat.exists
        or mirror_ssh_key.stat.mode != "0600"

    - name: Mirror known-hosts pin is private and outside the payload tree
      ansible.builtin.stat:
        path: /etc/vpn-subscription/mirror_known_hosts
      register: mirror_known_hosts
      failed_when: >-
        not mirror_known_hosts.stat.exists
        or not mirror_known_hosts.stat.isreg
        or mirror_known_hosts.stat.mode != "0600"
        or mirror_known_hosts.stat.pw_name != "vpn-bootstrap"
        or mirror_known_hosts.stat.gr_name != "vpn-bootstrap"

    - name: Mirror script enforces the managed host identity
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q -- '-o StrictHostKeyChecking=yes' /usr/local/bin/vpn-sub-mirror.sh
          grep -q -- '-o UserKnownHostsFile=${SSH_KNOWN_HOSTS}' /usr/local/bin/vpn-sub-mirror.sh
          grep -q -- '-o GlobalKnownHostsFile=/dev/null' /usr/local/bin/vpn-sub-mirror.sh
          grep -q -- '-o BatchMode=yes' /usr/local/bin/vpn-sub-mirror.sh
          grep -q -- '--no-links --no-devices --no-specials --exclude=/revoked' /usr/local/bin/vpn-sub-mirror.sh
          ! grep -q -- 'accept-new' /usr/local/bin/vpn-sub-mirror.sh
        executable: /bin/bash
      changed_when: false

    - name: Initialize missing host pin rejection result
      ansible.builtin.set_fact:
        mirror_missing_pin_rejected: false

    - name: Exercise missing mirror host pin rejection
      block:
        - name: Re-run mirror tasks without a trusted host pin
          ansible.builtin.include_role:
            name: subscription-host
            tasks_from: mirror
          vars:
            subscription:
              mirror:
                enabled: true
                backend: rsync
                source: "/var/lib/vpn-subscription-mirror-src/"
                known_hosts: ""
        - name: Fail when missing mirror host pin was accepted
          ansible.builtin.fail:
            msg: missing mirror host pin unexpectedly succeeded
      rescue:
        - name: Record missing mirror host pin rejection
          ansible.builtin.set_fact:
            mirror_missing_pin_rejected: true
            mirror_missing_pin_failed_task: "{{ ansible_failed_task.name }}"
            mirror_missing_pin_failure_message: "{{ ansible_failed_result.msg }}"

    - name: Missing host pin fails at preflight before side effects
      ansible.builtin.assert:
        that:
          - mirror_missing_pin_rejected
          - mirror_missing_pin_failed_task == 'Validate mirror configuration before making host changes'
          - "'trusted known_hosts pin' in mirror_missing_pin_failure_message"

    - name: vpn-sub-mirror.service journal has no fatal entries
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ! journalctl -u vpn-sub-mirror.service --since "5 minutes ago" \
            --no-pager --output=cat \
            | grep -iE 'traceback|fatal|critical'
        executable: /bin/bash
      changed_when: false
