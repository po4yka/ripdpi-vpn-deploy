---
- name: Verify subscription-host role
  hosts: all
  become: true
  tasks:
    - name: nginx -t
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Site is enabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/vpn-sub.conf
      register: site
      failed_when: not site.stat.exists or not site.stat.islnk

    - name: rate-limit zone defined
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'limit_req_zone .* zone=vpn_sub_per_ip' /etc/nginx/conf.d/vpn-sub-ratelimit.conf
        executable: /bin/bash
      changed_when: false

    - name: Subscription payload directory exists with safe perms
      ansible.builtin.stat:
        path: /var/lib/vpn-subscription
      register: payload_dir
      failed_when: payload_dir.stat.mode != "0700"

    # State-level: prove the role left the host in a serving state, not
    # merely that the config files were rendered.
    - name: vpn-bootstrap.service is active
      ansible.builtin.command:
        cmd: systemctl is-active vpn-bootstrap.service
      register: bootstrap_active
      changed_when: false
      failed_when: bootstrap_active.stdout != "active"

    - name: nginx.service is active
      ansible.builtin.command:
        cmd: systemctl is-active nginx.service
      register: nginx_active
      changed_when: false
      failed_when: nginx_active.stdout != "active"

    - name: vpn-bootstrap binds 127.0.0.1:8445 (loopback only)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lntp '( sport = :8445 )' | grep -q '127.0.0.1:8445'
        executable: /bin/bash
      changed_when: false

    - name: nginx binds the subscription port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -lntp '( sport = :8444 )' | grep -q ':8444'
        executable: /bin/bash
      changed_when: false

    - name: revoked-hashes file contains the seeded revoked entry
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'deadbeefdeadbeefdeadbeef' /var/lib/vpn-subscription/revoked
        executable: /bin/bash
      changed_when: false

    - name: vpn-bootstrap.service journal has no fatal entries
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ! journalctl -u vpn-bootstrap.service --since "5 minutes ago" \
            --no-pager --output=cat \
            | grep -iE 'traceback|fatal|critical'
        executable: /bin/bash
      changed_when: false

    # -----------------------------------------------------------------
    # Continuous payload mirror (subscription.mirror.enabled: true).
    # -----------------------------------------------------------------
    - name: vpn-sub-mirror.timer is enabled
      ansible.builtin.command:
        cmd: systemctl is-enabled vpn-sub-mirror.timer
      register: mirror_timer_enabled
      changed_when: false
      failed_when: mirror_timer_enabled.stdout != "enabled"

    - name: vpn-sub-mirror.timer is active
      ansible.builtin.command:
        cmd: systemctl is-active vpn-sub-mirror.timer
      register: mirror_timer_active
      changed_when: false
      failed_when: mirror_timer_active.stdout != "active"

    - name: Trigger one mirror pull (oneshot) so payload lands on disk
      ansible.builtin.command:
        cmd: systemctl start vpn-sub-mirror.service
      changed_when: false

    - name: Wait for the oneshot to settle
      ansible.builtin.command:
        cmd: systemctl is-active vpn-sub-mirror.service
      register: mirror_oneshot
      changed_when: false
      # oneshot reports "inactive" after a successful run; "failed" is the
      # error case we want to catch.
      failed_when: mirror_oneshot.stdout == "failed"

    - name: Mirror produced the sub payload under subscription_dir
      ansible.builtin.stat:
        path: "/var/lib/vpn-subscription/sub/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      register: mirrored_payload
      failed_when: not mirrored_payload.stat.exists

    - name: Mirrored payload has 0600 perms owned by vpn-bootstrap
      ansible.builtin.assert:
        that:
          - mirrored_payload.stat.mode == "0600"
          - mirrored_payload.stat.pw_name == "vpn-bootstrap"
          - mirrored_payload.stat.gr_name == "vpn-bootstrap"
        fail_msg: >-
          mirrored payload perms/ownership wrong:
          mode={{ mirrored_payload.stat.mode }}
          owner={{ mirrored_payload.stat.pw_name }}:{{ mirrored_payload.stat.gr_name }}

    - name: Mirror ssh credential survives the --delete pull (lives outside DEST)
      ansible.builtin.stat:
        path: /etc/vpn-subscription/mirror_ssh_key
      register: mirror_ssh_key
      failed_when: >-
        not mirror_ssh_key.stat.exists
        or mirror_ssh_key.stat.mode != "0600"

    - name: vpn-sub-mirror.service journal has no fatal entries
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ! journalctl -u vpn-sub-mirror.service --since "5 minutes ago" \
            --no-pager --output=cat \
            | grep -iE 'traceback|fatal|critical'
        executable: /bin/bash
      changed_when: false
