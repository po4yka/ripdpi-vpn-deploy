---
# Retire the field-report ingest. Aggregates are not retained.
- name: Inspect field-report ingest unit
  ansible.builtin.stat:
    path: /etc/systemd/system/vpn-field-report.service
  register: _subscription_field_report_unit_file

- name: Inspect field-report ingest socket
  ansible.builtin.stat:
    path: /etc/systemd/system/vpn-field-report.socket
  register: _subscription_field_report_socket_file

- name: Stop and disable field-report ingest
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: false
    state: stopped
  loop:
    - {name: vpn-field-report.service, present: "{{ _subscription_field_report_unit_file.stat.exists }}"}
    - {name: vpn-field-report.socket, present: "{{ _subscription_field_report_socket_file.stat.exists }}"}
  loop_control:
    label: "{{ item.name }}"
  when: item.present | bool

- name: Find which field-report ingest files exist
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/present-paths.yml"
  vars:
    owned_paths:
      - /etc/systemd/system/vpn-field-report.service
      - /etc/systemd/system/vpn-field-report.socket
      - /etc/vpn-field-report
      - /usr/local/lib/vpn-field-report
      - /var/lib/vpn-field-report
      - "{{ (monitoring | default({})).node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}/vpn_field_report.prom"

- name: Remove field-report ingest files and aggregate textfile
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ owned_present_paths }}"
  register: _subscription_field_report_removed

- name: Reload systemd after field-report ingest retirement
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode and _subscription_field_report_removed.changed
