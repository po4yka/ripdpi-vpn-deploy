---
# Anonymous client field-report ingest. Reports are aggregated and discarded;
# the cohort tokens come from the SOPS key field_report.
- name: Require bounded field-report ingest settings and cohort tokens
  ansible.builtin.assert:
    that:
      - subscription_field_report.path is match('^/[a-z0-9/_-]{1,64}\Z')
      - subscription_field_report.max_body_bytes | int is ge(1024)
      - subscription_field_report.max_body_bytes | int is le(1048576)
      - subscription_field_report.min_attempts | int is ge(5)
      - subscription_field_report.max_attempts_per_report | int is ge(subscription_field_report.min_attempts | int)
      - subscription_field_report.max_attempts_per_report | int is le(1000000)
      - subscription_field_report.top_n_min_reports | int is ge(2)
      - subscription_field_report.top_n_min_reports | int is le(1000)
      - subscription_field_report.asn_top_n | int is ge(1)
      - subscription_field_report.asn_top_n | int is le(50)
      - subscription_field_report.operator_top_n | int is ge(1)
      - subscription_field_report.operator_top_n | int is le(50)
      - subscription_field_report.country_top_n | int is ge(1)
      - subscription_field_report.country_top_n | int is le(50)
      - subscription_field_report.window_seconds | int is ge(300)
      - subscription_field_report.max_series | int is ge(50)
      - subscription_field_report.max_series | int is le(1000)
      - subscription_field_report.server_refs | length <= 64
      - subscription_field_report.server_refs | reject('match', '^[A-Za-z0-9_-]{1,64}\Z') | list | length == 0
      - field_report is mapping
      - field_report.cohort_token | default('') is match('^[A-Za-z0-9_-]{22,64}\Z')
      # The example value fits the token grammar but is public; issue one with rotate-cohort-token.sh.
      - field_report.cohort_token | default('') is not match('(?i)REPLACE_WITH_')
      - >-
        field_report.previous_cohort_token | default(none) is none or
        (field_report.previous_cohort_token is match('^[A-Za-z0-9_-]{22,64}\Z') and
         field_report.previous_cohort_token_valid_until | default('') is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\Z'))
    fail_msg: Field-report ingest needs bounded limits and a well-formed field_report cohort token set in the secrets file.
    quiet: true
  no_log: true

- name: Require bounded network-hint settings and a pinned dataset
  ansible.builtin.assert:
    that:
      - subscription_field_report.network_hint.path is match('^/[a-z0-9/_-]{1,64}\\Z')
      - subscription_field_report.network_hint.path != subscription_field_report.path
      - subscription_field_report.network_hint.nginx_rate is match('^[1-9][0-9]{0,3}r/[sm]\\Z')
      - subscription_field_report.network_hint.nginx_burst | int is ge(0)
      - subscription_field_report.network_hint.nginx_burst | int is le(100)
      - subscription_field_report.network_hint.ttl_seconds | int is ge(300)
      - subscription_field_report.network_hint.ttl_seconds | int is le(86400)
      - subscription_field_report.network_hint.dataset_version is match('^[0-9]{8}T[0-9]{6}Z\\Z')
      - subscription_field_report.network_hint.dataset_sha256 is match('^[0-9a-f]{64}\\Z')
    fail_msg: The network hint needs a bounded path, rate and TTL and a pinned dataset version and SHA-256.
    quiet: true
  when: subscription_field_report.network_hint.enabled | bool

# The dataset is never fetched at deploy time: scripts/refresh-ip-asn-dataset.sh stores the reviewed copy on the
# controller, and this task refuses any other bytes before the host changes.
- name: Verify the pinned network-hint dataset on the controller
  ansible.builtin.stat:
    path: "{{ role_path }}/../../../.cache/ip-asn/ip2asn-combined-{{ subscription_field_report.network_hint.dataset_version }}.tsv.gz"
    checksum_algorithm: sha256
    get_checksum: true
  delegate_to: localhost
  become: false
  register: _subscription_network_hint_dataset
  when: subscription_field_report.network_hint.enabled | bool

- name: Require the controller dataset to match its pin
  ansible.builtin.assert:
    that:
      - _subscription_network_hint_dataset.stat.exists
      - _subscription_network_hint_dataset.stat.checksum == subscription_field_report.network_hint.dataset_sha256
    fail_msg: Run scripts/refresh-ip-asn-dataset.sh and pin its version and SHA-256, or restore the pinned file under .cache/ip-asn/.
    quiet: true
  when: subscription_field_report.network_hint.enabled | bool

- name: Ensure node_exporter textfile writer group for the shared textfile directory
  ansible.builtin.group:
    name: "{{ (monitoring | default({})).node_exporter_textfile_group | default('node_exporter_textfile') }}"
    system: true

- name: Ensure field-report ingest system user
  ansible.builtin.user:
    name: vpn-field-report
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Ensure shared node_exporter textfile directory for the field-report link
  ansible.builtin.file:
    path: "{{ (monitoring | default({})).node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}"
    state: directory
    owner: root
    group: "{{ (monitoring | default({})).node_exporter_textfile_group | default('node_exporter_textfile') }}"
    mode: "3775"

- name: Require a pinned validator package for this release
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_release'] in subscription_field_report.jsonschema_package_versions
    fail_msg: Add the python3-jsonschema version of this release to subscription_field_report.jsonschema_package_versions.
    quiet: true

- name: Install the field-report contract validator package
  ansible.builtin.apt:
    name: "python3-jsonschema={{ subscription_field_report.jsonschema_package_versions[ansible_facts['distribution_release']] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure field-report ingest directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/usr/local/lib/vpn-field-report, /etc/vpn-field-report]

- name: Install field-report ingest, shared validator and contract
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/lib/vpn-field-report/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: vpn-field-report.py, dest: vpn-field-report.py}
    - {src: "{{ role_path }}/../../../scripts/validate-field-report.py", dest: validate_field_report.py}
    - {src: "{{ role_path }}/../../../contract/client-field-report.schema.json", dest: client-field-report.schema.json}
  notify: Restart vpn-field-report

- name: Install the pinned network-hint dataset
  ansible.builtin.copy:
    src: "{{ _subscription_network_hint_dataset.stat.path }}"
    dest: /usr/local/lib/vpn-field-report/ip2asn-combined.tsv.gz
    owner: root
    group: root
    mode: "0644"
  when: subscription_field_report.network_hint.enabled | bool
  notify: Restart vpn-field-report

- name: Remove the network-hint dataset when the hint is off
  ansible.builtin.file:
    path: /usr/local/lib/vpn-field-report/ip2asn-combined.tsv.gz
    state: absent
  when: not (subscription_field_report.network_hint.enabled | bool)
  notify: Restart vpn-field-report

- name: Install field-report ingest limits
  ansible.builtin.template:
    src: vpn-field-report.json.j2
    dest: /etc/vpn-field-report/config.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart vpn-field-report

- name: Publish field-report cohort tokens as a private credential
  ansible.builtin.copy:
    content: >-
      {{ {'current': field_report.cohort_token,
          'previous': field_report.previous_cohort_token | default(none),
          'previous_valid_until': field_report.previous_cohort_token_valid_until | default(none)} | to_json }}
    dest: /etc/vpn-field-report/cohort-tokens.json
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart vpn-field-report

# The ingest listens only on this socket file, which belongs to the nginx user: a loopback TCP port
# would be open to every local process, including the transport daemons that relay client traffic.
- name: Install field-report ingest socket
  ansible.builtin.template:
    src: vpn-field-report.socket.j2
    dest: /etc/systemd/system/vpn-field-report.socket
    owner: root
    group: root
    mode: "0644"
  register: _subscription_field_report_socket
  notify:
    - Restart vpn-field-report socket
    - Restart vpn-field-report

- name: Install field-report ingest unit
  ansible.builtin.template:
    src: vpn-field-report.service.j2
    dest: /etc/systemd/system/vpn-field-report.service
    owner: root
    group: root
    mode: "0644"
  register: _subscription_field_report_unit
  notify: Restart vpn-field-report

- name: Enable + start field-report ingest
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - vpn-field-report.socket
    - vpn-field-report.service
  # A fresh check-mode host has no unit to start yet; the planned install above shows the change.
  when: not (ansible_check_mode and (_subscription_field_report_unit.changed or _subscription_field_report_socket.changed))

# The ingest writes its aggregate in its own state directory and has no write access to the shared
# textfile directory; node_exporter follows this root-owned link. force replaces the regular file
# that an earlier ingest version wrote here.
- name: Link the field-report aggregate into the node_exporter textfile directory
  ansible.builtin.file:
    src: /var/lib/vpn-field-report/vpn_field_report.prom
    dest: "{{ (monitoring | default({})).node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}/vpn_field_report.prom"
    state: link
    owner: root
    group: root
    force: true
    follow: false
