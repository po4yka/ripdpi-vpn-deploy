---
- name: Validate explicit subscription-host lifecycle selection
  ansible.builtin.assert:
    that: subscription_host_role_enabled is boolean

- name: Converge enabled subscription-host runtime
  ansible.builtin.include_tasks: enable.yml
  when: subscription_host_role_enabled

- name: Reconcile disabled subscription-host ownership
  ansible.builtin.include_tasks: disable.yml
  when: not subscription_host_role_enabled
