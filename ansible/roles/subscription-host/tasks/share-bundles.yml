---
# Ingest operator-uploaded share bundles into the nginx static tree.
# Each bundle contains the rendered recipient page (index.html, qr.png, …)
# produced by `vpnd share <client>`. nginx serves them at
# /share/<token>/ via the subscription vhost.
#
# Upload only selected bundles; harden retained shares on every convergence.

- name: Protect dedicated share ancestry
  ansible.builtin.file:
    path: /var/www/subscription-host
    state: directory
    follow: false
    owner: root
    group: www-data
    mode: "0750"

- name: Ensure share root directory
  ansible.builtin.file:
    path: /var/www/subscription-host/share
    state: directory
    follow: false
    owner: root
    group: www-data
    mode: "0750"

- name: Ensure per-token share directories
  ansible.builtin.file:
    path: "/var/www/subscription-host/share/{{ item.token }}"
    state: directory
    follow: false
    owner: root
    group: www-data
    mode: "0750"
  no_log: true
  diff: false
  loop: "{{ vpn.share_bundles | default([]) }}"
  loop_control:
    label: "{{ item.client }}"
  when: vpn.share_bundles | default([]) | length > 0

- name: Sync share bundle contents
  ansible.builtin.copy:
    src: "{{ item.local_path }}/"
    dest: "/var/www/subscription-host/share/{{ item.token }}/"
    owner: root
    group: www-data
    mode: "0640"
    directory_mode: "0750"
    force: true
  no_log: true
  diff: false
  loop: "{{ vpn.share_bundles | default([]) }}"
  loop_control:
    label: "{{ item.client }}"
  when: vpn.share_bundles | default([]) | length > 0
  notify: Reload nginx

- name: Repair retained share tree permissions
  ansible.builtin.file:
    path: /var/www/subscription-host/share
    state: directory
    follow: false
    recurse: true
    owner: root
    group: www-data
    mode: u=rwX,g=rX,o=
  no_log: true
  diff: false
