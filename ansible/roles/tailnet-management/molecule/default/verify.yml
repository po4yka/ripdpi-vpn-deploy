---
- name: Verify Tailnet management role
  hosts: all
  become: true
  vars:
    vpn_service_address: 192.0.2.10
    ansible_port: 22
    tailnet_management:
      approved_sources:
        - 100.64.10.20
        - fd7a:115c:a1e0::1234
  tasks:
    - name: Verify complete OpenSSH policy without the volatile daemon runtime
      ansible.builtin.command:
        argv:
          - unshare
          - --mount
          - --propagation
          - private
          - /usr/bin/python3
          - -c
          - |
            import os
            import pathlib
            import shutil
            import subprocess
            import sys
            import tempfile
            import types

            sys.path.insert(0, '/usr/local/lib/vpn-tailnet')
            import tailnet_management as controller

            paths = types.SimpleNamespace(sshd=shutil.which('sshd'))
            baseline = controller._sshd_policy(paths, controller._run)
            subprocess.run(['mount', '-t', 'tmpfs', '-o', 'mode=0755', 'tmpfs', '/run'], check=True)
            assert not pathlib.Path('/run/sshd').exists()
            cold_test = subprocess.run([paths.sshd, '-T'], capture_output=True, text=True)
            assert cold_test.returncode == 255
            assert 'Missing privilege separation directory: /run/sshd' in cold_test.stderr
            cold_policy = controller._sshd_policy(paths, controller._run)
            assert cold_policy == baseline
            os.mkdir('/run/sshd', 0o755)
            warm_test = controller._run([paths.sshd, '-T'], timeout=30)
            assert cold_policy == controller._sshd_policy(paths, lambda argv, **kwargs: warm_test)
            with tempfile.NamedTemporaryFile(mode='w') as invalid:
                invalid.write('Port invalid\n')
                invalid.flush()
                try:
                    controller._run([paths.sshd, '-G', '-f', invalid.name], timeout=30)
                except controller.Refusal:
                    pass
                else:
                    raise AssertionError('Invalid OpenSSH configuration was accepted')
      changed_when: false

    - name: Verify the complete recovery and SSH boot dependency graph
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - --man=no
          - vpn-tailnet-firewall-recover.service
          - vpn-tailnet-recover.service
          - vpn-tailnet-recover.timer
          - tailscaled.service
          - ssh.socket
          - ssh.service
          - basic.target
          - sockets.target
          - multi-user.target
          - network-pre.target
          - nftables.service
      register: _tailnet_boot_graph
      changed_when: false
      failed_when: >-
        _tailnet_boot_graph.rc != 0 or
        (_tailnet_boot_graph.stdout | trim | length) != 0 or
        (_tailnet_boot_graph.stderr | trim | length) != 0

    - name: Read fixture enrollment calls
      ansible.builtin.slurp:
        src: /var/lib/tailscale-fixture-calls
      register: _tailnet_fixture_calls

    - name: Verify exact privacy and preference flags
      ansible.builtin.assert:
        that:
          - "'tskey-auth-molecule-fixture' not in (_tailnet_fixture_calls.content | b64decode)"
          - "'--accept-dns=false' in (_tailnet_fixture_calls.content | b64decode)"
          - "'--accept-routes=false' in (_tailnet_fixture_calls.content | b64decode)"
          - "'--netfilter-mode=off' in (_tailnet_fixture_calls.content | b64decode)"
          - "'--shields-up=false' in (_tailnet_fixture_calls.content | b64decode)"
          - "'--ssh=false' in (_tailnet_fixture_calls.content | b64decode)"

    - name: Find leaked enrollment credential files
      ansible.builtin.find:
        paths: /run
        patterns: vpn-tailnet-auth-*
        file_type: file
      register: _tailnet_auth_residue

    - name: Enrollment capability was removed
      ansible.builtin.assert:
        that:
          - _tailnet_auth_residue.matched == 0

    - name: Controller repeat is unchanged without an enrollment credential
      ansible.builtin.command:
        cmd: /usr/bin/python3 /usr/local/lib/vpn-tailnet/tailnet-check.py
        stdin: >-
          {{ {'inventory_alias': inventory_hostname,
              'public_address': vpn_service_address,
              'ssh_port': ansible_port | int,
              'approved_sources': tailnet_management.approved_sources} | to_json }}
      register: _tailnet_repeat
      changed_when: false

    - name: Repeat reports the existing exact configuration
      ansible.builtin.assert:
        that:
          - (_tailnet_repeat.stdout | from_json).status == 'configured'
          - not ((_tailnet_repeat.stdout | from_json).changed | bool)
