---
# Ordinary deployment can verify access, but never enroll or install Tailnet.
- name: Reject enrollment capabilities on ordinary deployment
  ansible.builtin.assert:
    that:
      - lookup('env', 'TAILSCALE_AUTH_KEY') == ''
    fail_msg: First enrollment must use the explicit bootstrap-tailnet command.
  no_log: true

- name: Verify existing ordinary OpenSSH Tailnet access
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/lib/vpn-tailnet/tailnet-check.py
  environment:
    PATH: /usr/sbin:/usr/bin:/sbin:/bin
  check_mode: false
  changed_when: false
  register: _tailnet_verified
  failed_when: >-
    _tailnet_verified.rc != 0 or
    (_tailnet_verified.stdout | from_json).status != 'configured'
  no_log: true
