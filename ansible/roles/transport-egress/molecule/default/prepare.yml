---
- name: Prepare controlled public recipient and frontend files
  hosts: all
  become: true
  tasks:
    - name: Inspect owned fixture run mount propagation
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - PROPAGATION
          - -T
          - /run
      register: fixture_run_propagation
      changed_when: false
    - name: Bind owned fixture run mount before credential namespace propagation
      ansible.builtin.command:
        argv:
          - mount
          - --bind
          - /run
          - /run
      changed_when: true
      when: '''shared'' not in fixture_run_propagation.stdout'
    - name: Enable genuine credential mount propagation in the owned fixture
      ansible.builtin.command:
        argv:
          - mount
          - --make-rshared
          - /run
      changed_when: true
      when: '''shared'' not in fixture_run_propagation.stdout'
    - name: Install private non-secret credential primitive source
      ansible.builtin.copy:
        dest: /run/molecule-credential-source
        content: owned-fixture-source
        owner: root
        group: root
        mode: '0600'
    - name: Install real credential primitive verifier
      ansible.builtin.copy:
        dest: /usr/local/libexec/molecule-credential-probe.py
        owner: root
        group: root
        mode: '0755'
        content: |
          import os, pathlib, stat
          path = pathlib.Path(os.environ['CREDENTIALS_DIRECTORY']) / 'probe'
          info = path.stat()
          assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1
          assert info.st_uid == 0 and info.st_mode & 0o077 == 0
          assert path.read_text() == 'owned-fixture-source'
          print('molecule-credential-ready', flush=True)
    - name: Install genuine credential-bearing test unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/molecule-credential-probe.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Type=oneshot
          User=root
          LoadCredential=probe:/run/molecule-credential-source
          ExecStart=/usr/bin/python3 /usr/local/libexec/molecule-credential-probe.py
    - name: Require actual credential delivery before dependent native services
      ansible.builtin.systemd_service:
        name: molecule-credential-probe.service
        daemon_reload: true
        state: started
    - name: Install genuine native network tooling
      ansible.builtin.apt:
        name:
          - iproute2
          - nftables
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Add owned admissible documentation recipient address
      ansible.builtin.command:
        argv:
          - ip
          - address
          - replace
          - 192.0.2.80/32
          - dev
          - lo
      changed_when: true
    - name: Create frontend configuration directory
      ansible.builtin.file:
        path: /etc/xray
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Install owned TCP and UDP echo receiver
      ansible.builtin.copy:
        dest: /usr/local/libexec/molecule-egress-peer.py
        mode: '0755'
        content: |
          import socket, threading
          def run(udp):
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM if udp else socket.SOCK_STREAM)
              s.bind(('192.0.2.80',9000))
              if udp:
                  while True:
                      payload,peer=s.recvfrom(65535);s.sendto(payload,peer)
              else:
                  s.listen()
                  while True:
                      c,_=s.accept()
                      def echo(c=c):
                          with c:
                              while True:
                                  payload=c.recv(65535)
                                  if not payload:return
                                  c.sendall(payload)
                      threading.Thread(target=echo,daemon=True).start()
          threading.Thread(target=run,args=(True,),daemon=True).start()
          run(False)
    - name: Install isolated recipient peer unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/molecule-egress-peer.service
        mode: '0644'
        content: |
          [Unit]
          Description=Owned molecule recipient peer
          [Service]
          ExecStart=/usr/bin/python3 /usr/local/libexec/molecule-egress-peer.py
    - name: Start controlled recipient peer
      ansible.builtin.systemd_service:
        name: molecule-egress-peer.service
        daemon_reload: true
        state: started

    - name: Create private snapshot state for the first guarded migration proof
      ansible.builtin.file:
        path: /var/lib/ripdpi/transport-egress
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Install an actual enabled legacy frontend unit with no guarded receipt
      ansible.builtin.copy:
        dest: /etc/systemd/system/xray.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Type=simple
          ExecStart=/usr/bin/sleep infinity
          [Install]
          WantedBy=multi-user.target
    - name: Start the real unguarded legacy fixture before migration admission
      ansible.builtin.systemd_service:
        name: xray.service
        daemon_reload: true
        enabled: true
        state: started
    - name: Begin the exact production first guarded transaction
      ansible.builtin.include_role:
        name: transport-egress
        tasks_from: begin
    - name: Inspect actual legacy process and boot authority before candidate publication
      ansible.builtin.command:
        argv: [systemctl, show, xray.service, '--property=ActiveState,MainPID,UnitFileState']
      register: legacy_stopped
      changed_when: false
    - name: Require definitive legacy stop and boot disable before publication
      ansible.builtin.assert:
        that:
          - "'ActiveState=inactive' in legacy_stopped.stdout_lines"
          - "'MainPID=0' in legacy_stopped.stdout_lines"
          - "'UnitFileState=disabled' in legacy_stopped.stdout_lines"
    - name: Exercise first-upgrade rollback without inventing accepted authority
      ansible.builtin.include_role:
        name: transport-egress
        tasks_from: rollback
    - name: Inspect restored unaccepted legacy authority after failure
      ansible.builtin.command:
        argv: [systemctl, show, xray.service, '--property=ActiveState,MainPID,UnitFileState']
      register: legacy_restored
      changed_when: false
    - name: Require rejected migration cannot restore live or boot-enabled bypass
      ansible.builtin.assert:
        that:
          - "'ActiveState=inactive' in legacy_restored.stdout_lines"
          - "'MainPID=0' in legacy_restored.stdout_lines"
          - "'UnitFileState=disabled' in legacy_restored.stdout_lines"
