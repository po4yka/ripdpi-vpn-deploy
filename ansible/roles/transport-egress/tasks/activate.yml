---
- name: Activate only a ready guarded generation after frontend staging
  when: not ansible_check_mode
  block:
    - name: Activate or retain the owned controller
      ansible.builtin.systemd_service:
        name: ripdpi-transport-generation.service
        daemon_reload: true
        enabled: true
        state: '{{ ''restarted'' if transport_egress_changed | default(false) | bool else ''started'' }}'
    - name: Require current authenticated generation and owned frontend readiness
      ansible.builtin.command:
        argv:
          - python3
          - -Es
          - '{{ transport_egress_libexec_dir }}/generation.py'
          - status
          - --config
          - '{{ transport_egress_config_dir }}/generation.json'
          - --normalizer-config
          - '{{ transport_egress_config_dir }}/normalizer.json'
      register: _transport_egress_readiness
      until: _transport_egress_readiness.rc == 0
      retries: '{{ transport_egress_control_timeout_seconds }}'
      delay: 1
      changed_when: false
      no_log: true
    - name: Close the accepted candidate transaction
      ansible.builtin.set_fact:
        _transport_egress_transaction_started: false
  rescue:
    - name: Restore the previous complete guarded route
      ansible.builtin.include_tasks: rollback.yml
    - name: Report candidate activation failure after bounded recovery
      ansible.builtin.fail:
        msg: Guarded transport candidate failed readiness; accepted route recovery was attempted.
