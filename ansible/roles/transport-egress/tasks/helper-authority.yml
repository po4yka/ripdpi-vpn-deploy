---
- name: Admit exact root-owned helper and journal ancestry before writes or helper execution
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -Es
      - -c
      - |
        import os, pathlib, stat
        roots = [pathlib.Path('/var/lib/ripdpi'),
                 pathlib.Path('/usr/local/libexec/ripdpi-transport-egress')]
        for root in roots:
            for path in [*reversed(root.parents), root]:
                try:
                    info = path.lstat()
                except FileNotFoundError:
                    continue
                if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                    raise SystemExit('consumer-helper-authority-refused')
        helper_names = ('transport_runtime_transaction.py', 'transport_runtime_accept.py',
                        'transport_runtime_probe.py', 'transport_runtime_validate.py',
                        'transport_runtime_outer.py', 'transport_runtime_rollback.py',
                        'transport_semantics.py')
        for name in helper_names:
            path = roots[1] / name
            try:
                info = path.lstat()
            except FileNotFoundError:
                continue
            if not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_nlink != 1 or info.st_mode & 0o022:
                raise SystemExit('consumer-helper-authority-refused')
  changed_when: false
  check_mode: false
