---
- name: Inspect rollback unit authority before stopping candidate services
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - '{{ lookup(''ansible.builtin.file'', role_path ~ ''/files/ownership.py'') }}'
      - stop-units
  register: _transport_egress_rollback_owned
  changed_when: false
  no_log: true
- name: Stop candidate controller before restoring any credential file
  ansible.builtin.systemd_service:
    name: ripdpi-transport-generation.service
    state: stopped
  when: '''ripdpi-transport-generation.service'' in (_transport_egress_rollback_owned.stdout | from_json).units'
- name: Stop remaining candidate generation processes before restore
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: stopped
  loop: '{{ (_transport_egress_rollback_owned.stdout | from_json).units }}'
  when: item != 'ripdpi-transport-generation.service'
