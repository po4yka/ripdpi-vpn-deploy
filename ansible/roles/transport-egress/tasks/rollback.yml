---
- name: Restore the complete accepted guarded route after a candidate failure
  when:
    - not ansible_check_mode
    - _transport_egress_transaction_started | default(false) | bool
  block:
    - name: Quiesce owned candidate processes before restoring accepted authority
      ansible.builtin.include_tasks: quiesce.yml
    - name: Restore committed consumer inodes before the outer route snapshot
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -Es
          - '{{ transport_egress_libexec_dir }}/transport_runtime_outer.py'
          - restore
      no_log: true
      diff: false
      changed_when: true
    - name: Inspect prior accepted generation before removing candidate vendor isolation
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - '{{ lookup(''ansible.builtin.file'', role_path ~ ''/files/snapshot.py'') }}'
          - inspect
      register: _transport_egress_rollback_previous
      changed_when: false
      no_log: true
    - name: Stop unaccepted legacy frontends before restoring any unsafe configuration
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: stopped
        enabled: false
      loop: '{{ (_transport_egress_rollback_previous.stdout | from_json).units }}'
      when:
        - not (_transport_egress_rollback_previous.stdout | from_json).accepted
        - item in ['xray.service', 'hysteria-server.service']
    - name: Retire owned candidate WARP before removing its isolation files
      ansible.builtin.include_role:
        name: warp-outbound
        tasks_from: retire
      when: "'ripdpi-transport-warp.service' not in (_transport_egress_rollback_previous.stdout | from_json).units"
    - name: Restore accepted files including policy and frontend credentials
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - '{{ lookup(''ansible.builtin.file'', role_path ~ ''/files/snapshot.py'') }}'
          - restore
      changed_when: true
      no_log: true
    - name: Reload restored units before kernel and runtime recovery
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Keep restored unaccepted frontend units stopped and boot-disabled
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: stopped
        enabled: false
      loop: '{{ (_transport_egress_rollback_previous.stdout | from_json).units }}'
      when:
        - not (_transport_egress_rollback_previous.stdout | from_json).accepted
        - item in ['xray.service', 'hysteria-server.service']
    - name: Recreate only previously claimed accepted WARP namespace before policy restore
      ansible.builtin.command:
        argv: [python3, -Es, /usr/local/libexec/ripdpi-warp/namespace.py, prepare]
      changed_when: true
      no_log: true
      when:
        - (_transport_egress_rollback_previous.stdout | from_json).accepted
        - "'ripdpi-transport-warp.service' in (_transport_egress_rollback_previous.stdout | from_json).units"
    - name: Seal restored WARP recipient egress before vendor tunnel recovery
      ansible.builtin.command:
        argv: [python3, -Es, /usr/local/libexec/ripdpi-warp/namespace.py, guard]
      register: _transport_egress_rollback_guard
      changed_when: (_transport_egress_rollback_guard.stdout | from_json).changed | bool
      no_log: true
      when:
        - (_transport_egress_rollback_previous.stdout | from_json).accepted
        - "'ripdpi-transport-warp.service' in (_transport_egress_rollback_previous.stdout | from_json).units"
    - name: Reapply and verify accepted host policy before restart
      ansible.builtin.command:
        argv:
          - '{{ transport_egress_policy_loader }}'
          - '{{ item }}'
          - --config
          - '{{ transport_egress_policy_config }}'
      loop:
        - apply
        - verify
      changed_when: item == 'apply'
      no_log: true
      when: (_transport_egress_rollback_previous.stdout | from_json).accepted
    - name: Restore the accepted isolated retained-registration vendor route
      ansible.builtin.include_role:
        name: warp-outbound
        tasks_from: activate
      when:
        - (_transport_egress_rollback_previous.stdout | from_json).accepted
        - "'ripdpi-transport-warp.service' in (_transport_egress_rollback_previous.stdout | from_json).units"
    - name: Complete consumer compensation with authenticated native rollback traffic
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -Es
          - '{{ transport_egress_libexec_dir }}/transport_runtime_outer.py'
          - recover
      register: _transport_runtime_compensation
      failed_when: false
      no_log: true
      diff: false
      changed_when: true
    - name: Require actual accepted generation readiness after rollback
      ansible.builtin.fail:
        msg: >-
          {{ (_transport_runtime_compensation.stderr | default('') |
               regex_findall('transport-runtime-(?:refused:[a-z][a-z0-9-]{0,96}|frame:[A-Za-z_][A-Za-z_0-9]*:[0-9]{1,6})'))[:9] }}
      when: _transport_runtime_compensation.rc != 0
    - name: Finish the failed candidate transaction after accepted restoration
      ansible.builtin.set_fact:
        _transport_egress_transaction_started: false
