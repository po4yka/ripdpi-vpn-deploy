---
- name: Predict missing transport authority without manufacturing identities
  ansible.builtin.debug:
    msg: Complete runtime and native readiness remain unverified until ordinary convergence.
  changed_when: true
  when: transport_egress_fresh_check_mode | default(false) | bool

- name: Require an owned authenticated transport canary before selection
  ansible.builtin.assert:
    that:
      - transport_runtime_probe_url | length > 0
    fail_msg: Configure the owned canary through watchdog_secrets.reality_probe_url before transport acceptance.
  when:
    - not ansible_check_mode
    - not (_transport_runtime_retire_all | default(false) | bool)
    - transport_runtime_candidates | default([]) | length > 0

- name: Publish complete transport candidates only through bounded native acceptance
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -Es
      - -c
      - |-
        import hashlib, io, json, sys, types
        bindings = {
            'transport_semantics': ({{ (transport_egress_libexec_dir ~ '/transport_semantics.py') | to_json }},
                {{ lookup('ansible.builtin.file',
                    role_path ~ '/../../../scripts/transport_semantics.py', rstrip=False) | hash('sha256') | to_json }}),
        {% for helper in ['transport_runtime_transaction', 'transport_runtime_probe',
                          'transport_runtime_validate', 'transport_runtime_accept'] %}
            {{ helper | to_json }}: ({{ (transport_egress_libexec_dir ~ '/' ~ helper ~ '.py') | to_json }},
                {{ lookup('ansible.builtin.file',
                    role_path ~ '/../runtime-release/files/' ~ helper ~ '.py', rstrip=False) | hash('sha256') | to_json }}),
        {% endfor %}
        }
        try:
            raw = sys.stdin.buffer.read(37748737)
            if len(raw) > 37748736:
                raise ValueError()
            envelope = json.loads(raw)
            if (not isinstance(envelope, dict) or set(envelope) != {'sources', 'request'}
                    or not isinstance(envelope['sources'], dict) or set(envelope['sources']) != set(bindings)):
                raise ValueError()
            for name, (path, digest) in bindings.items():
                source = envelope['sources'][name]
                if (not isinstance(source, str) or len(source.encode()) > 262144
                        or hashlib.sha256(source.encode()).hexdigest() != digest):
                    raise ValueError()
            for name, (path, digest) in bindings.items():
                module = types.ModuleType(name)
                module.__file__ = path
                sys.modules[name] = module
                exec(compile(envelope['sources'][name], path, 'exec'), module.__dict__)
            sys.stdin = io.TextIOWrapper(io.BytesIO(json.dumps(envelope['request']).encode()), encoding='utf-8')
            sys.modules['transport_runtime_accept'].main()
        except Exception as error:
            import re, traceback
            known = tuple(getattr(sys.modules[name], attribute)
                          for name, attribute in [('transport_runtime_transaction', 'Refusal'),
                                                  ('transport_runtime_probe', 'ProbeRefused')]
                          if name in sys.modules and hasattr(sys.modules[name], attribute))
            cause = error
            for _index in range(4):
                if cause is None:
                    break
                category = str(cause) if isinstance(cause, known) else 'validation-refused'
                if not re.fullmatch('[a-z][a-z0-9-]{0,96}', category):
                    category = 'validation-refused'
                print('transport-runtime-refused:' + category, file=sys.stderr)
                cause = cause.__context__
            for frame in traceback.extract_tb(error.__traceback__)[-8:]:
                if re.fullmatch('[A-Za-z_][A-Za-z_0-9]*', frame.name):
                    print('transport-runtime-frame:' + frame.name + ':' + str(frame.lineno), file=sys.stderr)
            raise SystemExit(1)
      - "{{ '--retire' if (_transport_runtime_retire_all | default(false) | bool) else '--apply' }}"
      - "{{ '--check' if ansible_check_mode else '--apply' }}"
    stdin: >-
      {{ {'sources': {
            'transport_semantics': lookup('ansible.builtin.file',
                role_path ~ '/../../../scripts/transport_semantics.py', rstrip=False),
            'transport_runtime_transaction': lookup('ansible.builtin.file',
                role_path ~ '/../runtime-release/files/transport_runtime_transaction.py', rstrip=False),
            'transport_runtime_probe': lookup('ansible.builtin.file',
                role_path ~ '/../runtime-release/files/transport_runtime_probe.py', rstrip=False),
            'transport_runtime_validate': lookup('ansible.builtin.file',
                role_path ~ '/../runtime-release/files/transport_runtime_validate.py', rstrip=False),
            'transport_runtime_accept': lookup('ansible.builtin.file',
                role_path ~ '/../runtime-release/files/transport_runtime_accept.py', rstrip=False)},
          'request': ({'paths': transport_runtime_candidates | map(attribute='path') | list}
         if (_transport_runtime_retire_all | default(false) | bool) else
         {'candidates': transport_runtime_candidates,
          'clients': transport_runtime_probe_clients,
          'probe_url': transport_runtime_probe_url,
          'asset_dir': transport_runtime_geodata_candidate_dir | default(none),
          'expected_status': transport_runtime_probe_expected_status | int,
          'timeout': transport_runtime_timeout_seconds | int}) |
          combine({'revocation': vpn_device_revocation | default(none)})} | to_json }}
    stdin_add_newline: false
  register: _transport_runtime_acceptance
  changed_when: >-
    _transport_runtime_acceptance.rc == 0 and (_transport_runtime_acceptance.stdout | from_json).changed
  check_mode: false
  no_log: true
  diff: false
  failed_when: false
  when:
    - not (transport_egress_fresh_check_mode | default(false) | bool)
    - transport_runtime_candidates | default([]) | length > 0

- name: Report only bounded categorical consumer refusal
  ansible.builtin.fail:
    msg: >-
      {{ (_transport_runtime_acceptance.stderr | default('') |
           regex_findall('transport-runtime-(?:refused:[a-z][a-z0-9-]{0,96}|frame:[A-Za-z_][A-Za-z_0-9]*:[0-9]{1,6})'))[:9] }}
  when:
    - _transport_runtime_acceptance.rc | default(0) != 0
