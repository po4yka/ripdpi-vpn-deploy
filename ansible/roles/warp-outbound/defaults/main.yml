---
# Optional vendor TUN backend for selected Xray routes. It never registers an
# account or changes host DNS/routing; retained registration is required.
warp_outbound:
  # false admits only the already installed exact canonical vendor package.
  install_warp_cli: true
  # Explicit public inventory/group_vars pin; it is not a SOPS secret.
  package_version: ""
  # Approved repository key digest; verify rotations before changing this pin.
  pubkey_sha256: "0f37fc298c98e88ee3c0ee68c95b69f1dba9eb477abe3167e13982105911264d"
  mode: tunnel_only
  routing_tag: warp-out
warp_outbound_role_enabled: true
