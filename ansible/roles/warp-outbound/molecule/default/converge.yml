---
- name: Converge actual owned namespace lifecycle without vendor registration
  hosts: all
  become: true
  tasks:
    - name: Install genuine kernel namespace tooling
      ansible.builtin.apt:
        name: [iproute2, nftables]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Prepare private exact lifecycle paths
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: /var/lib/ripdpi/warp-outbound, mode: '0700'}
        - {path: /usr/local/libexec/ripdpi-warp, mode: '0755'}
        - {path: /etc/ripdpi/transport-egress, mode: '0700'}
    - name: Install production namespace helper
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../files/namespace.py', rstrip=false) }}"
        dest: /usr/local/libexec/ripdpi-warp/namespace.py
        owner: root
        group: root
        mode: '0755'
    - name: Prepare actual bounded namespace and veth pair
      ansible.builtin.command:
        argv: [python3, -Es, /usr/local/libexec/ripdpi-warp/namespace.py, prepare]
      register: prepared
      changed_when: (prepared.stdout | from_json).changed | bool

    - name: Install actual namespace boot lifecycle unit
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/namespace.service.j2') }}"
        dest: /etc/systemd/system/ripdpi-warp-namespace.service
        owner: root
        group: root
        mode: '0644'
    - name: Admit actual boot lifecycle service without vendor registration
      ansible.builtin.systemd_service:
        name: ripdpi-warp-namespace.service
        daemon_reload: true
        state: started
