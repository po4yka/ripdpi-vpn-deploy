---
# Verify warp-outbound molecule scenario.
# Asserts:
#   1. warp-svc unit file present at expected path with correct ExecStart line.
#   2. Actual repeated role convergence is idempotent.
#   3. Real role CLI/health failure boundaries and subsequent reconvergence.

- name: Verify warp-outbound role
  hosts: all
  become: true
  tasks:
    - name: warp-svc unit file is present
      ansible.builtin.stat:
        path: /etc/systemd/system/warp-svc.service
      register: warp_unit
      failed_when: not warp_unit.stat.exists

    - name: warp-svc unit has expected ExecStart entry
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'ExecStart=' /etc/systemd/system/warp-svc.service
        executable: /bin/bash
      changed_when: false

    - name: Repeat actual successful WARP convergence
      ansible.builtin.include_role:
        name: warp-outbound
      vars: &warp_fixture_vars
        vpn: {enable_warp_outbound: true}
        warp_outbound: {package_version: '2026.8.2100.0', install_warp_cli: false, mode: proxy, socks_port: 40000}

    - name: Require actual repeat CLI convergence to be idempotent
      ansible.builtin.assert:
        that:
          - not warp_register.changed
          - not warp_mode.changed
          - not warp_port.changed
          - not warp_connect.changed
          - warp_trace.rc == 0
          - "'warp=on' in warp_trace.stdout"

    - name: Exercise actual CLI failure without inventing retry state
      environment: {WARP_CLI_FIXTURE: connect-failed}
      block:
        - name: Run the actual role with a failed connect
          ansible.builtin.include_role:
            name: warp-outbound
          vars: *warp_fixture_vars
        - name: Fail if failed CLI connection was accepted
          ansible.builtin.fail:
            msg: Actual WARP role accepted CLI failure
      rescue:
        - name: Require actual Connect WARP failure
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Connect WARP'
              - ansible_failed_result.rc == 1

    - name: Exercise actual curl failure without inventing retry state
      environment: {WARP_TRACE_FIXTURE: network-failed}
      block:
        - name: Run the actual role with a failed trace request
          ansible.builtin.include_role:
            name: warp-outbound
          vars: *warp_fixture_vars
        - name: Fail if trace transport failure was accepted
          ansible.builtin.fail:
            msg: Actual WARP role accepted trace transport failure
      rescue:
        - name: Require actual trace command failure
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Verify WARP exit IP is reachable'
              - ansible_failed_result.rc == 7

    - name: Reconverge the actual role after CLI and health failures
      ansible.builtin.include_role:
        name: warp-outbound
      vars: *warp_fixture_vars

    - name: Require actual successful recovered role health
      ansible.builtin.assert:
        that:
          - warp_trace.rc == 0
          - "'warp=on' in warp_trace.stdout"
          - not warp_connect.changed

    - name: warp-cli stub was invoked (call log exists)
      ansible.builtin.stat:
        path: /tmp/warp-cli-calls.log
      register: warp_call_log
      failed_when: not warp_call_log.stat.exists

    - name: warp-cli registration new was invoked
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'registration new' /tmp/warp-cli-calls.log
        executable: /bin/bash
      changed_when: false

    - name: warp-cli mode proxy was invoked
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -q 'mode proxy' /tmp/warp-cli-calls.log
        executable: /bin/bash
      changed_when: false

    - name: Cloudflare WARP apt source file is present (when install_warp_cli true)
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/cloudflare-warp.list
      register: warp_apt_source
      # The converge stub sets install_warp_cli: false, so the file is
      # absent; the check is a no-op. When install_warp_cli: true this
      # assertion fires and validates the role placed the source file.
      failed_when: false

    - name: Cloudflare WARP GPG keyring is present (when install_warp_cli true)
      ansible.builtin.stat:
        path: /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
      register: warp_gpg_keyring
      # Same note as above — absent when install_warp_cli: false.
      failed_when: false

    - name: Reject a successful trace response from an inactive tunnel
      environment:
        WARP_TRACE_FIXTURE: warp-off
      block:
        - name: Run the actual role with the inactive-tunnel response
          ansible.builtin.include_role:
            name: warp-outbound
          vars:
            warp_outbound:
              package_version: "2026.8.2100.0"
              install_warp_cli: false
              mode: proxy
              socks_port: 40000

        - name: Fail if the role accepts the inactive tunnel
          ansible.builtin.fail:
            msg: The actual WARP health gate accepted warp=off
      rescue:
        - name: Require failure from the role health gate
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Verify WARP exit IP is reachable'
              - ansible_failed_result.rc == 0
              - "'warp=off' in ansible_failed_result.stdout"

    - name: Reject an empty signing-key pin before repository installation
      block:
        - name: Run the actual installer with an empty pin
          ansible.builtin.include_role:
            name: warp-outbound
          vars:
            warp_outbound:
              package_version: "2026.8.2100.0"
              install_warp_cli: true
              pubkey_sha256: ""

        - name: Fail if the role accepts an empty signing-key pin
          ansible.builtin.fail:
            msg: The actual WARP installer accepted an empty key pin
      rescue:
        - name: Require failure from the signing-key pin preflight
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the repository signing key pin is present'

    - name: Empty pin leaves the repository and key absent
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/cloudflare-warp.list
        - /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
      register: rejected_install_artifacts
      failed_when: rejected_install_artifacts.stat.exists
