---
- name: Inspect bounded namespace retirement authority
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - '{{ lookup(''ansible.builtin.file'', role_path ~ ''/files/namespace.py'') }}'
      - inspect
  register: _warp_retire_owner
  changed_when: false
  check_mode: false
  no_log: true
- name: Retire only claimed isolated vendor adapter while retaining registration
  when: (_warp_retire_owner.stdout | from_json).record is not none
  block:
    - name: Inspect exact current lifecycle units before partial-install retirement
      ansible.builtin.command:
        argv: [systemctl, show, '{{ item }}', '--property=LoadState,FragmentPath']
      loop:
        - warp-svc.service
        - ripdpi-warp-refresh.service
        - ripdpi-warp-namespace.service
      register: _warp_retire_units
      changed_when: false
      check_mode: false
      no_log: true
    - name: Refuse foreign lifecycle unit authority during retirement
      ansible.builtin.assert:
        that:
          - >-
            'LoadState=not-found' in item.stdout_lines or 'LoadState=masked' in item.stdout_lines or
            ('LoadState=loaded' in item.stdout_lines and
             (('FragmentPath=/etc/systemd/system/' ~ item.item) in item.stdout_lines or
              (item.item == 'warp-svc.service' and
               ('FragmentPath=/usr/lib/systemd/system/warp-svc.service' in item.stdout_lines or
                'FragmentPath=/lib/systemd/system/warp-svc.service' in item.stdout_lines))))
        fail_msg: Owned namespace retirement encountered foreign service authority.
        quiet: true
      loop: '{{ _warp_retire_units.results }}'
      no_log: true
    - name: Stop and mask sole owned vendor service
      ansible.builtin.systemd_service:
        name: warp-svc.service
        state: "{{ 'stopped' if 'LoadState=not-found' not in _warp_retire_units.results[0].stdout_lines else omit }}"
        enabled: false
        masked: true
    - name: Stop owned namespace and refresh lifecycle units
      ansible.builtin.systemd_service:
        name: '{{ item.item }}'
        state: stopped
        enabled: false
      loop: '{{ _warp_retire_units.results[1:] }}'
      when: "'LoadState=not-found' not in item.stdout_lines"
      no_log: true
    - name: Remove only empty owned namespace and exact veth pair
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - '{{ lookup(''ansible.builtin.file'', role_path ~ ''/files/namespace.py'') }}'
          - retire
      register: _warp_namespace_retirement
      changed_when: >-
        _warp_namespace_retirement.rc == 0 and
        (_warp_namespace_retirement.stdout | from_json).changed | bool
      no_log: true
      when: not ansible_check_mode

  rescue:
    - name: Publish only a fixed namespace retirement refusal category
      ansible.builtin.debug:
        msg: "{{ _warp_namespace_retirement.stderr | trim }}"
      when:
        - _warp_namespace_retirement is defined
        - _warp_namespace_retirement.rc | default(0) == 1
        - (_warp_namespace_retirement.stderr | default('') | trim) is match('^[a-z][a-z0-9-]{0,63}$')
    - name: Refuse incomplete isolated vendor retirement
      ansible.builtin.fail:
        msg: Isolated vendor retirement refused; ownership and namespace authority remain retained.
