---
# Install + register Cloudflare WARP CLI in proxy mode on the VPS so the
# host can egress through Cloudflare's network. See the role README
# (ansible/roles/warp-outbound/defaults/main.yml) for rationale. The
# heavy lifting is the CLI install; registration is idempotent.

- name: Require exact stable WARP package version before mutation
  ansible.builtin.assert:
    that:
      - warp_outbound.package_version | default('') is string
      - warp_outbound.package_version | default('') is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+(?:-[0-9]+)?$')
    fail_msg: WARP requires an explicit exact stable package_version before activation.

- name: Ensure HTTPS apt transport is available
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
      - lsb-release
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: warp_outbound.install_warp_cli | default(true)

- name: Assert the repository signing key pin is present
  # Fail closed: an unset or malformed pin must never silently degrade
  # the key check to TOFU. After an upstream rotation update
  # warp_outbound.pubkey_sha256 (procedure in defaults/main.yml).
  ansible.builtin.assert:
    that:
      - warp_outbound.pubkey_sha256 | default('') is match('^[0-9a-f]{64}$')
    fail_msg: >-
      warp_outbound.pubkey_sha256 must pin the sha256 of Cloudflare's WARP
      apt signing key. Fetch the current key from a trusted network,
      verify it out-of-band, and set the pin before enabling this role.
  when: warp_outbound.install_warp_cli | default(true)

- name: Install Cloudflare WARP GPG key
  ansible.builtin.get_url:
    url: https://pkg.cloudflareclient.com/pubkey.gpg
    dest: /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
    mode: "0644"
    force: false
  when: warp_outbound.install_warp_cli | default(true)

- name: Verify Cloudflare WARP GPG key checksum against the pin
  ansible.builtin.stat:
    path: /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
    checksum_algorithm: sha256
  register: _warp_gpg_stat
  when: warp_outbound.install_warp_cli | default(true)

- name: Assert GPG key matches pinned sha256
  ansible.builtin.assert:
    that:
      - _warp_gpg_stat.stat.checksum == warp_outbound.pubkey_sha256
    fail_msg: >-
      Cloudflare WARP GPG key checksum mismatch: got
      {{ _warp_gpg_stat.stat.checksum }} but warp_outbound.pubkey_sha256 pins
      {{ warp_outbound.pubkey_sha256 }}. Verify the key has not been rotated
      upstream and update the pin if intentional.
  when: warp_outbound.install_warp_cli | default(true)

- name: Add Cloudflare WARP apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cloudflare-warp.list
    owner: root
    group: root
    mode: "0644"
    content: >-
      deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg]
      https://pkg.cloudflareclient.com/ {{ ansible_facts['distribution_release'] }} main
  register: _warp_apt_source
  when: warp_outbound.install_warp_cli | default(true)

- name: Refresh WARP package metadata after repository publication
  ansible.builtin.apt:
    update_cache: true
  when:
    - warp_outbound.install_warp_cli | default(true)
    - not ansible_check_mode
    - _warp_apt_source.changed

- name: Inspect approved WARP package metadata before installation
  ansible.builtin.command:
    argv: [apt-cache, show, "cloudflare-warp={{ warp_outbound.package_version }}"]
  register: _warp_package_metadata
  changed_when: false
  check_mode: false
  when:
    - warp_outbound.install_warp_cli | default(true)
    - not ansible_check_mode or not _warp_apt_source.changed

- name: Require the exact WARP package to suit this native architecture
  ansible.builtin.assert:
    that:
      - "('Package: cloudflare-warp') in _warp_package_metadata.stdout_lines"
      - "('Version: ' ~ warp_outbound.package_version) in _warp_package_metadata.stdout_lines"
      - >-
        ('Architecture: ' ~ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], 'unsupported'))
        in _warp_package_metadata.stdout_lines
    fail_msg: The approved WARP package is unavailable or does not suit the native architecture.
  when: _warp_package_metadata is not skipped

- name: Install cloudflare-warp package
  ansible.builtin.apt:
    name: "cloudflare-warp={{ warp_outbound.package_version }}"
    state: present
    update_cache: true
  when: warp_outbound.install_warp_cli | default(true)

- name: Read installed WARP package identity before configuration
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}', cloudflare-warp]
    expand_argument_vars: false
  register: _warp_installed_version
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Require installed WARP identity to match the approved pin
  ansible.builtin.assert:
    that:
      - _warp_installed_version.stdout == warp_outbound.package_version
    fail_msg: Installed WARP package differs from the approved exact version.
  when: not ansible_check_mode

- name: Accept WARP terms (idempotent)
  ansible.builtin.command: warp-cli --accept-tos registration new
  register: warp_register
  changed_when: "'Success' in warp_register.stdout"
  failed_when:
    - warp_register.rc != 0
    - "'already registered' not in warp_register.stdout"
    - "'already registered' not in warp_register.stderr"

- name: Set WARP proxy mode
  ansible.builtin.command: "warp-cli --accept-tos mode {{ warp_outbound.mode }}"
  when: warp_outbound.mode | default('proxy') == 'proxy'
  register: warp_mode
  changed_when: "'Success' in warp_mode.stdout"
  failed_when:
    - warp_mode.rc != 0
    - "'already' not in warp_mode.stdout"

- name: Set WARP proxy port
  ansible.builtin.command: "warp-cli --accept-tos proxy port {{ warp_outbound.socks_port }}"
  when: warp_outbound.mode | default('proxy') == 'proxy'
  register: warp_port
  changed_when: "'Success' in warp_port.stdout"
  failed_when:
    - warp_port.rc != 0
    - "'already' not in warp_port.stdout"

- name: Connect WARP
  ansible.builtin.command: warp-cli --accept-tos connect
  register: warp_connect
  changed_when: "'Success' in warp_connect.stdout"
  failed_when:
    - warp_connect.rc != 0
    - "'already' not in warp_connect.stdout"
    - "'Connected' not in warp_connect.stdout"

- name: Verify WARP exit IP is reachable
  ansible.builtin.command:
    cmd: >-
      curl -fsS --max-time 10
      --socks5-hostname 127.0.0.1:{{ warp_outbound.socks_port }}
      https://www.cloudflare.com/cdn-cgi/trace
  register: warp_trace
  changed_when: false
  # Single conjunctive-free boolean: curl success alone does NOT pass the
  # gate — an inactive tunnel returns warp=off with rc=0 and must fail.
  failed_when: >-
    warp_trace.rc != 0
    or 'warp=on' not in warp_trace.stdout

- name: Claim successful WARP role runtime ownership
  ansible.builtin.file:
    path: /var/lib/ripdpi/warp-outbound
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Record successful WARP role runtime ownership
  ansible.builtin.copy:
    dest: /var/lib/ripdpi/warp-outbound/managed.json
    content: "{{ {'schema': 1, 'unit': 'warp-svc.service'} | to_json }}"
    owner: root
    group: root
    mode: "0600"
