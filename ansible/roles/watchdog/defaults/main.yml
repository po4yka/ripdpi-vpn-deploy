---
watchdog:
  interval: "5min"             # systemd OnCalendar / OnUnitActiveSec
  fail_threshold: 3            # consecutive failed probes before alerting
  state_file: /var/lib/vpn-watchdog/state
  alerts_per_hour_max: 4       # rate-limit so a flapping host doesn't spam
  kicks_per_hour_max: 3        # bound systemd restart attempts for failed transports
  hysteria_probe_client: watchdog
  hysteria_probe_socks_port: 31110
  reality_probe_client: watchdog
  reality_probe_timeout: 15
  reality_probe_socks_port: 31082
  # Provider: none (default), ntfy or pushover. With none the watchdog still
  # probes and recovers but sends nothing off the node. A provider needs
  # node_alias (or the monitoring node ID), which replaces the hostname in alerts;
  # ntfy also needs ntfy_url.
  # Production refuses the public ntfy service: it would receive the node
  # address with every alert.
  provider: none
  node_alias: ""
  ntfy_url: ""

watchdog_role_enabled: true
