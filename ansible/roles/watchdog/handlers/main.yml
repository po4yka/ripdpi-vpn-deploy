---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart watchdog timer
  ansible.builtin.systemd_service:
    name: vpn-watchdog.timer
    state: restarted
  when:
    - watchdog_role_enabled | default(true) | bool
    - not ansible_check_mode or _watchdog_timer_preexisting.stat.exists
