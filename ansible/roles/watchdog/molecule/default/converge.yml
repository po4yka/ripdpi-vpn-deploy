---
- name: Converge watchdog role
  hosts: all
  become: true
  vars:
    xray_log_dir: /var/log/xray
    xray_api_listen: 127.0.0.1:10086
    vpn_service_address: 127.0.0.1
    vpn:
      enable_xray_reality: true
      enable_nginx_xhttp: true
      enable_hysteria: false
      enable_amneziawg: false
      xray_flow_mode: mux
      xray_finalmask: true
    amneziawg:
      interface: awg0
    xray:
      reality_public_key: "molecule-public-key"
      server_names: ["canary.example.test"]
      clients:
        - name: watchdog
          uuid: "98765432-1234-4234-8234-123456789abc"
          short_id: "55667788"
      cohorts: []
    xray_port: 443
    xray_fallback_port: 2053
    p0_reality_flow_mode: vision
    p0_reality_shapes:
      vision:
        client_flow: "xtls-rprx-vision"
        client_mux: false
        finalmask: false
      mux:
        client_flow: ""
        client_mux: true
        finalmask: false
    hysteria_port: 443
    watchdog_secrets:
      ntfy_topic: "molecule-stub-topic"
      reality_probe_url: "https://canary.example.test/healthz"
  pre_tasks:
    - name: Inspect owned container runtime mount propagation
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, /run, --output, PROPAGATION, --noheadings]
      register: _watchdog_molecule_run_propagation
      changed_when: false
      failed_when: >-
        _watchdog_molecule_run_propagation.rc != 0 or
        (_watchdog_molecule_run_propagation.stdout | trim) not in
        ['private', 'shared', 'slave', 'shared,slave', 'unbindable']

    - name: Prepare owned container runtime propagation for systemd credentials
      ansible.builtin.command:
        argv: [mount, --make-rshared, /run]
      when: "'shared' not in (_watchdog_molecule_run_propagation.stdout | trim).split(',')"
      changed_when: true

    - name: Inspect prepared runtime mount propagation
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, /run, --output, PROPAGATION, --noheadings]
      register: _watchdog_molecule_run_ready
      changed_when: false

    - name: Require shared owned runtime propagation before watchdog convergence
      ansible.builtin.assert:
        that:
          - "'shared' in (_watchdog_molecule_run_ready.stdout | trim).split(',')"
        fail_msg: The owned container runtime must publish systemd credential mounts.

    - name: Install jq for structured REALITY probe verification
      ansible.builtin.apt:
        name: jq
        state: present
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: watchdog
