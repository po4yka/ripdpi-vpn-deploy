---
- name: Converge watchdog role under simulated xray outage
  hosts: all
  become: true
  vars:
    xray_log_dir: /var/log/xray
    xray_api_listen: 127.0.0.1:10086
    vpn_service_address: 127.0.0.1
    vpn:
      enable_xray_reality: true     # → probes systemctl is-active xray
      enable_nginx_xhttp: false
      enable_hysteria: false
      enable_amneziawg: false
    amneziawg:
      interface: awg0
    xray:
      reality_public_key: "molecule-public-key"
      server_names: ["canary.example.test"]
      clients:
        - name: watchdog
          uuid: "98765432-1234-4234-8234-123456789abc"
          short_id: "55667788"
      cohorts: []
    xray_port: 443
    xray_fallback_port: 2053
    p0_reality_flow_mode: vision
    hysteria_port: 443
    p0_reality_shapes:
      vision:
        client_flow: "xtls-rprx-vision"
        client_mux: false
        finalmask: false
      mux:
        client_flow: ""
        client_mux: true
        finalmask: false
    watchdog:
      interval: "5min"
      fail_threshold: 1            # first failed probe → alert
      state_file: /var/lib/vpn-watchdog/state
      alerts_per_hour_max: 4
      kicks_per_hour_max: 3
      provider: ntfy
      ntfy_url: "http://127.0.0.1:18080"   # local stub listener
      reality_probe_client: watchdog
      reality_probe_timeout: 15
      reality_probe_socks_port: 31082
    watchdog_secrets:
      ntfy_topic: "molecule-failure-topic"
      reality_probe_url: "https://canary.example.test/healthz"

  pre_tasks:
    - name: Inspect owned container runtime mount propagation
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, /run, --output, PROPAGATION, --noheadings]
      register: _watchdog_molecule_run_propagation
      changed_when: false
      failed_when: >-
        _watchdog_molecule_run_propagation.rc != 0 or
        (_watchdog_molecule_run_propagation.stdout | trim) not in
        ['private', 'shared', 'slave', 'shared,slave', 'unbindable']

    - name: Prepare owned container runtime propagation for systemd credentials
      ansible.builtin.command:
        argv: [mount, --make-rshared, /run]
      when: "'shared' not in (_watchdog_molecule_run_propagation.stdout | trim).split(',')"
      changed_when: true

    - name: Inspect prepared runtime mount propagation
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, /run, --output, PROPAGATION, --noheadings]
      register: _watchdog_molecule_run_ready
      changed_when: false

    - name: Require shared owned runtime propagation before watchdog convergence
      ansible.builtin.assert:
        that:
          - "'shared' in (_watchdog_molecule_run_ready.stdout | trim).split(',')"
        fail_msg: The owned container runtime must publish systemd credential mounts.

    - name: Install curl, jq, and python3 (stub listener + alert delivery)
      ansible.builtin.apt:
        name: [curl, jq, python3]
        state: present
        update_cache: true

    # Stub ntfy listener: a 30-line http.server that records every POST
    # body to /tmp/ntfy-stub.log. Started via systemd-run so it survives
    # the play; killed by destroy.
    - name: Drop stub ntfy listener
      ansible.builtin.copy:
        dest: /usr/local/sbin/ntfy-stub.py
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import json
          import pathlib
          from http.server import BaseHTTPRequestHandler, HTTPServer

          LOG = pathlib.Path("/tmp/ntfy-stub.log")

          class H(BaseHTTPRequestHandler):
              def log_message(self, *a, **k): pass
              def do_POST(self):  # noqa: N802
                  n = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(n).decode("utf-8", "replace")
                  rec = {
                      "path": self.path,
                      "title": self.headers.get("Title", ""),
                      "tags": self.headers.get("Tags", ""),
                      "priority": self.headers.get("Priority", ""),
                      "body": body,
                  }
                  with LOG.open("a") as fh:
                      fh.write(json.dumps(rec) + "\n")
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok")

          if __name__ == "__main__":
              HTTPServer(("127.0.0.1", 18080), H).serve_forever()

    - name: Truncate stub log so verify reads only this run's alerts
      ansible.builtin.copy:
        dest: /tmp/ntfy-stub.log
        content: ""
        owner: root
        group: root
        mode: "0644"

    - name: Drop stub-listener systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/ntfy-stub.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Test stub for ntfy POST capture
          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /usr/local/sbin/ntfy-stub.py
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target

    - name: Start stub listener
      ansible.builtin.systemd_service:
        name: ntfy-stub.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Create fake Xray config directory
      ansible.builtin.file:
        path: /etc/xray
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Xray log group for the canonical watchdog sandbox
      ansible.builtin.group:
        name: xray
        system: true

    - name: Provision Xray log directory before the credential-bearing watchdog unit
      ansible.builtin.file:
        path: /var/log/xray
        state: directory
        owner: root
        group: xray
        mode: "0750"

    - name: Create failure-only watchdog diagnostic drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/vpn-watchdog.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install transparent failure-only sender diagnostic wrapper
      ansible.builtin.copy:
        dest: /usr/local/sbin/watchdog-notify-diagnostic.py
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/python3
          import os
          import sys

          def report_error(stage, error):
              if isinstance(error, OSError) and isinstance(error.errno, int):
                  detail = 'errno=' + str(error.errno)
              else:
                  allowed = {'OSError', 'KeyError', 'AttributeError', 'TypeError', 'ValueError',
                             'NotImplementedError', 'OverflowError', 'Exception'}
                  name = type(error).__name__
                  detail = 'error=' + (name if name in allowed else 'Exception')
              print('watchdog-credential-metadata stage=' + stage + ' ' + detail, flush=True)

          try:
              directory = os.environ['CREDENTIALS_DIRECTORY']
              if not directory:
                  raise KeyError('directory')
              path = directory + '/notifications.json'
              print('watchdog-credential-metadata location directory_exists=' + str(int(os.path.isdir(directory)))
                    + ' service_directory_matches=' + str(int(directory == '/run/credentials/vpn-watchdog.service'))
                    + ' canonical_file_exists=' + str(int(os.path.isfile(
                        '/run/credentials/vpn-watchdog.service/notifications.json')))
                    + ' source_file_exists=' + str(int(os.path.isfile('/etc/vpn-watchdog-notifications.json'))), flush=True)
              metadata = os.stat(path, follow_symlinks=False)
          except Exception as error:
              report_error('file-stat', error)
          else:
              readonly = 'unknown'
              try:
                  readonly = str(int(bool(os.statvfs(path).f_flag & os.ST_RDONLY)))
              except Exception as error:
                  report_error('mount-stat', error)
              print('watchdog-credential-metadata mode=' + oct(metadata.st_mode)
                    + ' uid=' + str(metadata.st_uid) + ' gid=' + str(metadata.st_gid)
                    + ' nlink=' + str(metadata.st_nlink) + ' size=' + str(metadata.st_size)
                    + ' readonly=' + readonly, flush=True)
          sender = '/usr/local/libexec/vpn-watchdog-notify.py'
          try:
              os.execv(sender, [sender, *sys.argv[1:]])
          except OSError:
              print('watchdog-notify-wrapper error=delegate-unavailable', file=sys.stderr)
              raise SystemExit(1)

    - name: Route only the failure fixture through the transparent sender wrapper
      ansible.builtin.copy:
        dest: /etc/systemd/system/vpn-watchdog.service.d/diagnostics.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment=WATCHDOG_NOTIFY_BIN=/usr/local/sbin/watchdog-notify-diagnostic.py

    - name: Drop fake Xray server config
      ansible.builtin.copy:
        dest: /etc/xray/config.json
        content: "{}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Drop TCP listener used by the liveness-green Xray stub
      ansible.builtin.copy:
        dest: /usr/local/sbin/watchdog-tcp-stub.py
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import socket
          import sys

          port = int(sys.argv[1])
          with socket.socket() as server:
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(("127.0.0.1", port))
              server.listen()
              while True:
                  connection, _ = server.accept()
                  connection.close()

    - name: Drop liveness-green protocol-red Xray stub
      ansible.builtin.copy:
        dest: /usr/local/bin/xray
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          if printf '%s\n' "$@" | grep -q -- '-test'; then
            exit 0
          fi
          if printf '%s\n' "$@" | grep -q 'vpn-watchdog-reality.json'; then
            exec /usr/local/sbin/watchdog-tcp-stub.py 31082
          fi
          exec /usr/local/sbin/watchdog-tcp-stub.py 443

    - name: Install fake Xray service
      ansible.builtin.copy:
        dest: /etc/systemd/system/xray.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Test Xray liveness stub
          [Service]
          Type=simple
          Environment=XRAY_LOCATION_ASSET=/usr/local/share/xray
          ExecStart=/usr/local/bin/xray run -config /etc/xray/config.json
          Restart=on-failure

    - name: Start fake Xray service
      ansible.builtin.systemd_service:
        name: xray.service
        state: started
        daemon_reload: true

  roles:
    - role: watchdog
