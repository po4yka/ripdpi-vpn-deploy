---
# Failure-injection scenario.
#
# default/ proves the watchdog probes happy-path (everything green); this
# scenario proves the alert path fires when process-level liveness stays green
# but authenticated protocol completion goes red:
#
#   1. a stub xray service is active, listens on 443, and passes config test
#   2. its probe-side SOCKS listener cannot complete a SOCKS/HTTP exchange
#   3. fail_threshold = 1 → first failed round trip triggers an alert
#   4. ntfy.sh URL is redirected to a local stub HTTP listener
#   5. verify.yml runs vpn-watchdog.sh once and asserts the stub
#      received the alert with the expected title shape
#
# This is the test the previous golden-path scenarios were missing.

dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
    role-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: vpn-watchdog-failure-debian13
    image: ghcr.io/po4yka/ripdpi-vpn-deploy/molecule-debian13@sha256:0de09c528cdbf83545420a1b3a9524af9f38d65fc1b28ff6a8af1eff052987da
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    host_vars:
      vpn-watchdog-failure-debian13:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: ansible

# No idempotence stage — the watchdog timer + state file change between
# the two passes, so a second converge legitimately diverges.
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
