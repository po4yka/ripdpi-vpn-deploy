---
- name: Assert pinned Xray runtime inputs
  ansible.builtin.assert:
    that:
      - xray.version | default('') | length > 0
      - (xray.linux_amd64_sha256 if ansible_architecture == 'x86_64' else xray.linux_arm64_sha256) | default('') | length > 0
    fail_msg: Xray version and architecture checksum are required.

- name: Set Xray runtime archive facts
  ansible.builtin.set_fact:
    xray_runtime_arch: "{{ '64' if ansible_architecture == 'x86_64' else 'arm64-v8a' }}"
    xray_runtime_sha256: "{{ xray.linux_amd64_sha256 if ansible_architecture == 'x86_64' else xray.linux_arm64_sha256 }}"

- name: Install Xray runtime dependencies
  ansible.builtin.apt:
    name: "{{ ['golang-go', 'git'] if xray_runtime_build_from_source | bool else ['unzip'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Xray release directory
  ansible.builtin.file:
    path: "{{ xray_install_dir }}/releases/{{ xray.version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check pinned Xray binary
  ansible.builtin.stat:
    path: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
  register: _xray_runtime_binary

- name: Clone pinned Xray source
  ansible.builtin.git:
    repo: https://github.com/XTLS/Xray-core
    dest: /opt/src/xray-core
    version: "{{ xray.version }}"
    depth: 1
    update: false
  when:
    - xray_runtime_build_from_source | bool
    - not _xray_runtime_binary.stat.exists

- name: Build pinned Xray source
  ansible.builtin.command:
    argv:
      - go
      - build
      - -trimpath
      - -ldflags=-s -w
      - -o
      - "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
      - ./main
    chdir: /opt/src/xray-core
    creates: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -trimpath
  when:
    - xray_runtime_build_from_source | bool
    - not _xray_runtime_binary.stat.exists

- name: Inspect source-built Xray checksum
  ansible.builtin.stat:
    path: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
    checksum_algorithm: sha256
  register: _xray_runtime_source_binary
  when:
    - xray_runtime_build_from_source | bool
    - xray_runtime_sha256 != 'REPLACE_WITH_RELEASE_SHA256'

- name: Verify source-built Xray checksum pin
  ansible.builtin.assert:
    that:
      - _xray_runtime_source_binary.stat.checksum == xray_runtime_sha256
    fail_msg: Source-built Xray binary does not match the configured SHA256.
  when:
    - xray_runtime_build_from_source | bool
    - xray_runtime_sha256 != 'REPLACE_WITH_RELEASE_SHA256'

- name: Download pinned Xray archive
  ansible.builtin.get_url:
    url: "https://github.com/XTLS/Xray-core/releases/download/{{ xray.version }}/Xray-linux-{{ xray_runtime_arch }}.zip"
    dest: "/tmp/xray-{{ xray.version }}-linux-{{ xray_runtime_arch }}.zip"
    checksum: "sha256:{{ xray_runtime_sha256 }}"
    mode: "0644"
  when:
    - not xray_runtime_build_from_source | bool
    - not _xray_runtime_binary.stat.exists

- name: Unpack pinned Xray archive
  ansible.builtin.unarchive:
    src: "/tmp/xray-{{ xray.version }}-linux-{{ xray_runtime_arch }}.zip"
    dest: "{{ xray_install_dir }}/releases/{{ xray.version }}"
    remote_src: true
    creates: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
  when:
    - not xray_runtime_build_from_source | bool
    - not _xray_runtime_binary.stat.exists

- name: Ensure pinned Xray binary permissions
  ansible.builtin.file:
    path: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
    owner: root
    group: root
    mode: "0755"

- name: Point current Xray runtime at pinned release
  ansible.builtin.file:
    src: "{{ xray_install_dir }}/releases/{{ xray.version }}"
    dest: "{{ xray_install_dir }}/current"
    state: link
    force: true
  register: _xray_runtime_current

- name: Expose pinned Xray runtime
  ansible.builtin.file:
    src: "{{ xray_install_dir }}/current/xray"
    dest: /usr/local/bin/xray
    state: link
    force: true

- name: Publish Xray runtime change state
  ansible.builtin.set_fact:
    xray_runtime_changed: "{{ _xray_runtime_current.changed }}"
