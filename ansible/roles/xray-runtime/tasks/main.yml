---
- name: Assert pinned Xray runtime inputs
  ansible.builtin.assert:
    that:
      - xray.version | default('') | length > 0
      - (xray.linux_amd64_sha256 if ansible_facts['architecture'] == 'x86_64' else xray.linux_arm64_sha256) | default('') | length > 0
      - not (xray_runtime_build_from_source | bool) or xray.source_commit | default('') is match('^[0-9a-f]{40,64}$')
      - not (xray_runtime_build_from_source | bool) or xray.source_binary_sha256 | default('') is match('^[0-9a-f]{64}$')
    fail_msg: Xray version, artifact checksum, and exact source pins are required.

- name: Set Xray runtime archive facts
  ansible.builtin.set_fact:
    xray_runtime_arch: "{{ '64' if ansible_facts['architecture'] == 'x86_64' else 'arm64-v8a' }}"
    xray_runtime_sha256: "{{ xray.linux_amd64_sha256 if ansible_facts['architecture'] == 'x86_64' else xray.linux_arm64_sha256 }}"

- name: Install Xray runtime dependencies
  ansible.builtin.apt:
    name: "{{ ['golang-go', 'git'] if xray_runtime_build_from_source | bool else ['unzip'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Xray release directory
  ansible.builtin.file:
    path: "{{ xray_install_dir }}/releases/{{ xray.version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check pinned Xray binary
  ansible.builtin.stat:
    path: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
  register: _xray_runtime_binary

- name: Clone pinned Xray source
  ansible.builtin.git:
    repo: https://github.com/XTLS/Xray-core
    dest: "/opt/src/xray-core-{{ xray.source_commit }}"
    version: "{{ xray.source_commit }}"
    update: false
  when: xray_runtime_build_from_source | bool

- name: Resolve pinned Xray source commit
  ansible.builtin.command:
    argv: [/usr/bin/git, rev-parse, HEAD]
    chdir: "/opt/src/xray-core-{{ xray.source_commit }}"
  register: _xray_runtime_source_head
  check_mode: false
  changed_when: false
  when:
    - xray_runtime_build_from_source | bool
    - not ansible_check_mode

- name: Verify Xray source resolved to the pinned commit
  ansible.builtin.assert:
    that:
      - _xray_runtime_source_head.stdout | trim == xray.source_commit
    fail_msg: Xray source checkout does not match xray.source_commit.
  when:
    - xray_runtime_build_from_source | bool
    - not ansible_check_mode

- name: Converge pinned Xray source build
  ansible.builtin.include_role:
    name: runtime-release
    tasks_from: source-build
    defaults_from: source-build
  vars:
    runtime_build_descriptor:
      schema_version: 1
      name: xray-core
      source:
        repository: https://github.com/XTLS/Xray-core
        version: "{{ xray.version }}"
        commit: "{{ xray.source_commit }}"
      steps:
        - argv:
            - /usr/bin/go
            - build
            - -trimpath
            - -ldflags=-s -w
            - -o
            - /var/lib/ripdpi/runtime-build-staging/xray-core/xray
            - ./main
          chdir: "/opt/src/xray-core-{{ xray.source_commit }}"
          environment:
            CGO_ENABLED: "0"
            GOFLAGS: -trimpath
          timeout_seconds: 1800
      outputs:
        - name: installed
          staged_path: /var/lib/ripdpi/runtime-build-staging/xray-core/xray
          path: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
          expected_sha256: "{{ xray.source_binary_sha256 }}"
  when: xray_runtime_build_from_source | bool

- name: Download pinned Xray archive
  ansible.builtin.get_url:
    url: "https://github.com/XTLS/Xray-core/releases/download/{{ xray.version }}/Xray-linux-{{ xray_runtime_arch }}.zip"
    dest: "/tmp/xray-{{ xray.version }}-linux-{{ xray_runtime_arch }}.zip"
    checksum: "sha256:{{ xray_runtime_sha256 }}"
    mode: "0644"
  when:
    - not xray_runtime_build_from_source | bool
    - not _xray_runtime_binary.stat.exists

- name: Unpack pinned Xray archive
  ansible.builtin.unarchive:
    src: "/tmp/xray-{{ xray.version }}-linux-{{ xray_runtime_arch }}.zip"
    dest: "{{ xray_install_dir }}/releases/{{ xray.version }}"
    remote_src: true
    creates: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
  when:
    - not xray_runtime_build_from_source | bool
    - not _xray_runtime_binary.stat.exists

- name: Ensure pinned Xray binary permissions
  ansible.builtin.file:
    path: "{{ xray_install_dir }}/releases/{{ xray.version }}/xray"
    owner: root
    group: root
    mode: "0755"

- name: Point current Xray runtime at pinned release
  ansible.builtin.file:
    src: "{{ xray_install_dir }}/releases/{{ xray.version }}"
    dest: "{{ xray_install_dir }}/current"
    state: link
    force: true
  register: _xray_runtime_current

- name: Expose pinned Xray runtime
  ansible.builtin.file:
    src: "{{ xray_install_dir }}/current/xray"
    dest: /usr/local/bin/xray
    state: link
    force: true

- name: Publish Xray runtime change state
  ansible.builtin.set_fact:
    xray_runtime_changed: >-
      {{
        (_xray_runtime_current.changed | bool)
        or (
          (xray_runtime_build_from_source | bool)
          and (runtime_build_changed | default(false) | bool)
        )
      }}
