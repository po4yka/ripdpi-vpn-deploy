---
# Defaults overridden by group_vars/all.yml or playbook vars.

xray_runtime_user: xray
xray_runtime_group: xray
xray_install_dir: "{{ xray_install_root | default('/opt/xray') }}"
xray_etc_dir: "{{ xray_config_dir | default('/etc/xray') }}"
xray_log_path: "{{ xray_log_dir | default('/var/log/xray') }}"

# Blackhole outbound QUIC (UDP/443) at the routing layer. ON by default —
# preserves the existing anti-fingerprint behaviour: proxied clients never
# emit UDP/443, so the exit cannot be distinguished by a QUIC-leak signature.
# TRADE-OFF: this DISABLES HTTP/3 for every proxied client. Browsers and apps
# transparently fall back to HTTP/2 over TCP — slower on lossy / high-latency
# links, but no functional break. Set to false per-deploy to allow QUIC/HTTP3
# egress (e.g. a cohort where HTTP/3 performance matters more than the
# fingerprint surface). See roles/xray/README.md.
xray_block_quic_outbound: true

# Client uTLS (browser-mimic) fingerprint emitted into sing-box client bundles
# for the REALITY and XHTTP outbounds. CLIENT-side only — the server has no uTLS
# knob — but declared here as the canonical per-profile default; override in
# group_vars (e.g. a RU-hosted cohort). `scripts/emit-singbox.sh` reads it
# (UTLS_FINGERPRINT env overrides for a single run). Default "chrome"; sing-box
# also accepts firefox/edge/safari/ios/android/random/…. Changing this is only
# materially relevant under the June-2026 RU-AS cascade pattern (Chrome/Safari/iOS
# flagged, Firefox/Android pass) — NOT on the foreign-VPS baseline. See
# docs/CLIENT-NOTES.md. Do NOT rotate it automatically; see the failover caveat.
xray_utls_fingerprint: "chrome"

# Version sentinel — must be overridden in secrets/group_vars.
# The role asserts this is non-empty at task start.
xray:
  version: ""
  linux_amd64_sha256: ""
  linux_arm64_sha256: ""
