---
- name: Converge Xray and guarded shared egress with the exact native runtime
  hosts: all
  become: true
  vars:
    xray_port: 443
    xray_fallback_port: 2053
    nginx_xhttp_port: 10085
    xray_runtime_release_urls:
      amd64: file:///var/tmp/xray-molecule/xray-v26.10.31.zip
      arm64: file:///var/tmp/xray-molecule/xray-v26.10.31.zip
    p0_reality_shapes:
      vision:
        client_flow: xtls-rprx-vision
        client_mux: false
        finalmask: false
      mux:
        client_flow: ''
        client_mux: true
        finalmask: false
    vpn:
      enable_nginx_xhttp: true
      xray_flow_mode: mux
      xray_finalmask: true
      enable_xray_reality: true
      enable_hysteria: false
      enable_warp_outbound: false
      enable_transport_egress: true
      enable_geodata: false
    xray:
      version: v26.10.31
      linux_amd64_sha256: e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214
      linux_arm64_sha256: 1811c8f1da0c3b6dc707ebaf1c8390e987ba39859a8f0a7aadd8526157f2ec8d
      reality_private_key: 6MpEOecc4Vy3oLd7MWFEozYpJ61O6x98ULDrgYVJxV8
      target: 192.0.2.90:8444
      server_names:
        - vpn.example.com
      xhttp_path: /test
      clients:
        - name: alice
          uuid: 11111111-1111-1111-1111-111111111111
          short_id: deadbeef
        - name: bob
          uuid: 22222222-2222-2222-2222-222222222222
          short_id: cafebabe
  pre_tasks:
    - name: Prepare the shared owned transport canary
      ansible.builtin.import_tasks: ../../../../molecule/tasks/transport-canary.yml
    - name: Create Xray runtime fixture directory
      ansible.builtin.file:
        path: /var/tmp/xray-molecule
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Fetch exact checksum-verified native Xray archive fixture
      ansible.builtin.get_url:
        url: https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-{{ 'arm64-v8a' if
          ansible_facts['architecture'] in ['aarch64', 'arm64'] else '64' }}.zip
        dest: /var/tmp/xray-molecule/xray-v26.10.31.zip
        checksum: sha256:{{ xray.linux_arm64_sha256 if ansible_facts['architecture'] in ['aarch64', 'arm64']
          else xray.linux_amd64_sha256 }}
        owner: root
        group: root
        mode: '0600'
    - name: Install jq (needed by molecule verify)
      ansible.builtin.apt:
        name: jq
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create xray user
      ansible.builtin.user:
        name: xray
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/xray
        create_home: true
  roles:
    - role: xray
  vars_files:
    - ../../../../molecule/vars/transport-native.yml
