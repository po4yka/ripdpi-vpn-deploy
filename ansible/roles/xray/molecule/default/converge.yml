---
- name: Converge xray role (template-only, no real binary download)
  hosts: all
  become: true
  vars:
    xray_port: 443
    xray_fallback_port: 2053
    nginx_xhttp_port: 10085
    xray_runtime_release_urls:
      amd64: file:///var/tmp/xray-molecule/xray-v26.3.27.zip
      arm64: file:///var/tmp/xray-molecule/xray-v26.3.27.zip
    p0_reality_shapes:
      vision:
        client_flow: "xtls-rprx-vision"
        client_mux: false
        finalmask: false
      mux:
        client_flow: ""
        client_mux: true
        finalmask: false
    vpn:
      enable_nginx_xhttp: true
      xray_flow_mode: mux
      xray_finalmask: true
    xray:
      version: "v26.3.27"
      linux_amd64_sha256: "9b7d7bd8f815f68a0c646e84f9e572e416fc4aca539811b235627892b323e970"
      linux_arm64_sha256: "9b7d7bd8f815f68a0c646e84f9e572e416fc4aca539811b235627892b323e970"
      reality_private_key: "MOLECULE_TEST_PRIVATE_KEY_NOT_REAL"
      target: "www.cloudflare.com:443"
      server_names:
        - "www.cloudflare.com"
      xhttp_path: "/test"
      clients:
        - name: alice
          uuid: "11111111-1111-1111-1111-111111111111"
          short_id: "deadbeef"
        - name: bob
          uuid: "22222222-2222-2222-2222-222222222222"
          short_id: "cafebabe"
  pre_tasks:
    - name: Create Xray runtime fixture directory
      ansible.builtin.file:
        path: /var/tmp/xray-molecule
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create hash-pinned Xray runtime archive fixture
      ansible.builtin.copy:
        dest: /var/tmp/xray-molecule/xray-v26.3.27.zip
        src: "{{ playbook_dir }}/files/xray-v26.3.27.zip"
        owner: root
        group: root
        mode: "0600"
        directory_mode: "0755"
    - name: Install jq (needed by molecule verify)
      ansible.builtin.apt:
        name: jq
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create xray user
      ansible.builtin.user:
        name: xray
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/xray
        create_home: true

    - name: Pre-create release dir for runtime link idempotence coverage
      ansible.builtin.file:
        path: /opt/xray/releases/v26.3.27
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Seed Xray binary for runtime link idempotence coverage
      ansible.builtin.copy:
        dest: /opt/xray/releases/v26.3.27/xray
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          exit 0

  # Use `roles:` (static binding) instead of `include_role` so the role's
  # handlers (Restart xray, Reload systemd) register with the play and
  # `notify:` from the role tasks resolves correctly.
  roles:
    - role: xray
