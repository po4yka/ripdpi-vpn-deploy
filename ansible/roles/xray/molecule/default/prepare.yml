---
- name: Prepare genuine isolated credential delivery
  ansible.builtin.import_playbook: ../../../../molecule/prepare-transport-credentials.yml

- name: Preserve a shared writable system log parent during Xray convergence
  hosts: all
  become: true
  tasks:
    - name: Model the Ubuntu system log directory permissions
      ansible.builtin.file:
        path: /var/log
        state: directory
        owner: root
        mode: '0775'

    - name: Create the previous default log root
      ansible.builtin.file:
        path: /var/log/xray
        state: directory
        mode: '0755'

    - name: Seed logs at the previous default log root
      ansible.builtin.copy:
        dest: "/var/log/xray/{{ item }}"
        content: "legacy\n"
        mode: '0640'
      loop: [access.log, error.log.1]
