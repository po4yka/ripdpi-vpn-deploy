---
- name: Select standalone frontend retirement topology
  ansible.builtin.set_fact:
    vpn: "{{ vpn | combine({'enable_xray_reality': false, 'enable_nginx_xhttp': false}) }}"
  when: not (transport_egress_prepared | default(false) | bool)

- name: Prepare remaining protected route before standalone retirement
  ansible.builtin.include_role:
    name: transport-egress
    tasks_from: prepare-site
  when: not (transport_egress_prepared | default(false) | bool)

- name: Retire xray runtime authority
  ansible.builtin.include_role:
    name: runtime-release
    tasks_from: retire
  vars:
    runtime_retire_units:
      - xray.service
    runtime_retire_paths:
      - /etc/systemd/system/xray.service
      - '{{ xray_etc_dir }}/config.json'
      - '{{ xray_etc_dir }}/config.json.prev'
