---
# P0 primary transport: Xray with VLESS+REALITY+XTLS-Vision.
# Pinning, symlink rollback, validate-before-restart, .prev backup.

- name: Preflight xray input semantics
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-input-preflight.yml"
  vars:
    transport_input_sections: [xray, egress]

- name: Prepare guarded topology for standalone frontend convergence
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-egress-prepare.yml"
  when: not (transport_egress_prepared | default(false) | bool)

- name: Pre-flight — xray version must be pinned
  ansible.builtin.assert:
    that:
      - xray.version | default('') | length > 0
    fail_msg: >-
      xray.version is empty. Set xray.version (and the matching
      linux_amd64_sha256 / linux_arm64_sha256) in your secrets file or
      group_vars before running this role.

- name: Resolve the effective P0 REALITY shape
  ansible.builtin.set_fact:
    p0_reality_effective_flow_mode: >-
      {{ vpn.xray_flow_mode | default(p0_reality_flow_mode) }}
  when: vpn.enable_xray_reality | default(true) | bool

- name: Pre-flight — default P0 REALITY shape must be declared
  ansible.builtin.assert:
    that:
      - p0_reality_effective_flow_mode in p0_reality_shapes
    fail_msg: >-
      The effective P0 REALITY flow_mode must name a declared
      p0_reality_shapes entry; unknown shapes are not rendered.
  when: vpn.enable_xray_reality | default(true) | bool

- name: Pre-flight — cohort P0 REALITY shapes must be declared
  ansible.builtin.assert:
    that:
      - item.flow_mode | default(p0_reality_effective_flow_mode) in p0_reality_shapes
    fail_msg: >-
      Every P0 REALITY cohort flow_mode must name a declared p0_reality_shapes
      entry; unknown shapes are not rendered.
  loop: "{{ xray.cohorts | default([]) }}"
  when: vpn.enable_xray_reality | default(true) | bool

- name: Pre-flight — REALITY replay window must be bounded
  ansible.builtin.assert:
    that:
      - xray_reality_max_time_diff_ms | type_debug == 'int'
      - xray_reality_max_time_diff_ms > 0
    fail_msg: >-
      xray_reality_max_time_diff_ms must be a positive integer number of
      milliseconds; 0 disables the REALITY client time check.
  when: vpn.enable_xray_reality | default(true) | bool

- name: Pre-flight — Xray StatsService must remain loopback-only
  ansible.builtin.assert:
    that:
      - xray_api_listen is match('^127\\.0\\.0\\.1:[0-9]+$')
      - (xray_api_listen | split(':') | last | int) > 0
      - (xray_api_listen | split(':') | last | int) < 65536
      - >-
        not (vpn.enable_nginx_xhttp | default(false) | bool) or
        (xray_api_listen | split(':') | last | int) != (nginx_xhttp_port | int)
    fail_msg: >-
      xray_api_listen must be a valid 127.0.0.1 TCP endpoint and must not
      collide with the localhost XHTTP inbound.

- name: Install shared pinned Xray runtime
  ansible.builtin.include_role:
    name: xray-runtime
  vars:
    xray_runtime_stage_only: true
    xray_runtime_publish_geoip: >-
      {{ not (vpn.enable_geodata | default(false) | bool) }}
    xray_runtime_asset_public_dir: "{{ xray_install_dir }}/bundled-assets"

- name: Stage the selected geodata pair for standalone complete candidate admission
  ansible.builtin.include_role:
    name: geodata
  when:
    - vpn.enable_geodata | default(false) | bool
    - transport_runtime_geodata_candidate_dir is not defined

- name: Require staged geodata authority before ordinary Xray admission
  ansible.builtin.assert:
    that: transport_runtime_geodata_candidate_dir is defined
    fail_msg: Ordinary Xray admission requires the complete staged geodata pair.
  when:
    - not ansible_check_mode
    - vpn.enable_geodata | default(false) | bool

- name: Report unverified future geodata bytes during predictive Xray convergence
  ansible.builtin.debug:
    msg: Staged geodata bytes and native candidate readiness remain unverified until ordinary convergence.
  when:
    - ansible_check_mode
    - vpn.enable_geodata | default(false) | bool
    - transport_runtime_geodata_candidate_dir is not defined

- name: Select staged Xray validation asset authority
  ansible.builtin.set_fact:
    _xray_candidate_asset_dir: >-
      {{ (transport_runtime_geodata_candidate_dir | default(xray_asset_dir))
         if (vpn.enable_geodata | default(false) | bool) else xray_runtime_bundled_asset_dir }}

- name: Pre-flight — REALITY target and serverNames must be set
  ansible.builtin.assert:
    that:
      - xray.target | default('') | length > 0
      - xray.server_names | default([]) | length > 0
    fail_msg: >-
      xray.target is empty or xray.server_names is an empty list.
      Validate the target with scripts/validate-reality-target.sh and
      probe SNI survivability from a filtered vantage with
      scripts/probe-sni-survival.sh before converging a new target.
  when: vpn.enable_xray_reality | default(true) | bool

- name: Create xray system user
  ansible.builtin.user:
    name: "{{ xray_runtime_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/xray
    create_home: true

- name: Ensure xray directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ xray_etc_dir }}"
      mode: "0750"
      owner: root
      group: "{{ xray_runtime_group }}"
    - path: "{{ xray_install_dir }}/releases"
      mode: "0755"
- name: Provision xray log directory and files without following links
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '-', '--directory', xray_log_path, '--user',
          xray_runtime_user, '--group', xray_runtime_group]
         + (['--retire-directory', '/var/log/xray'] if xray_log_path != '/var/log/xray' else [])
         + (['--check'] if ansible_check_mode else []) }}
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/xray_log_setup.py') }}"
  register: _xray_logs
  changed_when: _xray_logs.rc == 0 and (_xray_logs.stdout | from_json).changed
  check_mode: false

- name: Check if previous Xray config exists
  ansible.builtin.stat:
    path: "{{ xray_etc_dir }}/config.json"
  register: _xray_config_stat

- name: Detect Xray config change before preserving rollback state
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_etc_dir }}/config.json"
    owner: root
    group: "{{ xray_runtime_group }}"
    mode: "0640"
    validate: >-
      /usr/bin/python3 -c {{ lookup("ansible.builtin.file", role_path ~ "/files/xray_validate.py") | quote }}
      --binary {{ xray_runtime_binary | quote }}
      --asset-dir {{ _xray_candidate_asset_dir | quote }} --config %s
  check_mode: true
  register: _xray_config_change
  no_log: true
  diff: false
  vars:
    p0_reality_shape_template: >-
      {{ role_path }}/../../templates/p0-reality-shape.json.j2

- name: Validate Xray candidate before quiescing the accepted route
  # Private candidates are removed below; accepted publication reports runtime changes.
  when: not ansible_check_mode
  block:
    - name: Allocate an owned private Xray validation candidate
      ansible.builtin.tempfile:
        state: file
        suffix: .xray.json
      register: _xray_validation_candidate
      changed_when: false
      no_log: true

    - name: Prove native and guarded Xray candidate admission
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ _xray_validation_candidate.path }}"
        owner: root
        group: root
        mode: '0600'
        validate: >-
          /usr/bin/python3 -c {{ lookup("ansible.builtin.file", role_path ~ "/files/xray_validate.py") | quote }}
          --binary {{ xray_runtime_binary | quote }}
          --asset-dir {{ _xray_candidate_asset_dir | quote }} --config %s
      no_log: true
      diff: false
      changed_when: false
      vars:
        p0_reality_shape_template: "{{ role_path }}/../../templates/p0-reality-shape.json.j2"
  always:
    - name: Remove only the owned Xray validation candidate
      ansible.builtin.file:
        path: "{{ _xray_validation_candidate.path }}"
        state: absent
      no_log: true
      changed_when: false
      when: _xray_validation_candidate.path is defined

- name: Detect Xray unit change before guarded transaction
  ansible.builtin.template:
    src: xray.service.j2
    dest: /etc/systemd/system/xray.service
    owner: root
    group: root
    mode: '0644'
  check_mode: true
  register: _xray_unit_change

- name: Detect Xray validator authority change without publication
  ansible.builtin.copy:
    src: xray_validate.py
    dest: /usr/local/libexec/vpn-xray-validate
    owner: root
    group: root
    mode: "0755"
  check_mode: true
  register: _xray_validator_change

- name: Detect selected geodata changes without publishing active assets
  ansible.builtin.copy:
    src: "{{ transport_runtime_geodata_candidate_dir }}/{{ item }}"
    dest: "{{ geodata.install_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  loop: [geoip.dat, geosite.dat]
  check_mode: true
  register: _xray_geodata_change
  when: transport_runtime_geodata_candidate_dir is defined

- name: Define selected geodata activation receipt
  ansible.builtin.set_fact:
    _xray_geodata_receipt: >-
      {{ {'schema': 1, 'desired': {'geoip.dat': geodata.geoip_sha256 | lower,
                                  'geosite.dat': geodata.geosite_sha256 | lower},
          'metadata': {'mode': 420, 'uid': 0, 'gid': 0}}
         | to_json(sort_keys=true, separators=[',', ':']) }}
  when: transport_runtime_geodata_candidate_dir is defined

- name: Detect selected geodata receipt changes without publication
  ansible.builtin.copy:
    content: "{{ _xray_geodata_receipt }}"
    dest: "{{ geodata.install_dir }}/.geodata-activated.json"
    owner: root
    group: root
    mode: '0600'
  check_mode: true
  register: _xray_geodata_receipt_change
  when: transport_runtime_geodata_candidate_dir is defined

- name: Retain whole-route recovery for changed Xray authority
  ansible.builtin.include_role:
    name: transport-egress
    tasks_from: begin
  when:
    - not ansible_check_mode
    - not (transport_egress_fresh_check_mode | default(false) | bool)
    - >-
      (_xray_config_change.changed | bool) or
      (_xray_unit_change.changed | bool) or
      (_xray_validator_change.changed | bool) or
      (_xray_geodata_change.changed | default(false) | bool) or
      (_xray_geodata_receipt_change.changed | default(false) | bool)

- name: Stage complete Xray authority for guarded consumer acceptance
  ansible.builtin.set_fact:
    transport_runtime_candidates: >-
      {{ (transport_runtime_candidates | default([])) + [
          {'path': xray_etc_dir ~ '/config.json', 'mode': 416,
           'gid': transport_egress_frontend_gids.xray | int,
           'data': lookup('ansible.builtin.template', 'config.json.j2') | b64encode},
          {'path': '/etc/systemd/system/xray.service', 'mode': 420, 'gid': 0,
           'data': lookup('ansible.builtin.template', 'xray.service.j2') | b64encode},
          {'path': '/usr/local/libexec/vpn-xray-validate', 'mode': 493, 'gid': 0,
           'data': lookup('ansible.builtin.file', role_path ~ '/files/xray_validate.py', rstrip=false) | b64encode}
         ] }}
  vars:
    p0_reality_shape_template: "{{ role_path }}/../../templates/p0-reality-shape.json.j2"
  no_log: true
  diff: false
  when: not (transport_egress_fresh_check_mode | default(false) | bool)

- name: Stage selected geodata files without publishing either active asset
  ansible.builtin.set_fact:
    transport_runtime_candidates: >-
      {{ transport_runtime_candidates + [
         {'path': geodata.install_dir ~ '/geoip.dat', 'source': transport_runtime_geodata_candidate_dir ~ '/geoip.dat',
          'sha256': geodata.geoip_sha256 | lower, 'mode': 420, 'gid': 0},
         {'path': geodata.install_dir ~ '/geosite.dat', 'source': transport_runtime_geodata_candidate_dir ~ '/geosite.dat',
          'sha256': geodata.geosite_sha256 | lower, 'mode': 420, 'gid': 0},
         {'path': geodata.install_dir ~ '/.geodata-activated.json', 'mode': 384, 'gid': 0, 'deferred': true,
          'data': _xray_geodata_receipt | b64encode}
         ] }}
  no_log: true
  diff: false
  when:
    - not (transport_egress_fresh_check_mode | default(false) | bool)
    - transport_runtime_geodata_candidate_dir is defined

- name: Activate guarded standalone frontend generation
  ansible.builtin.import_tasks: "{{ role_path }}/../../playbooks/tasks/transport-egress-activate.yml"
  when: not (transport_egress_site_staging | default(false) | bool)
