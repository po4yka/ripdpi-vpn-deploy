---
# P0 primary transport: Xray with VLESS+REALITY+XTLS-Vision.
# Pinning, symlink rollback, validate-before-restart, .prev backup.

- name: Pre-flight — xray version must be pinned
  ansible.builtin.assert:
    that:
      - xray.version | default('') | length > 0
    fail_msg: >-
      xray.version is empty. Set xray.version (and the matching
      linux_amd64_sha256 / linux_arm64_sha256) in your secrets file or
      group_vars before running this role.

- name: Resolve the effective P0 REALITY shape
  ansible.builtin.set_fact:
    p0_reality_effective_flow_mode: >-
      {{ vpn.xray_flow_mode | default(p0_reality_flow_mode) }}
  when: vpn.enable_xray_reality | default(true) | bool

- name: Pre-flight — default P0 REALITY shape must be declared
  ansible.builtin.assert:
    that:
      - p0_reality_effective_flow_mode in p0_reality_shapes
    fail_msg: >-
      The effective P0 REALITY flow_mode must name a declared
      p0_reality_shapes entry; unknown shapes are not rendered.
  when: vpn.enable_xray_reality | default(true) | bool

- name: Pre-flight — cohort P0 REALITY shapes must be declared
  ansible.builtin.assert:
    that:
      - item.flow_mode | default(p0_reality_effective_flow_mode) in p0_reality_shapes
    fail_msg: >-
      Every P0 REALITY cohort flow_mode must name a declared p0_reality_shapes
      entry; unknown shapes are not rendered.
  loop: "{{ xray.cohorts | default([]) }}"
  when: vpn.enable_xray_reality | default(true) | bool

- name: Pre-flight — Xray StatsService must remain loopback-only
  ansible.builtin.assert:
    that:
      - xray_api_listen is match('^127\\.0\\.0\\.1:[0-9]+$')
      - (xray_api_listen | split(':') | last | int) > 0
      - (xray_api_listen | split(':') | last | int) < 65536
      - >-
        not (vpn.enable_nginx_xhttp | default(false) | bool) or
        (xray_api_listen | split(':') | last | int) != (nginx_xhttp_port | int)
    fail_msg: >-
      xray_api_listen must be a valid 127.0.0.1 TCP endpoint and must not
      collide with the localhost XHTTP inbound.

- name: Install shared pinned Xray runtime
  ansible.builtin.include_role:
    name: xray-runtime

- name: Schedule primary Xray restart after runtime change
  ansible.builtin.debug:
    msg: Pinned Xray runtime changed.
  changed_when: xray_runtime_changed | bool
  notify: Restart xray

- name: Pre-flight — REALITY target and serverNames must be set
  ansible.builtin.assert:
    that:
      - xray.target | default('') | length > 0
      - xray.server_names | default([]) | length > 0
    fail_msg: >-
      xray.target is empty or xray.server_names is an empty list.
      Validate the target with scripts/validate-reality-target.sh and
      probe SNI survivability from a filtered vantage with
      scripts/probe-sni-survival.sh before converging a new target.
  when: vpn.enable_xray_reality | default(true) | bool

- name: Create xray system user
  ansible.builtin.user:
    name: "{{ xray_runtime_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/xray
    create_home: true

- name: Ensure xray directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ xray_etc_dir }}"
      mode: "0750"
      owner: root
      group: "{{ xray_runtime_group }}"
    - path: "{{ xray_install_dir }}/releases"
      mode: "0755"
    - path: "{{ xray_log_path }}"
      mode: "0750"
      owner: "{{ xray_runtime_user }}"
      group: "{{ xray_runtime_group }}"

# A previous failed start (e.g. missing config.json during the first
# converge, or systemd restarting xray under root before User=xray took
# effect) can leave access.log / error.log root-owned; xray then crash-
# loops with "permission denied" on its next start. Pre-create the files
# with the right ownership and force ownership on re-runs so a bad state
# self-heals.
- name: Ensure xray log files exist with xray ownership
  ansible.builtin.file:
    path: "{{ xray_log_path }}/{{ item }}"
    state: touch
    owner: "{{ xray_runtime_user }}"
    group: "{{ xray_runtime_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  loop:
    - access.log
    - error.log

- name: Install xray systemd unit
  ansible.builtin.template:
    src: xray.service.j2
    dest: /etc/systemd/system/xray.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart xray

- name: Check if previous Xray config exists
  ansible.builtin.stat:
    path: "{{ xray_etc_dir }}/config.json"
  register: _xray_config_stat

- name: Detect Xray config change before preserving rollback state
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_etc_dir }}/config.json"
    owner: root
    group: "{{ xray_runtime_group }}"
    mode: "0640"
    validate: "/usr/local/bin/xray run -test -config %s"
  check_mode: true
  register: _xray_config_change
  no_log: true
  diff: false
  vars:
    p0_reality_shape_template: >-
      {{ role_path }}/../../templates/p0-reality-shape.json.j2

- name: Backup previous Xray config if exists
  ansible.builtin.copy:
    src: "{{ xray_etc_dir }}/config.json"
    dest: "{{ xray_etc_dir }}/config.json.prev"
    remote_src: true
    owner: root
    group: "{{ xray_runtime_group }}"
    mode: "0640"
  when:
    - _xray_config_stat.stat.exists
    - _xray_config_change.changed
  changed_when: false

- name: Render and validate Xray config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_etc_dir }}/config.json"
    owner: root
    group: "{{ xray_runtime_group }}"
    mode: "0640"
    validate: "/usr/local/bin/xray run -test -config %s"
  no_log: true
  diff: false
  notify: Restart xray
  vars:
    p0_reality_shape_template: >-
      {{ role_path }}/../../templates/p0-reality-shape.json.j2

- name: Ensure xray is enabled and started
  ansible.builtin.systemd_service:
    name: xray
    enabled: true
    state: started
    daemon_reload: true
