---
- name: Reconcile xray runtime lifecycle with guarded recovery
  block:
    - name: Reconcile xray runtime lifecycle
      ansible.builtin.include_tasks: "{{ 'enable.yml' if xray_role_enabled | bool else 'disable.yml' }}"
  rescue:
    - name: Restore the accepted protected generation after frontend staging failure
      ansible.builtin.include_role:
        name: transport-egress
        tasks_from: rollback
      when:
        - xray_role_enabled | bool
        - _transport_egress_transaction_started | default(false) | bool

    - name: Report refused frontend candidate after guarded recovery
      ansible.builtin.fail:
        msg: Protected frontend candidate was refused; accepted-generation recovery was attempted when available.
