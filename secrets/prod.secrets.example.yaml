# Placeholder secrets schema. Copy to ~/.config/vpn-provision/prod.secrets.yaml
# and fill with real values. Do NOT put real values here in this repo file.
#
# Every key in this file is consumed by an Ansible role at deploy time:
#   xray.*               → roles/xray
#   reality_self_steal.* → roles/reality-self-steal (optional)
#   nginx_xhttp.*        → roles/nginx-xhttp
#   hysteria.*           → roles/hysteria
#   geodata.*            → roles/geodata
#   amneziawg_*_version  → roles/amneziawg source pins
#   amneziawg_secrets.*  → roles/amneziawg
#   real_vps_awg_nat_secrets.* → roles/real-vps-awg-nat (optional evidence lane)
#   backup.*             → roles/backup
#   subscription.*       → roles/subscription-host (optional)

xray:
  version: "v26.3.27"  # current Xray-core stable; verify against upstream releases page
  linux_amd64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  linux_arm64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  # Required only when vpn.build_xray_from_source is true. Keep the source
  # identity and the resulting binary digest separate from release archives.
  source_commit: "REPLACE_WITH_40_OR_64_HEX_COMMIT"
  source_linux_amd64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  source_linux_arm64_sha256: "REPLACE_WITH_RELEASE_SHA256"

  # REALITY: generate with `xray x25519`
  reality_private_key: "REPLACE_WITH_PRIVATE_KEY"
  reality_public_key: "REPLACE_WITH_PUBLIC_KEY"

  # SNI target hygiene — validate with `make validate-target` before deploy.
  #
  # Pick a target that:
  #   1. Speaks TLS 1.3 and ALPN h2.
  #   2. Has the candidate hostname covered by the certificate SAN.
  #   3. Lives on an IP whose ASN is plausible for your VPS (close in
  #      geography / hoster class — see docs/PROVIDER-NOTES.md).
  #   4. Is NOT in the over-template list (cloudflare.com, microsoft.com,
  #      apple.com, google.com, discord.com — refused by Xray v26.3.27 via
  #      warning; flagged by validate-reality-target.sh).
  #   5. Returns a real HTTP/2 response on `GET /` (no infinite redirect,
  #      no empty body).
  #   6. Is NOT a Russian PoP of Cloudflare or any other CDN that peers
  #      through AS1299 inside RU (see docs/CDN-DECISION.md).
  #
  # No safe public default exists — a default would itself become a
  # template the censor can train on. Fill it yourself and run
  # `make validate-target` before `make plan`. To discover candidates:
  #   make scan-targets CIDR=<cidr>     # scan an IP range
  #   make scan-targets CRAWL=<url>     # crawl + scan a mirror list page
  # The wrapper installs XTLS/RealiTLScanner v0.2.1 with sha256 check.
  target: "REPLACE_WITH_LOW_PROFILE_HTTPS_TARGET:443"
  server_names:
    - "REPLACE_WITH_LOW_PROFILE_HOSTNAME"

  # XHTTP path used by P1 fallback inbound (see roles/xray/templates/config.json.j2)
  xhttp_path: "/app-sync"

  clients:
    - name: phone
      uuid: "REPLACE_WITH_UUID"
      short_id: "REPLACE_WITH_8HEX"
    - name: watchdog
      uuid: "REPLACE_WITH_DEDICATED_WATCHDOG_UUID"
      short_id: "REPLACE_WITH_DEDICATED_WATCHDOG_8HEX"
    # add more via scripts/new-client.sh

  # Optional multi-cohort layout. When `cohorts` is empty or missing,
  # the xray role renders a single VLESS+REALITY inbound on xray_port
  # using vpn.xray_flow_mode (group_vars). When non-empty, one REALITY
  # inbound is generated per entry, sharing the REALITY identity above.
  # See docs/MULTI-COHORT.md for the rationale and when to use it.
  #
  # cohorts:
  #   - name: home-isp
  #     port: 443
  #     flow_mode: mux         # mux | vision
  #     finalmask: true
  #     clients: [phone]       # client names from xray.clients
  #   - name: foreign
  #     port: 8444
  #     flow_mode: vision
  #     finalmask: false
  #     clients: [laptop]
  cohorts: []

nginx_xhttp:
  server_name: "vpn.example.com"     # plausible domain; you control DNS for it
  cert_pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_FULLCHAIN
    -----END CERTIFICATE-----
  key_pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END PRIVATE KEY-----

  # --- Optional second, DIRECT (non-CDN) HTTPS XHTTP frontend ---
  # Opt-in: leave off (false) by default. When true, nginx renders an extra
  # server block on nginx_xhttp_fallback_port (group_vars/all.yml, default
  # 2083) sharing the same Xray localhost upstream, so XHTTP delivery
  # survives a Cloudflare/cdn-front outage. This is the RU-baseline direct
  # path — NO Cloudflare directives are emitted for it. A pre-flight assert
  # rejects a fallback-port collision with REALITY/xray_fallback/nginx/cdn.
  # fallback_enabled: false
  #
  # By default the fallback reuses server_name's cert above. To serve the
  # fallback on a DISTINCT domain, set all three keys below; the role then
  # drops /etc/nginx/tls/<fallback_server_name>.{fullchain.pem,key}.
  # fallback_server_name: "alt.example.com"
  # fallback_cert_pem: |
  #   -----BEGIN CERTIFICATE-----
  #   REPLACE_WITH_FALLBACK_FULLCHAIN
  #   -----END CERTIFICATE-----
  # fallback_key_pem: |
  #   -----BEGIN PRIVATE KEY-----
  #   REPLACE_WITH_FALLBACK_PRIVATE_KEY
  #   -----END PRIVATE KEY-----

reality_self_steal:
  server_name: "edge.vpn.example.com"
  cert_pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SELF_STEAL_FULLCHAIN
    -----END CERTIFICATE-----
  key_pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_SELF_STEAL_PRIVATE_KEY
    -----END PRIVATE KEY-----

hysteria:
  version: "v2.9.0"
  linux_amd64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  linux_arm64_sha256: "REPLACE_WITH_RELEASE_SHA256"

  # Reuse the public-CA cert from nginx_xhttp if same domain, or use a separate one.
  cert_pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_FULLCHAIN
    -----END CERTIFICATE-----
  key_pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END PRIVATE KEY-----

  bandwidth_up: "100 mbps"
  bandwidth_down: "200 mbps"
  masquerade_url: "https://vpn.example.com"

  # Salamander obfuscation: keep disabled by default. Enabling trades a
  # vanilla-Hysteria fingerprint for high-entropy UDP, which can itself
  # be a network signal — only turn it on if vanilla Hysteria is being
  # classified on a target network.
  salamander_enabled: false
  salamander_password: "REPLACE_WITH_STRONG_PASSWORD_IF_ENABLED"

  clients:
    - name: phone
      password: "REPLACE_WITH_PER_DEVICE_PASSWORD"

naive_secrets:
  # Only needed when vpn.enable_naive is true (and vpn.enable_nginx_xhttp is false).
  server_name: "vpn.example.com"
  username: "REPLACE_WITH_USERNAME"
  password: "REPLACE_WITH_PASSWORD"
  probe_resistance_secret: "REPLACE_WITH_LONG_RANDOM"  # used as a "secret URL" to confirm a real client is on the other end
  cert_pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_FULLCHAIN
    -----END CERTIFICATE-----
  key_pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END PRIVATE KEY-----

geodata:
  geosite_url: "REPLACE_WITH_PINNED_GEOSITE_RELEASE_URL"
  geoip_url: "REPLACE_WITH_PINNED_GEOIP_RELEASE_URL"
  geosite_sha256: "REPLACE_WITH_RELEASE_SHA256"
  geoip_sha256: "REPLACE_WITH_RELEASE_SHA256"
  install_dir: /usr/local/share/xray
  refresh_interval: "1d"

amneziawg_go_version: "v0.2.12"
amneziawg_go_commit: "2e3f7d122ca8ef61e403fddc48a9db8fccd95dbf"
amneziawg_tools_version: "v1.0.20241018"
amneziawg_tools_commit: "c0b400c6dfc046f5cae8f3051b14cb61686fcf55"

amneziawg_secrets:
  server_private_key: "REPLACE_WITH_AWG_PRIVATE_KEY"

  # Per-AmneziaWG-spec obfuscation parameters; generate or pick a stable
  # set and keep it consistent with what the Amnezia client expects.
  #
  # Cohort-specific known-good profiles (see docs/AWG-COHORTS.md). These
  # are starting points — measure on the target network before locking.
  #
  #   narrow-junk sequential profile, 2026-05:
  #     jc=4 jmin=10 jmax=50 s1=0 s2=0 h1=1 h2=2 h3=3 h4=4
  #     (probabilistic pass — sometimes stalls on handshake)
  #
  #   wide-junk random-header profile, 2026-05 baseline:
  #     jc=4 jmin=40 jmax=70 s1=50 s2=100 + random H1..H4
  #
  # Generate a random H1..H4 set with:
  #   for i in 1 2 3 4; do
  #     printf 'h%d: %s\n' "$i" "$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
  #   done
  jc: 4
  jmin: 40
  jmax: 70
  s1: 50
  s2: 100
  h1: "REPLACE_WITH_H1_INT"
  h2: "REPLACE_WITH_H2_INT"
  h3: "REPLACE_WITH_H3_INT"
  h4: "REPLACE_WITH_H4_INT"

  peers:
    - name: phone
      public_key: "REPLACE_WITH_PEER_PUBLIC_KEY"
      preshared_key: "REPLACE_WITH_PRESHARED_KEY"
      allowed_ips: "10.66.66.2/32"
    # add more via scripts/new-client.sh

  # Optional multi-instance layout (see docs/AWG-COHORTS.md). When
  # `instances` is empty/missing, the role uses the single-instance
  # fields above. When non-empty, one awg-quick@<name>.service is
  # started per entry, each on its own UDP port + H1..H4 set.
  #
  # instances:
  #   - name: awg-narrow-junk
  #     listen_port: 51820
  #     address_v4: "10.66.66.1/24"
  #     address_v6: "fd42:42:42::1/64"
  #     server_private_key: "..."
  #     jc: 4
  #     jmin: 10
  #     jmax: 50
  #     s1: 0
  #     s2: 0
  #     h1: 1
  #     h2: 2
  #     h3: 3
  #     h4: 4
  #     peers: [...]
  #   - name: awg-wide-junk
  #     listen_port: 51821
  #     address_v4: "10.66.67.1/24"
  #     ...
  instances: []

# Optional standalone AWG evidence lane. Keep these values in SOPS even when
# the role is not enabled; never pass them through inventory or extra vars.
real_vps_awg_nat_secrets:
  server_private_key: "REPLACE_WITH_AWG_EVIDENCE_SERVER_PRIVATE_KEY"
  current_client_public_key: "REPLACE_WITH_AWG_EVIDENCE_CURRENT_CLIENT_PUBLIC_KEY"
  current_preshared_key: "REPLACE_WITH_AWG_EVIDENCE_CURRENT_PRESHARED_KEY"
  sentinel_ssh_public_key: "REPLACE_WITH_AWG_EVIDENCE_SENTINEL_SSH_PUBLIC_KEY"
  sentinel_ssh_private_key: "REPLACE_WITH_AWG_EVIDENCE_SENTINEL_SSH_PRIVATE_KEY"
  current_client_config: |
    REPLACE_WITH_AWG_EVIDENCE_CURRENT_CLIENT_CONFIG
  rotated_client_config: |
    REPLACE_WITH_AWG_EVIDENCE_ROTATED_CLIENT_CONFIG

backup:
  # Generate with: openssl rand -base64 32
  restic_password: "REPLACE_WITH_LONG_RANDOM"

  # Optional remote sync via rclone. Off by default; turning it on requires
  # a rclone_config blob that defines the rclone_remote name. Any backend
  # rclone supports works (S3, B2, Storj, SFTP, etc.).
  remote:
    enabled: false
    rclone_remote: "offsite"
    rclone_path: "vpn-backups"
    transfers: 4
    bwlimit: "off"   # e.g. "10M" for 10 MByte/s cap
    rclone_config: |
      [offsite]
      type = s3
      provider = Other
      env_auth = false
      access_key_id = REPLACE
      secret_access_key = REPLACE
      endpoint = https://s3.example.com
      region = us-east-1
      acl = private

# Optional — only needed when vpn.enable_dns_morph_bridge is true.
# The bridge daemon has no public release artifact; build from source on
# a trusted workstation and publish to an internal artifact store, then
# fill these three fields. See ansible/roles/dns-morph-bridge/CLAUDE.md
# and docs/PROVIDER-NOTES.md ("P4 fallback transport tier").
dns_morph_bridge_secrets:
  signing_key: "REPLACE_WITH_ED25519_BASE64_OR_LEAVE_BLANK_IF_DISABLED"
  binary_url: "REPLACE_WITH_HTTPS_ARTIFACT_URL"
  binary_sha256: "REPLACE_WITH_RELEASE_SHA256"

# Optional — only needed when vpn.enable_hysteria_realm is true.
# sing-box realm-service ships on the alpha release line; pin the
# tarball checksum per architecture so the role's get_url + checksum
# gate matches the downloaded artifact. Auth token is presented by
# every peer during the rendezvous handshake; long random string,
# treat as a long-lived secret. See ansible/roles/hysteria-realm/
# CLAUDE.md and docs/PROVIDER-NOTES.md ("P5 rendezvous transport tier").
hysteria_realm_secrets:
  linux_amd64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  linux_arm64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  auth_token: "REPLACE_WITH_LONG_RANDOM_REALM_AUTH_TOKEN"

# Optional — only needed when vpn.enable_snell is true. Snell is RESEARCH-tier,
# and the pinned prerelease is staging-only. Each variant and device uses a distinct credential.
snell_secrets:
  linux_amd64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  linux_arm64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  evaluation_path_token: "REPLACE_WITH_LONG_RANDOM_EVALUATION_PATH"
  variants:
    - id: v4-stream
      psk: "REPLACE_WITH_LONG_RANDOM_SNELL_V4_PSK"
      users: [{name: phone, userkey: "REPLACE_WITH_PER_DEVICE_SNELL_V4_USERKEY"}]
    - id: v6-default
      psk: "REPLACE_WITH_LONG_RANDOM_SNELL_V6_DEFAULT_PSK"
      users: [{name: phone, userkey: "REPLACE_WITH_PER_DEVICE_SNELL_V6_DEFAULT_USERKEY"}]
    - id: v6-unshaped
      psk: "REPLACE_WITH_LONG_RANDOM_SNELL_V6_UNSHAPED_PSK"
      users: [{name: phone, userkey: "REPLACE_WITH_PER_DEVICE_SNELL_V6_UNSHAPED_USERKEY"}]

# Optional — only needed when vpn.enable_split_hop_egress is true.
# These secrets live on Node B (egress) only. Generate with:
#   wg genkey | tee node_b.key | wg pubkey > node_b.key.pub
#   wg genkey | tee node_a.key | wg pubkey > node_a.key.pub
# Node B holds node_b_private_key + node_a_public_key. Node A holds
# the opposite (its private key + B's public key). Never share keys.
# See docs/SPLIT-HOP-TOPOLOGY.md and docs/RUNBOOK-split-hop-pilot.md.
split_hop_egress_secrets:
  node_b_private_key: "REPLACE_WITH_NODE_B_WG_PRIVATE_KEY"
  node_a_public_key: "REPLACE_WITH_NODE_A_WG_PUBLIC_KEY"
  node_a_public_ip: "REPLACE_WITH_NODE_A_PUBLIC_IPV4"
  preshared_key: ""  # optional; empty disables PSK

# Optional Node A secrets when vpn.enable_split_hop_ingress is true.
split_hop_ingress_secrets:
  node_a_private_key: "REPLACE_WITH_NODE_A_WG_PRIVATE_KEY"
  node_b_public_key: "REPLACE_WITH_NODE_B_WG_PUBLIC_KEY"
  preshared_key: ""

# Inert defaults for the proposed cascade role pair. Populate only after a
# future attestation-backed governance reversal; each node receives only the
# private key it owns when decrypted secrets are split for deployment.
cascade_secrets:
  ingress_private_key: ""
  ingress_public_key: ""
  egress_private_key: ""
  egress_public_key: ""
  preshared_key: ""
  classifier_proxy_password: ""

# Optional owned research-target secrets when vpn.enable_probe_matrix_target is true.
probe_matrix_target_secrets:
  mtproto_secret: "REPLACE_WITH_MTPROTO_SECRET"
  vless_uuid: "REPLACE_WITH_VLESS_UUID"
  xhttp_trojan_password: "REPLACE_WITH_XHTTP_TROJAN_PASSWORD"
  tcp_trojan_password: "REPLACE_WITH_TCP_TROJAN_PASSWORD"
  cert_pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_FULLCHAIN
    -----END CERTIFICATE-----
  key_pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END PRIVATE KEY-----
  mtg_version: "v2.2.8"
  mtg_linux_amd64_url: "REPLACE_WITH_MTG_V2_2_8_AMD64_RELEASE_URL"
  mtg_linux_arm64_url: "REPLACE_WITH_MTG_V2_2_8_ARM64_RELEASE_URL"
  mtg_linux_amd64_sha256: "REPLACE_WITH_RELEASE_SHA256"
  mtg_linux_arm64_sha256: "REPLACE_WITH_RELEASE_SHA256"

watchdog_secrets:
  # ntfy.sh: pick a long random topic name and treat it as a secret
  # (anyone with the topic can read alerts).
  ntfy_topic: "REPLACE_WITH_LONG_RANDOM_TOPIC"
  # Owned HTTPS endpoint fetched through every configured REALITY listener
  # with the dedicated client. Use 200 for a normal public site root.
  reality_probe_url: "https://REPLACE_WITH_OWNED_204_CANARY/healthz"
  reality_probe_expected_status: 204
  # Optional access token if you self-host ntfy with auth.
  # ntfy_token: "REPLACE_WITH_NTFY_TOKEN"
  #
  # Or, if watchdog.provider == "pushover":
  # pushover_token: "REPLACE_WITH_APP_TOKEN"
  # pushover_user:  "REPLACE_WITH_USER_KEY"

# Central observability authorities are versioned and split by runtime trust.
# Each sender certificate/private key is unique to one technical node. The
# control-plane bot is not reused by the independent dead-man route.
observability_secrets:
  schema_version: 1
  receiver_ca_pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_OBSERVABILITY_RECEIVER_CA
    -----END CERTIFICATE-----
  ingress_certificate_pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_OBSERVABILITY_INGRESS_CERTIFICATE
    -----END CERTIFICATE-----
  ingress_private_key_pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_OBSERVABILITY_INGRESS_PRIVATE_KEY
    -----END PRIVATE KEY-----
  senders:
    - node_id: vpn-node
      certificate_pem: |
        -----BEGIN CERTIFICATE-----
        REPLACE_WITH_UNIQUE_SENDER_CERTIFICATE
        -----END CERTIFICATE-----
      private_key_pem: |
        -----BEGIN PRIVATE KEY-----
        REPLACE_WITH_UNIQUE_SENDER_PRIVATE_KEY
        -----END PRIVATE KEY-----
  telegram:
    bot_token: "REPLACE_WITH_PRIMARY_TELEGRAM_BOT_TOKEN"
    chat_id: "REPLACE_WITH_PRIMARY_TELEGRAM_CHAT_ID"
    topic_id: "REPLACE_WITH_PRIMARY_TELEGRAM_TOPIC_ID"
  # Required when central alerting is enabled; every authority is distinct.
  silence_gateway:
    operators:
      - owner: primary-operator
        token: "REPLACE_WITH_SILENCE_OPERATOR_64_LOWER_HEX_TOKEN"
    sender_token: "REPLACE_WITH_SILENCE_SENDER_64_LOWER_HEX_TOKEN"
    backend_ca_pem: |
      -----BEGIN CERTIFICATE-----
      REPLACE_WITH_SILENCE_BACKEND_CA
      -----END CERTIFICATE-----
    backend_server_cert_pem: |
      -----BEGIN CERTIFICATE-----
      REPLACE_WITH_SILENCE_BACKEND_SERVER_CERTIFICATE
      -----END CERTIFICATE-----
    backend_server_key_pem: |
      -----BEGIN PRIVATE KEY-----
      REPLACE_WITH_SILENCE_BACKEND_SERVER_PRIVATE_KEY
      -----END PRIVATE KEY-----
    backend_client_cert_pem: |
      -----BEGIN CERTIFICATE-----
      REPLACE_WITH_SILENCE_BACKEND_CLIENT_CERTIFICATE
      -----END CERTIFICATE-----
    backend_client_key_pem: |
      -----BEGIN PRIVATE KEY-----
      REPLACE_WITH_SILENCE_BACKEND_CLIENT_PRIVATE_KEY
      -----END PRIVATE KEY-----

observability_deadman_secrets:
  schema_version: 1
  pulse_token: "REPLACE_WITH_UNIQUE_DEADMAN_PULSE_TOKEN"
  telegram:
    bot_token: "REPLACE_WITH_SECONDARY_TELEGRAM_BOT_TOKEN"
    chat_id: "REPLACE_WITH_SECONDARY_TELEGRAM_CHAT_ID"
    topic_id: "REPLACE_WITH_SECONDARY_TELEGRAM_TOPIC_ID"

# Optional: only needed if vpn.enable_subscription_host is true
# subscription:
#   port: 8444
#   server_name: "sub.example.com"
#   rate_limit: "5r/m"
#   rate_burst: 3
#   revoked_tokens:
#     - "REVOKED_TOKEN_HEX_1"
#     - "REVOKED_TOKEN_HEX_2"
#   # Continuous payload mirror — opt-in pull of the hashed-on-disk tree
#   # from a build worker so this delivery host stays fresh between
#   # deploys. Defaults to disabled; enable per-host as needed.
#   # `ssh_key` (rsync backend) and `restic_password` (restic backend)
#   # are the actual SECRET fields. The `subscription` top-level is in
#   # the coverage checker's NON_SECRET_TOPLEVEL (and harvested from role
#   # defaults), so these sub-keys are schema/documentation-only.
#   mirror:
#     enabled: true
#     backend: "rsync"            # "rsync" | "restic"
#     interval: "5min"
#     # rsync backend:
#     source: "build@worker.internal:/var/lib/vpn-subscription/"
#     ssh_key: |
#       -----BEGIN OPENSSH PRIVATE KEY-----
#       REPLACE_WITH_MIRROR_PULL_SSH_PRIVATE_KEY
#       -----END OPENSSH PRIVATE KEY-----
#     # restic backend (instead of rsync source/ssh_key):
#     restic_repo: "REPLACE_WITH_RESTIC_REPO_URL_OR_PATH"
#     restic_snapshot_path: "/var/lib/vpn-subscription"
#     restic_password: "REPLACE_WITH_RESTIC_REPO_PASSWORD"

# Per-device configuration registry (operator metadata; never read by
# Ansible roles). scripts/new-client.sh creates one entry per provisioned
# device and stores the AmneziaWG client private key here as the recovery
# copy — the device-local key remains primary. scripts/issue-sub-token.sh
# records the issuance options (format, hosts, cohorts, token hash prefix,
# expiry) so a later --refresh-token reproduces the original payload
# instead of silently falling back to defaults.
client_registry:
  REPLACE_WITH_DEVICE_NAME:
    status: "issued"                             # issued|delivered|active|stale|revoked|burned
    issued_at: "REPLACE_WITH_ISSUED_AT"          # UTC instant, e.g. 2026-08-23T12:00:00Z
    formats: []                                  # subset of [singbox, ripdpi]
    hosts: ["upcloud:prod"]                      # provider:env pairs used at issuance
    cohorts: []                                  # cohort slugs, one per host entry
    token_hash_prefix: ""                        # first 8 hex of sha256(token); empty until issued
    token_expires: ""                            # YYYY-MM-DD or empty when open-ended
    awg_public_key_fingerprint: "REPLACE_WITH_AWG_KEY_FINGERPRINT"  # sha256:<16 hex>
    awg_private_key: "REPLACE_WITH_AWG_CLIENT_PRIVATE_KEY"
    last_payload_identity:
      source: ""                                 # deploy-source-identity hash at last delivery
      outputs: ""                                # sha256 of consumed terraform outputs at last delivery
