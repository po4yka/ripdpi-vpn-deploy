# Topology-aware probe-matrix configuration. Copy outside the repository and
# replace every profile_file with an absolute path to an owner-controlled 0600
# target profile generated for an owned research target.
schema_version: 2
vantage: filtered-path-a
poll_interval_seconds: 300

control:
  url: https://control.example.com/generate-204
  expected_status: 204
  timeout_seconds: 15
  degraded_after_ms: 3000

protocols:
  - mtproto
  - xhttp-vless
  - xhttp-trojan
  - tcp-trojan
  - tls-non-443

targets:
  - id: allowlisted-dual
    comparison_set: allowlisted-pair
    destination_class: allowlist-pattern
    topology: single-ip-dual-role
    profile_file: /home/operator/.config/vpn-provision/probe-matrix/allowlisted-dual.json
  - id: allowlisted-split
    comparison_set: allowlisted-pair
    destination_class: allowlist-pattern
    topology: split-hop-ingress
    profile_file: /home/operator/.config/vpn-provision/probe-matrix/allowlisted-split.json
  - id: generic-dual
    comparison_set: generic-pair
    destination_class: neutral-pattern
    topology: single-ip-dual-role
    profile_file: /home/operator/.config/vpn-provision/probe-matrix/generic-dual.json
  - id: generic-split
    comparison_set: generic-pair
    destination_class: neutral-pattern
    topology: split-hop-ingress
    profile_file: /home/operator/.config/vpn-provision/probe-matrix/generic-split.json
  - id: non-allowlist-dual
    comparison_set: non-allowlist-pair
    destination_class: non-allowlist-pattern
    topology: single-ip-dual-role
    profile_file: /home/operator/.config/vpn-provision/probe-matrix/non-allowlist-dual.json
  - id: non-allowlist-split
    comparison_set: non-allowlist-pair
    destination_class: non-allowlist-pattern
    topology: split-hop-ingress
    profile_file: /home/operator/.config/vpn-provision/probe-matrix/non-allowlist-split.json
