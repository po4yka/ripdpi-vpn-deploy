[advisories]
version = 2
# Vulnerability and unsoundness advisories are errors by default; only the
# treatment of unmaintained crates and yanked versions is configurable.
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
version = 2
# Acceptable SPDX license expressions. Adjust if a new dep uses a
# different approved licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "deny"
private = { ignore = true }

[bans]
# Deny duplicate versions of the same crate (semver-incompatible
# duplicates are a common source of bloat and subtle bugs).
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
